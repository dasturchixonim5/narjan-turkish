larınız böyle bir olayla karşılaşabilir. Yerinde bir müdahale ile onların acısını dindirmek, sakat kalmasını önlemek hatta hayatta kalmasını sağlamak için ilk yardım bilgilerine sahip olmak gerekir. Bunu başkaları için değil, kendimiz ve yakınlarımız için bilmek zorundayız. Basit gibi görünen ilk yardım, ilk planda hastanın hayatını kurtardığı gibi daha sonra yapılacak tedavinin başarısını da arttıracaktır."],["l","A. Aşağıdaki sorulara doğru cevabı veriniz."],["l","1. İlk insanlarda basit anlamıyla ilk yardım neydi?"],["l",".................................................................................................."],["l","2. Günümüz insanı ne gibi tehlikelerle karşı karşıyadır?"],["l",".................................................................................................."],["l","3. Büyük şehirlerin doğmasındaki sebep nedir?"],["l",".................................................................................................."],["l","4. İnsanlar ilk yardım bilgilerini niçin bilmelidirler?"],["l",".................................................................................................."],["l","5. İlk yardımın önemi nedir?"],["l",".................................................................................................."],["l","B. Aşağıdaki cümlelerin doğru olanlarını “D” yanlış olanlarını “Y” ile işaretleyiniz."],["l","1. ( ) Günlük yaşamda çeşitli yerlere gidip gelirken hiçbir yaralanma olasılığı yoktur."],["l","2. ( ) Tanıdığımız ya da tanımadığımız kemseler yaralandıkları vakit, onları iyileştirmek, hatta onların hayatlarını kurtarmak ilk yardım bilgileriyle mümkündür."],["l","3. ( ) Günümüz insanı, ilk insanlara göre daha çok tehlikeyle karşı karşıyadır."],["l","4. ( ) İlk yardım bir yaralının ya da hastanın hayatını kurtarabilir; fakat daha sonra yapılacak tedavinin başarısını arttırmaz."],["l","5. ( ) Savaşların yanı sıra çeşitli kazalar sonucunda bir çok insan yaralanmakta hatta ölmektedir."]]},{"n":91,"b":[["l","C. Aşağıdaki cümlelerin boşluklarını tamamlayınız. 1- Harp araçları müthiş denilecek derecede gelişmiş,"],["l","........................... .............................. başlamıştır. 2-........................... ilk insanların yaralanma sırasında"],["l","........................... ........ ilk yardım olarak değerlendirilebilir. 3- ............................ başlangıcı ilk insanlara ............................ 4- ........................... evinize gelinceye kadar ........................... 5 – Trafik kazalarında her yıl .................................................."],["h","TÜRKİYE"],["p","Türkiye Asya ile Avrupa arasında bulunmaktadır ve jeopolitik konumu çok önemli bir ülkedir. Nüfusu yaklaşık 70 milyondur. 3 tarafı denizlerle çevrili bir ülkedir. Güneyde Akdeniz, kuzeyde Karadeniz, batıda Ege denizi, bir de iç deniz var bu Marmara denizidir. İstanbul ve Çanakkale boğazları Asya ile Avrupa’yı birbirinden ayırır. Türkiye birçok kültürün geçiş noktasında olduğu için tarihi ve kültürü çok zengindir. Türkiye’de 7 bölge var bu 7 bölgenin kendine ait kıyafetleri, mutfağı, folkloru vardır bu durum kültürü zenginleştirmektedir. Türkiye’nin tarihi de çok eskidir Türklerin Anadolu’da 1000 yıldan fazla zamandır yaşıyorlar. Deniz ve tarih ve doğa turizmi çok ileridedir. Her yıl milyonlarca turist Türkiye’ye tatil yapmak için geliyor. Burada sadece yaz turizmi değil kış turizmi de çok gelişmiştir. Kış turizmi genelde Bursa - Uludağ, Erzurum - Palandöken, Bolu - Kartalkaya, Kayseri - Erciyes, Çankırı - Ilgaz ve Akdeniz - Toroslar’daki kayak merkezlerinde yapılmaktadır. Karadeniz Türkiye’nin en yeşil bölgesidir. Burada bu nedenle yayla turizmi fazladır, doğa yürüyüşleri, rafting yapılıyor. İnsanlar mavi ve yeşilin birleştiği yerde dinleniyorlar."],["p","Aliya bu yaz tatile Türkiye’ye gidecek o en çok Konya’daki hoşgörünün temsilcisi Mevlana’yı merak ediyor bu yaz orayı görecek. İstanbul dünyanın en güzel ve en kalabalık şehirlerinden biri orada 16 milyon insan yaşıyor. Aliya daha önce İstanbul’a gitti ve çok beğendi bu yaz tekrar gidecek ama fazla durmayacak. Hemen Pamukkale’ye geçecek sonra diğer ilginç yerleri gezecek."]]},{"n":92,"b":[["p","Lütfen aşağıdaki soruların doğru cevabını bulunuz."],["l","1. Türkiye hangi kıtada bulunmaktadır?"],["l","A) Asya kıtasında"],["l","B) Avrupa kıtasında"],["l","C) Afrika kıtasında"],["l","D) Asya ve Avrupa kıtları arasında"],["l","E) Asya ve Afrika kıtaları arasında"],["l","2. Türkiye’nin iç denizi hangisidir?"],["l","A) Akdeniz B) Karadeniz C) Marmara Denizi"],["l","D) Ege Denizi E) Hazar Denizi"],["l","3. Türkiye’nin güneyinde hangi deniz bulunmaktadır?"],["l","A) Akdeniz B) Karadeniz C) Ege denizi"],["l","D) Marmara Denizi E) Hazar Denizi"],["p","4Türkiye’nin nüfusu yaklaşık ne kadardır?"],["l","A) 100 milyon B) 10 milyon C) 70 milyon"],["l","D) 7 milyon E) 60 milyon"],["l","5. Türkiye kaç bölgeye ayrılmaktadır"],["l","A) 3 B) 4 C) 5 D) 6 E) 7"],["h","ÇİKOLATA"],["p","Çikolatayı sevmeyen çocuk var mıdır? Her halde yoktur. Yalnızca çocuklar değil, yetişkinler de çikolatdan çok hoşlanırlar. Çikolata, yediden yetmişe herkesin sevdiği bir yiyecektir. Peki ya çikolata olamasydı? Dünyadaki bütün çikolatalr birde bire kaybolsaydı. Sütlü, fındıklı, fıstıklı çikolatalar ve çikolatalı dondurmalar yeryüzünde silinseydi. Hayat ne kadar tatsız olurdu bir düşünsenize."],["p","Aslında çikolatanın geçmişi çok ta eski değildir. Hayatımıza yalnızca birkaç yüzyıl önce girmiştir. Kristof Kolomb Amerika kıtasını keşfettiği zaman birçok şeyi ülkesine götürmüştü. Bunlar arasında kakao çekirdekileri de vardı. Çikolatatnın ana maddesi olan"]]},{"n":93,"b":[["p","kakao, Avrupa’da yetişmiyordu ve bilinmiyordu. Burada tarçın ve vanilya ile tatlandırıldı."],["p","İspanya’da sıvı çikolata, sıcak olarak içiliyordu. İspanyollar bu içeceğin lezzetindeki sırrı yaklaşık yüzyıl sakladılar. Bu sır daha sonra Fransızlar tarafından öğrenildi. İngilizler çikolatayı süt ekleyere onu daha da zenginleştirdiler."],["p","Günümüzde çikolata üretimi epeyce gelişmiştir. Yeni çikolata türleri ortaya çıkmştır. Çikolata aynı zamanda bir enerji deposudur. Bundan dolayı sporcular yarışmalardan önce çikolata yerler. Çikolatanın kalori değeri de oldukça yüksektir. Bir kilo çikolatada 5280 kalori, peynirde 4000 kalori, ette de 1470 kalori vardır."],["p","Siz de yapacağınız maç öncesi çikolata yiyebilirsiniz. Çikolata yerken aşırıya kaçmayın. Annenizi kızdırabilirsiniz. Başka yiyeceklerden de enerji elde edebileceğinizi unutmayın. Aşağıdaki soruları yanıtlayınız."],["l","1. Çikolatanın ana maddesi nedir?"],["l","a) Kakao b) Tarçın c) Vanilya d) Sıvı çikolata e) Şeker"],["l","2. Sporcular niçin çikolata yerler?"],["l","a) Sevdiği için b) Karnını doyurmak için"],["l","c) Enerji deposu olduğu için"],["l","d) Biraz kilo almak için e) Lezzetli olduğu için"],["l","3. İngilizler çikolataya nasıl bir yenilik katmışlardır?"],["l","a) Süt ekleyerek b) Su ekleyerek c) Sıvı çikolata"],["l","d) Sıcak içerek e) Vanilya ekleyerek"],["l","4. İspanya’da çikolatayı nasıl kullandılar?"],["l","a) Tarçın katarak b) Vanilya katarak c) Su katarak"],["l","d) Sıvı, sıcak olarak e) Süt ekleyerek"],["l","5. Peynirde ne kadar kalori vardır?"],["l","a) 5280 b) 4000 c) 1470 d) 4500 e) 5000"],["l","6. Ette ne kadar kalori vardır?"],["l","a) 1475 b) 1500 c) 1470 d) 1400 e) 1460"]]},{"n":94,"b":[["l","7. Çikolatada ne kadar kalori vardır?"],["l","a) 5280 b) 5200 c) 5180 d) 5380 e) 2380"],["l","8. Çikolatayı kim getirmiştir?"],["l","a) Kristof Kolomb b) Galileo c) Fransız bilim adamı"],["l","d) spanya bilim adamı e) Amerikalı"],["l","9. Çikolatayı nereden ve ne zaman getirmiştir?"],["l","a) Avrupayı keşfettiği zaman"],["l","b) Amerikayı keşfettiği zaman"],["l","c) Kakaoyu bulduğu zaman"],["l","d) Kristof Kolomb öldüğü zaman"],["l","e) Fransızlar tarafından"],["l","10. Çikolata ilk olarak Avrupa’nın hangi ülkesine getirildi?"],["l","a) İspanya"],["l","b) İtalya"],["l","c) Fransa"],["l","d) Amerika"],["l","e) İngeltere"],["h","BALON"],["p","Küçük çocuk, baloncuyu büyülenmiş gibi takip ederken, şaşkınlığını gizleyemiyordu. Onu hayrete düşüren şey, “Bizim eve bile sığmaz” dediği o güzelim balonların adamı nasıl havaya kaldırmadığı idi. Baloncu dinlenmek için durakladığında o da duruyor ve sonra yine takibe koyuluyordu. Bir ara adamın kendisine baktığını fark ederek ona doğru yaklaştı ve bütün cesaretini toplayarak:"],["l","- Baloncu amca, dedi. Biliyor musun benim hiç balonum olmadı. Adam çocuğu söyle bir süzdükten sonra:"],["l","- Paran var mı? diye sordu. Sen onu söyle."],["l","- Bayramda vardı, diye atıldı çocuk, önümüzdeki bayram yine olacak"]]},{"n":95,"b":[["l","- Öyleyse bayramda gel, dedi adam. Acelem yok, ben beklerim. Çocuk sessizce geri döndü. O ana kadar balonlardan ayırmadığı gözleri dolu dolu olmuş, yürümeye bile mecali kalmamıştı. Bir kaç adım attıktan sonra elinde olmadan tekrar onlara baktığında, gördüklerine inanamadı. Balonlar, her nasılsa adamın elinden kurtulmuş ve yol kenarındaki büyük bir akasya ağacının dallarına takılmıştı. Çocuk, olup bitenleri büyük bir merakla takip ederken, baloncu ona doğru dönerek:"],["l","- Küçük, diye seslendi. Balonları ağaçtan kurtarırsan birini sana veririm. Yapılan teklif, yavrucağın aklını başından almıştı. Koşarak ağacın altına doğru yöneldi ve ayakkabılarını aceleyle fırlatıp tırmanmaya başladı. Hedefine adım-adım yaklaşırken duyduğu heyecan, bacaklarını kanatan akasya dikenlerinin acısını hissettirmiyordu. Sincap çevikliğiyle balonlara ulaştığında bir müddet onları seyretti ve dallara dolanan ipi çözerek baloncuya sarkıttı. Ancak balonlardan birisi iyice sıkıştığından diğerlerinden ayrılmış ve ağaçta kalmıştı. Çocuk onu kurtarmaya kalkışsa, dikenlerden patlayacağını çok iyi biliyordu. İster istemez balonu yerinde bırakıp aşağıya indi ve adam dönerek: -Birini bana verecektiniz, dedi. Hangisi o? Adam elini tersiyle burnunu sildikten sonra:"],["l","- Seninki ağaçta kaldı evlat, dedi. İstersen çık al. Çocuk bu sefer ayakta bile duramadı. Kaldırım kenarına oturup baloncunun uzaklaşmasını bekledikten sonra, dallar arasında parlayan balona uzun uzun bakarak: “Olsun”, diye mırıldandı. “Olsun.” Ağacın üzerinde kalsa da, bir balonum var ya artık. Lütfen aşağıdaki soruları metne göre cevaplandırınız. 1- Metinin ana fikri nedir?"],["l",".................................................................................................. 2- Olay nerede geçiyor?"],["l",".................................................................................................. 3- Hikayenin kahramanları kimlerdir?"],["l",".................................................................................................. 4- Bu hikayeden nasıl bir ders çıkardınız?"],["l",".................................................................................................."]]},{"n":96,"b":[["l","1. Aşağıdaki cümlelerden doğru olanı (D), yanlış olanı (Y) ile işaretleyiniz."],["l","1. ( ) Çocuk balonları kurtarmak için koşarak ağacın altına doğru yöneldi."],["l","2. ( ) Çocuk balonların hepsin kurtardı."],["l","3. ( ) Çocuk balonları kolayca kurtardı."],["l","4. ( ) Balonları kurtardıktan sonra evine bir balonla geldi."],["l","2. Aşağıdaki cümlelerden var olanı (V), yok olanı (Y) ile işaretleyiniz. Var Yok"],["l","1. Balonlar takılan ağacın adı metinde var mı? ☐ ☐"],["l","2. Çocuk her bayramda balon satın alıyor. ☐ ☐"],["l","3. Baloncunun dış görünüşünün (fiziksel) açıklaması metinde var mı? ☐ ☐"],["l","4. Baloncu bir erkekti. ☐ ☐"],["l","3. Aşağıdaki kelimeleri manalarıyla eşleştiriniz."],["l","1. Takip etmek a. Gözleriyle inceler gibi bakmak"],["l","2. Süzmek b. Kolay ve çabuk davranma, canlılık"],["l","3. Mecal c. İzinden gitmek, arkasına düşmek"],["l","4. Takılmak e. Ağaçlarda yaşayan, büyük kuyruklu, küçük ve çevik bir hayvan"],["l","5. Sincap d. Asılmak, bağlı olmak"],["l","6. Çeviklik f. Güç, kuvvet, takat"],["l","4. Aşağıdaki cümleleri metne göre tamamlayınız."],["l","1. Balonlar, her nasılsa adamın elinden kurtulmuş ve yol kenarındaki büyük ______________ takılmıştı."],["l","2. Ancak balonlardan birisi iyice sıkıştığından _________________________ ve ağaçta kalmıştı."],["l","3. O ana kadar ________________________ dolu dolu olmuş, yürümeye bile mecali kalmamıştı."],["l","5. Aşağıdaki test sorularını cevaplayın."],["l","1. Çocuk balonların hepsini kurtardı mı?"]]},{"n":97,"b":[["l","a. Evet"],["l","b. 1 balon kalmış"],["l","c. 2 balon kalmış"],["l","d. Hiç birisini kurtarаmadı"],["l","2. Balonları kurtardığı için adam çocuğa ne verdi?"],["l","a. Tatlılar"],["l","b. 1 balon"],["l","c. 2 balon"],["l","d. ağaç"],["l","3. Balonlara ne olmuş?"],["l","a. Dallarda patlamış"],["l","b. Ağaça takılmış"],["l","c. Uçup gitmiş"],["l","d. Bir şey olmamış"],["h","KARIN HİKAYESİ"],["p","Önce biri düşer sessizce. Ardından bir diğeri iner yavaşça. Sonra bir başkası. Kar tanelerinin yaptığı bu yolculuk sürer ve tabiat beyaz bir örtünün altında kalmaya başlar. Çok ilginçtir ki, kar kristallerinin hiçbiri diğerine benzememektedir."],["p","Kar bütün izleri siler. Çocuklar evlerinden dışarı çıkmak için can atarlar. Bakışlarını gökyüzündeki kar tanelerine çevirirler ve uçuşan karları seyrederler. Sonra kardan adam yapma hazırlıklarına başlanır. Bunun için havuç, kömür, atkı ve süpürge hazırlanır. Kızaklar saklandıları arka balkonlardan çıkarılır. Kaymak için tekrar kontrol edilir. İşte çocuklar ve yetişkinler bütün bunlarla kış süresince eğlenir. Evet kardan adam yapmak ve kızakla kaymak yalnızca çocukların eğlencesi değildir. Yetişkinler de severek bunları yapar ve eğlenirler."],["p","Yine kar yağmaya devam eder. Hiçbir yer görünmeyene kadar yağar, yağar. Artık ırmaklarda balık avlamak için başka metotlar kullanılmalıdır. Balıkçılar önce buzu keserler, sonra da suya ağ bırakırlar. Eğer şansları iyi giderse o gün balıkçılar için kazançlı bir"]]},{"n":98,"b":[["p","gün demektir. Akşama doğru esen sert rüzgar balıkçıları evlerine dönmeyi mecbur eder. Balıkçıların eşleri ve çocukları onları kartopıyla karşılarlar. Evet artık kar topu savaşı başlamıştır. Eline eldivenini giyen bu savaşa katılır. Bu oyunda en çok eğlenenler, her zaman olduğu gibi, yine çocuklar olur. Çünkü onlar bütün bir yıl, kış ayını kartopu oynamak için beklemişlerdir. Oyundan yorulanlar evlerine girerler. Akşamları sıcak sobanın başında kestane pişirirler ve birbirine hatıralarını anlatırlar. İşte bütün bu güzellikleri bütün insanlık bir kar tanesine borçludur."],["l","1. Metine göre doğru olanın başına “D”, yanlış olanın başına “Y” yazınız."],["l","a. ( ) Kardan adam için havuç, atkı, kömür gerekir."],["l","b. ( ) Yetişkinler kızakla kaymaktan hoşlanmazlar."],["l","c. ( ) Yetişkinler kardan adam yapmaktan hoşlanırlar."],["l","d. ( ) Hava çok soğuk olursa sular buz tutar."],["l","e. ( ) Balıkçılar balık tutmak için buzu keserler. f. ( ) Akşamları sobada ekmek kızartır."],["l","2. Soruları metine göre cevaplayınız."],["l","a. Kışın çocuklar ve yetişkinler ne yaparlar? _________________________________________________"],["l","b. Kışın balıkçılar balık avlamak için nasıl bir metot kullanırlar? _________________________________________________"],["l","c. Balıktan dönen balıkçıları, eşleri ve çocukları nasıl karşılarlar? _________________________________________________"],["l","d. Kar tanesinin özelliği nedir? _________________________________________________"],["l","e. Küçük gibi görünen bir kar tanesi insan yaşamını nasıl etkiliyor? _________________________________________________"],["l","3. Aşağıdaki kelime, kelime gruplarını kullanarak anlamlı cümle kurunuz."],["l","1. Kar taneleri: ____________________________________"],["l","2. Yetişkin: _______________________________________"]]},{"n":99,"b":[["l","3. eğlenmek: ______________________________________"],["l","4. balık avlamak: ___________________________________"],["l","5. soba: __________________________________________"],["h","ÇİÇEKLE SUYUN HİKAYESİ"],["p","Günün birinde bir çiçekle su karşılaşır ve arkadaş olurlar. İlk önceleri güzel bir arkadaşlık olarak devam eder birliktelikleri, tabii zaman lâzımdır birbirlerini tanımak için. Gel zaman, git zaman çiçek o kadar mutlu olur ki, mutluluktan içi içine sığmaz artık ve anlar ki, su ya aşık olmuştur. İlk kez aşık olan çiçek, etrafa kokular saçar, “Sırf senin hatırın için ey su” diye."],["p","Öyle zaman gelir ki, artık su da içinde çiçeğe karşı bir şeyler hissetmeye başlamıştır. Zanneder ki, çiçeğe aşıktır ama su da ilk defa aşık oluyordur."],["p","Günler ve aylar bir birini kovalar ve çiçek acaba “Su beni seviyor mu?” diye düşünmeye başlar. Çünkü su, pek ilgilenmez çiçekle. Halbuki çiçek, alışkın değildir böyle bir sevgiye ve dayanamaz. Çiçek, suya “Seni seviyorum” der. Su, “Ben de seni seviyorum” der. Aradan zaman geçer ve çiçek yine “Seni seviyorum” der. Su, yine “Ben de” der. Çiçek, sabırlıdır. Bekler, bekler, bekler. Artık öyle bir duruma gelir ki, çiçek koku saçamaz etrafa ve son kez suya “Seni seviyorum” der. Su da ona “Söyledim ya ben de seni seviyorum”. Der ve gün gelir çiçek yataklara düşer. Hastalanmıştır çiçek artık. Rengi solmuş, çehresi sararmıştır çiçeğin. Yataklardadır artık çiçek. Su da başında bekler çiçeğin, yardımcı olmak için sevdiğine. Bellidir ki artık çiçek ölecektir ve son kez zorlukla başını döndürerek çiçek, suya der ki; “Seni ben, gerçekten seviyorum”. Çok hüzünlenir su bu durum karşısında ve son çare olarak bir doktor çağırır nedir sorun diye. Doktor gelir ve muayene eder çiçeği. Sonra şöyle der doktor: “Hastanın durumu ümitsiz artık elimizden bir şey gelmez”. Su, merak eder, sevgilisinin ölümüne sebep olan hastalık nedir diye ve sorar doktora. Doktor, şöyle bir bakar suya ve der ki: “Çiçeğin bir hastalığı yok dostum. Bu çiçek sadece susuz kalmış, ölümü onun için” der. Ve anlamıştır artık su, sevgiliye sadece “Seni seviyorum” demek yetmemektedir."]]},{"n":100,"b":[["l","1. Aşağıdaki soruları yanıtlayınız."],["l","1. Metnin ana fikri nedir?"],["l",".................................................................................................."],["l","2. Olay nerede geçiyor?"],["l",".................................................................................................."],["l","3. Hikayenin kahramanları kimlerdir?"],["l",".................................................................................................."],["l","4. Bu hikayeden nasıl bir ders çıkardınız?"],["l",".................................................................................................."],["l","2. Aşağıdaki cümlelerden doğru olanı (D), yanlış olanı (Y) ile işaretletıniz."],["l","1. ( ) İlk önceleri güzel bir arkadaş olup sonra ikisi kavga eder."],["l","2. ( ) Öyle zaman gelir ki, artık su çiçeğe karşı bir şeyler hissetmez."],["l","3. ( ) Su çiçeğin yatağa düşmesine çok üzülür."],["l","4. ( ) Çiçek suya “Seni seviyorum” demenin yetmediğini anlar."],["l","3. Aşağıdaki cümlelerden var olanı (V), yanlış olanı (Y) ile işaretletıniz. Var Yok"],["l","1. Su ve sarı renkli çiçek arkadaş olurlar. ☐ ☐"],["l","2. Su ve çiçek günler ve aylar bir birini takip ederler. ☐ ☐"],["l","3. Çiçek aşık olduğundan etrafa kokular saçar. ☐ ☐"],["l","4. Su hatasını anladıktan sonra hastalanır. ☐ ☐"],["l","3. Aşağıdaki kelimelerin eş anlamlılarını eşleştiriniz."],["l","1. Çehre a. Tahammül etmek"],["l","2. Kovalamak b. Beraberlik"],["l","3. Yatağa düşmek c. Yüz"],["l","4. Birliktelik ç. Üzülmek"],["l","5. Dayanmak d. Hastalanmak"],["l","6. Hüzünlenmek e.Takip etmek"]]},{"n":101,"b":[["l","4. Aşağıdaki cümleleri metne göre tamamlayınız."],["l","1. Çok hüzünlenir su bu durum karşısında ve _______________ bir doktor çağırır nedir sorun diye."],["l","2. Zanneder ki, _______________ ama su da ilk defa aşık oluyordur."],["l","3. Halbuki çiçek, alışkın değildir ________________ ve dayanamaz."],["l","5. Aşağıdaki test sorularını cevaplayın."],["l","1. Çiçek niçin yatağa düşmüş?"],["l","a. Soğuk almış b. Susuz kalmış"],["l","c. Aşık olduğu için d. Sapı kırıldığı için"],["l","2. Su çiçeğe karşı bir şeyler hisseder mi?"],["l","a. Evet b. Hayır"],["l","c. Sadece arkadaş olurlar d. Birbirini tanımıyor"],["l","3. Çiçeği muayene eden kim?"],["l","a. Su b. Kendisi"],["l","c. Doktor d. Arkadaşı"],["l","4. Çiçeğin rengi hastalandığında nasıldı?"],["l","a. rengi kızıldı b. rengi beyazdı"],["l","c. rengi solmuştu d. rengi sararmıştı"],["h","ULAŞIM ARAÇLARI"],["p","Ulaşım araçları günlük hayatımızın bir parçası. Örneğin gün içindeki ulaşımımızı sağlamak için otobüs, metro, minibüs, taksi gibi pek çok seçeneğe sahibiz. Her seçeneğin de farklı avantaj ve dezavantajları var elbette. Örneğin otomobiller... Kullanmayı biliyorsunuz ve otomobiliniz de var, bu durumda pek çok insan gibi siz de rahat etmek için arabanızla ulaşımı tercih edersiniz herhalde! Ama sürekli dikkatli olmaya çalışmak, başkalarının hataları yüzünden strese girmek, benzine çok fazla para vermek, park sorunu yaşamak bizi bu rahatlıktan biraz uzaklaştırıyor sanki!"],["p","Bu sebepler toplu taşıma araçlarını daha avantajlı hale getiriyor. O zaman otobüsleri düşünelim biraz... Otobüs durağı evinize ya da işinize yakın bir yerde mi? Otobüste oturmak üzere"]]},{"n":102,"b":[["p","yer bulabilecek misiniz? Yazın sıcak kışın soğuk hava sizi otobüste rahatsız edecek mi? Bunlar benim için sorun değil, ekonomik bir taşıtta ve stresten uzak olmam herşeyden daha önemli.” diyorsanız, otobüs doğru seçim. Ayrıca otobüste ayakta kalma sorununu minibüsleri tercih ederek çözerim diye düşünüyor da olabilirsiniz. Ama minibüse binmek için uzun kuyrukları da hatırlayın lütfen! Ben trafikte durup kalmaktan hoşlanmam, hızlı ulaşım benim için çok önemli mi diyorsunuz? Metrolar sizin hizmetinizde! Elbette bir şart var, yerin altında, kapalı bir alanda yolculuktan korkmayacaksınız! Seçim sizin. Artılarıyla eksiklikleriyle pek çok taşıt sizi bir yerlere götürmek için bekliyor, acele edin."],["l","(Zaman gazetesi, Nisan 2013)"],["l","1. Ulaşım araçları aşağıdakilerden hangisidir?"],["l","A) otobüs ve metro B) mektup C) posta"],["l","D) internet E) telefon"],["l","2. Otomobilin dezavantajları nelerdir?"],["l","A) arabayı kullanmak B) strese girmek"],["l","C) hızlı yetişmek D) rahat oturmak"],["l","E) istediğin zaman hareket etmek"],["l","3. Toplu taşıma araçlarının avantajları nelerdir?"],["l","A) benzine çok para vermek B) park etme sorunu"],["l","C) hatalar yapmak D) dikkatli olmak"],["l","E) stressiz yaşam"],["l","4. Otobüsteki en büyük sorun nedir?"],["l","A) soğuk hava B) ekonomik sorun"],["l","C) ayakta kalma D) yer bulabilme"],["l","E) strese girmek"],["l","5. En hızlı ulaşım hangisidir?"],["l","A) otobüs B) araba C) minibüs"],["l","D) metro E) araba"]]},{"n":103,"b":[["h","YARASALAR"],["p","Doğurarak üreyen ve uçabilen tek hayvan türü yarasalardır. İnsanlar genellikle yarasaların korkunç olduklarını düşünürler, ama gerçekte onlar korkunç değildirler. Daha çok geceleri ortaya çıkarlar. Kanatları zar adı verilen iki kat deriden oluşmaktadır. Kanatları kolayca şekil değiştirebilir."],["p","Bu yüzden yarasalar havada şaşırtıcı akrobasi hareketleri yapabilirler. Yarasaların gözleri görmez. Ama gece karanlıkta uçuşan küçük sineklerin farkına varıp onları yakalarlar... nasıl mı? Onlar mükemmel bir radar sisteminin sahibidirler. Kanatlarını çırparken, yüksek frekanslı ses dalgaları çıkartırlar. Bu sesleri insan kulağı işitemez. Bu dalgalar etraftaki cisimlere çarpar ve yansır. Yarasalar geri dönen ses dalgalarını değerlendirerek etrafındaki şeylerden haberdar olur. Yarasalar duran ve hareket eden cisimleri farkeder. İlim adamlarından biri, yüzlerce yarasanın bulunduğu karanlık bir mağaraya girmiş. Hepsini rahatsız ederek uçmalarını sağlamış. Yarasalar ne birbirine ne de bilim adamına çarpmışlar. Düzenli bir şekilde uçmuşlar. Mağarayı dolduran ses dalgaları içinde, her yarasa kendi ses dalgasını diğeriyle karıştırmamış. Yarasalar dinlenmek istedikleri zaman kanatlarını bir şemsiye gibi katlarlar, başlarını içeriye sokarlar ve parmak uçlarıyla başaşağı asılı dururlar. Yarasalar mağaralarda, ambarlarda, çatı katlarında ve ağaçlarda yaşayabilirler. Anne yarasa doüum yaptıktan sonra, yavrusu onun kürküne tutunarak annesiyle birlikte birkaç gün kalır. Yarasalar gündüzleri dinlenir, geceleri ise avlanmak için ortaya çıkarlar. Yarasalar çoğu zaman küçük böcekleri yada kemirgenleri yerler. Bazı yarasalar ise meyveleri tercih ederler. Dünyada 2000 çeşit yarasa vardır."],["p","Güney Amerika’da yaşayan ve herkesçe bilinen “Vampir Yarasa” kan içerek beslenir. Vampir yarasa kanını içeceği hayvanın toplardamarını bulur ve keskin ön dişleriyle yarar, açar. Bu olayı o kadar iyi yapar ki hayvan uyuyor bile olsa uyanmaz. Yarasa akan kanı içerken, hayvanın üzerinde durur. Sanılanın aksine, kanı emecek yerde, yaradan aktıkça yalar. Hayvan buyüzden rahatsız olmaz."]]},{"n":104,"b":[["l","I. Aşağıdaki cümleler doğru mu (D), yanlış mı (Y)? 1- ( ) Gerçekte yarasalar korkunç yaratıklardır. 2- ( ) Yarasalar memeli hayvanlar değil, kuşturlar. 3- ( ) Yarasalar başaşağı uyurlar. 4- ( ) Onlar aydınlık ve açık yerlerde yaşarlar. 5- ( ) Yarasalar geceleri dinlenmeyi severler. 6- ( ) Gözleri karanlıkta iyi gördüğü için avlarını kolay yakalarlar. 7- ( ) Anne yarasa uçacağı zaman yeni doğmuş yavrusunu yalnız bırakır."],["p","II. Aşağıdaki sorulara evet (E), ya da hayır (H) diye cevap veriniz."],["p","1- ( ) Yarasalar memeli hayvanlar grubuna mı dahildirler?"],["p","2- ( ) Yeni doğmuş yarasaya “zar” mı denir?"],["p","3- ( ) Başaşağı mı uçarlar?"],["p","4- ( ) Yarasalar havada akrobasi hareketleri yapabilirler mi?"],["p","5- ( ) Bir yarasa karanlık bir binanın içinde yaşayabilir mi?"],["p","III. Aşağıdaki kelimeleri anlamlarıyla eşleştiriniz."],["p","1Şaşırtıcı korkuya sebep olan"],["p","2Çatı katı yavru iken annesinin sütüyle beslenen hayvan."],["p","3Korkunç çok yumuşak ve ince deri"],["p","4Zar hayret uyandıran"],["p","5Kemirgen çatının altındaki yer"],["p","6Memeli güçlü ve keskin ön dişlere sahip, küçük hayvan"],["p","IV. Aşağıdaki boşluklara, yaşamak, akmak, uçuşmak, üremek, dönmek, durmak, hareket etmek kelimelerinden uygun olanlarını getiriniz."],["p","1Doğurarak ....................... ve uçabilen tek hayvan türü yarasalardır."],["p","2Gece karanlıkta ……………… sineklerin farkına varıp onları yakalarlar."]]},{"n":105,"b":[["p","3Yarasalar geri ………………….. ses dalgalarını değerlendirerek etraflarındaki şeylerden haberdar olur."],["p","4Yarasalar ………………….ve ………………….. cisimleri bile fark ederler."],["p","5Güney Afrika’da ……………….. ve herkesçe bilinen “vampir yarasalar” da vardır."],["p","6Yarasa …………….. kanı içerken, hayvanın üzerinde durur."],["p","7Aşağıdaki kelimeleri anlamlarıyla eşleştiriniz."],["l","V. Aşağıdaki soruları cevaplandırınız. 1- Yarasalar neler yerler? 2- Kaç çeşit yarasa vardır? 3- Besinlerini nasıl bulurlar? 4- Yarasalar nerelerde yaşarlar?"],["h","ASKERİN MEKTUBU"],["p","Babacığım,"],["p","Ellerinizi öpüp hepinize selam ederim. Size bir şey söyleyeceğim, daha doğrusu dinimizce bir müjde vereceğim... Ama acımayacaksınız, ağlamayacaksınız..."],["p","Baba, istersen nineme söyleme! Hani sen: “Bu kadar muharebe gördüm: lakin bir türlü isteğime erişemedim.” demez miydin? İşte tamam. Hasan isteğine erişti: şehit oldu. Üç gün evvelki muharebede bir geyik gibi çeviklik, bir arslan gibi yiğitlik gösterdikten sonra şehit oldu. Allah rahmet eylesin!... Düşerken yanındaydım: hakkınızı helal etmenizi rica etti. Bir kurşunla şakağından, iki kurşunla göğüsünden yaralanmıştı. Kendi elimle gömdüm. Toprağa girerken de çehresi gülümsüyordu. O, ecdadımızın yadigarı, senin hediyen olan yatağanı da beraber gömdüm. Kınını da taş yerine baş ucuna diktim. Bilirsin ki rahmetli bunca yıldır, geceleri bile yatağına o bıçakla yatardı... Ah, babacığım,düşmana ne şiddetle saldırdık, görseydin... Gözümün önüne senin o muharebelerde ettiğin hücumlar geliyordu ... Onları bize ne tatlı anlatırdın!... Yaralarını ne sevinçle gösterirdin... Emin ol, babacığım, kardeşim senin evlatlığına layık olacak surette şehit oldu."]]},{"n":106,"b":[["p","Düşman ilerden kara bulut gibi geliyordu. Biz iki bölükten ibarettik. Yıldırım gibi hücum ettik. İlk hamlede yüzbaşımızı kaybettik. Çavuşumuz da yaralanınca, kumandayı Hasan aldı. Ah, babacığım, şöyle uzakta bulunup da Hasan’ın “Ya Allah!” diye bağırdığı vakit, ayağımızın altındaki toprakların, başımızın üstündeki ulu ağaçların zangır zangır titrediğini göreydin, şaşardın!... Nihayet, düşmanı tepeden püskürttük. Kovalamaya başladık."],["p","En önde, çarıkları çözülmüş, fesi düşmüş, baş açık, yalın ayak Hasan koşuyor, koşuyordu... Kuş gibi, rüzgar gibi, alev gibi koşuyordu. Bu sırada düşman bir defa daha dönmeyi tecrübe etmez mi? İşte o dakikada Hasan’ı yerde gördüm. Hırsından, hiddetinden ne yapacağını bilmiyor: alnından dökülen kanlar içinde, kıpkırmızı kesilen dişleriyle tetiği çekmeye çalışıyor:"],["p","Tüfeğinin namlusunu ısırıyordu. Gözleri, kükremiş kaplan gözü gibi dışarı fırlamıştı. Onu çaresiz orada bıraktık. Düşmanı tamamıyla perişan ettikten sonra yanına geldim. Geldiğimi duyunca gözlerini açtı..."],["p","Sen her zaman demez miydin ki: “Ben şehit oğluyum, inşallah şehit babası olacağım...” İşte baba."],["p","Duan kabul oldu. O, şehadete kavuştu. Hem gazi oldu, hem şehit... İnşallah biz de kavuşuruz. Zannederim iki gün sonra yeni bir hücum daha olacak..."],["p","Senin ve ninemin ellerinden öperim... Beni soranlara selam... Bu mektubu alayımızın mülazımı..."],["p","Beye yazdırdım. Kendisi de sizi tebrik ediyor ve ellerinizden öpüyor."],["p","Oğlunuz Hüseyin Onbaşı."],["l","I. Sözlük çalışmaları"],["l","a. Kelimeler Şakak, gülle, yatağan, kın, bölük, alay, mülazım kelimelerinin anlamını sözlüklerinizden öğreniniz. Şakak, alın ve yanak kelimelerinin yüzün hangi bölümlerini anlattığını söyleyiniz."],["l","b. Deyimler ve gruplar"]]},{"n":107,"b":[["p","Hakkını helal etmek deyimini bir cümlede kullanınız."],["p","Onun alaylarına daha fazla dayanamamış."],["p","Birinci alay, düşmana kahramanca saldırdı."],["p","Bu cümlelerdeki “alay” kelimelerinin anlamlarını söyleyiniz."],["p","II. Metin üzerinde çalışmalar"],["l","a. Metni anlayalım"],["l","1. Hüseyin’in babasına vereceği müjde nedir?"],["l","2. Hüseyin’in babasının isteği nedir? Bu isteğine kavuşabilmiş midir?"],["l","3. Hüseyin, kardeşini görmekten neyi de beraber gömüyor? Niçin?"],["l","4. Hasan, hangi davranışıyla babasının oğlu olduğunu göstermiştir?"],["l","5. Hasan, ordunun neresinde ve nasıl savaşıyor? Vurulup yere düştükten sonra bile ne için gayret ediyor?"],["l","6. Metindeki benzetmeleri gösteriniz."],["l","7. Metnin anafikri nedir?"],["h","ESKİCİ"],["p","Hasan vapurla ilk yolculuğuna cıkacak. Artık istanbul’da kimsesi kalmadı. Şimdi Babası Hasan henüz üç yaşındayken vefat etmiş. Annesi de onu yalnız bırakıp cennete gitti. Hasan yedi yaşında yetim kaldı. Hasan şimdi Mısır’a halasının yanına gidiyor."],["p","Vapur o gürültülü düdüğünü çalıp homurdana homurdana hareket etti. Hasan çok küçük olduğu için hiçbir şeyin farkında değildi. Sadece o vapurda bir o yana bir bu yana koşuyor, denizi seyrediyor, yolcvularla konuşup oynuyordu. Sempatik tavırlarıyla herkesin sevgisini kazandı. Yolcular Hasan’a şeker ve hediyeler verdiler onu sevdiler. Ona Hasan yerine “Ya Hassen” diyorlardı. Sonunda vapur limana yanaştı."],["p","Hasan sırtında bir tepe var zannettiği hayvanı görünce çok şaşirdı. Bu hayvan deveydi. Hasan’ı limanda halası karşıladı. Burası kendi memleketine hiç benzemiyor ve burada hiç ağaç yoktu. Her taraf kumla kaplı ve sapsarıydı. Bahçesi yüksek duvarlarla çevrili bir"]]},{"n":108,"b":[["p","eve geldiler. Aradan bir hafta geçti. Burada anlaşacağı, oynayacağı hiç kimse yoktu. Hasan çok sıkıldı. Hasan evin önünde bir tamirci gördü. Halası onu içeriye çağırdı ve ayakbıları tamir etmesini istedi. Adam çok zayıf, eski elbiseli, kara saçlı, kara gözlü, yaşlı biriydi. Ama Araplara benzemiyor. Hasan adama karşı bir sıcaklık hissetti. Adamın karşısına geçip onu seyretmeye başladı. Adam ağır hareketlerle sandalyesine oturdu, malzemelerini çıkardı ve ağzına bir avuç çivi koyup ayakkabıları tamir etmeye başladı. Hasan da onu seyretmeye başladı. Hasan yabancı bir ülkede olduğunu unutup “-Çivileri ne kadar hızlı çakıyorsun” dedi. Tamirci çok şaşırdı ve bir an durdu. “- Sen Türk müsün” dedi. Hasan: Evet İstanbul’dan geldim diye söyledi. Tamirci de ben de İstanbul’a yakın yerden İzmit’tenim dedi."],["p","Hasan tamirciyle uzun uzun Türkçe konuşup güzel vakit geçirdi. Hasan ile tamirci birbirlerini çok sevdiler. Tekrar görüşmek üzere ayrıldılar."],["l","A. Lütfen, soruları metine göre cevaplayınız."],["l","1. Hasan neden Mısır’a gitti?"],["l",".................................................................................................."],["l","2. Hasan halasının memleketinde kiminle arkadaşlık kurdu?"],["l",".................................................................................................."],["l","3. Yolcular Hasan’a nasıl davrandılar onu neden çok sevdiler?"],["l",".................................................................................................."],["l","4. Hasan neden çok şaşırdı?"],["l",".................................................................................................."],["l","5. Tamirci nasıl biridir?"],["l",".................................................................................................."],["l","B. Okuduğunuz parçaya göre aşağıdaki cümlelerden doğru olanın başına “D” yanlış olanın başına “Y” yazınız."],["l","1. ( ) Ahmet yetim kaldigindan dolayi Kazakistana gitti."],["l","2. ( ) Ahmet misirli."],["l","3. ( ) Ahmetin Annesi ve babası hayattadir."],["l","4. ( ) Ahmet aslani gorunce sasirdi."],["l","5. ( ) Ahmete Ya Hassen diyorlardi."]]},{"n":109,"b":[["l","C. Lütfen, soruları yanıtlayınız."],["l","1. Ahmet Mısıra gitmekle doğru bir karar almışmıdır?"],["l","2. Ahmet neden mutsuzdu?"],["l","3. Ahmet gibi çocuklara nasıl yardım ederdiniz?"],["l","D. Lütfen, soruları yanıtlayınız. Doğru bir şekilde cümleleri yerine koyunuz."],["l","1. annesi – melek – babası – hasanın – oldu – ve"],["l","...........……………………………………………………….."],["l","2. hasan – geldi – mısıra – Istanbuldan – ve – tanıştı – ayakkabıcıyla."],["l","......………………………………………………………….."],["l","3. hasan – tepe – sırtında – olan – gördü – hayvan – bir."],["h","TÜRK DİLLERİ"],["p","Türk dilleri Ural-Altay dil ailesinin Altay koluna mensuptur ve dünyada çok konuşulan bilimsel bir dildir. Günümüzde Türk dilleri 3 lehçeye ayrılmaktadır. Bunlar; Oğuz lehçesi (Batı Türkçesi): Türkiye Türkçesi, Azerice, Türkmence vs. Kıpçak lehçesi: Kazakça, Kırgızca, Tatarca Hakaniye(Çağatay) lehçesi: Özbekçe, Uygurca bunlar önde gelen Türk dili şiveleridir. Türk dilleri çok geniş bir coğrafyada hüküm sürmüş tarih boyunca etkili bir dil olmuştur. SSCB dağıldıktan sonra Orta Asya’daki Türk dilleri kendi bağımsızlığını kazanmış ve hızla gelişmeye başlamıştır. Bilimsel eserler yayınlanmıştır."],["p","Günümüz de Türk ülkelerinin aydınları zaman zaman bir araya gelip dili geliştirici, dile yeni şeyler kazandıracak faaliyetlerde bulunmaktadır. Eski dil bilgisi ve edebi eserler incelenerek günümüzde halkın konuştuğu dille karşılaştırıp çağdaş gramer kitapları yazılmaktadır. Anadil daha işlek hale getirilmeye çalışılmaktadır. Fakat bu çalışmalar dil alimleriyle sınırlı kalmamalı toplumun her kesimi buna destek vermelidir. Çünkü ülkeler ancak dilleriyle ayakta kalabilmekte ve kendilerini geliştirebilmektedir. Dilleriyle sanatını, tarihini oluşturur, kültürünü korur, edebi eserlerini torunlarına ulaştırabilirler."]]},{"n":110,"b":[["p","Bu konuda öncülüğü Türkiye cumhuriyetinin kurucusu Atatürk başarıyla yapmıştır. Türk dilinin yapısının bozulmasını önlemiş, Türkçeyi ön plana geçirmiş, kendine özgü bir alfabe oluşturmuş, eğitim seviyesinin artmasına katkı sağlamıştır. Türk dilleri arasında en çok konuşulanı ve en işlenmiş olanı nüfusun da etkisiyle Türkiye Türkçesi olmuştur."],["p","Bu sayede Türkçe her geçen gün gelişmiş dünyada da kendine saygın bir yer edinmiştir."],["l","I. Okuduğunuz parçaya göre aşağıdaki cümlelerden doğru olanın başına “D” yanlış olanın başına “Y” yazınız."],["l","1. ( ) Türkçe Ural – Altay dil ailesinin Ural koluna mensuptur."],["l","2. ( ) Kazakça Kıpçak lehçesi içerisinde yer alır."],["l","3. ( ) Türk dilleri çok geniş bir coğrafyada hüküm sürmüş; ancak tarih boyunca etkili bir dil olamamıştır."],["l","4. ( ) Atatürk, Türk dilinin yapısının bozulmasına sebep olmuştur."],["l","5. ( ) Türkler kendi dillerine ait alfabeler oluşturabilmişlerdir."],["l","6. ( ) Dilin kültürü koruyucu özelliği vardır."],["p","II. Lütfen, soruları metine göre cevaplayınız."],["l","1. Türk dilleri hangi dil grubu içinde yer almaktadır?"],["l","2. Türk dilleri kaç gruba ayrılmaktadır, bunlar hangileridir?"],["l","3. Türk dillerinin gelişimi için hangi faaliyetler yapılmaktadır?"],["l","4. Dil bir ülke için niçin gereklidir?"],["l","5. Türk dilinin gelişimiyle ilgili son dönemde öncülüğü kim yapmıştır, nasıl?"],["l","6. Türk dilinin gelişimi için vatandaşlar ne gibi çalışmalar yapabilir?"],["h","FUTBOL MAÇI"],["p","Türkiye’de insanlar, özellikle erkekler futbolla çok ilgilenir. Hemen hemen her erkeğin bir futbol geçmişi vardır. Birçok erkek, gençliğinde amatörce bu sporu yapmıştır veya en azından çocukluğunda mahalle ara­larında top koşturmuştur. Türkiye’de her"]]},{"n":111,"b":[["p","şehirde en az bir tane stadyum vardır. Maç günleri bu stadyumlar seyircilerle dolup taşar."],["p","O gün de 19 Mayıs Stadyumu’nda Türkiye’nin en büyük iki futbol ta­kımı arasında şampiyonluk maçı vardı. Ben de bu heyecanı yaşamak için arkadaşlarımla buluşup stadyuma gittim. Stadyumun girişi oldukça kalaba­lıktı. Bir tarafta yiyecek ve bayrak satıcıları, bir tarafta gazeteciler ve tele­vizyonların spor muhabirleri, bir tarafta ise itişe kakışa stadyuma girmeye çalışan seyirciler vardı."],["p","Nihayet içeri girip yerlerimize oturduk. Bütün tribünler iki takımın ta­raftarlarıyla doldu. Havada konfetiler uçuşmaya başladı. İki takımın oyun­cuları taraftarların tezahüratları, bağrışmaları arasında sahaya çıktılar. Bir­birleriyle selamlaştılar. İki takımın kaptanı birbiriyle tokalaştı. Az sonra maç başladı. Bizim takımın oyuncuları paslaşarak karşı takımın kalesine ulaştılar. Tam bu sırada hakem düdük çaldı. “Faul var!” diyerek oyunu dur­durdu. Bizim futbolcular bu duruma bir anlam veremeyip şaşkın şaşkın ba­kıştılar. Stadyumda hava iyice gerginleşti. Tribünlerden hakeme sataşma­lar başladı."],["p","Hakem oyunu hemen başlatıp ortalığı yatıştırdı. Karşılaşmanın heyecanlı atmosferi maçın sonuna kadar sürdü ve maç bizim takımın ga­libiyetiyle sona erdi. Sahada takımımızın futbolcuları kucaklaşarak birbir­lerini tebrik ederken bazı seyirciler de sahaya inerek futbolcuları kutladı. Maç çıkışında, bazı seyirciler arasında da itişmeler, sataşmalar; hatta birkaç karşıt taraftar arasında yumruklaşmalar oldu."],["l","A. Lütfen, soruları metine göre cevaplayınız."],["l","1. Nerede, ne zaman futbol maçı vardı?"],["l",".................................................................................................."],["l","2. Iyi futbolcu olmak için neler yapmalı?"],["l",".................................................................................................."],["l","3. Maç çıkışında seyirciler arasında neler oldu?"],["l",".................................................................................................."],["l","B. Lütfen, “Hemen hemen her erkeğin bir futbol geçmişi vardır.”"]]},{"n":112,"b":[["p","cümlesinde altı çizili sözcüğün anlamı, seçeneklerden hangisnde aynıdır, bulunuz."],["l","A) zamanı var B) ilgisi var C) vakti var D) tarihi var"],["l","E) topu var"],["l","C. Lütfen, seçeneklerin hangisinde meslek adları verilmiştir, bulunuz."],["l","A) futbol-basketbol-tenis"],["l","B) masa-sandaliye-tahta"],["l","C) doktor-hasta-eczane"],["l","D) gazeteci-muhabir-futbolcu"],["l","E) stadyum-tribün-taraftar"],["h","ERZURUM’DAN HARVARD’A"],["p","Onunla aslında çok önce buluştuk. Ama onunla ilgili notlarım masanın bir köşesinde durdu kaldı. Çok geciktim size Esin Taboğlu’yu tanıtmak için."],["p","Esin Taboğlu 1965 Erzurum doğumlu. Beş kardeşin dördüncüsü. Küçükken hep eczacı olmanın hayalini kurmuş. O günleri bakın nasıl anlatıyor: “Herhalde eczacıların kepleri hoşuma gidiyordu. Lise sona kadar Erzurum’da okudum. Sonra hayalim bilgisayar mühendisi ya da matematik profesörü olmak oldu.”"],["p","Liseyi birincilikle bitirmiş. “Çok çalışkanmışsınız.” diyorum, gülümsüyor, ”Yok canım küçük yerlerde okul birincisi olmak kolaydır. Sonra üniversite tercihimi yaptım. Bilgisayar istiyorum ama bir baktım hukuk bölümünü kazanmışım.”"],["p","Esin Taboğlu İstanbul’a yerleşmiş. İlk yıl, ikinci yıl “Benim bu bölümde ne işim var?” derken “birden” okulunu sevmeye başlamış. Önce dil öğrenmek için Columbia Üniversitesi’ne gitmiş. “O zaman yabancı dilim yoktu tabii. Lisede ne öğrendiysem o. Hiç unutmam, İngilizcem öylesine yetersizdi ki başvuru formlarını doldurmakta bile zorlanmışım. Ama yine de gittim. Yoğun bir dil programına katıldım.”"],["p","Sonra Harvard Üniversitesi’ne hukuk mastırı için başvurmuş. Kabul edilmesine kendi bile şaşırmış. “Harvard’ın ismi beni korkutmadı dersem yalan söylemiş olurum. Ama kabul edilen dört"]]},{"n":113,"b":[["p","kişiden biri olduğumu öğrenince çok gururlandım. Hazırlandım ve gittim. İlk günümü hiç unutmam. Derste İngilizce değil de Almanca konuşuyor gibiydiler.” Hiç ben bu işi yapamayacağım diye düşündü mü peki?” “Hayır” diyor. “Oraya gittikten sonra korkup geri dönmek gibi bir şey söz konusu bile olamazdı. Gururuma yediremezdim bir kere “Başaramadım.” demeyi.”"],["p","Esin Taboğlu başlamış çalışmaya. “O zamana kadar hukuk bölümüne Türkiye’den kimse başvurmamış. Beni bu daha da çok kamçıladı. Herkes bir çalışıyorsa ben on çalıştım, ne yalan söyleyeyim.” Harvard’ı bütün zorluklarına rağmen başarıyla bitirir Esin Taboğlu. Bir çok firmadan teklif almasına rağmen, özlem ağır basar, Türkiye’e geri döner ve on beş gün içinde iş bulur. “Önce bir Fransız hukuk firmasında çalıştım. Orada özelleştirme hukukunu öğrendim ve uzmanlığımı bunun üzerine geliştirdim.”"],["p","Esin Taboğlu bugün kendi hukuk bürosunu kurmuş başarılı bir kadın. Ya erkek dünyasında başarılı kadın olmak? “Bunca yıldan sonra bile kadınları iyi, yüksek konumlara yaklaştırmıyor bazı insanlar. Ne mi yapıyorum? Onları tiye alıyorum."],["l","A. Lütfen, aşağıdaki cümleleri metne göre işaretleyiniz. Doğru Yanlış"],["l","1. Esin Taboğlu, Harvard hukuk bölümümünde okuyan ilk Türktür. ( ) ( )"],["l","2. Esin Taboğlu kalabalık bir aile çocuğudur."],["l","( ) ( )"],["l","B. Lütfen, verilen atasözünü metne göre açıklama yapınız."],["l","3. “Görünen dağ rehber istemez!” atasözünü bu metine göre açıklayınız."],["l",".................................................................................................."],["l",".................................................................................................."],["l","C. Lütfen, soruları metine göre cevaplayınız."],["l","4. O üniversiteye nerede başlamış, nasıl kazanmış, öğrencilik hayatı nasılmış?"]]},{"n":114,"b":[["l",".................................................................................................."],["l","5. O neden yurt dışında çalışmak için kalmamamış? Türkiyede nerede çalışmış?"],["l",".................................................................................................."],["l","6. Türkiye’de kadınlar da erkekler gibi bütün haklara sahip midr?"],["l",".................................................................................................."],["h","NASRETTİN HOCA"],["p","Bütün tarihî şahsiyetler öldükten sonra da yaptığı işlerle hatırlanmaktadır. Meselâ Mimar Sinan yapıtlarıyla, Marco Polo seyahatleriyle, Tolstoy yazdığı romanlarla, Albert Einstein bilime olan katkılarıyla bütün dünya tarafından bilinmektedir. Nasrettin Hoca ise mizahî kişiliğiyle tanınmıştır."],["p","Günümüzde dilden dile dolaşan fıkralarda Nasrettin Hoca doğumundan ve ölümünden sonraki olaylara karışmış, sanki o olayları yaşamıştır. Meselâ; onun kendisinden en az yetmiş yıl sonra yaşamış olan Timur’la konuştuğu, Birkaç yerde birlikte görüldüğü anlatılmaktadır."],["p","Nasrettin Hoca, bundan yedi yüz yıl kadar önce Eskişehir’in Sivrihisar ilçesinde doğmuş, Akşehir’de yaşamış ve yine orada ölmüştür. Nasrettin Hoca’nın değeri, yaşadığı olaylarla değil, kendisinin gerek halkın onun ağzından söylediği fıkralardaki anlamla ifade edilir. Nasrettin Hoca, fıkralarında bilgili, bilgisiz, açıkgöz, kurnaz, utangaç ve vurdumduymaz kişiliklerde görülür. Nasrettin Hoca fıkralarında dile gelen, onun kişiliğinde, halkın duygularını yansıtan başka bir özellik de eşektir. Aslında bu fıkralarda eşek, eleştiri ve alay öğesidir. Eşek; acıya, sıkıntıya, dayağa, açlığa katlanmanın simgesidir."],["p","Türkçenin konuşulduğu her yerde Nasrettin Hoca’nın fıkraları yayılmış ve anlatıla gelmiştir. Nasrettin Hoca fıkraları dünyanın birçok dillerine çevrilmiştir. Fıkraların hepsinin bir anlamı vardır. Bu anlam o zamanki insanların yaşantısını göstermektedir. Bu fıkralarda Nasrettin Hoca, aşırı davranışlara karşı zıt fikirlerle cevap veren, zeki, hazır cevap ve sempatik bir insandır. Her fıkrada"]]},{"n":115,"b":[["p","Hoca’ya ait bir nükte vardır. Fıkralar arasında Hoca’ya ait olmayanlar da vardır. Bunun nedeni insanların Hoca’yı çok sevmeleri ve onu efsaneleştirmeleridir."],["p","Nasrettin Hoca’nın türbesi Akşehir’de bulunmaktadır. Bu türbe 1907 yılında tamir edilmeden önce, altı direk üzerinde bulunuyordu. Duvarı olmayan bu türbenin kapısının kilitli olması da Hoca’nın kişiliği ve mizahî anlayışıyla açıklanmaktadır."],["l","A. Aşağıdaki sorulara cevap veriniz."],["l","1. Nasrettin Hoca’nın fıkraları nasıldır?"],["l",".................................................................................................."],["l","2. Nasrettin Hoca nerede doğmuş ve nerede ölmüştür?"],["l",".................................................................................................."],["l","3. Hoca’nın fıkralarının arasına neden kendisine ait olmayan fıkralar da girmiştir?"],["l",".................................................................................................."],["l","4. Nasrettin Hoca’nın türbesi ne zaman onarılmıştır?"],["l",".................................................................................................."],["l","5. Nasrettin Hoca’nın mezarının kapısı niçin kilitlidir?"],["l",".................................................................................................."],["l","6. Nasrettin Hoca nerede ve kaç yıllarında yaşamıştır?"],["l",".................................................................................................."],["l","7. Nasrettin Hoca fıkralarında hangi kişilik özelikleriyle tanınmaktadır?"],["l",".................................................................................................."],["l","8. Nasrettin Hoca’nın fıkralarında eşeğin rolü nedir?"],["l",".................................................................................................."],["l","9. Nasrettin Hoca’nın fıkraları hangi bölgelere yayılmıştır?"],["l",".................................................................................................."],["l","10. Bilinen tüm Nasrettin Hoca fıkraları gerçekten ona mı aittir?"],["l",".................................................................................................."],["l","B. Asagidakilere doğru olana (D) yanlış olana (Y) yazınız."],["l","1. ( ) Nasrettin hocanin fikralari korkunçtur."]]},{"n":116,"b":[["l","2. ( ) Nasrettin hoca Bayburtta doğmuştur."],["l","3. ( ) Nasrettin hocanın fikralarında attan bahsedilir."],["l","4. ( ) Nasrettin hoca Timurla konuşmuştur."],["l","5. ( ) Nasrettin hocanın fıkraları birçok dile çevrilmiştir."],["l","C. Lütfen, soruları yanıtlayınız."],["l","1. Kendi ulkenizin efsanelerinden bir tanesini secip hayatini anlatın."],["l","2. En sevdiginiz bir yazardan bahsedin."],["l","D. Doğru bir şekilde cümleleri yerine koyunuz."],["l","1) hocanın – Nasrettin – komiktir - fıkraları."],["l","……………………………………………………………….."],["l","2) akşehirde - nasrettin hoca – ölmüştür - doğup."],["l","………………………………………………………………."],["l","3) fıkraları-çevrilmiştir-birçok-dile-nasrettin hocanın."],["l","………………………………………………………………."],["h","BANKACILIK"],["p","Başta Rusya olmak üzere geniş bir coğrafyada faaliyet gösteren Türk yatırımcılar bankacılık ve diğer mali hizmetler için Hollanda ve İngiltere gibi AB ülkelerini tercih ederken imalat, inşaat ve ulaşım gibi alanlarda eski Sovyetler Birliği ülkelerini seçiyor. Türk yatırımcıların yaptıkları inşaatların tutarı 16 milyar doları aşıyor."],["p","Aralarında Türkiye’nin büyük ve köklü grupları da var, oralardaki inşaatlarda eksik gördükleri noktaları tamamlamak üzere girişiminde bulunan çiçeği burnunda işadamları da..."],["p","Hazine verilerine göre Türkiye’den giden doğrudan sermaye miktarı 7 milyar doları aşıyor. Türk yatırımcıların yurtdışına gitme nedenlerinin başında, söz konusu ülkelerdeki yatırım koşullarının Türkiye’ye göre daha iyi olmasının yanı sıra gelişen yeni ilişki biçimleri ve bu ülkelerdeki boşluklar da Türk yatırımcılar için cazip noktaları oluşturuyor."],["p","“Sovyetler Birliği’nin 1991’de dağılmasıyla 15 bağımsız cumhuriyet kuruldu. Eskiden merkezi olarak Moskova ile yapılan"]]},{"n":117,"b":[["p","ticaret, tek tek cumhuriyetlerde yapılmaya başlandı” diyen Erkin, yapılan faaliyetleri de dört ana grupta topluyor. İlk gruba ticareti koyan Erkin, ikinci grubu yatırımlar, üçüncü grubu müteahhitlik hizmetleri, dördüncü grubu da turizm olarak sıralıyor."],["p","İlk ilişkilerin 1990’ların hemen sonrasında kurulduğunu dile getiren Erkin, bir yandan oraların gelişmesine yardımcı olunduğunu, bir yandan da iş olanakları yaratıldığını belirtiyor."],["p","Bankacılık hizmetleri, uçak seferlerinin konulması, TSE’nin dünya standartlarını tanıtması, mesleki eğitim için binlerce öğrencinin gelmesi bu yardımlar arasında sayılabilir."],["p","Öte yandan orada otel, havaalanı ya da santralde çalışmak üzere giden bir ustabaşının, tamirci dükkanı göremeyince tamirci açması, bir mühendisin boşluk görerek büyük bir lokanta açması gibi tek tek girişimler de yaygınlaştı."],["p","Söz konusu ilişkilerin ticaret hacimlerini de arttırdığına dikkat çeken Erkin, Ukrayna ile 200 milyon dolar olan hacmin buğün 4 milyara ulaştığını hatırlatıyor."],["p","Aşağıdaki test sorularını cevaplayın."],["l","1.Türk yatırımcıları bankacılık için hangi ülkeleri tercih ediyor?"],["l","A) Afganistan B) Rusya"],["l","C) Azerbaycan D) Hollanda ve İngiltere"],["l","E) Kazakistan ve Kırgızistan"],["l","2. Türkiye inşaat ve ulaşım alanlarında hangi ülkeyi seçiyor?"],["l","A) Amerika B) İngiltere"],["l","C) Hindistan D) Komşu ülkeleri"],["l","E) Soviyetler Birliği"],["l","3. Hangi faaliyet dördüncü grupta yer alıyor?"],["l","A) ticaret B) turizm"],["l","C) yatırım D) tekstil"],["l","E) müteahhitlik"]]},{"n":118,"b":[["l","4. Ülkeler arasındaki ilişki ne zaman başlamış?"],["l","A) 1990’ların sonrasında B) 1991’de"],["l","C) 1990’lardan önce D) 1990’da"],["l","E) 2000’de"],["l","5. Ukrayna ile hacim bugünde ne kadar?"],["l","A) 200 milyar B) 200 milyon"],["l","C) 300 milyon C) 4 milyar"],["l","E) 4 milyon"],["l","6. Sizce bu makalenin konusu nedir?"],["h","EDEBİYAT VE AHLAK"],["p","Ahlakın başlıca kurucusu ve yayıcısı edebiyattır. Bir kimsenin sıkıntılar çektiğini, yüreğinden yaralandığını anlamamız için kendisini görmemiz, diyeceklerini dinlememiz yeter sanırız. Oysaki yetmez; görmek, dinlemek başka, anlamak gerçekten anlamak başkadır. Anlarız, öğreniriz, bilgi ediniriz ama bu bilgi içimizi sarmaz, içimize işlemez. İnsanoğlu bencildir. Bencil olduğu için de yalnız kendi dertlerini düşünür, yalnız onlara inanır, başkalarında olan dertleri kendi derdiymiş gibi kavrayamaz. Hatta başkalarının dertlerine gülmezse, onlarla eğlenmezse yine iyidir."],["p","Bizi bu bencillikten edebiyat kurtarır. Şiirler, hikâyeler, romanlar, tiyatrolar, denemeler kurtarır. Başka insanların iç dünyalarını bize açarlar, bize başkalarını dertlerini, sevinçlerini bunlar duyurur. Edebiyat eserlerindeki kahramanları çevrenizdeki insanlarla kendinizle bütünleştirirsiniz. İlim bize dışı öğretir, onun öğrettikleri bizim dışımızda kalır. Sanat, edebiyat ise öğretmez bize yaşatır, sezdirir, kavratır. Ahlakın asıl istediği de bu sezme, kavrama işidir. Edebiyattan, sanattan uzak olan kişiler başkalarını anlamada, onların sevinçlerini, üzüntülerini paylaşmada güçlük çekerler."],["p","Bir toplumda ahlakın düzelmesini insanlık seviyesinin yükselmesini istiyor musunuz? O toplumda edebiyat, sanat merakını uyandırmaya, geliştirmeye çalışmalıyız. Çocuklara, gençlere romanlar, hikâyeler, denemeler okutmalıyız. Onları tiyatroya,"]]},{"n":119,"b":[["p","sinemaya göndermeliyiz. Bu şekilde insanlar birbirini daha iyi anlayacak toplum daha başka olacaktır. Siz çocuklarınıza edebiyatı sanatı sevdirin ilim bilgi ardından gelecektir."],["p","Atatürk’ün bu konu hakkında güzel bir sözü vardır: “Sanatsız kalan bir milletin hayat damarlarından biri kopmuş demektir”."],["l","I. Okuduğunuz parçaya göre aşağıdaki cümlelerden doğru olanın başına “D” yanlış olanın başına “Y” yazınız."],["l","1. ( ) Görmek, dinlemek, anlamak başka; sezmek, kavramak, hissetmek gerçekten başkadır."],["l","2. ( ) Ahlakın başlıca kurucusu ve yayıcısı dildir."],["l","3. ( ) Sanat ve edebiyat toplumun sosyalleşmesine katkıda bulunur."],["l","4. ( ) Sanat ve edebiyat bize her şeyden daha çok bilgi verir."],["l","5. ( ) Edebiyat insanın her şeyden daha çok kendisini düşünmesine sebep olur."],["l","6. ( ) Sanat ve edebiyat ahlakın gelişimine katkıda bulunur."],["p","II. Lütfen, soruları metine göre cevaplayınız."],["l","1.Bir kimseyi anlamamız için edebiyat bize ne gibi yardımlarda bulunur?"],["l","2. Edebiyattan uzak insanlar hangi sorunlarla karşılaşırlar?"],["l","3. Bir toplumda ahlakın düzelmesi, insanlık seviyesinin yükselmesi için ne yapmak gerekir?"],["l","4. Ahlakın edebi eserlerden istediği nedir?"],["l","5. İlim ile edebiyatın farkı nedir? Bu farkı açıklayınız."],["l","6. Atatürk, bu sözle bize ne anlatmak istemiştir?"],["h","LALE"],["p","Lale, eskiden Türkler için çok önemli bir çiçekti. Osmanlılar lale resimlerini her yerde; örneğin halılarda, kilimlerde, cami, okul ve çeşme duvarlarında kullandılar. Saray kadınlarının, hatta padişahın bile elbise ve havlularında lale motifleri vardı. Türkler İstanbul’u aldıktan sonra, bütün bahçeleri lalelerle süslediler. Lale yetiştirme"]]},{"n":120,"b":[["p","merakı, özellikle zengin insanlar arasında çoktu. Bu yüzden Osmanlı Tarihi’nin bu dönemine “Lale Devri” dediler."],["p","Lale soğanını 400 yıl önce bir diplomat İstanbul’dan Avrupa’ya götürmüş. O zaman herkes bu güzel çiçeğe sahip olmak istemiş. Bu nedenle lale fiyatları hızla artmış. Hollanda’da çok değerli bir lale soğanını 25000 guldene satın almak mümkünmüş. Lale yüzünden bazı insanlar çok zengin, bazıları da çok fakir olmuş. O zamanlar lale, altından daha değerli, daha önemliymiş."],["p","Bütün dünyada en çok ve en güzel laleler Hollanda’da yetişiyor. Lalelerin beyazdan siyaha kadar çeşitli renkleri vardır. Kırmızı bir lale kadar, sarı ve pembe renkli laleler de insanların hoşuna gider."],["p","Son yıllarda Türkiye’de insanlar tekrar lale yetiştirmeye önem vermeye başladılar. 1959’da çiçekçiler İstanbul’da bir lale sergisi açıp değişik lale türlerini insanlara tanıttılar. Özellikle Emirgan ağaçlığı devamlı lale bahçesi haline geldi. Bugün pek çok bahçede, botanik bahçelerindeki kadar güzel laleler görmek mümkün oluyor."],["l","I. Aşağıdaki sorulara metne göre yanıt verin."],["l","1. Lale devrinde lale resimlerini nerelerde görmek mümkündü?"],["l",".................................................................................................."],["l","2. İstanbul’daki bütün bahçeler ne zaman lalelerle doldu?"],["l",".................................................................................................."],["l","3. Avrupa’da lale fiyatları niçin hızla arttı?"],["l",".................................................................................................."],["l","4. İnsanlar hangi renklerde laleler yetiştiriyorlar?"],["l",".................................................................................................."],["l","5. 1959’daki lale sergisini çiçekçiler hangi amaçla açtılar?"],["l",".................................................................................................. II. Aşağıdaki tümceleri metne göre işaretleyin."],["l","1. Osmanlılar lale resimlerini pek çok yerde kullandılar."],["l","(D) (Y)"],["l","2. Türkler İstanbul’u almadan önce bütün bahçeler lalelerle doluydu. (D) (Y)"],["l","3. Lale yetiştirmek fakir insanlar için çok kolaydı."],["l","(D) (Y)"]]},{"n":121,"b":[["l","4. Lale soğanını bir diplomat Avrupa’dan İstanbul’a getirdi."],["l","(D) (Y)"],["l","5. Bir dönemde Avrupa’da altın bile laleden daha az değerliydi."],["l","(D) (Y)"],["h","KAHVE VE SOHBETIN ARDINDA GIZLI"],["h","OLAN BIR ÇIFT KÜPE"],["p","Eskiden geldiğimiz yere geldim anneciğim... ama gene sen yoksun..."],["p","Hatırlıyorumda hiç değişmeyen haftalık bir programdı sanki bizimkisi. Her hafta buraya gelmek ve aynı lezzette olan kahvelerimizi yudumladıktan sonra o mistik kokulu peçeteyi dudağımıza dokundurup gitmek düşerdi bize... O günkü sohbetinden ardından sonra ve sen anne!!. Bilmem fark eder miydin ama, her defasında da kızının kulağına farklı bir küpe takardın sezdirmeden, öyle gizlice. Sanki “Al bunu kulağına tak kızım, zamanı geldiğinde kullanırsın!” der gibiydin, hatta konuşman bittiğinde “‘istediğin anda çıkar, bazen bir diğeriyle değiştir, istersen hiç takma da, ama ne olursa olursun bu çift küpeyi sakın kaybetme” der gibi gözlerinle bakardın sessizce..."],["p","Anneciğim!!! Biliyor musun ben hala her hafta geliyorum buraya, seninle hiç konuşmadan sessizce kararlaştırdığımız o günlerdeki gibi, ama artık senden bir çift küpe dahi alabilme şansım yok. Meğer ne kadar da özel ve değerliymiş, kahve ve sohbetin ardında gizli olan bir çift küpe..."],["p","Bilki hepsini saklıyorum anne... Senin çeyizinden kalan tahta işlemeli mücevher kutusundalar ve ne zaman yüreğim sessizden kanasa, ne zaman senin sesine ihtiyacım olsa takıyorum bir çiftini kulağıma. Bazen nerde benim destekçi annem derken fark ediyorum ki, bir çift küpe bana bakar aralıkdan “işte kızım ben buradayım” der gibi... Hepside hayat karşısında farklı zamanlarda, farklı insanlara karşı yapılmış bir çift küpeler sanki..."],["p","Anneciğim şimdi artık ben senin yerinde oturuyorum ve karşımda oğlum var. Eğer görseydin kim bilir ne kadar mutlu olurdun. Belki bir anda gözlerin dolardı ya da sessizliğin içinde"]]},{"n":122,"b":[["p","kaybolurken kimsenin anlıyamayacağı incelikle onun yüreğine bir buse bırakırdın."],["p","Yıllar sonra çok daha iyi anladım senin yüreğini ve inceliğini. Sevdiklerine nasıl büyük bir vefa örneği olduğunu, bazen camdan dışarı bakıp, sanki bugün güneş soğuk ruhlara fazla işlemiyor deyip dışarı çıktığını. Sokakta suratı asık insanlara gülümsemenle ısıtmanı."],["p","Ahh bilemiyorum anneciğim, ben senin gibi kendi hayatıma sahip çıkmayı başarabildim mi, acaba? Ve oğluma verebileceklerim, senin bana verdiğin onca çift küpenin kaçta kaçı olacak acaba?..."],["l","A. Lütfen, aşağıdaki cümleleri metne göre işaretleyiniz. Doğru Yanlış"],["l","1. Yazar annesiyle geçerdiği güzel günleri hatırlamaktadır."],["l","(.....) (.....)"],["l","2. Çocukluğunda annesini dinlemediği ve üzdüğü için pişmandır. (.....) (.....)"],["l","B. Lütfen, verilen atasözünü metne göre açıklama yapınız."],["l","3. “Cennet annelerin ayağındadır.” atasözünü bu metine göre açıklayınız."],["l",".................................................................................................."],["l",".................................................................................................."],["l","C. Lütfen, soruları metine göre cevaplayınız."],["l","4. Annesinin önemini ne zaman anlamış?"],["l",".................................................................................................."],["l","5. Yazar annesiyle kendisin nasıl karşılaştırıyor?"],["l",".................................................................................................."],["l","6. Çocuğun başarılı olmasının sebebi nededir?"],["l",".................................................................................................."],["h","ŞİMDİ ÇAYIN DA HATIRI VAR"],["p","Sabahları uyunun verdiği mahmurluğu, onun bardağa dökülürken çıkardığı ses etrafa yaydığı kokusu ve dudaklarımızı kısarak çektiğimiz ilk yudumuyla atarız. Çok etkili bir ilaç gibi bizi"]]},{"n":123,"b":[["p","kendimize getirir. Sabah kahvaltıda başlayan çay seansı böylelikle akşam yatağa girene dek devam eder. Kışın iliklerimize kadar üşüdüğümüzde yine çatdan aldığımız sıcak yudumlar içimizdeki buzları çözer. Misafir ağırlarken, sohbetleri koyulaştırmada çay hemen imdadımıza yetişir. Son elli yıldır, kırk yıl hatırı kalan kahvenin yanına ince belli bardaklarda afiyetle içtiğimiz bir bardak çayı da ekledik. Eskiden sabahları çorba içilir sonra kahveler yudumlanırdı. Çayın yükselişi ile beraber kahvehaneler de artık çayhane oluyor. Çayın kahveye göre ucuzluğu, pratikliği, kahvenin az içilmesine, turistik bir hale gelmesine yol açtı. Bir bakıma da kahve sınıf atladı. Çay kültürünün gelişmesi ile pişirilmesinde ve içilmesinde de zaman içinde yerine göre değişiklikler meydana geldi. Türk çay pişirme yönteminin kökeninde Rus semaveri var. Kimi çay bahçelerinde, bazı evlerde hala semaverde pişen çaylar içiliyor. Genelde evlerimizde pratikliğinden dolayı ocaklarda demlediğimiz çayı yudumluyoruz. İpek Yolu üzerinde işleyen kervanlar, çayı Anadolu’ya çoktan tanıtmıştı. Fakat bu yeşil bitkinin Doğu Karadeniz’e ulaşması yaşadığımız yüzyılın ikinci çeyreğinde yani 1940’lı yıllarda gerçekleşmiş. Çok dağlık olan bölgeden nüfus hızla göç ediyormuş. Taki Zihni Derin isimli ziraat umum müdürünün Batum’dan çay fidelerini getirmesine kadar: böylelikle çayın Türkiye serüveni başlamış. Doğu Karadeniz Bölgesi’nde, deniz kıyısında Kafkas dağlarına kadar uzanan dağ etekleri, yüksek yağış almasından dolayı çay için ideal zemin oluşturuyor. Arada bir yağan kar da böcek ve benzeri zararlıları öldürerek tarım ilaçlarının tehlikesini ortadan kaldırıyor. Malatya’da kayısıda, Çukurova’da pamukta, Ege’de zeytinliklerde hep emek sarf eden Anadolu kadınını bu sefer Karadeniz’de kırmızı peştamalı, sırtında sepeti, elinde makası ile çay keserken görürsünüz. Çayın toplanması mayıs ayında başlayıp yaklaşık altı ay sürmektedir. Dik yamaçlarda insanın yürüyerek zor çıkabileceği yerlerde gördüğünüz aylıklar insan azminin göstergesidir. Bu çayları oralarda kesip toplama ayrı bir maharet, dağ bayır demeden taşımak ise ayrı bir gayret istiyor."]]},{"n":124,"b":[["l","1. Lütfen aşağıdaki metni paragraflara bölünüz ve her paragrafı adlandırınız."],["l","2. Yukarıdaki konuyu ele alan bir yazı yazınız."],["l","3. Aşağıdaki ifadeler doğru mu (D), yanlış mı (Y)? 1- ( ) Günümüzde sabah kahvaltılarının vazgeçilmez içeceği kahvedir. 2- ( ) Misafirlere ikram edilen en önemli içecek çaydır. 3- ( ) Çay demlemek kahve yapmaya göre daha zordur. 4- ( ) Eskiden kahvaltıda çay yerine sıcak çorba içilirmiş. 5- ( ) Çay Anadolu’ya İpek Yolu üzerinde işleyen kervanlar sayesinde girmiştir. 6- ( ) Çay, daha çok sıcak yörelerde yetiştirilir. 7- ( ) Çay, Türkiye’ye ilk defa Bakü’den getirilmiştir. 8- ( ) Kar, çayın yetiştirilmesine zararlıdır. 9- ( ) Günümüzde kahve çaya göre daha lüks bir içecektir."],["h","ÇAYIN EFSANESİ"],["p","5000 bin yıl öncesine giden çayın tarihi konusunda çeşitli efsaneler vardır:"],["p","Bunlardan ilki Çin’e dayanıyor. M.Ö.(milattan önce) 2700’lü yıllarda tıp bilimine meraklı olduğu bilinen Çin İmparatoru Shen Nung, su içmenin sağlığa olan olumlu etkilerini gözlemlemiş. Bir gün kendi sıcak suyunu hazırlarken, demliğine birkaç yaprak düşmüş. Kaynayan suyun buharından mistik ve rahatlatıcı bir aroma yükseldiğini görmüş ve bu sıcak içecekten bir bardak içerek onun harika lezzeti ve aroması karşısında hayret etmiş. Demliğine düşen bu yapraklar bir çeşit yabani çay ağacına aitmiş..."],["p","Çayın Japonya’daki efsanesi biz bir keşişe götürüyor. Hayatının yedi yılını Buda’ya adayarak uyumadan geçiren bu keşiş, bir gün istemeyerek uyuyakalınca çok kızmış ve ardından göz kapaklarını kesip toprağa atmış. Toprakta köklenerek büyüyen bitki, çay bitkisiymiş."],["p","Hindistan’da çayın keşfini bu keşişe bağlar. Onların öyküsüne göre bu keşiş uykusuza geçirdiği yılların beşincisinde yanındaki ağaçtan birkaç yaprak alır ve çiğner. Birden bire canlandığını gören"]]},{"n":125,"b":[["p","keşiş bunu sık sık tekrarlar. Bu yabani ağaç elbette ki çay bitkisidir."],["p","Sudan sonra en eski ve en çok tercih edilen içecek olan çayın Türkiye’deki serüveni oldukça yenidir. 1888’deki ilk ciddi girişiminden sonra üretimdeki gerçek başarı ancak 1940’larda elde edilmiştir. Bugün Türkiye, üretimde Hindistan, Seylan gibi ülkelerden sonraki yerini korumaktadır. Tüketimde de İngiliz ve İrlandalıların ardından üçüncü sırada gelmektedir."],["p","Aşağıdaki soruları yanıtlayınız."],["l","1. Çay ilk ne zaman keşvedilmiş?"],["l","a) 2700 yıllarda b) M.Ö.2700 c) 5000 yıl önce"],["l","b) d) 1888 yılında e) 1940 yılında"],["l","2. Çin İmparatoru çayı nasıl keşfetmiş?"],["l","a) Ormanda b) tarlada c) bardağına birkaç yaprak düşmüş"],["l","b) d) ekinde e) bahçede"],["l","3. Japonya’daki keşiş gözünü ne yapar?"],["l","a) Kesip toprağa atar b) gözlük takar c) gözü kızarır"],["l","b) d) göz hastalığı olur e) uyuyor"],["l","4. Toprakta büyüyen bitki neymiş?"],["l","a) Ağaç b) sebze c) çay d) çaydanlık e) yaprak"],["l","5. Hindistan’daki keşiş çayı nasıl bulur?"],["l","a) Bir ağaç yaprağını alır ve çiğner b) bahçeye eker"],["l","c) ormandan bulur d) topraktan bulur e) Çin’den getirir"],["l","6. Çay hangi içecekten sonra en eski içecektir?"],["l","a) kahveden sonra b) sütten sonra c) sudan sonra"],["l","d) içkiden sonra e) buzdan sonra"],["l","7. Çay Türkiye’ye ne zaman gelir?"],["l","a) 5000 yılında b) 1970 yılında c) 1888 yılında"],["l","d) M.Ö.2700 yılında e) çok eski zamanda"],["l","8. Çay üretiminde Türkiye hangi ülkelerden sonra yer alır?"],["l","a) İngiliz ve Çin b) İrlanda c) Japonya ve İngiliz"],["l","d) Çin ve Seylan e) Hindistan ve Seylan"],["l","9. Çay başarılı olarak Türkiye’de ne zaman elde edildi?"],["l","a) 1888 b) 1940 c) 1970 d) 2700 yılında e) 21 Asırda"]]},{"n":126,"b":[["l","10. Türkiye çay tüketimde hangi ülkelerden sonra üçüncü sıradadır?"],["l","a) Hindistan ve Çin b) Japonya ve İngiltere"],["l","c) İrlanda ve İngiltere d) İrlanda ve Seylan"],["l","e) Seylan ve İngiltere"],["h","GERÇEK MUTLULUK GERÇEK SEVGİ"],["p","“Bebeğimi görebilir miyim?” dedi başörtülü yeni anne. Kucağına yumuşak bir bohça verildi ve mutlu anne, bebeğinin minik yüzünü görmek için kundağını açtı ve şaşkınlıktan adeta nutku tutuldu! Anne ve bebeğini seyreden doktor hızla arkasını döndü ve camdan bakmaya başladı. Bebeğin kulakları yoktu. Muayenelerde, bebeğin duyma yetkisinin etkilenmediği, sadece görünüşü bozan bir kulak yoksunluğu olduğu anlaşıldı."],["p","Aradan yıllar geçti, çocuk büyüdü ve okula başladı. Bir gün okul dönüşü eve koşarak geldi ve kendisini annesinin kollarına attı. Hıçkırıyordu."],["p","Bu onun yaşadığı ilk büyük hayal kırıklığıydı; Ağlayarak: “Büyük bir çocuk bana ucube dedi”. Küçük çocuk bu kadersizliğiyle büyüdü. Arkadaşları tarafından sevildi ve oldukça da başarılı bir öğrenciydi. Sınıf başkanı bile olabilirdi; eğer insanların arasına karışmış olsaydı. Annesi, her zaman ona “Genç insanların arasına katılmalısın” diyordu, ancak aynı zamanda yüreğinde derin bir acıma ve şefkat hissediyordu."],["p","Delikanlının babası, aile doktoru ile oğlunun sorunu ile ilgili görüştü; “Hiç bir şey yapılamaz mı?” diye sordu. Doktor, “Eğer bir çift kulak bulunubilirse, organ nakli yapılabilir” dedi. Böylece genç bir adam için kulaklarını feda edecek biri aranmaya başlandı. İki yıl geçti, bir gün babası “Hastaneye gidiyorsun oğlum, annen ve ben, sana kulaklarını verecek birini bulduk ancak unutma bu bir sır” dedi."],["p","Operasyon çok başarılı geçti ve adeta yeni bir insan yaratıldı. Yeni görünümüyle psikolojisi de düzelen genç, okulda ve sosyal hayatında büyük başarılar elde etti. Daha sonra evlendi ve diplomat oldu."],["p","Yıllar geçmişti, bir gün babasına gidip sordu; “Bilmek zorundayım, bana bu kadar iyilik yapan kişi kim? Ben o insan için"]]},{"n":127,"b":[["p","hiç bir şey yapamadım. Bir şey yapabileceğimi de sanmıyorum” dedi. Babası, “Fakat anlaşma kesin, şu anda öğrenemezsin, henüz değil”. Bu derin sır yıllar boyunca gizlendi. Ancak bir gün açığa çıkma zamanı geldi. Hayatnını en karanlık günlerinden birinde, annesinin cenazesi başında babasıyla birlikte bekliyordu. Babası yavaşça annesinin başına elini uzattı; ilk defa başörtüsüz gördüğü annesinin, kızıl kahverengi saçlarını elleriyle geriye doğru itti; annesinin kulakları yoktu. “Annen sana kulaklarını verebildiği için çok mutlu oldu” diye fısıldadı babası. “Ve hiç kimse annenin daha az güzel olduğunu düşünmedi değil mi?” Gerçek güzellik fiziksel görünüşe bağlı değildir, ancak kalptedir. Gerçek mutluluk, gördüğün şeye değil, asıl görünmeyen yerdedir."],["p","Gerçek sevgi, yapıldığı bilinen şeyde değil, yapıldığı halde bilinmreyen şeydedir."],["l","A) Lütfen, aşağıdaki cümleleri metne göre işaretleyiniz. Doğru Yanlış"],["l","1. Çocuk annesinin yardımıyla başarıya ulaştı. (.....) (.....)"],["l","2. Çocuk zeki, çalışkan, başarılı fakat özürlüydü. (.....) (.....)"],["l","B) Lütfen, verilen atasözünü metne göre açıklama yapınız."],["l","3. “Anne gibi yar vatan gibi diyar olmaz” atasözünü bu metine göre açıklayınız."],["l",".................................................................................................."],["l",".................................................................................................."],["l","C) Lütfen, soruları metine göre cevaplayınız."],["l","4. Çocuk neden kendi yaşıtlarıyla karışamaz ve oynayamazdı?"],["l",".................................................................................................."],["l",".................................................................................................."],["l","5. Çocuğun ailesi nasıl bir fedakarlıkta bulundu?"],["l",".................................................................................................."],["l",".................................................................................................."],["l","6. Çocuğun başarılı olmasının sebebi nededir?"],["l",".................................................................................................."],["l",".................................................................................................."]]},{"n":128,"b":[["h","GERÇEK DOSTLUK BU"],["p","Günün birinde iki dost varmış her ikiside çok iyimiş ama biri saf diğeri ise kurnaz ve açık gözlüymüş. Açık gözlü olan dostun şirketi batmış ve dostundan para istemiş. Dostu ne demek, sen benim en iyi dostumsun demiş ve bütün servetini vermiş. Aradan günler geçmiş açık göz olan işlerini büyütmüş, işlerinde ilerlemiş. Açık göz olan dost günün birinde dostunun yanına gitmiş, senin nişanlını çok beğeniyorum bana onu verir misin, demiş. Saf olan o benim nişanlım ama sen benim en iyi dostumsun demiş ve veririm."],["p","Aradan aylar geçmiş bu saf olan dostun bir gün işleri bozulmuş ve dostunun yanına gitmiş ve ondan iş istemiş. Açık göz olan dostu ona iş vermemiş. Saf olan dost biraz ezilip büzülmüş ve iş aramaya başlamış. Giderken yolda yaşlı bir adam, “Oğlum çok hastayım, bana şu reçetedeki ilaçları alır mısın?” demiş. Saf dost cebindeki son para ile adamın ilaçlarını almış."],["p","Ertesi günü bir avukat, “Dün ilaçlarını aldığınız yaşlı adam öldü ve tüm mal varlığını size bıraktı!” demiş. Çocuk şaşırmış, ama bu serveti kabul etmiş."],["p","İşlerini yoluna koymuş ve tam arkadaşının şirketinin karşısına bir ev almış. Niyeti sadece en iyi dostunu her gün görebilmekti."],["p","Günün birinde kapısına yaşlı bir teyze gelmiş, “Oğlum çok acıktım bana yemek verir misin?” demiş. Saf olan dost, “Teyze veririm ama bir şartla, benim yanımda çalışır mısın? Hem bana yardım edersin hemde karnın doyar.” demiz. Teyze kabul etmiş."],["p","Aradan üç sene geçmiş, kadın ona, “Oğlum, artık senin evlenme çağın geldi, artık sana bir eş lazım!” demiş. Çocuk bu durumu kabul etmiş “Tamam teyze, tanıdığın biri varsa evleneyim.” demiş. Kadın “Bizim orda çok iyi bir aile kızı var, seni onunla başgöz edelim.” demiş."],["p","Saf dost, en iyi arkadaşına nikah davetiyesinden bir tanede ona yollamış. Düğün günü saf dost eline mikrofonu alıp dostlar size bir diyeceğim var: “Günün birinde benim en iyi dostum vardı. Bir gün işleri battı benden para istedi bütün mal varlığımı ona verdim. Benden nişanlımı istedi gözümü kırpmadan ona verdim. İşlerim bozuldu yanına gittim iş istedim, bana “Sana burda iş yok!” dedi.”"]]},{"n":129,"b":[["p","demiş. Sizce bu gerçek dost mu?” demiş."],["p","Lütfen, soruları okuduğunuz metine göre yanıtlayınız."],["l","1. Gerçek dostluk dediğimiz nedir?"],["l",".................................................................................................."],["l","2. Saf olan dostuna yardim etmiş mi?"],["l",".................................................................................................."],["l","3. Seçeneklerin hangisi kurnaz dostun özelliğidir?"],["l","A) mal varlığını vermiş"],["l","B) nişanlısını vermiş"],["l","C) şirketi batmış"],["l","D) kardeşine evlenmiş"],["l","E) yaşlı adama ilaç almış"],["l","3. Seçeneklerin hangisinde “Çünkü nişanlısı ona göre bir kız değildi.” cümlesinin anlamıyla aynı anlamdadır?"],["l","A) “Sebebi, nişanlısı iyi bir insan değildi.”"],["l","B) “Çünkü, nişanlısı kötü kalpli biriydi.”"],["l","C) “Çünkü, nişanlısı güzel birisi değildi.”"],["l","D) “Nedeni, nişanlısı ona layık değildi.”"],["l","E) “Çünkü dostu nişanlısına layıktı.”"],["l","4. Lütfen, “Saf dost neden dostunun şirketinin karşısından ev almış?” sorusunun cevabını seçeneklerden bulunuz."],["l","A) Ona her gün yanlışlığını hatırlatmak için."],["l","B) Onu her gün görebilmek için."],["l","C) Nişanlısını her gü görebilmekiçin."],["l","D) Onu sevmediği için"],["l","E) Orada ev ucuz olduğu için."],["h","ESKİMOLAR"],["p","Dünyanın en kuzeyinde yaşayan Eskimolar herkesin ilgisini çekmiştir. Fakat, Eskimolar kendilerine “Eskimo” demezler. Genellikle “inuit” derler. Bu: “insanlar” anlamına gelir. Eskimo adıysa onlara sonradan verilmiştir. Anlamıysa “çiğ et yiyenler” demektir."],["p","Peki ama kimdir Eskimolar? Asya ve Amerika birbirine"]]},{"n":130,"b":[["p","bağlı olduğu zaman, buzul çağında, Sibirya’dan Alaska’ya geçen avcıların torunlarıdır. Anavatanı Asya olan Eskimolar, tarih içinde yavaş yavaş buradan göç etmişlerdir. Günümüzde ise Sibirya’nın kuzeydoğusunda az sayıda Eskimo yaşamlrını sürdürür. Çoğunluğu Grönlanda kıyılarınd Alaska’da, Rusya’nın kuzeyinde, Kanada’da ve Labrodor kıyılarında yaşamaktadır. Eskimolar 6 veya 9 ay süren kışta yaşamak zorundadırlar. Öyle ki sıcaklık -40 dereceye kadar düşebilir ve genellikle -6, -7 dereceden yukarıya çıkmaz. Yaşadıları yerlerde hiçbir tarım imkanı yoktur. Doğal olarak Eskimolar eskiden beri avcılık ve balıkçılıkla geçinirler. Eskimolar dünyanın en kuzeyinde dört bin yıldan beri yaşarlar. Daha çok kıyı bölgelere yerleşmişlerdir. Kuzey kutbunun ilk misafirleri olan Eskimolar bu topraklarda hem birbirlerine hem de tek geçim kaynağı olan hayvanlara büyük saygı duyarlar."],["p","Fok ve mors temel geçim kaynaklarıdır. Foklardan yalnızca yiyecek ihtiyaçlarını karşılamazlar. Giyim eşyası yanında çadır ve tekneleri için derisinden, lamba için yağından, zıpkın yapımında dişlerinden yararlanırlar. Fok avlamak için basit bir yöntem kullanılır. Kışın eskimolar donmuş su yüzeyinde delik açarlar. Foklar soluk almaya bu deliklere gelir. O zaman avcılar zıpkınlarını fırlatır."],["p","Geçmişte Eskimolar yazın çadırda, kışınsa donmuş kar bloklarından yapılma evlerde yaşarlardı. Bu buz evlere “lglo” derlerdi. Ulaşım araçalrı ise buz ve karın üzeinde köpeklerin öektiği kızaklardı. Günümüzde bu geleneksel yaşam tarzı kaybolmaya yüz tutmuştur. Avrupa ve Amerikalılarla ilişkilerini arttırmışlardır. Bugün Eskimoların birçoğu ya balıkçılık sanayiinde ya da kutup çevresindeki askeri üslerde çalışmaktadırlar. Eskimolar artık eskisi gibi yaşam sürmüyorlar. Ama ne olursa olsun onlar hala kuzeyin, göz alabildiğine uzanan karlar ülkesinin çocuklarıdı."],["p","Okuduğunuz parçaya göre aşağıdaki soruları yanıtlayınız."],["l","1. Eskimo ne anlam verir?"],["l","A) Et yiyenler B) Çiğ et yiyenler"],["l","C) Balık yiyenler D) İnsanlar E) İnuit"]]},{"n":131,"b":[["l","2. Eskimolar nerelerde yaşıyorlar?"],["l","A) Sibirya, Asya, Afrika"],["l","B) Rusya, Alaska, Kanada"],["l","C) Labrodor, OrtaAsya, Güney"],["l","D) Grönland, Afrika, Rusyanın kuzeydoğusunda"],["l","E) Grönland, Rusyanın kuzeydoğusunda, Sibiryanın doğusunda"],["l","3. Eskimolar yaşadıkları yerde kaç kış kaç ay sürüyor?"],["l","A) 6-12 ay B) 10-12 ay C) 6-9 ay D) 9-12 ay E) 6-7 ay"],["l","4. Geçimlerini nasıl sağlarlar?"],["l","A) Tarım B) Ekin C) Avcılık D) Hayvan besliyor E) Kuşlar"],["l","5. Sıcaklık kaç dereceye kadar düşebilir?"],["l","A) -50 B) -7 C) - 40 D) -10 E) -6"],["l","6. Temel geçim kaynagı nedir?"],["l","A) Fok ve mors B) Köpek balığı C) Köpekler"],["l","D) Çadır E) Buz"],["l","7. Fok balıklarını avlamak için nasıl bir yöntem kullanırlar?"],["l","A) Donmuş su yüzeyinde delik açar B) Oltayla"],["l","C) Silahla D) Köpek yardımıyla E) Balık ağı ile"],["l","8. Fok balığından başka nasıl faydalanırlar?"],["l","A) Derisinden, yağından, dişlerinden"],["l","B) Derisinden, yağından, ayaklarından"],["l","C) Derisinden, yağından, tırnaklarından"],["l","D) Sadece etinden"],["l","E) Sadece derisinden"],["l","9. “lglo” ndeir?"],["l","A) Kızak B) Zıpkın C) Lamba D) Yemek türü E) Buz ev"],["l","10. Şimdi daha çok nerelerde çalışıyorlar?"],["l","A) Balıkçılık sanayiinde ve askeri üslerde"],["l","B) Tarımcılıkta ve avcılıkta"],["l","C) Asker ordusunda ve avcılıkta"],["l","D) Amerika’da"],["l","E) Donmuş su yüzeyinde"]]},{"n":132,"b":[["h","FINDIK"],["p","Türkiye’nin görkemli yün, pamuk ve ipek halılarının dünyaca ünlü olduğunu herkes bilir. Peki fındık halılarını biliyor musunuz? Bu soruyu ancak Karadeniz’e gidenler bilebilir."],["p","Bu yaz ağustos ayında Karadeniz’e gittim. Orada Türkiye’nin görkemli fındık halılarını gördüm. Ünye’ye yaklaştıkça yol boyunca sağlı sollu dizilmiş siyahımsı kümeler dikkatimi çekti. Bunların ne olduklarını önce anlamadım. Daha sonra bu kümelerin, güneşte kurumaları için kaldırımlara serilmiş fındıklar olduğunu anladım. Yolun her iki yanında kilometlerce uzayıp giden bu fındıklar, kaldırıma serilmiş görkemli halı görüntüsü oluşturuyordu. Rize’nin doğusuna dek sadece kaldırımlara değil yol kenarındaki neredeyse avuç içi büyüklüğündeki her yere serilmişti. 300 kilometre uzunluğundaki bu “sanat eseri” yani “fındık halı” Türkiye’deki fındık üretiminin sadece bir bölümüydü."],["p","Türkiye fındık üretiminde dünyada “1numara” olarak kabul edilmektedir. Türkiye dünya fındığının yüzde yetmişinden fazlasını üretiyor. Dünya fındık üretiminin yüzde 30’nu ise İtalya, Fransa, İspanya ve Amerika Birleşik Devletleri üretmektedir."],["p","Türkiye’nin Karadeniz kıyısına özgü olarak bilinen fındık, 2400 yıllık bir tarihinin sahibidir. Bölgenin ılıman iklimi ve Karadeniz’e paralel uzanan dağların yamaçları fındık ağaçları için en uygun ortamı oluşturmaktadır. Fındık ağaçları çiçeklerini kışın açar. Meyvesini ise ancak ağustos ayında verir."],["p","Fındık olgunlaştıkça, yöresel adı “çotanak” olan tüylü dış kılıfını “ağız” bölümü açılır. İçindeki sert ve pürüzsüz kabuk gün ışığına çıkar. Fındık giderek olgunlaşır ve çotanağın rengi açıl yeşilden kahverenginin tonlarına dönüşmeye başlar."],["p","Karadeniz’in doğusuna doğru ilerledikçe fındık bahçelerinden sırtında çuvallarla çıkan kişiler görülüyordu. Onlar, dalından yeni koparılmış ürünü kuruması için, güneş altına sermeye getiriyorlardı. Şehirlerde, sanki tüm iş yerleri şu ya da bu şekilde fındı
