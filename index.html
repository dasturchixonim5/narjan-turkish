kla ilişkiliydi. Şehirlerde, işleri fındık satın almak ya da satmak, fındık kırmak, fındık işlemek olan yüzlerce fabrika ve iş yeri vardı. Araştırmalar, Türkiye’de sekiz milyondan fazla kişinin geçimini, fındıktan"]]},{"n":133,"b":[["p","sağladığını gösteriyor. Dünyada “Türk fındıkları” olarak özel bir üne sahip Karadeniz fındığı, 85 ülkeye ihraç ediliyor."],["p","Amerika Birleşik Devletleri’nde fındık kullanımını artırmak için kurulmuş “Fındık Birliği” Türk fındık ihracatçıları ve üreticileri tarafından kurulmıştur. Gelişme faaliyetlerinin bir parçası olarak “Fındık Birliği” fındığın salata çeşitlerini, yemek ve tatlılarda kullanıldıkları tarifleri yayımlamaktadır. Fındıklar, tüm dünyada çikolata ürünleri, pastalar, şekerlemeler ve krabiyelerde kullanılmaktadır."],["p","Okuduğunuz parçaya göre aşağıdaki soruları yanıtlayınız."],["l","1. Yazar fındık halısıyla neyi kastetmiştir?"],["l","a) Güneş b) Küme c) Kaldırım d) Yol e) Görüntü"],["l","2. Fındık ağacı ne zaman meyve verir?"],["l","a) Ağustos b) Haziran c) Eylül d) Nisan e) Ekim"],["l","3. Fındık Türkiye dışında hangi ülkelerde üretilmektedir?"],["l","a) İtalya, Fransa, İspanya"],["l","b) İtalya, Fransa, İran"],["l","c) ABD, İran, Irak"],["l","d) İspanya, ABD, Kazakistan"],["l","e) Azerbaycan, İtalya, ABD"],["l","4. Fındık, Türkiye’den kaç ülkeye ihraç edilmektedir?"],["l","a) 75 b) 65 c) 85 d) 95 e) 83"],["l","5. Fındık neden Karadeniz bölgesinde yetiştirilmektedir?"],["l","a) Sert iklimi ve paralel uzanan dağların yamaçalrı"],["l","b) Sert iklimi ve paralel uzanan tepelrin yamaçalrı"],["l","c) Kuru ve sıcak iklimi ve deniz havası"],["l","d) Ilıman iklimi ve paralel uzanan dağların yamaçalrı"],["l","e) Oramanlrın ve ağaçların çok olduğundan"],["l","6. Fındığın tüylü dış kılıfına ne denir?"],["l","a) a) Ağız b) Çotanak c) Potanak d) Yöresel e) Pürüz"],["l","7. Fındık en çok nerede yetişir?"],["l","a) Karadeniz bölgesi"],["l","b) Akdeniz bölgesi"],["l","c) Ege denizi bölgesi"]]},{"n":134,"b":[["l","d) Marmara denizi bölgesi"],["l","e) İç Anadolu bölgesi"],["l","8. Fındık ne zaman keşvedilmiş?"],["l","a) 2400 yıl önce"],["l","b) 300 yıl önce"],["l","c) 85 000 yıl önce"],["l","d) 5 yüzyıl önce"],["l","e) 2 yüzyıl önce"],["l","9. “Fındık Birliği” hangi ülkede kurulmuş?"],["l","a) İtalya"],["l","b) Türkiye"],["l","c) İspanya"],["l","d) Fransa"],["l","e) Amerika"],["l","10. Fındık ağaçları ne zaman çiçek açar?"],["l","a) Yazın"],["l","b) Sonbaharda"],["l","c) İlkbaharda"],["l","d) Kışın"],["l","e) Güzde"],["h","AFFET BABACIĞIM"],["p","Genç adam evlendiğinden beri, beraber yaşadıkları ihtiyar babası yüzünden hanımıyla sürekli tartışıyordu. Hanımı, babasını istemiyordu. Onun evde fazlalık olduğunu düşünüyordu. Yine bir gün, şiddetli bir tartışmadan sonra hanımı, “Ya ben, ya baban gider” dedi."],["p","Adam, hanımından ayrılmak istemiyordu. Babası yüzünden çıkan tartışmaların dışında hanımıyla iyi geçiniyordu. Hanımı kendisini seviyordu. Üstelik bir de çocukları vardı. Evlendikleri günden beri birçok problemle karşılaşmışlardı. Onu hala çok seviyordu. Günlerce düşündü ve kendine göre bir çözüm yolu buldu. Babasını yıllar önce ormanda yaptırdıkları dağ evine götürecekti. Haftada bir deaf onu ziyaret edecek ve ihtiyaçlarını karşılayacktı. Böylece problem çözülmüş olacaktı. Babasına gerekli olan bütün"]]},{"n":135,"b":[["p","eşyalarını hazırladı. Bir gün babasını kucakladı ve arabaya götürdü. Oğlu Can, “Babacığım ben de gitmek istiyorum” diye ısrar edince birlikte yola çıktılar."],["p","Kış mevsiminin ortasıydı. Hava çok soğuktu. Yoğun kar yağışı yüzünden yolu zor görüyorlardı. Küçük Can babasına; “Baba nereye gidiyoruz?” diye soruyor, ama cevap alamıyordu. İstenmediğini anlayan yaşlı adam gizli gizli ağlıyordu fakat ağladığını torununa belli etmemeye çalışıyordu. Saatler süren yolculuktan sonra dağ evine geldiler. Dağ evi eskimişti. Genç adam evin bir odasını temizledi. Sonra arabadaki eşyaları bu odaya taşıdı. En sonunda ise babasını getirdi. Dağ evinin içinde rüzgar esiyordu. Yaşlı adam titriyordu. Üzüntü içinde babasını izledi. Kendi kendine yarın evden birkaç battaniye daha getiririm, diye düşündü. Öyle üzgündü ki ne yapacağını bilemiyordu. Babasının ise neredeyse yüreği parçalanacaktı. Yıllarca büyüttüğü oğlu kendisini bir dağ evinde yalnız bırakıyordu. Minik Can gördüklerinden hiçbir şey anlamıyordu. Genç adam, babasının yatağına eğilerek elini öptü. İkisi de ağlıyordu."],["p","Genç adam, çocuğu da alarak evden uzaklaştı. Can, yolda ağlamaya başladı. Babasına: “Neden dedemi o soğuk evde bıraktın?” dedi. Babası çocuğuna, annen istemiyor, diyemedi. Can, “Baba sen yaşlandığında ben de seni buraya getireceğim”, dedi. Genç adam, çocuğun bu sorusunua cevap veremedi. Hemen arabayı geri çevirdi. Dağ evine girdi. “Beni affet baba!” diyerek babasının boynuna sarıldı. Baba ile oğul birbirine sarılarak çocuk gibi ağladılar. Genç adam, hatasını anlamıştı. Babası, oğluna şöyle dedi: “Geri geleceğini biliyordum oğlum. Ben babamı dağ başında bırakmadım ki, sen de beni bırakasın... Beni bu dağda bırakmayacağını biliyordum”."],["l","A. Okuduğunuz parçaya göre aşağıdaki cümelelerden doğru olanın başına ‘’D’’; yanlış olanın başına ‘’Y’’ yazınız."],["l","1. ( ) Kadın, kayın babasını istemiyordu."],["l","2. ( ) Genç adam, babası yüzünden sık sık hanımıyla tartışıyordu."],["l","3. ( ) Adam, babasını bir otele yerleştirmeye karar verdi."]]},{"n":136,"b":[["l","4. ( ) Genç adam, küçük oğluna babasını nereye götürdüklerini söylemek istemiyordu."],["l","5. ( ) Dağ evi yeni ve çok temizdi."],["l","6. ( ) Genç adam, babasını dağ evine bıraktı ve geri döndü."],["l","B. Okuduğunuz parçaya göre aşağıdaki soruları yanıtlayınız."],["l","1. Genç adam, hanımıyla niçin tartışıyordu?"],["l","………………………………………………………………"],["l","2. Genç adam, babsını nereye götürmeye karar verdi?"],["l","………………………………………………………………"],["l","3. Dağ evi nasıldı?"],["l","………………………………………………………………"],["l","4. Genç adam, babasını ormanda bıraktı mı?"],["l","………………………………………………………………"],["h","ERZURUM’DA KIŞ"],["p","Türkiye’de farklı iklim bölgeleri vardır. Aynı zaman dilimi içinde Türkiye’nin güney batısında yaz, doğusunda kış hüküm sürer. Aynı mevsimde Antalya’da insanlar denize girer, Erzurum’da kayak yapar. Erzurum bir kış memleketidir. Türkiye’deki şehirler içinde rakımı en yüksek ildir. Erzurum’da, kışın pek çok zorluğuna karşılık eğlenceli yanları vardır. Özellikle güneş doğunca sanki bütün yıldızlar karın üstüne iner. Kar tanelerinin parıltıları gözleri kamaştırır."],["p","Erzurumlular, kışın, altı ay boyunca başka bir hayat yaşarlar. Bu yörenin insanı çayı çok sever. Çocuklar sabahları çaydanlığın sesiyle uyanırlar. Kahvaltıdan hemen önce pencereye koşarlar ve dışarıyı seyrederler. Çocuklar için kış, bambaşka bir anlam ifade eder. Kahvaltıdan sonra da kalın kışlık elbiselerini giyer ve kızaklarıyla dışarıya çıkarlar. Hep birlikte dağın dik yamaçlarından aşağı doğru kayarlar. Bazıları kartopu oynar, bazıları ise kardan adam yapar. Bu oyunlar sabahtan akşama kadar devam eder. Çocuklar bazen öğle yemeğini bile unurlar. Akşama doğru artık çocuklar üşümüş ve yorgun bir halde eve dönerler."],["p","Erzurum’un kış günlerinde, yetişkinler iş yerlerine giderler."]]},{"n":137,"b":[["p","Yaşlılar da genellikle köy odaları ve kahvehanelerde zaman geçirirler. Kahvehanelerde halk tiyatrosu sahnelenir. Aşıklar saz çalar ve şiir okurlar. Erzurum’da çay kışın en gözde içeceğidir. Çünkü sıcaklığıyla, insanların sohbetlerini ve içini ısıtır. Erzurumlular çaya şeker koymazlar. Onlar sert şekerleri dillerin üstüne yerleştirirler. Bu şekerle üç dört bardak demli çay içebilirler. Sert şeker hem ağızda hem de çayda kolay erimez. Erzurumlular buna “kıtlama çayı” derler. Çayin kokusu ve buğusu arasında sohbetler sürer gider. Arkadaşlık ve komşuluk işikileri Erzurumlular için önemlidir. Bu ilişkilere çok değer verirler."],["p","Erzurum, Palandöken dağının eteğinde kurulmuştur. Aynı zamanda Palandöken dağı, kış sporları merkezidir. Kışın yerli ve yabancı turistler buraya büyük ilgi gösterirler. Bu dağın gururlu ve dumanlı başı yıldızlarla konuşur. İnsanlar yıldızlara orada daha yakındır. Erzurum, her mevsimde bir başka güzeldir. Yazın rengârenk çiçeklerle süslü, kışın başı dumanlarla kaplıdır. Orada kendinizi sonsuz beyazlığın ortasında bulursunuz. Kış sporları Erzurum’da gelişmiştir. Her yıl kış sporları ile ilgili yarışmalar yapılır. Erzurumlular için kış, bolluk, bereket ve verim aylarıdır. Erzurum’un folkloru da zengindir. Halk hayatı ve evlenme, sünnet, ziyaret, bayram gibi gelenekleri çok renklidir. Atlılar, ellerinde sopalarla “cirit” adlı oyun oynarlar. Ayrıca burada, davul, zurna eşliğinde el ele oynanan oyunların adına da “bar” denir."],["l","A. Lütfen, soruları yanıtlayınız."],["l","1. Erzurum’da kış nasıl geçer?"],["l",".................................................................................................."],["l","2. Erzurum’da insanlar çayı nasıl içerler?"],["l",".................................................................................................."],["l","3. Kışın ve yazın Palandöken dağları nasıldır?"],["l",".................................................................................................."],["l","4. Erzurumlular için kışın anlamı nedir?"],["l",".................................................................................................."],["l","5. Erzurum kış ile ülkenizdeki kış arasında benzerlik varmı?"],["l",".................................................................................................."]]},{"n":138,"b":[["l","B. Asagidakilere dogru olana (D) yanlış olana (Y) yazınız."],["l","1. ( ) Erzurumda havalar sıcaktır."],["l","2. ( ) Erzurumda kıtlama sekeri kahve ile icerler."],["l","3. ( ) Kıtlama seker cok serttir."],["l","4. ( ) Erzurum yaz memleketidir."],["l","5. ( ) Erzurumda insanlar denize girmeyi cok sever."],["l","C. Lütfen, soruları yanıtlayınız."],["l","1. Sizde kendi ülkenizde kış aylarında yapılan aktiviteri yazınız."],["l","2. Bildiğiniz kış terimlerini söyleyiniz."],["l","3. Kışın dondurma yenir mi? Kendi fikir beyanınızı sununuz."],["h","ŞİŞMAN OLMANIN DAYANILMAZ AĞIRLIĞI"],["p","Şişmanlık, sadece çağımızda gündeme gelmiş bir konu değildir. Sanıldığının aksine yüzyıllardır tanınan ve yol açtığı kötü sonuçlarla bilinen bu durum ilk defa Hipokrat tarafından tanımlanmıştır. Sokrates’in de inceliğini korumak için her sabah düzenli olarak dans ettiği söylenir."],["p","Şişmanlık, çağlar boyunca sanatta da etkili olmuş; kimi zaman saadet ve bereketin simgesi olurken, kimi zaman büyük günahlardan biri veya hırsın simgesi sayılmıştır."],["p","Şişmanlık nedir? Estetik bir sorun mu yoksa ciddi bir hastalık olarak mı değerlendirilmelidir? Çok sayıda araştırmacı, şişman insanların birçok hastalık yüzünden büyük risk altında olduğunu göstermiştir. Şişman insanların bir çoğunda yeme davranışında bir bozukluk söz konusu. Bunun sonucu olarak harcadıklarından çok daha fazla miktarda kalori alırlar. Yalnız bu, şişmanların en fazla yiyen kişiler olduğu anlamına gelmemektedir. Obur kişilerde, besinleri tanıma ve besin uyaranlarına tepki vermede abartılmış bir cevap vardır. Yine bu kişiler, daha çok şekeri düşük, yağ oranı yüksek yiyecekleri tercih ederler. Bazı şişmanlar zayıf kişilerle aynı miktarda besin alsalar bile hareketsizlikten dolayı çok az enerji harcarlar."],["p","Şişmanlık, tedavisi çok zor olan bir hastalıktır. Tedavide pasif olarak ilaç kullanmaktan ziyade kişinin aktif olarak tedaviye"]]},{"n":139,"b":[["p","katılması ve iradesi söz konusudur. Hekimin sorumluluğu ise, mümkün olduğunca hastayı desteklemesi ve hastaya yardımcı olmasıdır. Şişman kişiler iradelerini kontrol altına almalıdırlar. Diyet uzmanları, diyet yapmanın kendini disiplin altına almanın gerekliliğinden bahsetmektedirler: Mesela: “Sabahları şekersiz greyfurt suyu, bir dilim kepekli ekmek, kibrit kutusu kadar peynir, öğlen 125 gram ciğer... Eğer ara öğünlerde acıkırsanız hatta açlıktan gözleriniz hiçbir şey göremeyecek kadar karaırsa sakın umutsuzluğa kapılmayın. Bu durumda buzdolabınızın kapaığını açarak sadece havuç ve salatalık gibi çiğ sebzelerden dilediğinizce yiyebilirsiniz.”"],["l","1. Aşağıdaki kelimeleri manalarıyla eşleştiriniz."],["l","a) saadet 1. Güzellik duygusu ile ilgili olan veya güzellik duygusuna uygun olan."],["l","b) estetik 2. Rejim, perhiz"],["l","c) kalori 3. Mutluluk"],["l","d) obur 4. Yenilebilir, beslenmeye elverişli her türlü madde, gıda."],["l","e) besin 5. (Yemek için) kez, defa f) diyet 6. Gereğinden çok fazla yemekyiyen, doymak bilmeyen (kimse) g) öğün 7. Besinlerin dokular içinde yanarak vücudun sıcaklık ve enerjisini sağlama değeri."],["l","2. Aşağıdaki boşlukları parçadan yararlanarak uygun kelimelerle doldurunuz."],["l","a) Şişmanlık ilk defa ....................... tarafından tanımlanmıştır."],["l","b) Şişmanlık kimi zaman ............................. ve ......................."],["l","............................ simgesi olmuştır."],["l","c) ........................................ kişiler her zaman bir şeyler yemeyi arzu ederler."],["l","d) Zayıflamak için doktorun önerdiği ................................ programı uygulanmalıdır."],["l","e) Çok sayıda araştırmacı, şişman insanların birçok hastalık yüzünden büyük bir .................... altında olduğunu göstermiştir."]]},{"n":140,"b":[["l","3. Aşağıdaki ifadeler doğru mu (D), yanlış mı (Y)?"],["l","a) ( ) Şişmanlık sadece çağımızda gündeme gelmiş bir konudur."],["l","b) ( ) Şişmanlık ilk defa Hipokrat tarafından tanımlanmıştır."],["l","c) ( ) Şişmanlık çağlar boyunca sanatta da etkili olmuştur."],["l","d) ( ) Şişmanlığın insan sağlığına hiç zararı yoktur."],["l","e) ( ) Şişman insanlarda başka rahatsızlıklar da görülebilir. f) ( ) Şişmanlık sadece çok yemekten dolayı görülen bir hastalıktır. g) ( ) Obur kişiler he zaman bir şey yemeyi arzu ederler. h) ( ) Kişi istese de istemese de zayıflayamaz."],["l","I) ( ) Rejim yapmak ve sporla meşgul olmak şişmanlığı önler. i) ( ) Şişmanlığın bir sebebi de hareketsizlik ve gereğinden fazla ukudur."],["l","4. Aşağıdaki karışık olarak verilen kelimelerden cümleler kurunuz."],["l","a) şişmanlık/ çağlar / sanatta / boyunca / olmuştur / etkili / da"],["l","b) şişmanlık / hastalıktır / zor / çok / olan / bir / tedavi"],["l","c) hareketsizlik / nsebebi / şişmanlığın / bir / de"],["l","d) önler / spor / yapmak / şişmanlık"],["l","5. Aşağıdaki kelimelerin yerine kullanabileceğimiz kelimeleri yazınız."],["l","a) ilk defa : ..............................."],["l","b) risk : ..............................."],["l","c) saadet : ..............................."],["l","d) aktif : ..............................."],["l","e) diyet : ................................ f) besin : ................................ g) hekim : ................................"],["l","6. Aşağıdaki kelimelerin zıt anlamlarını yazınız."],["l","a) şişman : ................................."]]},{"n":141,"b":[["l","b) aç : ................................."],["l","c) pasif : ................................."],["l","d) çiğ : ................................."],["l","7. Aşağıdaki verilen kelime gruplarından farklı olan kelimeleri bularak işaretleyiniz."],["l","1. a. AİDS 2. a. böbrek 3. a. su çiçeği"],["l","b. verem b. Kalp b. kızamık"],["l","c. kolera c. Bağırsak c. diz ağrısı"],["l","d. nezle d. Organ d. Kanser"],["l","8. Aşağıdaki kelimeleri manalarıyla eşleştiriniz."],["l","a) ilaç 1. Hastalığı iyi etme, iyileştirme"],["l","b) tedavi 2. Kan basıncı, gerilim"],["l","c) perhiz 3. Ameliyat, heyecan gibi etkenlerin insanda oluşturduğu buzukluk."],["l","d) taburcu olmak 4. Ruhi bozukluk"],["l","e) stres 5. Diyet, rejim. Beslenme düzeni f) tansiyon 6. Hastaneden çıkma g) depresyon 7. Hastalığı iyi etmek için kullanılan madde"],["l","10. Aşağıdaki sorulara cevap veriniz. 1- Hastalıklarla şişmanlık arasında nasıl bir ilişki vardır? 2- Sadece çok yiyenler mi şişmanlar? Açıklayınız. 3- Şişmanlık ile insan iradesi arasında nasıl bir ilgi vardır? 4- Zayıflamak için neler yapmalıdır? Kısaca açıklayınız."],["l","5. Tarih boyunca şişmanlık olayına nasıl bakılmıştır?"],["h","KUŞAK ÇATIŞMASI"],["p","İnsanlar, yaşlandıktan ve kendilerini işe yaramaz hissettikleri zaman çocuk gibi olurlar. Birisi bir şey söyleyince hemen üzerlerine alınıp çeşitli tavırlar takınırlar. Ya kızıp kimseyle konuşmazlar ya da iğneli iğneli konuşmaya başlarlar. Oysa, hayat tecrübeleri çok zengin olan yaşlılarımız, böyle bir tutum takınmak yerine gençlere yol gösterici oldukları zaman hem kendileri çok mutlu olurlar hem"]]},{"n":142,"b":[["p","de çevrelerindekileri mutlu ederler. Elbet te bu, karşılıklı tutum ve davranışlara bağlıdır. Eğer gençler yaşlılara gereken değeri verir, saygıda kusur etmezlerse yaşlılar da her konuda aydınlatıcı ve destekleyici olurlar."],["p","Her kuşağın kendisinden önceki ve sonraki kuşakla yaşam şartları ve insan ilişkileri yönünden birtakım farklılıklarının olması doğaldır. Bu yüzden de, zaman zaman aile büyükleri ile gençler arasında çatışmalar yaşanmaktadır. Özellikle gençlerin sabırsızlığı ve düşüncelerinin doğruluğu konusundaki ısrarları, yetişkinlerin de kimi konulardaki katı tutumları bu çatışmaları derinleştirebilmektedir. Bu sebeple evini terk eden, ailesinden kopan ve bunalımlara giren birçok genç, eğer iş yaşamında da başarılı olamazsa geri dönüşü mümkün olmayan yollara girebilmektedir. Yetişkinleri de bu durumda payları olduğunu bildikleri için gecikmiş bir pişmanlık duyarlar."],["p","İnsanlar genellikle bir şeye kızınca tepkilerini de en sert biçimde gösteriyorlar. Belki de zamanımızın en önemli sorunlanndan biri de budur. İnsanlan çok iyi dinlemeden, onların neyi niçin söylediklerini çok iyi tartmadan yapılan anlık çıkışlar, çoğu zaman gençlerle yetişkinler ya da yetişkinlerle yaşlılar arasında güven bunalımına doğru giden bir yolun başlangıcı oluyor."],["p","İnsanların kızdıkları sırada sağlıklı düşünebilmeleri oldukça zordur. “En çok kızdığınız an aslında en sakin olmanız gereken andır.” diye güzel bir söz vardır. Sonradan pişmanlık duyacağımız bir şeyi yapmadan önca sakin kafayla düşünmeyi öğrendiğimiz zaman çatışmaları azaltabilir, kendimizi karşımızdaki kişinin yerine koyup düşünmeyi alışkanlık haline getirdiğimiz zaman ise sorunlarımızm büyük bir bölümünü halletmiş oluruz."],["l","A. Lütfen, aşağıdaki cümleleri metne göre işaretleyiniz. Doğru Yanlış"],["l","1. Yaşlı insanlar çocuklar gibi çok alıngan olurlar."],["l","(......) (......)"],["l","2. Yaşlıların olumsuz davranmalarına gençlerin de payı varır."],["l","(......) (......)"]]},{"n":143,"b":[["l","B. Lütfen, verilen atasözünü metne göre açıklama yapınız."],["l","3. “Sakla samanı gelir zamanı.” atasözünü bu metine göre açıklayınız."],["l",".................................................................................................."],["l",".................................................................................................."],["l",".................................................................................................."],["l",".................................................................................................."],["l",".................................................................................................."],["l","C. Lütfen, soruları metine göre cevaplayınız."],["l","4. Yaşlıların desteğini almak isteyen gençlerin ne yapmaları gerek?"],["l",".................................................................................................."],["l","5. Kuşak çatışmalarını asıl nedenleri nelerdir?"],["l",".................................................................................................."],["l",".................................................................................................."],["l","6. Yaşlanıp kendilerini işe yaramaz hissedenler hangi tavırlar içine girer?"],["l",".................................................................................................."],["h","NİÇİN ALIYORUZ?"],["p","Reklamın en açık amacı tüketiciye ürün ile ilgili bilgi vermektir. İkinci bir amacı ise ürünü satmaktır. Üretici için herhalde ikinci amaç, birinci amaçtan önde geliyor olsa gerek. Üreticiler tüketicilere ürünleriyle ilgili bilgi vermenin ötesine giderler. Müşteriyi iknaya çalışırlar. Reklamlar yüzünden tüketici, ihtiyacı olmayan şeyleri almak ister. İşte bu yüzden, her hangi bir şey aldıktan sonra tüketici alma nedenini açıklayamaz."],["p","Tüketici niye aldığını bilmiyorsa da üretici bilmekte... firmalar alış ve satışla ilgili analizler yaptırırlar. Müşterinin bir ürün alırken kullandığı mantıksal ve duygusal motivasyonu vardır. Bir çok ürünün niçin kasanın etrafında olduğunu hiç düşündünüz mü? Marketlerin bunu yaparken bazı iyi sebepleri var... kasa sırasına giren müşteri para ödemeye, satın almaya hazırdır. Şu ana kadar mantıksal motivasyonu kullanmıştır. Yaptığı alışverişten"]]},{"n":144,"b":[["p","memnundur. Bu noktayı farkeden market yöneticileri, tüketicinin duygusal motivasyonunu harekete geçirecek olan küçük ve kolay taşınır olan şeker, sakız, magazin dergilerini kasa etrafındaki raflara yerleştirirler. Ayakta ve sırada beklemekte olan müşteri aniden bir şey almaya karar verir ve alır."],["p","Firmalar, kasalara yakın olan rafları kapmak için büyük çaba sarfederler. Atrıca onlar için rafların alt veya en üst kısmında yer almak da dezavantajdır. Çünkü müşteri tarafından rahat görülemezler."],["p","Tabii ki alışverişin birinci amacı ihtiyaçları karşılamaktır. Yiyecek gerçek bir ihtiyaçtır.ancak televizyonda gördüğümüz için aldığımız kutu kutu sakız ve şekerleme gerçekte ihtiyacımız olmadığını hepimiz biliyoruz. Bunlar ne gerekli ne de faydalıdır. Belki çocuğunuz istemiştir; belki paket renkli ve çekicidir..."],["p","Alışveriş yaparken verilen kararların ardındaki sebepleri bilmek bizi daha bilinçli bir tüketici yapacaktır. Mantıklı ve bilinçli müşteri de daha az para harcayacaktır."],["l","I. Lütfen aşağıdaki soruları cevaplayınız. 1- Reklamların amaçları nelerdir?"],["l","……………………………………………………………… 2- Tüketici hangi motivasyonları kullanarak alış veriş yapar?"],["l","……………………………………………………………… 3- Alış verişin en önemli sebepleri nedir?"],["l","……………………………………………………………… 4- Kişi nasıl daha bilinçli bir tüketici olabilir?"],["l","………………………………………………………………"],["p","II. Lütfen doğru seçeneği işaretleyiniz."],["l","1. Alış veriş yaparken ................... duygusal motivasyona örnektir."],["l","a) ekmek almak b) deterjan almak c) sakız almak"],["l","d) sebze almak"],["l","2. ........................ müşteri daha az para harcar."],["l","a) zengin b) akıllı c) bilinçli"],["l","d) fakir"]]},{"n":145,"b":[["p","III. Lütfen aşağıdaki boşlukları doldurunuz."],["p","Marketlerde ............... yakınında bulunan ürünler genellikle alması kolay ............ boyutlu ürünlerdir. Duygusal motivasyon nedeniyle yapılan bu alışverişte müşteri zaten ............... ödemeye hazırdır. Belki ...................... istemiştir belki de ................renkli ve çekicidir. Veya dün akşam .................... reklamdan etkilenmiştir."],["h","KOMŞU ÜLKELERLE KÜLTÜREL İŞBİRLİĞİ"],["p","Türkiye ile sınırı olan ülkeler Bulgaristan, Yunanistan, Gürcistan, Ermenistan, Azerbaycan, İran, Irak ve Suriye’dir. Türkiye komşularıyla kültürel işbirliğini ağırlıklı olarak ikili kültürel anlaşmalar yoluyla yürütmektedir. Bu anlaşmalrının yanı sıra çok taraflı anlaşmalar da mevcuttur."],["p","Türkiye’nin komşusu Ermenistan’la arasındaki sınır kapısı kapalıdır. Bu ülkeye giriş ve çıkışlar sınır kapılarından yapılamamaktadır. Ermenistan ve Türkiye arasındaki eğitim ve kültür alanındaki yegane resmi belgeleridir."],["p","Türkiye sınır komşularıyla kültürel işbirliğini çok taraflı anlaşmalarla da desteklemektedir. Karadeniz Ekonomik İşbirliği Teşkilatı Parlamenterler Asamblesi (KEIPA) Türkiye’nin kuzey ve kuzeydoğu komşularını bir araya getiren önemli işbirliği projelerindendir. AB’ye üyelik perspektifinde Türkiye, diğer üye ülkelerle Karadeniz kültürel mirasının korunması için işbirliği yapmaktadır."],["p","Son dönemde Suriye ve Rusya ile yapılan anlaşmalarla bu iki ülke arasındaki giriş-çıkışlarda vize sorunu ortadan kalkmıştır. Her düzeydeki diplomatik temsilcilikler, kültür ve turizm ataşelikleri, ikili ilişkilerin kurulmasında önemli aktörlerdir. Kültürel işbirliği farklı disiplinlerde çeşitli etkinliklerden oluşmaktadır."],["p","İkili kültürel ilişkiler, diplomaik ilişkiler ve dış politika çerçevesinde ele alındığından Dışişleri Bakanlığı bu alandaki temel aktördür. Kültür ve Turizm Bakanlığı kültürel ilişkilerin geliştirilmesinde destekleyici rol üstlenmektedir."],["l","(Zaman Gazetesi, Nisan 2013)"]]},{"n":146,"b":[["p","Aşağıdaki test sorularına cevap veriniz."],["l","1. Türkiye ile sınırı olan ülkeler aşağıdakilerden hangileridir?"],["l","A) Rusya ve Ukrayna B) Kazakistan ve Türkmenistan"],["l","C) Irak ve Suriye D) Hindistan ve Pakistan"],["l","E) Hollanda"],["l","2. Türkiye kültürel işbirliğini nasıl yürütmektedir?"],["l","A) anlaşmalar B) görüşmeler"],["l","C) yazılarla D) ikili kültürel anlaşma"],["l","E) oturumlarla"],["l","3. Türkiye’nin hangi ülkeyle sınır kapısı kapalıdır?"],["l","A) Bulgaristan B) Ermenistan"],["l","C) Irak D) İran E) Suriye"],["l","4. Suriye ve Rusya arasındaki ilişkide ne ortadan kalkmıştır?"],["l","A) iletişim B) kültür ilişkisi C) vize sorunu"],["l","D) eğitim ilişkisi E) anlaşmalar"],["l","5. İkili ilişkilerin kurulmasında ne önemlidir?"],["l","A) anlaşmalar yapmak B) oturumlar düzenlemek"],["l","C) ekonomik ilişkiler D) diplomatik temsilcilikler"],["l","E) iletişim araçları"],["h","HİÇ HAYALLERİNİZDEN SIFIR ALDINIZ MI?"],["p","Bu öykü, çiftlikten çiftliğe, yarıştan yarışta koşarak atları terbiye etmeye çalışan gezgin bir at terbiyecisinin genç oğluna kadar uzanır. Babasının işi nedeniyle çocuğun orta öğretimi kesintilere uğramıştı. Orta ikideyken, büyüdüğü zaman ne olmak ve yapmak istediği konusunda bir kompozisyon yazmasını istedi hocası. Çocuk bütün gece oturup günün birinde at çiftliğine sahip olmayı hedeflediğini anlatan 7 sayfalık bir kompozisyon yazdı. Hayalini en ince ayrıntılarıyla anlattı. Hatta hayalindeki 200 dönümlük çiftliğin krokisini de çizdi."],["p","Binaların, ahırların ve koşu yollarının yerlerini gösterdi. Krokiye, 200 dönümlük arazinin üzerine oturacak 1000 metrekarelik evin ayrıntılı planını da ekledi. Ertesi gün hocasına sunduğu 7 sayfalık ödev, tam kalbinin sesiydi. İki gün sonra ödevi geri aldı. Kağıdın üzerinde kırmızı kalemle yazılmış kocaman bir “0” ve"]]},{"n":147,"b":[["p","“Dersten sonra beni gör” uyarısı vardı. “Neden “0” aldım?” diye merakla sordu hocasına, çocuk. “Bu senin yaşında bir çocuk için gerçekçi olmayan bir hayal” dedi, hocası. “Paran yok. Gezginci bir aileden geliyorsun. Kaynağınız yok. At çiftliği kurmak büyük para gerektirir. Önce araziyi satın alman lazım. Damızlık hayvanlar da alman gerekiyor. Bunu başarman imkânsız” ve ekledi:"],["p","“Eğer ödevini gerçekçi hedefler belirledikten sonra yeniden yazarsan, o zaman notunu yeniden gözden geçiririm.”"],["p","Çocuk evine döndü ve uzun uzun düşündü. Babasına danıştı. “Oğlum” dedi babası “Bu konuda kararını kendin vermelisin. Bu senin hayatın için oldukça önemli bir seçim!.” Çocuk bir hafta kadar düşündükten sonra ödevini hiçbir değişiklik yapmadan geri götürdü hocasına. “Siz verdiğiniz notu değiştirmeyin” dedi."],["p","“Ben de hayallerimi”."],["p","O orta 2 öğrencisi, bugün 200 dönümlük arazi üzerindeki 1000 metrekarelik evinde oturuyor. Yıllar önce yazdığı ödev şöminenin üzerinde çerçevelenmiş olarak asılı. Öykünün en can alıcı yanı şu: Aynı öğretmen, geçen yaz 30 öğrencisini bu çiftliğe kamp kurmaya getirdi. Çiftlikten ayrılırken eski öğrencisine “Bak” dedi, “Sana şimdi söyleyebilirim. Ben senin öğretmeninken, hayal hırsızıydım. O yıllarda öğrencilerimden pek çok hayal çaldım. Allah’ tan ki, sen, hayalinden vazgeçmeyecek kadar inatçıydın.”"],["p","Soru: Yukarıdaki hikâyeyi ele alan eleştirisel bir yazı yazınız."],["l","I. Aşağıdaki cümlelerden doğru olanın başına (D) yanlış olanın başına (Y) yazınız."],["l","a. ( ) Çocuk kompozisyonda hayalinin en ince ayrıntıların anlattı."],["l","b. ( ) Çocuk kötü not aldı."],["l","c. ( ) Bu senin yaşında bir çocuk için gerçekçi olmayan bir hayal” dedi, hocası."],["l","ç. ( ) “Siz verdiğiniz notu lütfen değiştiriniz” dedi,çocuk."],["l","d. ( ) Çocuğun yazdığı hayalleri gerçek oldu."]]},{"n":148,"b":[["p","II. Aşağıdaki kelimelerle anlamları eşleştiriniz."],["l","1.Hayal a. Uydurma ve sahte olmayan, hakiki, halis"],["l","2.Terbiye b. Yararlanılan uygun şart veya durum,olanak"],["l","3.Kompozisyon c. Bir şahıs veya bir şeyin insan aklında canlanan şekli"],["l","4.İmkan ç.Besleyip büyütme"],["l","5.Gerçek d. Ortaya konan her türlü fikri eser III. Aşağıdaki boşlukları uygun düzenlemeleri yazınız."],["l","1. Orta ikideyken, büyüdüğü zaman ne olmak ve yapmak istediği konusunda……… istedi hocası."],["l","2. Çocuk bütün gece oturup günün birinde……… anlatan 7 sayfalık bir kompozisyon yazdı."],["l","3. “Eğer ödevini gerçekçi hedefler belirledikten…….. o zaman notunu yeniden gözden geçiririm”. IV. Aşağıdaki sorulara cevap veriniz."],["l","1. Bu metnin konusu nedir?"],["l","2. Öğretmen çocuğa hangi ev odevin vermisti?"],["l","3. Çocuk kompozisyonunda ne anlattı?"],["l","4. Öğretmen çocuğa onun kompozisyon hakkında ne söylemişti?"],["l","5. Çocuğunun yazdığı hayalleri gerçek oldu mu?"],["l","V. Aşağıdaki cümlelerin yanına metne göre varsa Var diye yoksa Yok diye yazınız."],["l","1. ( ) Çocuk bütün gece oturup 7 sayfalık bir kompozisyon yazdı."],["l","2. ( ) Bu senin yaşında bir çocuk için gerçekçi olmayan bir hayal” dedi, hocası."],["l","3. ( ) Bu kompozisyon hobi hakkında yazılmıştır."],["l","4. ( ) Dersten sonra çocuk arkadaşla dışarıya çıktı."],["l","5. ( ) Bugün 200 dönümlük arazi üzerindeki 1000 metrekarelik evinde oturuyor."]]},{"n":149,"b":[["h","HAYATTA EN HAKİKI MÜRŞİT İLİMDİR"],["p","Atatürk’ün bu sözle ne demek istediğini anlatabilmek için önce “mürşit” sözünün anlamını açıklayalım: Mürşit demek, doğru yolu gösteren, kılavuz demektir. Buna göre, insanların ve üzerinde duralım."],["p","Bilim yalnızca gerçeği arar ve ona değer verir. Gerçek dışı şeylerin bilimde yeri yoktur. O halde,bilim kendine kılavuz yapan insan ve toplumlar gerçeğin yolunda ilerlerler. Bu yol doğrunun, doğruluğun yoludur. Doğruluğun olduğu yerde de iyilik ve güzellik vardır. İnsan ya da toplum bu yolda dünyayı, geleceği ve her şeyi olduğu gibi görebilir. Böyle olunca da uygarlık yarışında güvenli adımlarla ilerler. Her yeni gün bir ilerleme, bir gelişme ve bir kalkınma günü olur. Çünkğ bu yolda tutuculuk yoktur, geri kalma yoktur. Akıl, yeteneklerini gerektiği gibi kullanabilir. İnsan bilgisizlikten, bilgisizliğin karanlığından kurtulur. Yaşadığı hayatı daha iyi yaşamanın yollarını bulur."],["p","Bilimin yasaları vardır. Birtakım varsayımlar, kişisel görüşler ve kalplaşmış, katı düşüncelerin bilim diye tanıtılması her zaman olagelmiştir. Ama bunlar bilim olmadığı gibi bilimin ortaya koyduğu gerçeği de hiçbir zaman değiştiremezler."],["p","Bilim, ancak doğrunun ve gerçeğin ortamında oluşur. Ancak onunla iyiye ve güzele gidilebilir. Böyle olduğu için, bilim, insana hoşgörü kazandırır. Katı ve kalıplaşmış düşünceli, ön fikirli olmayan insanlar yetişirme ortamını oluşturur. Bilimin verileri ile iyi insan, iyi vatandaş yetişirme imkanları elde edilebilir. Bilime dayalı gerçeklere yetiştirilmiş insanlar, hiçbir görüş ve düşüncenin tutsağı"],["l","(...) olmazlar. Bir ülke bilimi kendine kılavuz seçerse her alanda büyük ilerlemeler gösterir. Dünya uygarlık düzeyinin üstüne çıkar. Önde olur, ileriye gider. “Hiç bilenle bilmeyen bir olur mu?”, “Bilim Çin’de de olsa ara.” sözleri hep bu gerçeği gösterir. Öyleyse tekrar edebiliriz: “Hayatta en hakikı mürşit ilimdir” Aşağıdaki sorulara cevap veriniz."],["l","1. Atatürk, insanlara ve toplumlara yol gösterici olarak neyi gösteriyor? Niçin?"]]},{"n":150,"b":[["l","………………………………………………………………"],["l","2. Akılla bilim arasında nasıl bir ilişki vardır?"],["l","………………………………………………………………"],["l","3. Bilimin ışığında yetişen insanların özellikleri nelerdir?"],["l","………………………………………………………………"],["l","4. Bilimin, kılavuz olarak seçilmesi ülkelere neler sağlar?"],["l","………………………………………………………………"],["l","5. Atatürk, “Hayatta en hakikı mürşit ilimdir.” sözünü hangi amaçla söylemiştir?"],["l","………………………………………………………………"],["l","6. Okuduğunuz metinden yararlanarak bilimin insan hayatındaki yerini ve değerini belirtiniz."],["l","………………………………………………………………"],["l","7. Metinde savunulan ana fikri söyleyiniz."],["l","………………………………………………………………"],["h","DİLE SEVGİ VE SAYGI"],["p","İnsanın kendi dilini sevmesi, ona şuurlu bir saygı duyması milli bir borçtur. Milli dil, kullanılan dildir. Kullanılan canlı kelimeler üzerine titremek gerekir. Kullanıla gelen canlı dil ve kelimeler, insanın kendisini kardeşleriyle birleştirici milli kültürdür. Diline, kelimesine sahip çkmayan, onu rasgele değiştirmeye, atmaya bırakmaya, ondan vazgeçmeye hazır bir toplulukta milli kültürün sağlamlığını ve milli kardeşliğin birleştirici rolünü korumak mümkün değildir."],["p","İnsanın kendi dili, onun dünyada sahip olduğu en mukaddes varlığıdır. Herkes milletinin sıhhatle yaşaması için, kendisinin milleti içinde, milleti ile birlikte mesut olması için, bu kutsal ve değerli varlığın üzerine kendi öz malı, şahsi malı gibi titremelidir. Onu sevmeli, ona saygı duymalıdır."],["p","Dili sevmek, ona saygı duymak onun kanunlarına hürmet etmek, onun yapısına aykırı kullanışlara kapılmamak, onu içten ve dıştan gelecek yabancı tesrlerden ve zorlamalardan korumak, onun tabii gelişme yolunu, zaman içindeki tarihi seyrini açık tutmaktır."],["p","İnsanın kendi dili, anasının, babasının, sevdiklerinin, edebiyatının, gelmiş ve geçmişiyle bütün milletinin dilidir. İnsanın dili, destanlarının, hikayelerinin, masallarının, deyimlerinin dilidir."]]},{"n":151,"b":[["p","Milli dil memleket ölçüsünde kullanılan dildir. Dilde milliliğin ölçüsü, kullanılışıdır. Neyi kullanırsak, evde, sokakta, milletçe hangi kelimelerle konuşuyorsak, memleket ölçüsünde ne geçerli ise dilimiz odur. Milli dil menşe değil, mevcut durum, yani kullanış tayin eder. Her mişşetin dili, kendi kullandığı canlı dildir."],["p","Muharrem Ergin"],["l","1. Aşağıdaki ifadeler doğru mu (D), yanlış mı (Y)?"],["l","1. ( ) Milli dil, memleket ölçüsünde kullanılan dildir."],["l","2. ( ) Bir dilden başka bir dile klime girmesi doğru değildir."],["l","3. ( ) Dilini korumayan mşlletler, tarihlerini, geçmişlerini unutmaya mahkumdurlar."],["l","4. ( ) Günlük konuşma dili ile halk dili arasında fark yoktur."],["l","5. ( ) Edebiyat dili halkın kullandığı dile göre daha sanatlıdır."],["l","6. ( ) Dili, bazı devletler bir sömürge aracı olarak kullanmışlardır."],["l","2. Aşağıdaki kelimeleri manalarıyla eşleştiriniz."],["l","a) milli dil 1- başlangıç, bir şeyin çıktığı yer, köken, kaynak, menşe"],["l","b) mukaddes 2- kutsal"],["l","c) yabancı tesir 3- olağanüstü olayları konu alan şiir"],["l","d) destan 4- bilinç"],["l","e) şuur 5- bir millete ait, ona özgü konuşulan lisan"],["l","3. Aşağıdaki karıiık olarak verilen kelimelerden düzgün cümleler kurunuz."],["l","a) üzerine / canlı / kelimeler / kullanılan / gerekir / titremek"],["l","b) varlığımızdır / olduğumuz / sahip mukaddes / en / dil"],["l","c) korumak / tesirlerden / dili / yabancı / gerekir"],["l","d) dildir / dil / memleket / milli / ölçüsünde / kullanılan"],["l","e) canlı / her / dili / kullandığı / kendi / milletin / dildir"],["l","4. Aşağıdaki test sorularını cevaplayınız."],["l","1. Milli dil .............................................................................."],["l","a) kullanış tayin eder."],["l","b) menşe tayin eder."]]},{"n":152,"b":[["l","c) sanatçılar belirler."],["l","d) edebiyatçılar değiştirir."],["l","2. İnsanın kendi dilini sevmesi ..............................................."],["l","a) milli dili güçleştirir."],["l","b) milli bir borçtur."],["l","c) dilin başka dillerle etkileşimini sağlar."],["l","d) kardeşliğin pekiştirilmesini sağlar."],["l","3. Bir dilin başka bir dilden etkilenmesi ................................."],["l","a) engellenmiştir."],["l","b) olmamıştır."],["l","c) doğal gçrülmüştür."],["l","d) önlenememiştir."],["l","4. İnsanın kendi dili onun dünyada sahip olduğu ........................"],["l","a) en zengin düşüncedir."],["l","b) en mukaddes varlığıdır."],["l","c) kalıplaşmış kelimelerdir."],["l","c) en büyük huzurdur."],["l","5. Halk dili .............................................................................."],["l","a) halkın günlük olarak kullandığı dildir."],["l","b) edebiyatçıların kullandığı dildir."],["l","c) ekonomi terimlerini de içine alır."],["l","d) eski destanlarda kullanılmış dildir."],["l","5. Aşağıdaki sorulara cevap veriniz. 1- İnsan kendi dilini niçin sevmelidir?"],["l",".................................................................................................. 2- Canlı dil ne demektir?"],["l",".................................................................................................. 3- Dile sahip çıkmakla, milli kültür arasında nasıl bir benzerlik vardır?"],["l",".................................................................................................."],["h","ÇOK ÖZEL BİR SIR"],["p","Öncelikle şunu söyleyeyim, bu bir sır: daha önce kimseye anlatmadım. Çünkü anlatsaydım hepsi dedemin deli olduğunu"]]},{"n":153,"b":[["p","düşünebilirdi. Zaten pek çok defa dedemin biraz deli olduğunu söylediklerini duydum."],["p","Evet, kabul ediyorum, dedem zaman zaman evdeki herkes yatmış, uyurken balkona çıkar ninemle konuşur. Ninemin yıllar önce öldüğünü ben de biliyorum ama yine de hiç kimsenin ona deli demesini istemiyorum."],["p","Dedem 73 yaşında, yani oldukça yaşlı ama hala sağlıklı ve yürürken baston kullanmıyor. Ayakkabı tamirciliği yapıyor. Her gün okuldan çıktıktan sonra dükkanına uğrayıp onu çalışırken seyretmeyi çok severim. Oraya yürüyerek giderim ve yoldaki büfeden ikimiz için kola alırım. Birlikte kolalarımızı içip sohbet ederiz. Ona okulda neler yaptığımı anlatırım. Dedem, bazen bunlara bir çocuk gibi güler. Ben konuşurken işini bırakır ve sadece beni dinler. Saat beşe gelirken dükkanı kapatmak için toparlanır, kalkarız. Ninemin fotoğrafını öpüp, “Yarın görüşmek üzere prensesim”, diyerek ona sarılır. Siz de görüyorsunuz işte: dedem ninemi çok sevmiş. Bu, onun deli olduğunu göstermez."],["p","Beni ninemin cenazesine götürmediler. Bu, çocuklar için iyi değilmiş. Ama dedm günlerce ağlayarak onun fotoğraflarıyla konuşmuş."],["p","Size bunu daha önce kimseye anlatmadığımı söylemiştim. Siz de anlatmazsanız sevinirim."],["p","Dedemin doğum günüydü. Annem bir pasta yaptı.ailedeki herkes ona birer hediye satın aldı. Bense ninemin fotoğrafını koyması için güzel bir çerçeve yaptım. Benim hediyemi alırken gözleri doldu, bana sarılarak teşekkür etti. O gece, tam uyuyacakken dedem odama geldi. Kulağıma, çok güzel bir başka hediye aldığını ve onu bana göstermek istediğini söyledi. Gizlice odasına gittik. Kapıyı arkamızdan kapattı ve yatağının altından küçük bir kutu çıkararak bana açmamı söyledi. Kutunun içinde kenarları dantelli iki mendil ve bir kağıt vardı. Kağıdı okudum: biraz şaşkın ve hüzünlü bir halde ancak “Dedeciğim” diyebildim. Bana alçak sesle “Prensesim beni unutmamış. Hala doğum günümü hatırlıyor”-dedi. Ben de, “ve hiç bir zaman unutmayacak, dedeciğim”-dedim."]]},{"n":154,"b":[["l","1. Aşağıdaki soruları cevaplayın."],["l","1) Yazarın verdiği hediye niçin diğerlerinden daha özeldir?"],["l",".................................................................................................."],["l","2) Yazarın hikayeyi hiçkimseye anlatmamasının sebebi nedir?"],["l",".................................................................................................."],["l","3) Dedesi ne işle meşguldür?"],["l",".................................................................................................."],["l","4) İnsanı çok sevmek deli anlamına gelir mi sizce?"],["l",".................................................................................................."],["l","5) Dedesi ile ninesi arasında nasıl bir aşk, sevgi olmuş olabilir?"],["l",".................................................................................................."],["l","2. Cümlelerin doğrusunu (D), yanlış olanları da (Y) olarak işaretleyiniz."],["l","1. ( ) Bu hikayedeki olayı herkes bilir."],["l","2. ( ) Yazar, herkesin dedesini deli demesini istemiyor."],["l","3. ( ) Dedesinin doğum günü için ninesi bir pasta yaptı."],["l","4. ( ) Yazarın hediyesini alınca dedesi çok sinirlenir."],["l","5. ( ) Kutunun içinde çok özel şeyler vardı."],["l","3. Aşağıdaki test sorularını cevaplayın."],["l","1. Dedem her gece balkonda ninemle ........................ ."],["l","A) Telefonla görüşür B) Sohbet eder"],["l","C) Yay yana oturur D) Tartışır"],["l","E) Çay içer"],["l","2. Yazarın dedesi ile ninesi arasında nasıl bağlantı olmuş?"],["l","A) Sevgi B) Kardeşlik"],["l","C) Arkadaşlık D) Nefret"],["l","E) Güvensizlik"],["l","3. İnsanın bir kişiyi uzun yıllar sevmesi onun ....................... olduğunu gösterir."],["l","A) Deli B) Sadık"],["l","C) Hain D) Akıllı E) Kurnaz"]]},{"n":155,"b":[["l","4. Kutunun içindeki kağıdı alıp okuyunca yazar"],["l","............................. ."],["l","A) Sevinir B) Duygulanır"],["l","C) Şaşırır D) Ağlar"],["l","E) Üzülür"],["l","5. Tam uyuyacakken dedem odama geldi ve kulağıma"],["l",".................. ."],["l","A) Bağırdı B) Vurdu"],["l","C) Anlattı D) Hayrırdı"],["l","E) Fısıldadı"],["l","4. Aşağıdaki boşlukları uygun kelimelerle doldurun."],["l","1. Yazarın ....................... insanlar, onun dedesini .................. sayıyorlarmış."],["l","2. Dedem bazen ....................... ............... balkona çıkar ninemle konuşur."],["l","3. Okuldan çıkınca ........................................... uğrayıp, dedemi çalışırken ............................. zevk alıyorun."],["l","4. Saat beşte dükkanı kapatırız, dedem ise ............................."],["l","................................."],["l","5. Dedem benim hediyemi alınca çok ................... ve bana ..."],["l","......................................................................................................... ."],["h","BAHAR"],["p","Artık dağlar, sırtlarından kürklerini attılar; fakat henüz, sabahları serince olduğu için omuzlarına sislerden birer atkı alıyorlar. Şimdi rüzgârlar da kuru ağaç dehlizlerinde pek deli gibi koşuşmuyor. Nebatların karnavalı mutlaka ilkbaharda! Her dalın üzerinde renkli ve güzel kokulu ipeklerden ufacık maskeler kıpırdıyor. Erguvanların, akasyaların dallarında kâğıt fenerciklere benzer sayısız çiçekler asılı. Ne kadar sevinç, ne kadar neşe Yarabbi! Hem her taraf böyle! Hele böcekler cidden görülecek şey! Büyük bir kuyumcu dükkânının camekânı canlanarak buraya gelmiş gibi. Kimisi kanadlı bir zümrüt küpe, kimisi uçan bir yakut damlası. Hepsi de takım takım çiçeklere koşuyorlar."],["p","Ya kuşlar? Doğrusu onlar da olur şey değil. Güya hepsi de"]]},{"n":156,"b":[["p","büyük bir konsere hazırlanıyorlarmış gibi ağaçların dallarında toplanıyorlar, birtakımı sazlarını akordetmekle meşgul."],["p","Dün, kendi kendime geziniyordum; birdenbire, bilmem nerden bir rüzgâr geliverdi; bütün çiçekli yapraklardan yerlere renkli kıvılcımlar yağdığını gördüm. Güya ağaçlar, yüzümüze konfeti atıyorlar. Bu şakacı rüzgâr, dalları gıdıkladıkça bütün yaşını başını almış kavaklar, ıhlamur bile gülmekten katılıyorlarmış gibi eğiliyor, birbirine giriyor."],["p","Gölgelerin yeşilliklere serdiği yaygıları beş dakika bir yerde durdur-îk kaabil değil; çünkü rüzgârı görür görmez onlar da uçuşuyorlar. Bütün eller neşe içinde. Leylâklar birer kandil ki ışıkları hep güzel koku! Bahçelerde kafile kafile menekşe, zerrin, fulya, daha adını sanını bilmediğim birçok çiçek. Bunlardan bâzıları parmaklıklara sarılarak bütün gelene geçene başlarını sallıyor, selâm veriyorlar."],["p","Şimdiden sonra, süslü ihtiyarları hiç ayıplamıyacağım : bu sabah bahçedeki buruşuk yüzlü akasyaya baktım da hayret ettim. O ne süs Yarabbi! Her dalında salkım salkım tazelik sallanıyor."],["p","Fakat bu kadar hazırlıktan sonra yaz, neye tazelenip de çabucak gel-biimem ki!"],["l","1. Yazın hava çok sıcak mı olur? Ülkenizde de böyle midir?"],["l",".................................................................................................."],["l","2. Yılın en sıcak mevsimi hangisidir? Ya ayı?"],["l",".................................................................................................."],["l","3. Yazın, büyük kentlerde oturanlar nerelere giderler?"],["l",".................................................................................................."],["l","4. Deniz kıyısında çocuklar neler yaparlar?"],["l",".................................................................................................."],["l","5. Ya büyükler?"],["l",".................................................................................................."],["l","6. Yazın siz nereye gitmeyi seversiniz?"],["l",".................................................................................................."],["l","7. En çok hangi mevsimi seversiniz?"],["l",".................................................................................................."]]},{"n":157,"b":[["l","8. Ya çocuklar? Niçin?"],["l",".................................................................................................."],["l","9. Yazın yağmur yağdığı olur mu?"],["l",".................................................................................................."],["l","10. Şimşek nedir, yıldırım nedir?"],["l",".................................................................................................."],["l","11. Yaz yağmurundan sonra kırlar nasıldır?"],["l",".................................................................................................."],["l","12. Bu metnin ana fikri nedir?"],["l","................................................................................................."],["h","ÖĞRENMENİN YAŞI YOK"],["p","Müzeyyen Çiftçi, İzmir Buca Halık Eğitim Merkezi’nin kurslarına katıldı, 70 yaşından sonra okuma yazma öğrendi, 15 yılda 20’ye yakın kurs bitirerek hepsinden sertifika aldı."],["p","Kursiyerlere göre çoktan “süper babaanne” olmuş Muzeyyen Çifçi. Merkezin kumaş boyama, cam süsleme, resim, bilgisayar gibi 20’ye yakın kursunu başarıyla bitirmiş ve okuma yazmayı da 70 yaşından sonrayine bir kursta öğrenmiş bu nedenle çevresindekiler ona “süper babaanne” diyorlar. Çiftçi, bu lokantadan ve gördüğü ilgiden oldukça memnun."],["p","80 yaşındaki Çiftçi, kurslara azimle katılıyor ve herkesin ileri görüşlü olmasını ister. Hayat hikayesi de onun azminin ve ileri görüşlüğünün bir göstergesi. Muzeyyen Çifçi’nin ilköğrenim yılları Elazığ’da bir ilkokulda 4. Sınıfta terk etmesiyle bölünmüş. Uzun yıllar Elazığ’da kaldıktan sonra 1991’de ailesiyle birlikteİzmir’e yerleşmiş. İki kız çocuğuyla birlikte zorluklarla dolu günleri olsa da hayata sımsıkı sarılmaktan vazgeçmemiş. Zamanın büyük bir bölümünü halık eğitim merkezinin kurslarına katılarak değerlendirmiş. Çiftçi, “Boş oturmayıp yeni bir şeyler öğrenmek için elimden gelen her türlü gayreti gösteririm.” diyor."],["p","Gençliğinin çoğu, sosyal etkinliklere katılmak için zamanının olmadığını söyler. Bu durum ya tembellikten ya vurdumduymazlıktan kaynaklanır genelde. Gençlerin bu kaçamak tutumu karşısında 80 yaşındaki Müzeyyen Çiftçi’nin azmi ise çapka çıkarılacak cinsten"]]},{"n":158,"b":[["p","doğrusu. Müzeyyen Çiftçi, gençlerin aksine “Katılacak başka kurs var mı?” diye soruyor. İnsanın içinde öğrenme isteği varsa yaş da zamansızlık da bahane oluyor."],["p","Buca Halık Eğitim Merkezi Müdürü Hasan Okur, “Müzeyyen Teyze pek çok kursumuzu bitirip belge aldı. Kendisine halık eğitim merkezimize katılımı ve devamlılığı noktasında örnek bir kişi olarak bakıyoruz. Hayatı çok seviyor. Biz de gençlere hayatı sevmek, üretken olmak, bir şeyler öğrenmek gerektiğini onun aracılığıyla anlatıyoruz."],["p","Gençler öğrenmeye ne kadar istekli olurlarsa önleri o kadar açık olur. Müzeyyen Teyze bunun en iyi örneklerinden biri.” diyor."],["p","Müzeyyen Çiftçi, her yerde öğrenmenin ve eğitimin önemini anlatarak herkese örnek oluyor. Çevresindekile devamlı sohbet ederek eğitimin önemini vurguluyor. Çiftçi, kurslardaki öğretmen ve öğrencilerin de neşe kaynağı. Öğrenme arzusuyla dolu olan Müzeyyen Çiftçi, “Ben buradaki kurslara katıldım. Herkes gelsin, katılsın. Herkes ileri görüşlü olsun. Gelip okuma-yazmayı, insanlığı, terbiyeyi, sevgiyi öğrensin.” diyor."],["p","Nurşen Görşen."],["p","Lütfen, soruları metine göre cevaplayınız."],["l","1. Müzeyyen Çiftçi’nin çevresi neden ona şaşkınlık ve hayranlık içinde bakıyorlar?"],["l","................................................................................................."],["l","2. Müzeyyen Çiftçi, sizce nasıl birisidir?"],["l",".............................................................................................."],["l","3. Muzeyyen Çifçiye göre okuyan insanın geleceği nasıl olacak?"],["l","................................................................................................"],["l","4. Müzeyyen Teyze, eğitimini nerede almaya başlamış ve nasıl devam ettirmiş?"],["l","..............................................................................................."],["l","5. Müzeyyen Teyzeye göre gençlerin sosyal etkinliklere zaman bulamamasının nedeni nedir?"],["l",".................................................................................................."]]},{"n":159,"b":[["h","KAŞGARLI MAHMUT"],["p","Kaşgarlı Mahmut XI. yüzyılda yaşayan Türk dil bilginidir. Dîvânü Lûgati’t-Türk adlı eseriyle ünlüdür. Karahanlılar soyundandır. 1072 yılında yazmaya başladığı eserini 1074’te tamamlayarak Bağdat’ta Abbasî halifesi El-Muktedî Billah’a sunmuştu. Karahanlılar döneminde yetişen ve ilk Türk dil bilgini olan Kaşgarlı Mahmut’un doğum tarihi, kesin olmamakla birlikte 1025 olarak biliniyor. 1071-1077 arasında Bağdat’ta bulunan Mahmut, Türk kültürünün Araplara tanıtılmasında büyük rol oynadı. Kendi döneminin Türk hayat ve cemiyetleri üzerine eğilen ünlü âlimleriyle birlikte Türk illerini adım adım dolaşan Kaşgarlı Mahmut, çalışmalarında Türkçeyi resmî dil olarak kabul eden Karahanlı Devleti’nden de büyük destek gördü. Türkçenin serpilip gelişmeye başladığı o dönemde, Mahmut’la birlikte Balasagunlu Yusuf Has Hacib de Türk diline büyük hizmet etti. Bu iki Türk âlimi, ortaya koydukları eserlerle, Türk dil birliğinin sağlanmasına önemli katkılarda bulundular. Aynı zamanda filolog, etnograf ve ilk Türk haritacısı olan Kaşgarlı Mahmut, Dîvânü Lûgati’t-Türk adlı eserinde; yaşadığı devirdeki Türk illerinin ve boylarının kullandığı ağızları canlı olarak tespit etti. Oğuz Türklerinin 24 boyu ile ilgili şemayı da verdiği eserinde, Türkçenin zenginliğini ve Arapça ile Farsça yanındaki değerini ispata çalışan Mahmut, ayrıca Türkçeyi Araplara öğretmek gayesiyle bir gramer kitabı da yazdı. Divân’ında Türk dilinin grameri yanında, Türk yer adları, Türk damgaları ve Türk topluluklarını da etraflı şekilde anlatan Kaşgarlı Mahmut, ömrünün sonlarına doğru tekrar memleketi Kaşgar’a dönerek, tahminen 1090’da burada vefat etti. Doğu Türkistan’da bulunan Kaşgar şehrine 35 kilometre uzaklıktaki Azak köyünde olan kabri, 1983 yılı Temmuz ayında bulundu."],["p","Türk illerini, obalarını ve bozkırlarını birer birer dolaşan ve Türk dili ve kültürüne ait topladığı malzemeyi titizlikle inceleyerek eserlerine alan Kaşgarlı Mahmut; Türk, Türkmen, Oğuz, Çiğil, Yağma ve Kırgız boylarının ağız ve lehçelerini karşılaştırmalı olarak işledi. Ona göre; Türk lehçelerinin en kolayı Oğuz lehçesi, en dürüst ve kullanışlısı Yağma ve Tuhsi şivesi, en edebisi ise Kaşgar"]]},{"n":160,"b":[["p","Türkçesidir. Divanü Lugati’t-Türk dünyanın her yanında, Türkoloji ilmiyle uğraşan pek çok bilgin için paha biçilmez bir kaynak olmuştur. Üzerinde şimdiye kadar yerli, yabancı uzmanlar çok çeşitli incelemeler yapmışlardır. Dîvânü Lûgati’t-Türk, bir ön sözle sözlük kısmından meydana gelmiştir. Ön sözde yazar Türk dilinin tarifini, lehçelerinin özelliklerini sayar ve dil bilgisi kurallarını, Arapçadakilere kıyasla gösterip tespit eder. Ana dilinin Arapça’dan çok üstün olduğunu söyler ve örnekler verir. Bu arada, o bilgileri nasıl elde ettiğini, nasıl bütün memleketleri gezip dolaştığını da anlatır. Ikinci, yani sözlük bölümü, Türkçe kelimelerin Arapça izahlarını kapsar. Bu nedenle, eser, Arapça yazılmış bir Türkçe sözlüktür. Ya da Türkçeden Arapçaya sözlüktür. Arapça dil bilgisindeki şekillerine göre sıralanmış 7500’den fazla kelime hakkında açıklama yapılmıştır. Büyük bilgin bu açıklamaları yaparken kelimelerin nerelerde ve hangi anlamlarda kullanıldığını göstermiştir. Bu esere ve onu izleyen başka eserlere kadar yazılı edebiyat örneklerimiz bilinmediği için, daha önceki yüzyıllara ait sözlü edebiyat örneklerini Kaşgarî’nin kitabından öğrenmekteyiz. Ağıtlar, koşmalar, atasözleri ve nazım şekillerinden başka destanlaşmış kahramanların varlığını da yine Dîvânü Lûgati’t-Türk’ten öğrenmiş bulunuyoruz. Bu sebeplerden dolayı Kaşgarlı Mahmut’un Dîvânü Lûgati’t-Türk’ü hem dil, hem edebiyat, hem toplum ve sosyoloji tarihimiz bakımından çok önemli belgeleri toplayan bir kaynaktır."],["p","Lütfen, soruları okuduğunuz metne göre yanıtlayınız."],["l","1. Kaşgarlı Mahmut, kaçıncı yüzyılda yaşamıştır?"],["l","A) XII. Yüzyıl"],["l","B) XI. Yüzyıl"],["l","C) X. Yüzyıl"],["l","D) XV. Yüzyıl"],["l","E) IX. Yüzyıl"],["l","2. Kaşgarlı Mahmut’un ünlü eserinin adı nedir?"],["l","A) Kutadgu Bilig"],["l","B) Atabetü’l Hakayık"],["l","C) Divan-ı Lügati’t Türk"]]},{"n":161,"b":[["l","D) Risaletün Nushiye"],["l","E) Divan-ı Kebir"],["l","3. Kaşgarlı Mahmut, ünlü eserini hangi amaçla yazmıştır?"],["l","A) Türkçeyi Araplara öğretmek amacıyla"],["l","B) Türkçeyi Farisilere öğretmek amacıyla"],["l","C) Arapçasını geliştirmek için"],["l","D) Kalıcı bir eser bırakmak için"],["l","E) Arapçayı yermek için"],["l","4. Bu eser, hangi tarihler arasında yazılmıştır?"],["l","A) 1080-1084"],["l","B) 1071-1072"],["l","C) 1025-1029"],["l","D) 1072-1074"],["l","E) 1049-1055"],["l","5. Kaşgarlı Mahmut’un ünlü eseri için aşağıdakilerden hangisi söylenebilir?"],["l","A) Bir hatıra kitabıdır."],["l","B) Bir masal kitabıdır."],["l","C) Bir tıp kitabıdır."],["l","D) Bir şiir antolojisidir."],["l","E) Arap harfleriyle yazılmış Türkçe bir sözlüktür."],["l","6. Kaşgarlı Mahmut, nerede ve kaç yılında vefat etmiştir?"],["l","A) Basra - 1077"],["l","B) Halep - 1083"],["l","C) Istanbul - 1069"],["l","D) Kaşgar - 1090"],["l","E) Semerkand – 1093"],["l","7. Aşağıdaki Türk lehçelerinden hangisi Kaşgarlı Mahmut’a göre en kolay öğrenilen lehçedir?"],["l","A) Oğuz"],["l","B) Yağma"],["l","C) Tuhsi"],["l","D) Türkmen"],["l","E) Çiğil"]]},{"n":162,"b":[["l","8. Divan-ı Lügatit’t Türk’ün ön söz bölümü için aşağıdakilerden hangisi söylenemez?"],["l","A) Bu bölümde Türk dilinin tarifi vardır."],["l","B) Türk lehçelerinin özellikleri vardır."],["l","C) Bu bölümde Türkçe kelimelerin Arapça izahları vardır."],["l","D) Türk dil bilgisi kuralları ve bunların Arapçadaki ile karşılaştırması vardır."],["l","E) Kaşgarlı Mahmut, bütün memleketleri nasıl gezdiğini anlatır."],["l","9. Aşağıdaki devletlerden hangisi Türkçeyi resmî dil olarak kabul etmiştir?"],["l","A) Endülüs Emevi Devleti"],["l","B) Karahanlı Devleti"],["l","C) Gazneliler Devleti"],["l","D) Abbasi Devleti"],["l","E) Memlüklüler Devleti"],["l","10. Aşağıdakilerden hangisi Divan-ı Lügati’t Türk için söylenemez?"],["l","A) Türkçe kelimelerin nerelerde ve hangi anlamlarda kullanıldığını göstermiştir."],["l","B) Bu esere kadar Türk dilinin yazılı edebiyat örnekleri bilinmemekteydi."],["l","C) Destanlaşmış kahramanların varlığını bu eserle öğrenmekteyiz."],["l","D) Eser, dil, edebiyat, toplum ve sosyoloji tarihi bakımından önemli belgeleri toplar."],["l","E) Türk dilinin ilk yazılı edebiyat örneğidir."],["h","İSMAİL GASPIRALI"],["l","(1851-1914) Büyük düşünce adamlarından biri olan Gaspırali İsmail Bey 1851 yılında Kırımda dünyaya geldi. Henüz on yaşındayken Akmescit Lisesine gönderilen İsmail Bey orda iki sene kaldıktan sonra askeri okula nakledildi. Daha sonra Moskova Askeri Lisesine gitti. Ama kısa bir süre sonra okuldan ayrıldı ve Rusça"]]},{"n":163,"b":[["p","öğretmenliği yapmaya başladı. Daha sonra sistemleştireceği eğitim uygulamalarını ilk burda gerçekleştirmeye başladı. Gaspıralı yarım kalan eğitimini tamamlamak amacıyla 1871 yılında Paris’e gitti ve 1874’e kadar orda kaldı. Ülkesine dönüp belediye başkanı seçildiği tarih olan 1878’e kadar kendini okuyarak yetiştirmeye devam etti. Bahçesaray Belediye Başkanı olduktan sonra 1873’de Tercüman gazetesini çıkardı. Bu gazetede dil ve eğitim hakkındaki yazılarıyla fikirlerini açıklamaya çalıştı."],["p","Gaspıralı İsmail Bey 11 Eylül 1914 Cuma günü Bahçesaray’da vefat etti. Onun Türkçe konuşan herkes tarafından kullanılabilecek bir yazı dili ortaya koymak için gösterdiği büyük gayret o günün şartlarında büyük bir çalışma istiyordu."],["p","Gaspıralı aslında sadece dilde değil kültürün bütün alanlarında toplumca bir yenilenme düşüncesiyle ortaya çıkmıştır. Bu yenileşmenin temel kuralı ise Tercüman gazetesinde başlığın hemen altında yer alan: “Dilde, fikirde, işte birlik”ti. Bu kelimelerle özlü bir şekilde özetlenen düşüncenin ana çerçevesi kısaca şunlardı: okulları modern metotlarla yenilemek; Türkçe konuşan herkes için ortak bir yazı dili oluşturmak; eğitim ve öğretim işlerinin yürütülebilmesi için hayır kurumları kurmak."],["p","Gaspıralı dilde birlik idealinin gerçekleşmesi için de Türkçeden mümkün olduğu kadar yabancı kelime ve kuralları çıkarmayı ve her şivede kullanılabilecek yerel kelimeleri almayı öngörüyordu. Sonunda öyle bir dil kurulmalıydı ki bir dostunun yazdığı mektupta da söylediği gibi Türkistan steplerindeki Türk devecileriyle İstanbul’daki kayıkçılar ve hamallar bile rahatça anlaşabilmeliydi. Gaspıralı bu amaçla Tercüman’ı Türkçe konuşulan hemen her yerde okunan bir gazete haline getirmeyi başarmıştır. Onun çabalarıyla farklı ülkelerdeki otuz beşten fazla gazete ve dergide, hikâye ve romanda Gaspıralı Dili kullanılmıştır."],["p","Eğitimde modernliği savunan Gaspıralı 1884 yılında Bahçesaray’da ilk yeni tarz okulun açılmasına ön ayak oldu. Bu okulda kendisinin yazdığı okuma kitabı okutulacaktı. Bu kitaplarla kendi metodunu uygulamaya başladı. Ne var ki eski metodu savunanlar buna karşı çıktılar. Onların etkisiyle halk da onun"]]},{"n":164,"b":[["p","açtığı okula karşı cephe almıştı. Okul açılalı kırk beş gün olmuştu. Gaspıralı ve arkadaşları elde ettikleri sonucu göstermek için şehrin ileri gelenlerini okula davet ettiler. Daveti kabul eden çok az sayıdaki misafirler, öğrencilerin kırk beş günde, her gün sadece dörder saat çalışarak okuyup yazmasını öğrendiklerini görünce gözyaşlarını tutamadılar."],["p","Bu olaydan sonra ünü epeyce yükselmişse de onu eleştirenler “çabuk öğrenilen bilgi çabuk unutulur” gibi gerekçelerle eleştirilerini devam ettirdiler. Bunun üzerine Bahçesaray pazarındaki bir kahvehanede bir akşam okulu açarak yirmi kadar hamalı ve bakkal çırağını davet eden Gaspıralı kırk akşam özellikle kendisi ders vererek hepsine okuma yazma öğretmiştir."],["p","Gaspıralı İsmail Bey Türkçe sevdalısı büyük bir eğitimci ve düşünce adamıydı. Hayatı boyunca Türkçenin gelişimi ve insanların eğitimiyle ilgili çalışmalar yaptı."],["p","Günümüzde de hala Türkçeye yaptığı çalışmalar unutulmamış ve kendisi hep hayırla anılmıştır."],["l","I. Aşağıdaki soruları yanıtlayınız."],["l","1. Hangi gazeteyi çıkarmıştır ve bu gazetede hangi konularda yazmıştır?"],["l","2. Gaspıralının ideolojisini yansıtan ve Tercüman gazetesinin başlığının altında yazan slogan nedir? Bu sloganda ne anlatmak istiyor?"],["l","3. Gaspıralı hayatı boyunca hangi konularda çalışmalar yapmıştır?"],["l","4. İsmail Gaspıarlı başarılı olmuş mudur?"],["l","5. Sizce Gaspıralı’nın düşünceleri ütopya mıdır? II. Aşağıdaki test sorularını dinlediğiniz metne göre yanıtlayın."],["l","1. Gaspıralı yarım kalan eğitimini tamamlamak üzere 1871 yılında ……………….’e gitti"],["l","A) İstanbul C) Moskova"],["l","B) Paris D) Roma E) Pekin"],["l","2. Gaspıralı’nın çıkardığı gazetenin adı nedir?"]]},{"n":165,"b":[["l","A) Hürriyet C) Tercüman E) Hakikat"],["l","B) Zaman D) Milliyet"],["l","3. Gaspıralı 40 günde okuma yazma öğretince onu çekemeyenler nasıl bir savunmayla onun başarısını kabul etmemişlerdir?"],["l","A) Çabuk öğrenilen bilgi çabuk unutulur"],["l","B) Herkes bunu öğrenemez"],["l","C) Bütün millete bu şekilde ulaşamazsın"],["l","D) Bunun için maddi kaynağın yok."],["l","E) Ders verdiğin kişiler genç insanlardı."],["l","4. Gaspıralı’nın oluşturduğu dele ne ad verilmiştir?"],["l","A) Genel Türkçe C) Genel Dil E) Gaspıralı Dili"],["l","B) Hedef Dil D) Kolay Dil"],["l","5. Gaspıralı dilde birlik idealinin gerçekleşmesi için ne yapmak gerektiğini düşünüyordu?"],["l","A) Türkçenin mümkün olduğu kadar yabancı kelime ve kuralları çıkarmayı ve her şivede kullanılabilecek yerel kelimeleri almayı öngörüyordu."],["l","B) Batıdan alınan kelime ve kavramları kullanmak gerektiğini düşünüyordu."],["l","C) Bir kurul oluşturup kelime seçimi yapılmalı."],["l","D) Kendinin oluşturacağı kuralları bütün dillerin uyması gerektiğini öngörüyordu."],["l","E) Dildeki doğu kökenli sözcükler çoğaltılmalı Batı kaynaklı kelimeler azaltılmalı."],["p","III. Metne göre aşağıdaki cümlelerin doğru olanını “D”, yanlış olanını “Y” olarak işaretleyin."],["l","1. Gaspıralı İsmail Bey Türkçe sevdalısı büyük bir eğitimci ve düşünce adamıydı. ( )"],["l","2. Gaspırali İsmail Bey çalışmalarında hep yalnız kalmıştır."],["l","( )"],["l","3. Gaspıralının çalışmaları hiçbir zaman başarılı olmamaıştır."],["l","( )"],["l","4. Gaspıralının öğrencileri 15 günde okuma yazma öğrendiler"],["l","( )"]]},{"n":166,"b":[["l","5. Gaspıralı aslında sadece dilde değil kültürün bütün alanlarında toplumca bir yenilenme düşüncesiyle ortaya çıkmıştır."],["l","( ) IV. Aşağıdaki kelimelerle cümle kurunuz."],["l","1. Nakletmek"],["l","2. Gayret"],["l","3. İdeal"],["l","4. Cephe almak"],["l","5. Eleştiri"],["h","BAHAR GİBİ BAHAR"],["p","Uzun zamandır böylesi olmuyordu, bahar bu kadar kendini göstermiyor, bizi sevindirmiyordu. Tabii felaket senaryolarının en dehşet verici versiyonlarının arka arkaya sıralandığı şu dönemde, bir iklim sürprizi ile karşı karşıyayız."],["p","Sizleri bilmem ama ben bu sürpriz baharı büyük bir sevinç ve coşkuyla karşılıyorum. Kapıdan çıkar çıkmaz aldığım o taze bahar kokusu, o tabiat heyecanı, o gözleri kör etmeyen tatlı ışık, çayırı çimeni saran yeşillenme telaşı, dallara düşen beyaz çiçekler, patlamaya hazır tomurcuklar, kuşların muhteşem sevinç gösterileri… Ne zamandır “Artık hiç bahar gelmiyor, kış bitiyor, yaz başlıyor” diye kendi aramızda konuşup duruyorduk değil mi? Aman bu sene de nasılsa öyle oluyordur deyip baharı ıskalamayın. Dışarıda gerçekten bahar var, bahar gibi bahar…"],["p","Doğrusu işler güçler nedeniyle kendimi henüz kırlara vuramadım. Pencereden bakarak, balkona çıkarak, işe gittiğim yolları hafiften uzatarak bahara dokunmaya çalışıyorum. Yani farkındayım, bu bahar bir yerlerden sızarak benim kıstırılmış hayatımı bile kaplayabilen bir bahar… Her şeyden çok sıkıldığım, çok yorulduğum bir zamanda beş dakika, on dakika başımı yastığına koyup dinlendiğim, tazelendiğim bir bahar… Sizler de yapın, lütfen yapın. Hemen şimdi, bulunduğunuz yerden çıkın, yapamıyorsanız bir pencere açın, bahara “Merhaba!” deyin. Sitemle nerelerde kaldığını sorun, gelmekle ne iyi ettiğini söyleyin, “Her zaman bekleriz” deyin. El sıkışın, kucaklaşın, baharı iki yanağından doyasıya öpün,"]]},{"n":167,"b":[["p","koklayın."],["p","Seneye yine gelir mi, etrafımızı kuşatır mı, yüreğimizi heyecana boğar mı, ruhumuzu canlandırır mı, bunların hiçbirinin garantisi yok artık. Bulduğumuz baharı bağrımıza basacağız çaresiz. Daha kaç bahar göreceğiz, bunu bile düşünsek yeri… Çünkü küremiz ısındı, mevsimlerin dengesi bozuldu. Yazlar kışlar uzadı, sonbahar azaldı, bahar neredeyse hiç kalmadı. Piyango gibi kırk yılda bir çıkıyor artık bahar… Öyle ki kazık kadar kimi çocuklar için bu bahar gerçekten ilk bahar!.."],["p","Şunu da düşünmek lazım, yazılan felaket senaryolarının elbette bilimsel temeli var, her şeyi o kadar tüketiyoruz ki bunları hak etmediğimizi de söyleyemeyiz. Ama unutmayalım, rahmet diye bir şey var, Allah isterse dünyanın bütün senaryoları durur, duruyor. Bu bahar, biraz da böylesine bahşedilmiş bir bahar…"],["p","Birazdan yazıya noktayı koyacağım. Sanal hayata düğümlenmiş gözlerimi çözeceğim, binlerce tonluk bir ağırlıkla aşağıya doğru çekilmekte olan bedenimi toparlayıp masanın başından uzaklaştıracağım. Ayakkabılarımı giyip kendimi baharın kucağına atacağım. Üç beş kare fotoğraf çekeceğim, bu baharın hatırası olarak… Sonra toprağa dokunacağım, çimlere dokunacağım, bahar dallarına dokunacağım. Ağaçları şenlendiren serçelere selam duracağım. Sonra direksiyonu bahara bırakacağım. Beni nereye götürürse oraya gideceğim. İtirazlarımla hiç canını sıkmayacağım. Gönlünü hoş edeceğim. Yine gelsin diye, yine gelip beni bulsun diye, rutini bozsun, güzelliğiyle hayatımı aksatsın diye… Bütün kapıların öyle ya da böyle aslında hayata açıldığını anlatsın diye…"],["p","Bu bahar gerçekten de bahar gibi bir bahar…"],["p","Ruhuma ne yaptı hele bir bakın!"],["p","Lütfen aşağıdaki soruları metne göre cevaplandırın."],["l","I. Aşağıdaki soruları yanıtlayınız."],["l","1. Yazarın bizlere tavsiyesi nedir?"],["l",".................................................................................................."],["l","2. Mevsimlerin dengesinin bozulmasının sebebi nedir?"],["l",".................................................................................................."]]},{"n":168,"b":[["l","3. Yazar neden heyecan yaşamaktadır?"],["l",".................................................................................................."],["l","4. Yazar niçin baharı “sürpriz bahar” diye nitelendiriyor?"],["l",".................................................................................................."],["l","5. “Sanal hayata düğümlenmiş gözlerimi çözeceğim” sözleriyle ne demek istiyor?"],["l",".................................................................................................."],["p","II. Aşağıdaki test sorularını okuduğunuz metne göre yanıtlayınız."],["l","1. Yazar hangi sürpriz ile karşı karşıyadır?"],["l","A) Baharın gelmesi sebebiyle"],["l","B) Kış gelmesi sebebiyle"],["l","C) Yaz gelmesi sebebiyle"],["l","D) Kar yağması sebebiyle"],["l","E) Çiçeklerin açması sebebiyle"],["l","2. Niçin tabiatın dengesi bozulmuştur?"],["l","A) Dünyanın yörüngesinin bozulması sebebiyle"],["l","B) Küremizin ısınması sebebiyle"],["l","C) İnsanların ahlakının bozulması sebebiyle"],["l","D) Hayvanların azalması sebebyile"],["l","E) Suların bitmesi sebebiyle"],["l","3. “Son noktayı koymak” deyimi aşağıdakilerin hangisinde gerçek anlamda kullanılmıştır."],["l","A) Bu konuya son noktayı koydum, artık konuşmak istemiyorum"],["l","B) Yazacağım metin bitti ve son noktayı da koydum."],["l","C) Evliliğime son noktayı koydum"],["l","D) Senle olan dostluğuma son noktayı koyuyorum."],["l","E) Bu ev meselesine artık bir son noktayı koysanız diyorum."],["l","4. “kazık kadar çocuklar” sözüyle karşılanan anlam nedir?"],["l","A) Bebekler"],["l","B) Aptal çocuklar"],["l","C) Yaşı büyük gençliğe yakın çocuklar"],["l","D) Erkek çocuklar"],["l","E) Kız çocuklar"]]},{"n":169,"b":[["l","5. Yazar kimin gönlünü hoş edecektir?"],["l","A) Eşinin"],["l","B) Çocuklarının"],["l","C) Baharın"],["l","D) Arkadaşının"],["l","E) Annesinin"],["p","III. Aşağıdaki cümlelerin doğru olanını “D”, yanlış olanını “Y” olarak işaretleyin."],["l","1. ( ) Bahar yazarın ruhunu okşamış ve mutlu etmiştir."],["l","2. ( ) Uzun zamandır böyle bir bahar gelmemiştir"],["l","3. ( ) Yazar işleri güçleri düşünmüyor ve kendini kırlara vuruyor."],["l","4. ( ) Felaket senaryolarının bilimsel temeli yoktur ve uydurmadır."],["l","5. ( ) Yazlar kışlar kısalmış, sonbahar uzamıştır, kış neredeyse hiç kalmamıştır."],["p","IV. Aşağıdaki kelime, kelime gruplarını kullanarak anlamlı cümle kurunuz."],["l","1. Iskalamak"],["l",".................................................................................................."],["l","2. Sitem"],["l",".................................................................................................."],["l","3. Son noktayı koymak"],["l",".................................................................................................."],["l","4. Bağrına basmak"],["l",".................................................................................................."],["l","5. Rutin"],["l",".................................................................................................."],["h","HAYATIM ROMAN DİYEN İNSANLAR"],["p","Bazen tanıdığım ya da tanıştığım insanları roman karakteri gibi görüyorum. Öyle insanlar var ki muhteşem roman kahramanları olabilirler."]]},{"n":170,"b":[["p","Üstelik onlar da farkındadır sanki bu durumun. Kendi hikâyelerini anlatmak isterler. Belli ki anlaşılmak isterler. Sadece anlaşılmak değil, bir de yazılmak isterler. İlgimi çekiyor bazı kadınların “Hayatım roman, dinleseniz de yazsanız keşke!” demeleri. İlgimi çekiyor gündelik hayatta son derece utangaç, kendi halinde olan insanların bile gizliden gizliye hayatlarını bir yazara anlatmak istemeleri. Kitaplaşmak istemeleri. Bir de kendi hikâyelerini kendileri yazmak isteyen nice insan tanıyorum. Ertelenen bir gelecekte, beklenen bir emeklilik evresinde oturup hayatlarını adım adım yazmayı isteyenler."],["p","“Günün birinde bir tekne alıp her şeyi bırakacağım. Sonra ver elini deniz, ver elini huzur. Valla billa ahdım olsun altı ay karaya ayak basmaya niyetim yok, bir açılsam… O zaman yazacağım hayatımı”. diyor adam."],["p","Mesleği bankacılık. Son derece işkolik. Ne edebiyatla işi var ne kitaplarla. Pek bir şey okuyamamaktan şikâyet ediyor sık sık. Ama işte günün birinde her şeyi bırakıp yazmak istiyor. Hem de mesleğiyle ilgisi alakası olmayan bir kitap yazmak arzusu. Kendi hayatını, kendini anlatmak arzusu ertelenen bir borç gibi birikmiş yüreğinde sene be sene…."],["p","Gerçek ismi saklı kalsın, biz ona Tam-Gaz-Son-Hız Bey diyelim. Hani şu çalışmadan duramayan, oturduğu yerde rahat batan, evini ailesini seneler seneler boyu işleri için ihmal eden, bunun da farkında olan, acısını duyan, gene de koşturmaktan vazgeçemeyen iş ve hız ve adrenalin meraklıları vardır ya, onlardan biri bu lafların sahibi. Karısı bir kenardan dinliyor. Sessiz, mânidar bir tebessümle. Yüzünde “atma Recep din kardeşiyiz” diyen bir ifadeyle. Biliyorum ki çok seviyor eşini; ama çok da kızıyor ona, hep kızıyor. Onun da gerçek ismini saklayalım. Hâlâ-Âşık-Ama-Hep-Kırgın Bayan diyelim."],["p","“Depolayacaksın yiyeceğini içeceğini, bir de okunacak kitapları yığacaksın tepeleme. Bunca koşuşturmadan kitap mitap okuyamaz oldum. Tekneye yığarım okumak istediğim tüm kitapları. Tamamdır, ne televizyon ne bilgisayar isterim. Blackberry’i bile kapatırım. Bir de sınır koyarım kendime. Yüz kitabı devirmeden"]]},{"n":171,"b":[["p","karaya dönmek yok diye. Peş peşe yüz tane kitap!”"],["p","“Çok duyduk bu lafları.” diye araya giriyor Hâlâ-Âşık-AmaHep-Kırgın Bayan kocasının gözünün içine baka baka. Sonra bana dönüyor: “Sen söyle. Bu bir roman olsa, bizler de roman karakterleri olsak, sonunda şu tekne işi ne olurdu? Hayatını yazar mıydı bir tekneye kapanıp?”"],["p","Bu bir roman olsa, onlar da roman karakterleri, değişik şekillerde yazılabilirdi hikâyenin devamı. Tam-Gaz-Son-Hız Bey seneler sonra teknesine kavuşur; ama denize açılır açılmaz dipsiz bir yalnızlık ve ıssızlık içinde bulurdu mesela kendini. Dayanamazdı. Medeniyetten uzak olmaya değil, hatta bilgisayarından, telefonlarından, iş yemeklerinden bile uzaklaşmaya değil, kendi kendisiyle baş başa kalmaya dayanamazdı. Uğraşacak iş, koşturacak tempo kalmayınca kendi içindeki sesleri dinlemek zorunda kalır, kendi yüreği ve beyni ve geçmişiyle konuşmaya başlardı. Susuyorum. Bu bir roman olsa, onlar da roman karakterleri, birilerini incitmeden yazması zor olurdu bu hikâyeyi."],["p","Lütfen, soruları okuduğunuz metine göre tamamlayınız."],["l","1. Yazarın gözünde herkes kim olarak görünmektedir?"],["l","A) Birer sanatkar olarak"],["l","B) Aydın kimseler olarak"],["l","C) Birer romancı olarak"],["l","D) Birer roman kahramanı olarak"],["l","E) Birer aktör olarak"],["l","2. Yazarın kahramanları neden şikayetçiler?"],["l","A) Devrin acımasız olmasından"],["l","B) İşlerinin çok olmasından"],["l","C) Kendilerine kimsenin değer vermediğinden"],["l","D) Eşiyle anlaşamadığından"],["l","E) Kendilerine zaman ayıramadıklarından"],["l","3. Yazar kahramanına neden “Hâlâ-Âşık-Ama-Hep-Kırgın Bayan” adın takmaktadır?"],["l","A) Çünkü kadın hep sevgilisini aramıştır."],["l","B) Kadın her gördüğü erkeğe aşk olmaktadır."]]},{"n":172,"b":[["l","C) Kadın kendisine aşktır."],["l","D) Eşinin kusurlarını bildiği halde seven kadın"],["l","E) Çok dedikonu yapan ve komşu komşu gezen kadın."],["l","4. Yazar kahramanına neden “Tam-Gaz-Son-Hız Bey” adını takmaktadır?"],["l","A) Çünkü adam hep tatili hayal etmektedir."],["l","B) Adam yalancı züppenin biridir."],["l","C) Hep eşini aldatan tiplerden biridir."],["l","D) Ailesi için herşeyi adayan adam."],["l","E) İşkolik hep iş peşinde olan adamdır."],["l","5. Yazar kahramanlarının genel ortak özellikleri nelerdir?"],["l","A) Eşlerini aldatmaları"],["l","B) Kendilerine zaman ayıramamaları"],["l","C) Eşlerini çok sevmeleri"],["l","D) İşlerini çok sevmeleri"],["l","E) İşkolik olmaları"],["l","6. Lütfen, soruları doğru “D”, yanlış “Y” olarak işaretleyin."],["l","A) ( ) Tam-Gaz-Son-Hız Bey sürekli okumaya vakit ayıran biridir."],["l","B) ( ) Yazarın çevresindeki insanlar romanlarda karakter olarak geçmek istemezler."],["l","C) ( ) Yazar hayata ve çevresine roman ve roman karakterleri olarak bakıyor."],["h","BAŞARININ İLK DÜŞMANI TEMBELLİKTİR"],["p","Yetişme ve başarılı olma yolunun genç yolcusu! Bil ki, tuttuğun yolda birçok tehlikeli geçitlerin ve yol kesen düşmanların var. Gerçi bunlara yalnız sen değil, hayat yolunun her yolcusu rastlayabilir. Fakat bu düşmanlar, senin gibi hayatın henüz eşiğinde bulunan tecrübesiz masumlara musallat olmayı çok sever. Senin bunlarla pençeleşecek ve bu düşmanları alt edecek silahların yok değildir. Elverir ki, sen bu silahları kullanabilesin. Kullanmayı bilmez de bir defa alt olursan, bir daha belini kolayca doğrultamazsın. Müsaade et de sana, evvela, yolunu bekleyen düşmanları ve rastlayacağın tehlikeleri göstereyim."]]},{"n":173,"b":[["p","Başarılı olma yolunda senin ilk büyük düşmanın tembelliktir. Burada sana tembelliği tarif edecek değilim. Onu sen, ben, hepimiz az çok tanırız. Yalnız ben sana şunu söyleceğim ki, tembellik insan karşısına çıkıp da mertçe savaşan bir düşman değildir. Tam aksine eski peri hikayelerindeki kahramanlar gibi, şekilden şekile girerek ve bin bir hile kullanarak alt etmeye çalışan bir namerttir. Tehlikesinin büyüklüğü de buradan gelmektedir."],["p","Tembelliğin; yerine, adamına ve çağına göre girmediği kalıp yoktur. Herkesin mizacına göre tavır alır ve konuşur. Dilimizde aldığı çeşitli isimlerde onun bu sinsiliğini gösterir. Tembelliğin bir adı havailiktir. Bir adı gevşeklik, bir adı hoppalık ve züppelik, bir adı uyuşukluk, üşengeçlik, keyfine düşkünlük, tenseverliktir. Tembellik herkesin karşısına her zaman aynı kılıkla çıkmaz. O mesleksiz bir aktör gibi daima rol değiştirir. Bazen samimi ve iyilik sever bir dost tavrı alır. Bazen en meşru bir mazeret kılığına girer, hasta olur, yorgun düşer ve herkesi haline acındırır. Bazen iş yapar görünür; hakikatte hiçbir şey yapmaz. Bazen tatlı bir dille konuşur ve gönül çeler. Onun kandırıcı bir felsefesi ve safsata ilmiklerinden örülmüş bir edebiyatı vardır. Tembelliğin kitabından sana bazı parçalar okuyayım da dinle:"],["p","Adam sen de... Çalışanlar ne olmuş sanki?... Üzme kendini şu ölümlü dünyada, çalışmak yıpranmaktır. Hayat dediğin bir şanstır. Şansın varsa, herşeyin var demektir. Şansın yoksa kendini parçalasan da birşey olamazsın. Zaten suyu getiren de testiyi kıran da bir... Sen testiyi kır, suyu başkaları getirsin de afiyetle iç... Hem bir işin olacağı varsa sırt üstü yatsan da olur, olacağı yoksa, yırtınsan da olmaz.. Hele dursun bakalım, şimdi söyle yaslan da yarın yaparsın."],["p","Hem sana çalışmak yaramıyor, iştahın kaçıyor, neşen sönüyor. Huy bu ya, ben bütün sene kitabı, defteri koltuğunda gezmekten; hele kütüphane köşelerinde pineklemekten hoşlanmıyorum. Sınavlara şöyle yirmi gün, bir ay kala kafayı vurur, dersleri hazırlar ve sınavları mis gibi geçerim... Nedense benim yalnız sınav üstü zihnime bir açıklık geliyor; sene içinde sanki uykudayım. Hem ne gerek var, muvaffak olanın ve olmayanın gideceği mezarlık değil mi? Dünyaya insan ber defa gelir, hayattan zevk almaya bak."],["p","Tembelliğin kitabında daha neler neler var. Bildiğin şeylerle"]]},{"n":174,"b":[["p","başını ağırtmayayım. Yalnız şunu söyleyeyim ki, eğer tembel isen ve tembelliğin organik bir hastalıktan ileri gelmiyor da psikolojik bir gevşeklik, uyuşukluk, üşengeçlik, hoppalık ve havailik şeklinde ise iredeni kullanmak suretiyle başarının bu düşmanını yenebilirsin."],["p","Aşağıdaki test sorularını cevaplayın."],["l","1. Yazar başarıyı neye benzetiyor?"],["l","A) Yola B) Denize C)Gökyüzüne"],["l","D) Yelkene E)Kitaba"],["l","2. Hayatın her yolcusu neye rastlayabilir?"],["l","A) Yokuşa B) Engele C) Arkadaşa"],["l","D) Yolcuya E) Yönetmene"],["l","3. Başarının düşmanları en çok kimleri rahatsız eder?"],["l","A) Tembelleri B) Yaşlıları C) Tecrübeli kişileri"],["l","D) Çocukları E) Tecrübesiz kişileri"],["l","4. Aşağıdakilerden hangisi tembelliğin öğütlerinden değildir?"],["l","A) Bugünün işini yarına bırakma!"],["l","B) Üzme kendini şu ölümlü dünyada, çalışmak yıpranmaktır!"],["l","C) Sen testiyi kır, suyu başkaları getirsin!"],["l","D) Dünyaya insan bir defa gelir, hayattan zevk almaya bak!"],["l","E) Şansın varsa herşeyin var demektir!"],["l","5. Aşağıdaki kelimelerden hangisi züppelik kelimesinin eş anlamıdır?"],["l","A) Sadelik B) Güzellik C) Gösteriş"],["l","D) Yapmacık E) Çalışkanlık"],["l","6. Aşağıdakilerden hangisi başarının düşmanlarından değildir?"],["l","A) Gevşeklik B) Üşengeçlik C) Tembellik"],["l","D) Uyuşukluk E) Çalışkanlık"],["l","7. Bu metnin ana fikri nedir?"],["h","BİZİM KÖYDE ORMAN YANGINI"],["p","Bizim köyde, yaz aylarında, köy tellalı, dut ağalarda olurdu. Ormandan ufacık bir duman kabarsa, köy tellalı, dut ağacının dalma çıkar ellerini boru gibi yapar, ünlerdi. Herkes çeşme başına koşmaya başlardı."]]},{"n":175,"b":[["p","Balta, kazma, kürek çapa bıçak eline ne geçerse alır, yangına doğru koşardı. Çocuklar: “Biz de gideceğiz, biz de göreceğiz.” diya birbiri arkasına dizilirler, koşuşurlardı."],["p","Yangın yerine kuş gibi gitmek, duman yayılmadan, yangın büyümeden bastırmak lazımdı. Övle, yolda oyalanmaya, yolu uzatmaya gelmezdi. Dumanın kabarmasıyla alevlerin dil uzatması, çalıları, ağaçları yiyip yutması bir olurdu."],["p","Bizim köy, etraft dağlarla çevrili bir çukurun meyilli sırtına kurulmustur. Bu ufak dağlar arasında meltem erken çlkar. Yapraklar hemen titremeye başlar. Bazen, meltem yangını önümne katar, eteklerden alır, tepeleri, dağları aşırıncaya kadar kovalar, gider."],["p","Ormandaki yangını sıçratmamak için olağanüstü bir hız gerekir. Sıçrayan yanık kozalaklardan çıkan kıvılcımlardan ormanın beri yanında ani bir duman kalkar, yangın belirirdi. Köylüler hemen ateşin üstüne atlarlar, ayaklarıyla çiğnerlerdi."],["p","Tabanı yanmış çakallar, kuyruğu kavlamış tilkiler, sakat kurtlar, tavşan, sancar, yılan... binbir böcek perişan bir halde sürüne gelirler. Karşılarına çıkan insandan kaçmak şurda dursun, onu ğormezler bile. Hatta yaban hayvanları, insanın üstüne üstüne gelirler. Kuzu gibi sokulurlar. İnilti, vızılu ve yangının korkunç uğultusu insanın aklını başından alır."],["p","Yuvasında yavruları kalmış kuşlar, dumanlar arasında çırpına feryat eder. Yılanların, kertenkelelerin, kaplumbağaların dön
