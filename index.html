},{"i":65,"t":"Bankacılık","p":116},{"i":66,"t":"Edebıyat ve Ahlak","p":118},{"i":67,"t":"Lale","p":119},{"i":68,"t":"Kahve ve Sohbetin Ardında Gizli Olan Bir Çift Küpe","p":121},{"i":69,"t":"Şimdi Çayın da Hatırı var","p":122},{"i":70,"t":"Çayın Efsanesi","p":124},{"i":71,"t":"Gerçek Mutluluk,Gerçek Sevgi","p":126},{"i":72,"t":"Gerçek Dostluk Bu","p":128},{"i":73,"t":"Eskimolar","p":129},{"i":74,"t":"Fındık","p":132},{"i":75,"t":"Affet Babacığım","p":134},{"i":76,"t":"Erzurumda Kış","p":136},{"i":77,"t":"Şişman Olmanın Dayanılmaz Ağırlığı","p":138},{"i":78,"t":"Kuşak Çatışması","p":141},{"i":79,"t":"Niçin Alıyoruz","p":143},{"i":80,"t":"Komşu Ülkelerle Kültürel İşbirliği","p":145},{"i":81,"t":"Hiç Hayallerinizden Sıfır Aldınız Mı","p":146},{"i":82,"t":"Hayatta En Hakiki Mürşit İlimdir","p":149},{"i":83,"t":"Dile Sevgi ve Saygı","p":150},{"i":84,"t":"Çok Özel Bir Sır","p":152},{"i":85,"t":"Bahar","p":155},{"i":86,"t":"Öğrenmenin Yaşı Yok","p":157},{"i":87,"t":"Kaşgarlı Mahmut","p":159},{"i":88,"t":"İsmail Gaspıralı","p":162},{"i":89,"t":"Bahar Gibi Bahar","p":166},{"i":90,"t":"Hayatım Roman Diyen İnsanlar","p":169},{"i":91,"t":"Başarının İlk Düşmanı Tembelliktir","p":172},{"i":92,"t":"Bizim Köyde Orman Yangını","p":174},{"i":93,"t":"Çiçek ve Umut","p":176},{"i":94,"t":"Hayat Ağacında Bir Yaprak","p":179},{"i":95,"t":"Lütfen Kemerlerinizi Takınız","p":180},{"i":96,"t":"Kamyon","p":184},{"i":97,"t":"Rüşvet","p":186},{"i":98,"t":"Tuzlu Kahve","p":189},{"i":99,"t":"Yorulanlar","p":193},{"i":100,"t":"Bir Saatiniz Kaldı","p":195},{"i":101,"t":"Bufalo","p":200},{"i":102,"t":"Görme, Anlama Merakı","p":204}],"sents":[[7,"Bugün hava çok güzel ve güneşli."],[7,"TÖMER’in öğrencileri Çubuk Barajı’na pikniğe gidiyorlar."],[7,"Okuldan bir otobüse biniyorlar."],[7,"Orada yemek için meyveler, peynir, ekmek ve salam alıyorlar."],[7,"Bir öğrencinin teybi ve güzel kasetleri var."],[7,"Bazı öğrencilerin de topları var."],[7,"Orada tahta masalar ve sıralar var."],[7,"Öğrenciler ve öğretmenler masalarda oturuyorlar, yemek yiyorlar, müzik dinliyorlar ve konuşuyorlar."],[7,"Biraz da çalışıyorlar, çünkü yarın onların Türkçe sınavları var."],[7,"Onlar çok çalışıyorlar, çünkü çabuk Türkçe öğrenmek istiyorlar."],[7,"Otobüs saat dörtte geliyor ve hepsi okula dönüyorlar."],[9,"Türkiye’de bir yılda dört mevsim vardır."],[9,"Bu mevsimler ilkbahar, yaz, sonbahar, kıştır."],[9,"Her mevsim üç ay sürer."],[9,"İlkbaharda güneş hem daha erken doğar, hem de daha geç batar."],[9,"Bunun için günler uzun olur."],[9,"İlkbaharda sık sık yağmur yağar, gök gürler, şimşek çakar."],[9,"Ama, sonra hemen güneş açar."],[9,"İlkbahar ne soğuk ne de sıcaktır."],[9,"İlkbaharda genellikle havalar ılık olur."],[9,"İnsanlar evlerinde ilkbahar temizliği yaparlar."],[9,"Yazın havalar iyice ısınır."],[9,"Bütün okullar tatil olur."],[9,"Denizlerin, göllerin, nehirlerin suyu ısınır."],[9,"Herkes denizlere, dağlara veya ormanlara koşar."],[9,"Deniz ve güneş sağlığımız için çok yararlıdır."],[9,"Yazın meyveler, sebzeler olgunlaşır."],[9,"Bütün bitkiler biraz daha büyürler."],[9,"Sonbaharda artık uzun günler yavaş yavaş kısalır."],[9,"Havalar da artık çok şıcak değildir."],[9,"Sonbaharda çok yamur yağar."],[9,"Üşümemek için daha kalın elbiseler giyeriz."],[9,"Tatil biter okullar ve dersler başlar."],[9,"Kışın havalar iyice soğur."],[9,"Gündüzler kısa geceler uzundur."],[9,"Kışın ağaçların hiç yaprağı kalmaz."],[9,"Sadece çam gibi bazı ağaçlar kışın da yeşil kalır."],[9,"Kışın hasta olmamak ve üşümemek için en kalın elbiselerimizi giyeriz."],[9,"Lütfen, soruları okuduğunuz metine göre yanıtlayınız."],[10,"Zeynep şimdi ortaokul ikinci sinifa gidiyor."],[10,"Ağabeyi ise lise ikide."],[10,"Zeynep hergün okula yürüyerek gidiyor."],[10,"Zeynep yine bir gün okuldan eve yürüdü ve eve geldi."],[10,"Evlerinin kapısının önünde bir yavru köpek gördü."],[10,"Evde annesi, babası yoktu."],[10,"Hemen köpeği içeri almak istedi."],[10,"O sırada ağabeyi Erol geldi."],[10,"Erol köpeği görünce çok şaşırdı."],[10,"Fakat Zeynep ağabeyinin sözünü dinlemedi, köpeği içeri aldı."],[10,"Biraz sonra, babası geldi."],[10,"Evde köpeği gördü ve çok şaşırdı."],[10,"Zeynep’e çok çok kızdı."],[10,"Doktor köpeği muayene etti."],[10,"Babası da Zeynep’in bu köpeğe evde bakmasına izin verdi."],[11,"Bir köylü kadın ikinci defa evlendi."],[11,"Mutfakta birinci kocasını düşündü."],[11,"Birinci kocası şimdiki kocasından daya iyiydi."],[11,"Bu arada bir dilenci kapıyı çalmadan içeri girdi."],[11,"Köylü kadından bir şeyler vermesini rica etti."],[11,"Çünkü dilenci çok açtı."],[11,"Köylü kadın Çanakkale’yi duymadı ve bunu cennet gibi anladı."],[12,"Dilenci torbayı alip gitti."],[12,"Biraz sonra kadının kocası geldi."],[12,"Karısına hiçbir çey söylemeden atını getirdi ve binip dilencinin arkasından gitti."],[12,"Dilenci nal sesleri duydu, durup baktı ve köylüyü gördü."],[12,"Hemen torbayı bir ağacın arkasına saklayıp torbanın üstünü örttü ve yolun kenarına oturdu."],[12,"Dilenci torbayı aldı ve ata binip gitti."],[12,"Köylü tabii dilenciyi bulamadan geri döndü baktı ama at ve o adam yoktu."],[12,"Her şeyi o zaman anladı."],[13,"Kardeşimin biri dört yaşında, diğeri beş buçuk yaşında."],[13,"Annem, babam, kardeşlerim ve büyükannemle birlikte bir çiftlik evinde oturuyoruz."],[13,"Evimiz iki katlı, tam altı odası var."],[13,"Evimiz ve çiftliğimiz Bursa’da."],[13,"Ama, Bursa’nın biraz dışında."],[13,"Ne büyük, ne küçük, orta büyüklükte."],[13,"Çiftliğimizde çok hayvan var."],[13,"İnekler, atlar, koyunlar, tavuklar bir kedi ve bir köpek var."],[13,"Ben en çok atları severim."],[13,"Ata binmek ve atla gezmek çok güzel."],[13,"Biz her gün çiftlikte taze yumurta yeriz, taze süt içeriz."],[13,"Ben şimdi ailemle birlikte kalmıyorum."],[13,"Ankara’da bir yurtta kalıyorum."],[13,"Çünkü Hukuk Fakültesinde okuyorum."],[13,"İki yıl sonra avukat olacağım."],[14,"Ben her tatilde ailem için hediyeler alıp Bursa’ya gidiyorum."],[14,"Genellikle Bursa’ya otobüsle gidiyorum."],[14,"Bugün ben çok mutluyum."],[14,"Çünkü bu çarşamba bayram ve bir hafta sonra benim tatilim başlıyor."],[15,"Ali ile Fatma evliler."],[15,"İki kız çocukları var."],[15,"Çocuklar çok küçük, okula gitmiyorlar."],[15,"Bir şirkette kamyonla İzmir’den Ankara’ya yük taşıyor."],[15,"Fatma Hanım da aynı şirkette sekreter."],[15,"Çocuklar ise, şirkete yakın bir kreşte kalıyor."],[15,"Şimdi İzmir’de Konak’ta küçük bir evde oturuyorlar."],[15,"Ev iki oda, bir salon."],[15,"Fatma Hanım ailesini ve evi çok seviyor."],[15,"Evi güzel çiçeklerle süslüyor."],[15,"Ailede her şey güzel ama, Fatma Hanım çok yoruluyor."],[15,"Çünkü tatilde Ali Bey futbol maçı seyrediyor, gazete okuyor, müzik dinliyor."],[15,"Ama, Fatma Hanım tatilde ev işi yapıyor, çocuklara bakıyor."],[15,"Fatma Hanım bugünlerde biraz sinirli."],[15,"Ali Bey eşiyle konuşuyor."],[15,"Küçük bir tatil yapmak istiyorlar."],[15,"Çocukları Ayşe Hanım’a bırakıyorlar."],[15,"Fatma Hanım şimdi çok mutlu ama, evi ve çocukları özlüyor."],[15,"Aşağıdaki test sorularını okuduğunuz metne göre yanıtlayınız."],[16,"Fatma Hanım tatil günleri ne yapıyor ?"],[16,"Güler Hanım da bir bankada çalışıyor."],[16,"Onların sekiz yaşında bir çocukları var."],[16,"O okulu ve öğretmenini seviyor."],[16,"Onlar bu hafta sonu büyükannelerine gitmek istiyorlar."],[16,"Büyükanneleri Ankara’dan biraz uzakta, Bursa’da oturuyorlar."],[16,"Onlar büyükanneye güzel bir hediye almak istiyorlar."],[16,"Güzel bir bluz alıyorlar."],[16,"Murat da bir hediye almak istiyor, ama parası yok."],[16,"Cumartesi sabah saat on birde arabaya biniyorlar ve yola çıkıyorlar."],[16,"Hava biraz soğuk ama güneşli."],[16,"İki sat sonra Bolu’ya geliyorlar ve orada lokantada öğle yemeği yiyorlar."],[16,"Murat döneri çok seviyor ve iki tabak döner yiyor."],[17,"Bursa’ya kadar karnı ağrıyor."],[17,"Saat dört buçukta Bursa’ya geliyorlar."],[17,"Büyükanne pencerede onları bekliyor."],[17,"Güler Hanım hemen bluzu büyükanneye vermek istiyor."],[17,"Bavulu açıyor ama paket bavulda yok."],[18,"Faruk Bey ‘in annesi oturuyor."],[18,"Size bir anımı anlatmak istiyorum."],[18,"Sabahleyin çok erken kalktım."],[18,"Ama, bu defa yılbaşını arkadaşlarımla beraber kutlayacağız."],[18,"Onun için çok mutluyum."],[18,"Kahvaltımı ailemle beraber heyecanla yaptım."],[18,"Çünkü, hem ailemle, hem de arkadaşlarıma hediye almak istiyorum."],[18,"Eve akşamüstü dört buçukta geldim."],[18,"Hemem hediyelerin üzerine unutmamak için arkadaşlarımın ve ailemin adlarını yazdım."],[18,"Ailemin şimdiden yeni yılını kutladım."],[18,"Arkadaşlarımla buluşmaya geç kalmak istemedim."],[18,"Ertesi sabah geç uyandım."],[18,"Ama o da ne!"],[18,"Bana hem gülüyor, hem de parmağını sallıyordu."],[18,"Kardeşim fincanı için de mutluydu."],[19,"Şimdi Türkiye’de TÖMER’de Türkçe ögreniyorum."],[19,"Bugün biz Kapadokya’ya gidiyoruz."],[19,"Otobüsümüz onbeş dakika sonra saat sekizde hareket edecek."],[19,"Yoculuğumuz, -tahmin ediyorum, dört ya da belki dört buçuk saat sürecek."],[19,"Ama bütün bunlar her yolculuk ve herkes için mümkün olmaz."],[19,"Bazı insanlar için yolculukta gülmek, eğlenmek mümkün değildir."],[19,"Çünkü, otobüste başka insanlar belki dinlenmek isterler, ses, gürültü istemezler."],[19,"O zaman sessiz olmak, başka insanları rahatsız etmemek lazımdır."],[19,"Biz gezmek, görmek, Türkiye’yi ve Türk insanları tanıtmak, eğlenmek için bu yolculuğa çıktık."],[19,"Şimdi hep birlikte şarkı söylüyoruz."],[19,"Sanıyorum bu gezi çok güzel olacak."],[19,"Aşağı yukarı bir buçuk saat sonra Ürgüp’te olacağız."],[21,"Bu sene on beş Şubatta okullar kapandı."],[21,"On beş günlük bir tatilimiz vardı ve bütün derslerimiz çok iyiydi."],[21,"Birkaç arkadaşla sıçak bir yerde tatil yapmak istedik."],[21,"Ailelerimize sorduk ve izin aldık."],[21,"Bizce Mersin tatil için güzel bir yerdi."],[21,"Biletlerimizi almadan önce Mersin’de bir otele telefon edip yer ayırttık."],[21,"Altı arkadaş soğuk bir şubat günü Ankara’dan yola çıktık."],[21,"Çünkü Mersin’i ve yüksek Toros dağlarını ilk defa göreceğiz."],[21,"Öğleyin karlı ve sisli Toros dağlarına geldik."],[21,"Otobüs çok yavaş gitmeye başladı."],[21,"Sonra yeşil çam ormanlarının arasından geçtik."],[21,"Mersin, temiz ve güzel bir şehir."],[21,"Otelimize gidip biraz dinlendik."],[21,"Sonra hemen şehri gezmeye başladık."],[21,"Deniz kenarında çok güzel parklar ve bahçeler var."],[21,"Bir gün portakal bahçesine gittik."],[21,"Bol bol portakal topladık."],[21,"Ağaçların altında oturup yedik."],[21,"Son gün de Erdemli’ye gittik."],[21,"Burada halk kış mevsiminde yaz sebzeleri yetiştirip bütün Türkiye’ye gönderiyor."],[21,"Biz bu tatilde kış mevsiminde baharı yaşadık."],[21,"Ailelerimize küçük birer hediye aldık."],[21,"Gelecek sene şubat tatilinde tekrar buruya gelmek istiyoruz."],[22,"Diğer şehirler gibi İzmir’de de insanlar yaşıyor."],[22,"Bu şehre birçok turist gelir."],[22,"Turistler de, Izmirliler de mutlaka alışveriş yapmak için Kemeraltı’na giderler."],[22,"Kemeraltı İzmir’in en uzun ve en kalabalık sokağıdır."],[23,"Bu sokakta satıcılar, tüm mevsimlere göre sebze ve meyvelerini satarlar."],[23,"Meyve ve sebzeler mevsimlere göre farklıklar göstermez, bu sokakta."],[23,"Hem turistler hem tamirliler Kemeraltı’nda bu sokağı gezmeden geri dönmezler."],[23,"Bu sokakta balıkçılar, çerezciler, manavlar, tenekeciler vardır."],[23,"Ama, şimdi sadece dört tenekeci var ve aynı dükkanda çalışıp aynı şeyleri üretiyorlar."],[23,"Belki, tenekecilerin çocuklan onlar gibi baba mesleklerini yapmayacaklar."],[23,"Kış ortasında karpuz, kavun, domates, çilek, yaz ortasında elma, portakal, ıspanağı burada görürsünüz."],[23,"Eskiyi ve yeniyi beraber orada tanırsınız."],[24,"O, bu sene liseyi biterecek."],[24,"Hakan’ın babası Murat Bey avukat, annesi Meltem Hanım ev hanımdır."],[24,"Sibel ise Hukuk Fakultesinde öğrencidir."],[24,"Kahvaltıyı hazırlar, sonra herkesi uyandırır."],[24,"Onlar hep birlikte kahvaltı yaparlar."],[24,"Kahvaltıdan sonra Hakan, babası ve ablasıyla evden çıkar."],[24,"Babaları Murat Bey, Hakan’ı ve ablasını okullarına bırakıp bürosına gider."],[24,"Murat Beyin çok geniş ve güzel bir arabası var."],[24,"Bu sabahta en erken Hakan uyandı."],[24,"Saate baktı saat altıydı."],[24,"O hemen mutfağa gitti."],[24,"Çünkü annesine güzel bir sürpriz yapmak istedi."],[24,"Sonra güzel bir kahvaltı sofrası hazırladı."],[24,"Hakan çok sessiz hareket etti ve hiç kimseyi uyandırmadı."],[24,"Meltem hanım önce eşini uyandırdı, sonra Sibel’i çağırdı."],[24,"Meltem Hanım Hakan’ı da uyandırmak için odasına gitti."],[24,"Fakat Hakan yatakta yoktu."],[24,"O biraz telaşlandı ve korktu."],[24,"Meltem Hanım odadan çıkıp hazırlamak için mutfağa gitti."],[24,"Hakan’ı kahvaltı masasında gördu."],[24,"Bu, onun için gerçekten güzel bir sürprizdi."],[24,"Biraz sonra Hakan’ın babası ve ablası mutfağa geldiler."],[24,"Onlar da çok şaşırdılar ve sevindiler."],[24,"Bütün aile güzel ve neşili bir kahvaltı yaptılar."],[24,"Hakan hepsiden daha mutluydu."],[25,"Cengiz ile Metin liseden arkadaştırlar."],[25,"Cengiz liseyi bitirdikten sonra üniversiteyi kazanamamış ve turizm işine başlamıştır."],[25,"Buna çok sevinen Cengiz hemen hazırlıklara başlar."],[25,"En iyi odayı arkadaşı Metin’e ayırır, odayı çiçeklerle süsler."],[25,"Cengiz, Metin’in geleceği gün onu karşılamak için tren istasyonuna gider."],[25,"Tren perona girince sevinçten havaya uçacağını sanır."],[25,"Çünkü, tam karşısında arkadaşı Metin durmaktadır."],[25,"Fakat, otele geldiklerinde Metin eşyalarının bulunduğu valizi trende unuttuğunu anlar."],[25,"Uzun yıllar sonra karşılaşmanın sevinciyle eşyalarını trende unutan Metin telaşlanır."],[25,"Cengiz üzülmemesini bir telefonla valizini otele getirtebileceğini söyler."],[25,"Metin rahatlar ve odasına çıkmak ister."],[25,"Cengiz, Metin’i odasına çıkarıp ona sürpriz yapmak ister."],[25,"Çiçeklerle süslü odaya girince Cengiz çok şaşırır."],[25,"Bütün çiçekler solmuş ve bazıları da tamamen kurumuştur."],[25,"Çünkü, Cengiz de o günün heyacanıyla çicekleri sulamayı unutmuş."],[26,"Birlikte çiçeklere sularken lise günlerini hatırlalarlar."],[26,"Bir hafta boyunca çok güzel günler geçirirler."],[26,"Tren isyasyonunda Cengiz Metin’e valizini bir daha unutmamasını hatırlatır."],[26,"Metin de Cengiz’e çiçekleri sulamayı unutmayasın diye gülerek ayrılırlar."],[26,"Lütfen, soruları okuduğunuz metine göre yanıtlayınız."],[27,"Kediler yalnız yaşamayı seven, özgürce davanan, bağımsız yaratılışı hayvanlardır."],[27,"Evcil hayvanlar gibi sahiplerinin isteklerine her zaman boyun eğmezler."],[27,"Kediler aç kaldıkları zaman miyavlar."],[27,"Daha bunlar gibi pek çok hareketle insanlara istedikleri mesaji verirler."],[27,"Kedilerin minik patileri, tehlike anında âdeta yırtıcı bir aslan pençesine dönüşür."],[27,"Tırnaklarını patilerinin içinde saklarlar."],[27,"Metrelerce yükseklikten düşseler bile her zaman dört ayakları üzerine düşerler."],[27,"Kedilerin gözleri geceleri parıl parıl parlar."],[27,"Karanlıkta büyüyerek yuvarlaklaşan, bu sayede ışığı daha fazla toplayan gözbebeklerine sahiptirler."],[27,"Bu özellikleri aynı zamanda geceleri çok iyi görmelerini de sağlar."],[27,"Bir nesneyi görebilmeleri için azıcık ışık yeterlidir."],[27,"Kediler evdeki zaralı böceklerin, yılanların ve farelerin en büyük düşmanıdır."],[27,"Kediler tavuk, horoz gibi kümes hayvanlarına ilişmezler."],[28,"Anadolu’da düğün çok önemli bir törendir."],[28,"Herkes mutlaka düğün yaparak evlenmek ister."],[28,"Anadolu’nun her bölgesinde düğünler değişik şekillerde yapılır."],[28,"Şimdi Konya ve çevresi düğünlerine bir göz atalım."],[28,"Bu bölgede düğünler Çarşamba ve Cumartesi günleri başlar."],[28,"Bu günlerin dışında kesinlikle hiçbir gün düğün başlamaz."],[28,"Cumartesi günü sabahtan erkek evinin çatısına veya balkonuna bayrak dikilir."],[28,"Öğleyin davul-zurna ekibi düğün evine gelir."],[28,"Düğünler salonlarda değil evlenen erkeğin ve kızın evlerinde olur."],[28,"Erkeğin ailesi davetlilere yemek verir."],[28,"Davetliler yemekleri mutlaka burada yemelidirler."],[28,"Yemekten sonra davul-zurna eşliğinde oyunlar oynanır."],[28,"Akşam yemek için ara verilir."],[28,"Akşam yemeğinden sonra tekrar eğlenmeye başlarlar."],[28,"Daha sonra kız evinde eğlenmeye giderler."],[29,"Pazar günü öğleye kadar herkes dinlenir."],[29,"Öğleyin tekrar tören başlar."],[29,"İkindiye kadar eğlence devam eder."],[29,"Kız evine giderek kızı alırlar ve davul-zurna eşliğinde oynayarak erkek evine gelirler."],[30,"Eğitim, insanı daha iyiye daha güzele, daha doğruya götürmek için yapılır."],[30,"Çocuk eğitimi ise çok önemli ve bilgi gerektiren bir iştir."],[30,"Çocuğun çoğu kez bize yabancı gelen duygu ve düşüncelerini anlamaya çalışmalıyız."],[30,"Çocuk kendine ait orijinal dünyası olan bir varlıktır."],[30,"Çevresinde gördüğü şeyleri, o dünyanın ölçüleriyle değerlendirir."],[30,"Yani, çocuk eğiticilerinin sahip olmaları gereken en önemli iki şey, sabır ve anlayıştır."],[31,"Gürültünün insan sağlığını önemli ölçüde etkilediği de artık herkes tarafından biliniyor."],[31,"Sesin gürültü niteldiği taşıması kişiye gore değişmektedir."],[31,"Gürültü, uyumsuz, istenmeyen, hoşa gitmeyen ses olarak tanımlanabilir."],[31,"Bu yüzden bizim hoşumuza giden bir müzık, başkalarının hoşuna gitmeyebilir ve gürültü sayılabilir."],[31,"Gürültü insanda psikolojik bozukluklar meydana getirir."],[32,"Buzdolabı, radyo, televizyon sesleri zamanına gore bizi çok rahatsız eder."],[32,"Bunlar çok basit örneklerdir ama bizi sonuca götürür."],[32,"Uygarlık ne kadar gelişirse gürültü de o oranda artmaktadır."],[32,"O halde gürültüyle savaşmalıyız."],[32,"Bu basit araçların sesi insanda gerilimlere yol açıyor."],[32,"Böylece mutluluk getiren uygarlık beraberinde mutsuzluğu da getiriyor."],[33,"Aşağıdaki cümlelerin boş bırakılan yerlerini doldurunuz."],[33,"Yasemin’in her gün işi, oturdukları apartmanın bahçesine diktiği çiçekleri sulamaktır."],[33,"Hepsini ayrı ayrı sever, bakımlarına özen gösterına özen gösterirdi."],[33,"Yasemin’e bakıp komşu apartmanlar da çicek yetiştirmeye başladılar."],[33,"Ama hiç biri Yasemin’in çiçekleri gibi canlı ve ölmüyordu."],[35,"Babam bizım apartmanın yöneticisidir."],[35,"Bahçenin düzenlenmesi, temiz tutulması, kaloriferin yaktırıması, hep onun görevi."],[35,"Bu konuda babamın tek yardımcısı kapıcı Rüstem amcadır."],[35,"Rüstem amca, yetenekli bir adamdır."],[35,"Beceremediği hiç bir iş yoktur."],[35,"İlkbahar gelince kazmasını, küreğini alıp gül fidanlarının diplerini temizler."],[35,"Sonbahar rüzgarları esmeye başlayınca Rüstem amcanın görevi değişir."],[35,"Eski tulumlarını sırtına geçirip, kalorifer kazanının bakımını yapar."],[35,"Yanmaya hazır hale getirir."],[35,"Elektrik işlerinden de anlar."],[35,"Kimin sigortası atsa, ütüsü, fırını bozulsa, hemen Rüstem amcaya koşar."],[35,"Aynı gün bizim mahallenin pazarıydı."],[35,"Apartmandaki hanımlar, ellerinde pazar çantalarıyla merdivenleri kan ter içinde çıktılar."],[35,"Rüstem amca durumu görünce çok üzüldü."],[35,"Çekicini ve tornavidasını alıp asansöre koştu."],[35,"Yarım saat içinde onu da çalışır hale getirdi."],[35,"Daha sonra apartmanda uymamamız gereken kuralları bir kağıda yadı."],[35,"Rüstem amca da bu işi sıkı takip ediyor."],[36,"Gazeteler bugünkü uygar dünyamızda önemli yeri olan yayın organlarıdır."],[36,"Osmanlılar zamanında yayınlanan ilk gazetenin ismi Takvimi Vekayı’dır."],[36,"Gazeteler, günlük, haftalık olabileceği gibi aylık olarak da çıkabilir."],[36,"Gazetelerde halkın anlayabileceği bir dil kullanılır."],[37,"Böylece sabahın erken saatlerinde gazeteler elimize geçer."],[37,"Gazete okuyan insanlar sadece kendi memleketlerindeki olaylardan değil, tüm dünyadaki olaylardan haberdar olurlar."],[37,"Aşadaki doğru cevaplari işaretleyin."],[38,"Sanırım on üç yaşındaydım."],[38,"İstanbul’da okuyan bir Antepli..."],[38,"Güz gelince İstanbul’a göçüyor, şubata kadar orada kalıyordum."],[38,"Tatil başladığı gün, ver elini Haydarpaşa!"],[38,"İki gün iki gece sonra Narlı."],[38,"Tatil bitince yaza kadar yine İstanbul."],[38,"Yarıyıl utilimin son gecesiydi."],[38,"Ertesi akşam trenle İstanbul’a dönecektim."],[38,"O cumartesi gecesi, annemle babam sinemaya götürdüler beni."],[38,"Hangi sinema olacak, Nakıp Alinin sinemasına."],[38,"Filmi hatırlamıyorum, ama bütün filmler gibi keyifle seyrettim."],[38,"Onu kaçıracaktım, öyle de görmek istediğim bir filmdi ki....."],[38,"Sinamadan çıkarken Nakıp Ali gördü bizi."],[38,"Ama ertesi sabah erkenden evin kapısı çalındı."],[38,"Koşa koşa sinemaya gittim."],[38,"Nakıp Ali gişenin önünde bir iskemle atmış, beni bekliyor."],[39,"Türkive’de son yillarda spor, insan yaşamında önemli yer almaktadır."],[39,"Türkiye’de her dalda spor yapılır."],[40,"Kendi öz sporumuz olan güreşten sonra Türkiye’de en çok sevilen spor futboldur."],[40,"Türkiye’nin her şehrinde futbol sahası ve kapalı spor salonu bulunur."],[40,"Gençler en çok futbolu severler."],[40,"Çünkü futbol maçları çok heyecanlı oluyor."],[40,"Beşiktaş, Fenerbahçe, Galatasaray arasında çekişmeli bir şampiyonluk mücaadelesi yapılır."],[41,"Yaz sonunda ya da sonbahar başında yapraklar sararmaya ve dökülmeye başlar."],[41,"Fakat, çam ve manolya gibi bazı ağaçlar her zaman yemyeşildirler."],[41,"Sonbaharda bol bol yağmur yağar."],[41,"Manavlarda her çeşit meyve ve sebze görülmeye başlar."],[41,"Bu mevsimde bağbozumu yapılır."],[41,"Yani, bağlardan, bahçelerden üzümler kesilerek sepetlere doldurulur."],[41,"Kara üzümü seven birçok insan vardır."],[41,"Bazıları da şıraya yani üzümün suyuna bayılır."],[41,"Ayrıca, üzümden şarap, rakı gibi alkollü içkiler de yapılır."],[41,"Sonbahar kıştan sıcak, yazdan soğuktur."],[41,"Sonbahar sonuna doğru kalın elbiseler, kazaklar giyilmeye başlanır."],[41,"Şehirlerde tatile yazlığa gidenler yavaş yavaş evlerine dönerler."],[41,"Artık, okullar da açılmıştır."],[41,"Köylüler için sonbahar bir çalışma mevsimidir."],[41,"Tarlalarını sürüp buğday ve arpa ekerler."],[41,"Kışlık odunlarını ormanlardan toplayıp evlerine getirirler."],[42,"Origami bir kağıdı katlayarak, kesme, yapıştırma vb."],[42,"Origamide bütün şekiller daima kağıt bir kareden çıkar."],[42,"Gerisi hazır modelleri yapmanıza ve hayal gücünüze bağlıdır."],[42,"Origami sadece kağıt sanatı mıdır?"],[42,"Yoksa metal ve benzeri diğer maddeleri de içine alır mı?"],[43,"Origami kelimesinin kökü Japonca’ya dayanır."],[43,"Japon’lar tarafından kullanılan origami kelimesi, bizim şimdi anladığımız origami kelimesinden farklı anlamda kullanılıyordu."],[43,"Onlar kağıt bükmek anlamında origami kelimesini kullanmak yerine, kağıt sertifikalara origami diyorlardı."],[44,"Günümüz insanının yaşamdan pek çok beklentisi var."],[44,"Ancak hepimizin tek bir ortak beklentisi var sanırım, mutlu olmak."],[44,"Peki, mutlu olabilmemiz için fiziksel ve ruhsal yönden sağlıklı olmamız gerekmez mi?"],[45,"Çoğumuz için ağrısız sızısız hareket edebilmek sağlıklı olmanın bir göstergesidir."],[45,"Bazılarımıza göre ise sağlıklı olmanın gece yarılarına kadar dans edebilecek güce sahip olmaktır."],[45,"Ancak daha önemlisi o insan streslerinden, günlük yorgunluklarından kurtulabilmiş, yaşamdan mutluluk duymayı öğrenmiştir."],[45,"Çünkü bedenimizin en önemli gereksinimlerinden biri de harekettir."],[45,"Ancak bügun teknolojik araçlarla dolu hayatımızda yeterince hareket etmek neredeyse imkansızdır."],[45,"Yürüyen merdivenler, asansörler, arabalar..."],[45,"Kabul etmeliyiz ki spor yapmak hepimiz için kaçınılmaz bir gereklilik artık."],[45,"Yalnız, şunu da unutmamak gerekir ki ancak düzenli egzersizler sağlığımızı olumlu etkileyebilir."],[45,"Bu nedenle sporu günlük hayatımızın merkezine taşımamız gerekir."],[46,"Kelimeleri kendi dilinizde çeviriniz ve tanımını yapınız."],[46,"Sigaranın içinde bulunan maddelerin çoğu kanser yapan maddelerdir."],[46,"Sigara sadece içen kişiye değil, yanında sigara içilen kişilere de zarar vermektedir."],[46,"Sigara içen annelerin doğurduğu çocuklarda zeka düşüklüğü ve zor öğrenme gibi hastalıklar görülmektedir."],[47,"Sigara karşıtı çalışmaların basın, yayın, televızyon, radio gibi araçların yardımıyla insanlara iletmesi gerekir."],[48,"Shrek çirkin görünümlü bir canavardır."],[48,"Ancak bu durum Shrek’in canını hiç sıkmaz."],[48,"Kendisine göveni tam olduğu için korkutucu dış görünümüne hiç aldırmaz."],[48,"Bu durumdan fazlasıyla raharsız olan Shrek, kahramanları bataklığından çıkarmak için harekete geçer."],[48,"Prenses Fiona’yı ağzından ateşler saçan ejderhanın elinden kurtarmak kolay olmayacaktır."],[48,"Ancak prensesin anlattıkları bu görevin henüz tamamlanmadığını göstermektedir."],[48,"Yol boyunca onları birçok sürpriz beklemektedir."],[48,"Asıl problem, güzel prensesin esrarengiz sırlarının ortaya çıkmasıyla başlayacaktır..."],[49,"Türkiye’nin motor sektörlerinden biri tekstil sektörüdür."],[49,"Moda tasarım sektörü bu bağlamda oldukça yenidir ve hızlı bir gelişim ivmesi sergilemektedir."],[50,"Moda tasarım sektörü İstanbul odaklı gelişmektedir."],[50,"Güneş, pırıl pırıl altın ışıklarını yer yüzüne yolluyordu."],[51,"Çok büyük ve tül gibi ince bembeyaz kanatları vardı."],[51,"Birden kendini bir bahçenin çiçekleri arasında buldu."],[51,"Önce keşif uçuşuna çıkıp bahçeyi dolaştı."],[51,"Sonra dinlenmek için kırmızı bir güle kondu."],[51,"Dinlenirken, kanatlarını dikleştirip birleştirmişti."],[51,"Doyasıya yeşilliğe daldı saatlerce seyretti."],[51,"Şimdi dolaşma vaktiydi, yaşamalıydı, önünde uzun zamanı vardı."],[51,"Akşama kadar çiçekten çiçeğe, daldan dala uçup durdu."],[51,"Güneş batarken bir garip his kapladı içini, artık öğrenmişti."],[51,"Sadece bir günlük olan ömrü bitmişti."],[51,"Son bir kez etrafına baktı."],[51,"Ve bir daha hiç uyanmadı."],[52,"Aşağıdaki cümlelerdeki boşlukları tamamlayınız."],[52,"Bu kelimenin gerçek anlamını biliyor muyuz, ya da düşündük mü?"],[52,"Sevgi üzerine herkes kendince bir fikir yürütür."],[52,"Aslında sevgi, duyguların en iyisi ve en güzelidir."],[52,"Güzel olduğu kadar da özveri gerektirir."],[52,"Canlıların en gelişmişi, en akıllısı bile bu özveriye muhtaçtır."],[52,"Çünkü insanı sevgi kadar yücelten ve sevgi kadar mutlu eden unsur daha yoktur."],[52,"Sevgiden yoksun büyüyen bir kişinin nerede, ne zaman ne yapacağını kims m, çocuğun bu sorusunua cevap veremedi."],[135,"Hemen arabayı geri çevirdi."],[135,"Baba ile oğul birbirine sarılarak çocuk gibi ağladılar."],[135,"Genç adam, hatasını anlamıştı."],[135,"Ben babamı dağ başında bırakmadım ki, sen de beni bırakasın..."],[136,"Türkiye’de farklı iklim bölgeleri vardır."],[136,"Aynı zaman dilimi içinde Türkiye’nin güney batısında yaz, doğusunda kış hüküm sürer."],[136,"Aynı mevsimde Antalya’da insanlar denize girer, Erzurum’da kayak yapar."],[136,"Erzurum bir kış memleketidir."],[136,"Türkiye’deki şehirler içinde rakımı en yüksek ildir."],[136,"Erzurum’da, kışın pek çok zorluğuna karşılık eğlenceli yanları vardır."],[136,"Özellikle güneş doğunca sanki bütün yıldızlar karın üstüne iner."],[136,"Kar tanelerinin parıltıları gözleri kamaştırır."],[136,"Erzurumlular, kışın, altı ay boyunca başka bir hayat yaşarlar."],[136,"Bu yörenin insanı çayı çok sever."],[136,"Çocuklar sabahları çaydanlığın sesiyle uyanırlar."],[136,"Kahvaltıdan hemen önce pencereye koşarlar ve dışarıyı seyrederler."],[136,"Çocuklar için kış, bambaşka bir anlam ifade eder."],[136,"Kahvaltıdan sonra da kalın kışlık elbiselerini giyer ve kızaklarıyla dışarıya çıkarlar."],[136,"Hep birlikte dağın dik yamaçlarından aşağı doğru kayarlar."],[136,"Bazıları kartopu oynar, bazıları ise kardan adam yapar."],[136,"Bu oyunlar sabahtan akşama kadar devam eder."],[136,"Çocuklar bazen öğle yemeğini bile unurlar."],[136,"Akşama doğru artık çocuklar üşümüş ve yorgun bir halde eve dönerler."],[136,"Erzurum’un kış günlerinde, yetişkinler iş yerlerine giderler."],[137,"Yaşlılar da genellikle köy odaları ve kahvehanelerde zaman geçirirler."],[137,"Kahvehanelerde halk tiyatrosu sahnelenir."],[137,"Aşıklar saz çalar ve şiir okurlar."],[137,"Erzurum’da çay kışın en gözde içeceğidir."],[137,"Çünkü sıcaklığıyla, insanların sohbetlerini ve içini ısıtır."],[137,"Erzurumlular çaya şeker koymazlar."],[137,"Onlar sert şekerleri dillerin üstüne yerleştirirler."],[137,"Bu şekerle üç dört bardak demli çay içebilirler."],[137,"Sert şeker hem ağızda hem de çayda kolay erimez."],[137,"Çayin kokusu ve buğusu arasında sohbetler sürer gider."],[137,"Arkadaşlık ve komşuluk işikileri Erzurumlular için önemlidir."],[137,"Bu ilişkilere çok değer verirler."],[137,"Erzurum, Palandöken dağının eteğinde kurulmuştur."],[137,"Aynı zamanda Palandöken dağı, kış sporları merkezidir."],[137,"Kışın yerli ve yabancı turistler buraya büyük ilgi gösterirler."],[137,"Bu dağın gururlu ve dumanlı başı yıldızlarla konuşur."],[137,"İnsanlar yıldızlara orada daha yakındır."],[137,"Erzurum, her mevsimde bir başka güzeldir."],[137,"Yazın rengârenk çiçeklerle süslü, kışın başı dumanlarla kaplıdır."],[137,"Orada kendinizi sonsuz beyazlığın ortasında bulursunuz."],[137,"Kış sporları Erzurum’da gelişmiştir."],[137,"Her yıl kış sporları ile ilgili yarışmalar yapılır."],[137,"Erzurumlular için kış, bolluk, bereket ve verim aylarıdır."],[137,"Erzurum’un folkloru da zengindir."],[137,"Halk hayatı ve evlenme, sünnet, ziyaret, bayram gibi gelenekleri çok renklidir."],[138,"Şişmanlık, sadece çağımızda gündeme gelmiş bir konu değildir."],[138,"Sokrates’in de inceliğini korumak için her sabah düzenli olarak dans ettiği söylenir."],[138,"Estetik bir sorun mu yoksa ciddi bir hastalık olarak mı değerlendirilmelidir?"],[138,"Çok sayıda araştırmacı, şişman insanların birçok hastalık yüzünden büyük risk altında olduğunu göstermiştir."],[138,"Şişman insanların bir çoğunda yeme davranışında bir bozukluk söz konusu."],[138,"Bunun sonucu olarak harcadıklarından çok daha fazla miktarda kalori alırlar."],[138,"Yalnız bu, şişmanların en fazla yiyen kişiler olduğu anlamına gelmemektedir."],[138,"Obur kişilerde, besinleri tanıma ve besin uyaranlarına tepki vermede abartılmış bir cevap vardır."],[138,"Yine bu kişiler, daha çok şekeri düşük, yağ oranı yüksek yiyecekleri tercih ederler."],[138,"Şişmanlık, tedavisi çok zor olan bir hastalıktır."],[139,"Hekimin sorumluluğu ise, mümkün olduğunca hastayı desteklemesi ve hastaya yardımcı olmasıdır."],[139,"Şişman kişiler iradelerini kontrol altına almalıdırlar."],[141,"İnsanlar, yaşlandıktan ve kendilerini işe yaramaz hissettikleri zaman çocuk gibi olurlar."],[141,"Birisi bir şey söyleyince hemen üzerlerine alınıp çeşitli tavırlar takınırlar."],[141,"Ya kızıp kimseyle konuşmazlar ya da iğneli iğneli konuşmaya başlarlar."],[142,"Elbet te bu, karşılıklı tutum ve davranışlara bağlıdır."],[142,"Bu yüzden de, zaman zaman aile büyükleri ile gençler arasında çatışmalar yaşanmaktadır."],[142,"Yetişkinleri de bu durumda payları olduğunu bildikleri için gecikmiş bir pişmanlık duyarlar."],[142,"İnsanlar genellikle bir şeye kızınca tepkilerini de en sert biçimde gösteriyorlar."],[142,"Belki de zamanımızın en önemli sorunlanndan biri de budur."],[142,"İnsanların kızdıkları sırada sağlıklı düşünebilmeleri oldukça zordur."],[143,"Reklamın en açık amacı tüketiciye ürün ile ilgili bilgi vermektir."],[143,"İkinci bir amacı ise ürünü satmaktır."],[143,"Üretici için herhalde ikinci amaç, birinci amaçtan önde geliyor olsa gerek."],[143,"Üreticiler tüketicilere ürünleriyle ilgili bilgi vermenin ötesine giderler."],[143,"Reklamlar yüzünden tüketici, ihtiyacı olmayan şeyleri almak ister."],[143,"İşte bu yüzden, her hangi bir şey aldıktan sonra tüketici alma nedenini açıklayamaz."],[143,"Tüketici niye aldığını bilmiyorsa da üretici bilmekte..."],[143,"Müşterinin bir ürün alırken kullandığı mantıksal ve duygusal motivasyonu vardır."],[143,"Bir çok ürünün niçin kasanın etrafında olduğunu hiç düşündünüz mü?"],[143,"Marketlerin bunu yaparken bazı iyi sebepleri var..."],[143,"Şu ana kadar mantıksal motivasyonu kullanmıştır."],[144,"Firmalar, kasalara yakın olan rafları kapmak için büyük çaba sarfederler."],[144,"Atrıca onlar için rafların alt veya en üst kısmında yer almak da dezavantajdır."],[144,"Çünkü müşteri tarafından rahat görülemezler."],[144,"Tabii ki alışverişin birinci amacı ihtiyaçları karşılamaktır."],[144,"Bunlar ne gerekli ne de faydalıdır."],[144,"Alışveriş yaparken verilen kararların ardındaki sebepleri bilmek bizi daha bilinçli bir tüketici yapacaktır."],[144,"Mantıklı ve bilinçli müşteri de daha az para harcayacaktır."],[144,"Lütfen doğru seçeneği işaretleyiniz."],[145,"Lütfen aşağıdaki boşlukları doldurunuz."],[145,"Duygusal motivasyon nedeniyle yapılan bu alışverişte müşteri zaten ..............."],[145,"Veya dün akşam ...................."],[145,"Türkiye komşularıyla kültürel işbirliğini ağırlıklı olarak ikili kültürel anlaşmalar yoluyla yürütmektedir."],[145,"Bu anlaşmalrının yanı sıra çok taraflı anlaşmalar da mevcuttur."],[145,"Türkiye’nin komşusu Ermenistan’la arasındaki sınır kapısı kapalıdır."],[145,"Bu ülkeye giriş ve çıkışlar sınır kapılarından yapılamamaktadır."],[145,"Ermenistan ve Türkiye arasındaki eğitim ve kültür alanındaki yegane resmi belgeleridir."],[145,"Türkiye sınır komşularıyla kültürel işbirliğini çok taraflı anlaşmalarla da desteklemektedir."],[145,"Her düzeydeki diplomatik temsilcilikler, kültür ve turizm ataşelikleri, ikili ilişkilerin kurulmasında önemli aktörlerdir."],[145,"Kültürel işbirliği farklı disiplinlerde çeşitli etkinliklerden oluşmaktadır."],[145,"Kültür ve Turizm Bakanlığı kültürel ilişkilerin geliştirilmesinde destekleyici rol üstlenmektedir."],[146,"Aşağıdaki test sorularına cevap veriniz."],[146,"Babasının işi nedeniyle çocuğun orta öğretimi kesintilere uğramıştı."],[146,"Hayalini en ince ayrıntılarıyla anlattı."],[146,"Binaların, ahırların ve koşu yollarının yerlerini gösterdi."],[146,"İki gün sonra ödevi geri aldı."],[147,"Gezginci bir aileden geliyorsun."],[147,"At çiftliği kurmak büyük para gerektirir."],[147,"Önce araziyi satın alman lazım."],[147,"Damızlık hayvanlar da alman gerekiyor."],[147,"Çocuk evine döndü ve uzun uzun düşündü."],[147,"Yıllar önce yazdığı ödev şöminenin üzerinde çerçevelenmiş olarak asılı."],[147,"Ben senin öğretmeninken, hayal hırsızıydım."],[147,"O yıllarda öğrencilerimden pek çok hayal çaldım."],[148,"Aşağıdaki kelimelerle anlamları eşleştiriniz."],[149,"Buna göre, insanların ve üzerinde duralım."],[149,"Bilim yalnızca gerçeği arar ve ona değer verir."],[149,"Gerçek dışı şeylerin bilimde yeri yoktur."],[149,"O halde,bilim kendine kılavuz yapan insan ve toplumlar gerçeğin yolunda ilerlerler."],[149,"Bu yol doğrunun, doğruluğun yoludur."],[149,"Doğruluğun olduğu yerde de iyilik ve güzellik vardır."],[149,"Böyle olunca da uygarlık yarışında güvenli adımlarla ilerler."],[149,"Her yeni gün bir ilerleme, bir gelişme ve bir kalkınma günü olur."],[149,"Çünkğ bu yolda tutuculuk yoktur, geri kalma yoktur."],[149,"Akıl, yeteneklerini gerektiği gibi kullanabilir."],[149,"İnsan bilgisizlikten, bilgisizliğin karanlığından kurtulur."],[149,"Yaşadığı hayatı daha iyi yaşamanın yollarını bulur."],[149,"Ama bunlar bilim olmadığı gibi bilimin ortaya koyduğu gerçeği de hiçbir zaman değiştiremezler."],[149,"Bilim, ancak doğrunun ve gerçeğin ortamında oluşur."],[149,"Ancak onunla iyiye ve güzele gidilebilir."],[149,"Böyle olduğu için, bilim, insana hoşgörü kazandırır."],[149,"Katı ve kalıplaşmış düşünceli, ön fikirli olmayan insanlar yetişirme ortamını oluşturur."],[149,"Bilimin verileri ile iyi insan, iyi vatandaş yetişirme imkanları elde edilebilir."],[150,"İnsanın kendi dilini sevmesi, ona şuurlu bir saygı duyması milli bir borçtur."],[150,"Milli dil, kullanılan dildir."],[150,"Kullanılan canlı kelimeler üzerine titremek gerekir."],[150,"Kullanıla gelen canlı dil ve kelimeler, insanın kendisini kardeşleriyle birleştirici milli kültürdür."],[150,"İnsanın kendi dili, onun dünyada sahip olduğu en mukaddes varlığıdır."],[150,"Onu sevmeli, ona saygı duymalıdır."],[150,"İnsanın kendi dili, anasının, babasının, sevdiklerinin, edebiyatının, gelmiş ve geçmişiyle bütün milletinin dilidir."],[150,"İnsanın dili, destanlarının, hikayelerinin, masallarının, deyimlerinin dilidir."],[151,"Milli dil memleket ölçüsünde kullanılan dildir."],[151,"Dilde milliliğin ölçüsü, kullanılışıdır."],[151,"Milli dil menşe değil, mevcut durum, yani kulla const G = [
  { id: 'alifbo', t: 'Turk alifbosi va talaffuz', intro: 'Turk alifbosi lotin yozuviga asoslangan va 29 harfdan iborat: 8 unli, 21 undosh. Har bir harf doim bir xil o‘qiladi — qanday yozilsa, shunday o‘qiladi.', rules: ['Q, W, X harflari yo‘q (faqat chet so‘zlarda uchraydi).', 'C — «j» kabi o‘qiladi: cami [jami] — masjid.', 'Ç — «ch»: çay [chay] — choy.', 'Ş — «sh»: şeker [sheker] — shakar.', 'Ğ (yumshoq g) — o‘zi o‘qilmaydi, oldingi unlini cho‘zadi: dağ [da:] — tog‘.', 'I (nuqtasiz ı) — o‘zbekcha «i» dan qattiqroq, [ɯ]: ılık, kırmızı.', 'İ (nuqtali) — oddiy «i»: iyi, İstanbul. Katta harfda ham nuqta saqlanadi: İ.', 'Ö — o‘zbekcha «o‘» ga yaqin: göz [go‘z].', 'Ü — tilni oldinga qilib aytiladigan «u» [y]: gün, süt.', 'J — «j» (fransuzcha) faqat o‘zlashmalarda: jale, garaj.'], table: { h: ['Harf', 'O‘qilishi', 'Misol', 'Tarjima'], r: [['C c', 'j', 'cami', 'masjid'], ['Ç ç', 'ch', 'çocuk', 'bola'], ['Ğ ğ', 'cho‘ziq unli', 'dağ', 'tog‘'], ['I ı', 'ɯ (qattiq i)', 'kız', 'qiz'], ['İ i', 'i', 'iyi', 'yaxshi'], ['Ö ö', 'o‘', 'göz', 'ko‘z'], ['Ş ş', 'sh', 'şehir', 'shahar'], ['Ü ü', 'ü [y]', 'gün', 'kun'], ['Y y', 'y', 'yol', 'yo‘l'], ['V v', 'v', 've', 'va']] }, ex: [['Merhaba, nasılsın?', 'Salom, qalaysan?'], ['Çocuk çay içiyor.', 'Bola choy ichyapti.'], ['Dağda kar var.', 'Tog‘da qor bor.'], ['Şehir çok güzel.', 'Shahar juda chiroyli.']], exc: ['Chet so‘zlarda «â, î, û» (uzun unli) uchraydi: kâr (foyda) ≠ kar (qor).', 'İ / ı farqi ma’noni o‘zgartiradi: kır (dala) ≠ kir (kir, iflos).'], err: ['«c» ni «s» yoki «ts» deb o‘qish (cami — «jami» o‘qiladi).', 'ı va i ni adashtirish: «kız» o‘rniga «kiz» yozish.', 'Ğ ni «g‘» deb kuchli aytish — aslida u deyarli eshitilmaydi.'], drill: [['«ch» tovushi qaysi harf bilan yoziladi?', 'ç', ''], ['«sh» tovushi qaysi harf?', 'ş', ''], ['«j» kabi o‘qiladigan harf (cami so‘zida)', 'c', ''], ['Turk alifbosida nechta harf bor?', '29', ''], ['Nechta unli harf bor?', '8', '']], gen: 'alifbo' },
  { id: 'unli-undosh', t: 'Unli va undosh harflar', intro: 'Turk tilida 8 unli va 21 undosh bor. Unlilar qo‘shimcha tanlashning asosi bo‘lgani uchun ularning guruhlarini bilish shart.', rules: ['Unlilar: a, e, ı, i, o, ö, u, ü.', 'Yo‘g‘on (orqa qator) unlilar: a, ı, o, u. Ingichka (old qator): e, i, ö, ü.', 'Lablangan unlilar: o, ö, u, ü. Lablanmagan: a, e, ı, i.', 'Keng unlilar: a, e, o, ö. Tor unlilar: ı, i, u, ü.', 'Jarangsiz (qattiq) undoshlar: f, s, t, k, ç, ş, h, p — eslab qolish uchun: «FıSTıKÇı ŞaHaP».', 'Jarangli undoshlar: b, c, d, g, ğ, j, l, m, n, r, v, y, z.'], table: { h: ['Guruh', 'Harflar'], r: [['Yo‘g‘on unli', 'a ı o u'], ['Ingichka unli', 'e i ö ü'], ['Lablangan', 'o ö u ü'], ['Lablanmagan', 'a e ı i'], ['Qattiq undosh', 'f s t k ç ş h p'], ['Jarangli juftlar', 'p→b, ç→c, t→d, k→ğ/g']] }, ex: [['kitap → kitaptan', 'p qattiq → -tan'], ['ev → evden', 'v jarangli → -den'], ['okul → okulu', 'u — yo‘g‘on, lablangan'], ['göz → gözü', 'ö — ingichka, lablangan']], exc: ['«e» va «a» keng unlilar, lekin uyg‘unlikda alohida qatorlarga kiradi.'], err: ['«h» ni jarangli deb o‘ylash — u qattiq undosh: «Türkiye’de» emas, «sabahtan».'], drill: [['«FıSTıKÇı ŞaHaP» — qaysi undoshlarni eslatadi?', 'qattiq', 'f s t k ç ş h p'], ['«ö» yo‘g‘onmi yoki ingichka?', 'ingichka', ''], ['«ı» lablanganmi?', 'yo‘q', ''], ['«p» ning jarangli jufti', 'b', '']], gen: 'harf' },
  { id: 'uygunlik', t: 'Unli tovushlar uyg‘unligi (Ünlü uyumu)', intro: 'Turk tilida qo‘shimcha unlisi so‘zning OXIRGI unlisiga moslashadi. Bu qoida deyarli barcha qo‘shimchalarga taalluqli — uni bilmasdan to‘g‘ri gapirib bo‘lmaydi.', rules: ['Ikki xil (2-li) uyg‘unlik — qo‘shimchada a/e: oxirgi unli a, ı, o, u → a; e, i, ö, ü → e. Masalan: -lar/-ler, -da/-de, -a/-e.', 'To‘rt xil (4-li) uyg‘unlik — qo‘shimchada ı/i/u/ü: a, ı → ı; e, i → i; o, u → u; ö, ü → ü. Masalan: -ı/-i/-u/-ü, -mı/-mi/-mu/-mü.', 'Faqat OXIRGI unliga qaraladi: öğretmen → öğretmenler (e), kalem → kalemi.', 'Ba’zi qo‘shimchalar o‘zgarmaydi: -yor, -ken, -ki, -leyin, -gil.'], table: { h: ['Oxirgi unli', '2-li (a/e)', '4-li (ı/i/u/ü)', 'Misol'], r: [['a', 'a', 'ı', 'kitap-lar, kitab-ı'], ['ı', 'a', 'ı', 'kız-lar, kız-ı'], ['o', 'a', 'u', 'okul-lar, okul-u'], ['u', 'a', 'u', 'kuş-lar, kuş-u'], ['e', 'e', 'i', 'ev-ler, ev-i'], ['i', 'e', 'i', 'şehir-ler, şehr-i'], ['ö', 'e', 'ü', 'göz-ler, göz-ü'], ['ü', 'e', 'ü', 'gün-ler, gün-ü']] }, ex: [['Kızlar okulda.', 'Qizlar maktabda.'], ['Gözlerin çok güzel.', 'Ko‘zlaring juda chiroyli.'], ['Evde misin?', 'Uydamisan?'], ['Bu kitap mı?', 'Bu kitobmi?']], exc: ['O‘zlashma so‘zlar: saat → saati, kalp → kalbi, otel → oteli, harf → harfi (yo‘g‘on unli bo‘lsa ham ingichka qo‘shimcha).', '-yor qo‘shimchasi doim -yor: geliyor, okuyor.'], err: ['Birinchi unliga qarab tanlash: «otobüsta» ✗ → «otobüste» ✓ (oxirgi unli ü).', '4-li uyg‘unlikda lablanganlikni unutish: «okulı» ✗ → «okulu» ✓.'], drill: [['ev + ler/lar = ?', 'evler', ''], ['okul + ı/i/u/ü (tushum) = ?', 'okulu', ''], ['göz + da/de = ?', 'gözde', ''], ['kız + mı/mi/mu/mü = ?', 'kız mı', ''], ['araba + lar/ler = ?', 'arabalar', '']], gen: 'uyg' },
  { id: 'katta-kichik', t: 'Katta va kichik unli uyg‘unligi', intro: '«Büyük ünlü uyumu» (katta uyg‘unlik) — so‘zdagi unlilar bir qatorda (yo‘g‘on yoki ingichka) bo‘lishi; «küçük ünlü uyumu» (kichik uyg‘unlik) — lablanmagan unlidan keyin lablanmagan, lablangandan keyin tor-lablangan yoki keng-lablanmagan unli kelishi.', rules: ['Katta uyg‘unlik: turkiy so‘zlarda unlilar yo‘g‘on yoki ingichka bo‘ladi: kapı, oda (yo‘g‘on); gece, köprü (ingichka).', 'Katta uyg‘unlikka bo‘ysunmaydigan so‘zlar ko‘pincha o‘zlashma: kitap, kalem, otobüs, televizyon, anne, elma.', 'Kichik uyg‘unlik: a, e, ı, i (lablanmagan) dan keyin faqat a, e, ı, i keladi; o, ö, u, ü dan keyin a, e yoki u, ü keladi.', 'Qo‘shimchalar har doim ikkala qoidaga moslashadi: göz-ün, gün-ü, kol-u.', 'Turkiy so‘zning birinchi bo‘g‘inidan keyingi bo‘g‘inlarda o, ö kelmaydi (-yor, -ken bundan mustasno).'], table: { h: ['So‘z', 'Katta uyg‘unlik', 'Kichik uyg‘unlik'], r: [['kapı', '✓ (a-ı)', '✓'], ['gözlük', '✓ (ö-ü)', '✓'], ['kitap', '✗ (i-a)', '—'], ['anne', '✗ (a-e)', '—'], ['otobüs', '✗', '—'], ['uzun', '✓', '✓ (u-u)']] }, ex: [['Kapılar açık.', 'Eshiklar ochiq.'], ['Gözlüğüm nerede?', 'Ko‘zoynagim qayerda?'], ['Kitaplar masada.', 'Kitoblar stolda.']], exc: ['anne, elma, kardeş, hangi, inanmak — turkiy bo‘lsa ham katta uyg‘unlikka bo‘ysunmaydi.'], err: ['So‘zning o‘zi uyg‘unlikka bo‘ysunmasa ham qo‘shimcha OXIRGI unliga qarab olinadi: kitap → kitaplar.'], drill: [['«kapı» katta uyg‘unlikka bo‘ysunadimi?', 'ha', ''], ['«kitap» katta uyg‘unlikka bo‘ysunadimi?', 'yo‘q', ''], ['«anne» turkiy so‘zmi, uyg‘unlikka bo‘ysunadimi?', 'yo‘q', 'istisno']], gen: 'uyg' },
  { id: 'undosh', t: 'Undosh tovush o‘zgarishlari', intro: 'Qo‘shimcha qo‘shilganda so‘z oxiridagi yoki qo‘shimcha boshidagi undosh o‘zgarishi mumkin. Asosiy 3 hodisa: jaranglashish (yumshash), jarangsizlanish (qattiqlashish) va unli tushishi.', rules: ['Jaranglashish (ünsüz yumuşaması): ko‘p bo‘g‘inli so‘z oxiridagi p, ç, t, k unli bilan boshlanuvchi qo‘shimcha oldidan b, c, d, ğ ga aylanadi: kitap → kitabı, ağaç → ağacı, çocuk → çocuğu.', '«nk» → «ng»: renk → rengi, ahenk → ahengi.', 'Jarangsizlanish (ünsüz benzeşmesi): qattiq undosh (f, s, t, k, ç, ş, h, p) dan keyin qo‘shimchadagi c, d, g → ç, t, k: kitap-ta, sokak-tan, iş-çi, git-ti.', 'Bir bo‘g‘inli so‘zlarda ko‘pincha jaranglashish bo‘lmaydi: top → topu, süt → sütü, saç → saçı (lekin: kalp → kalbi, renk → rengi, dört → dördü).', 'Unli tushishi: isim → ismi, ağız → ağzı, şehir → şehri, burun → burnu (unli bilan boshlanuvchi qo‘shimcha oldidan).', 'Ba’zi fe’llarda t → d: gitmek → gidiyor, etmek → ediyor, tatmak → tadıyor.'], table: { h: ['Hodisa', 'Misol', 'Natija'], r: [['p → b', 'kitap + ı', 'kitabı'], ['ç → c', 'ağaç + a', 'ağaca'], ['t → d', 'git + iyor', 'gidiyor'], ['k → ğ', 'ayak + ı', 'ayağı'], ['nk → ng', 'renk + i', 'rengi'], ['d → t', 'kitap + da', 'kitapta'], ['unli tushishi', 'isim + i', 'ismi']] }, ex: [['Çocuğun kitabı nerede?', 'Bolaning kitobi qayerda?'], ['Ağaçta kuş var.', 'Daraxtda qush bor.'], ['Ayağım ağrıyor.', 'Oyog‘im og‘riyapti.'], ['İsmin ne?', 'Isming nima?']], exc: ['Ko‘p o‘zlashmalarda t o‘zgarmaydi: saat → saati, sanat → sanatı, fiyat → fiyatı.', 'Atoqli otlar apostrof bilan yoziladi va yumshamaydi: Mehmet’i, Tokat’a.'], err: ['«kitapı» ✗ → «kitabı» ✓.', '«sokakdan» ✗ → «sokaktan» ✓.', '«isimi» ✗ → «ismi» ✓.'], drill: [['kitap + ı = ?', 'kitabı', ''], ['sokak + dan = ?', 'sokaktan', ''], ['ağız + ı = ?', 'ağzı', ''], ['renk + i = ?', 'rengi', ''], ['git + iyor = ?', 'gidiyor', '']], gen: 'undosh' },
  { id: 'koplik', t: 'Ko‘plik qo‘shimchasi (-lar/-ler)', intro: 'Ko‘plik -lar yoki -ler qo‘shimchasi bilan yasaladi. Tanlov 2-li unli uyg‘unligiga bog‘liq.', rules: ['Oxirgi unli a, ı, o, u → -lar: kitaplar, kızlar, okullar.', 'Oxirgi unli e, i, ö, ü → -ler: evler, şehirler, gözler, günler.', 'Sondan keyin ot birlikda keladi: iki kitap (iki kitaplar ✗), üç öğrenci.', 'Ko‘plik hurmat ma’nosida ham ishlatiladi: Hocam geldiler.', 'Kesimda III shaxs ko‘plik: Onlar geliyorlar (yoki geliyor).'], table: { h: ['Birlik', 'Ko‘plik', 'Tarjima'], r: [['kitap', 'kitaplar', 'kitoblar'], ['ev', 'evler', 'uylar'], ['okul', 'okullar', 'maktablar'], ['göz', 'gözler', 'ko‘zlar'], ['saat', 'saatler', 'soatlar'], ['otel', 'oteller', 'mehmonxonalar']] }, ex: [['Çocuklar bahçede oynuyor.', 'Bolalar bog‘da o‘ynayapti.'], ['Üç kardeşim var.', 'Uchta aka-ukam bor.'], ['Evler çok büyük.', 'Uylar juda katta.']], exc: ['saat → saatler, kalp → kalpler, otel → oteller (o‘zlashma, ingichka).'], err: ['Sondan keyin ko‘plik qo‘shish: «beş öğrenciler» ✗ → «beş öğrenci» ✓.'], drill: [['göz → ko‘plik', 'gözler', ''], ['kitap → ko‘plik', 'kitaplar', ''], ['saat → ko‘plik', 'saatler', 'istisno'], ['«iki elma(lar)» — qaysi to‘g‘ri?', 'iki elma', '']], gen: 'plural' },
  { id: 'egalik', t: 'Egalik qo‘shimchalari', intro: 'Egalik qo‘shimchasi narsa kimga tegishli ekanini bildiradi: kitab-ım (kitobim). Unli bilan tugagan so‘zlarda qo‘shimcha unlisiz keladi.', rules: ['Undoshdan keyin: -ım/-im/-um/-üm, -ın/-in/-un/-ün, -ı/-i/-u/-ü, -ımız, -ınız, -ları/-leri.', 'Unlidan keyin: -m, -n, -sı/-si/-su/-sü, -mız, -nız, -ları/-leri.', 'III shaxsda unlidan keyin bufer «s»: araba-sı, kedi-si.', 'Egalikda ham jaranglashish: kitap → kitabım, çocuk → çocuğum.', 'Qaratqich + egalik (izofa): benim kitabım, Ali’nin evi.', 'III shaxs egalikdan keyin kelishikda bufer «n»: evi-n-de, arabası-n-ı.'], table: { h: ['Shaxs', 'ev (uy)', 'araba (mashina)', 'kitap'], r: [['benim', 'evim', 'arabam', 'kitabım'], ['senin', 'evin', 'araban', 'kitabın'], ['onun', 'evi', 'arabası', 'kitabı'], ['bizim', 'evimiz', 'arabamız', 'kitabımız'], ['sizin', 'eviniz', 'arabanız', 'kitabınız'], ['onların', 'evleri', 'arabaları', 'kitapları']] }, ex: [['Benim adım Ali.', 'Mening ismim Ali.'], ['Onun arabası yeni.', 'Uning mashinasi yangi.'], ['Evimiz okula yakın.', 'Uyimiz maktabga yaqin.']], exc: ['su → suyum, suyun, suyu; ne → neyim.', 'isim → ismim, ağız → ağzım (unli tushishi).'], err: ['«arabaı» ✗ → «arabası» ✓ (unlidan keyin -sı).', '«evide» ✗ → «evinde» ✓ (III shaxsdan keyin n).'], drill: [['ev + (benim) = ?', 'evim', ''], ['araba + (onun) = ?', 'arabası', ''], ['kitap + (benim) = ?', 'kitabım', ''], ['okul + (bizim) = ?', 'okulumuz', ''], ['ev + (onun) + da = ?', 'evinde', '']], gen: 'poss' },
  { id: 'kelishik', t: 'Kelishik qo‘shimchalari', intro: 'Turk tilida 6 kelishik bor: bosh, tushum, yo‘nalish, o‘rin-payt, chiqish va qaratqich. Har birini chuqur o‘rganish uchun «Kelishiklar» bo‘limiga o‘ting — u yerda har bir qo‘shimcha nima uchun tanlanishi bosqichma-bosqich tushuntiriladi.', rules: ['Bosh (Yalın): qo‘shimchasiz — Kitap masada.', 'Tushum (Belirtme): -(y)ı/i/u/ü — aniq to‘ldiruvchi: Kitabı okudum.', 'Yo‘nalish (Yönelme): -(y)a/e — qayerga? kimga?: Okula gidiyorum.', 'O‘rin-payt (Bulunma): -da/de/ta/te — qayerda?: Evdeyim.', 'Chiqish (Ayrılma): -dan/den/tan/ten — qayerdan?: İşten geldim.', 'Qaratqich (İlgi): -(n)ın/in/un/ün — kimning?: Ali’nin kitabı.'], table: { h: ['Kelishik', 'ev', 'okul', 'araba', 'kitap'], r: [['Bosh', 'ev', 'okul', 'araba', 'kitap'], ['Tushum', 'evi', 'okulu', 'arabayı', 'kitabı'], ['Yo‘nalish', 'eve', 'okula', 'arabaya', 'kitaba'], ['O‘rin-payt', 'evde', 'okulda', 'arabada', 'kitapta'], ['Chiqish', 'evden', 'okuldan', 'arabadan', 'kitaptan'], ['Qaratqich', 'evin', 'okulun', 'arabanın', 'kitabın']] }, ex: [['Okuldan eve geldim.', 'Maktabdan uyga keldim.'], ['Kitabı masaya koydum.', 'Kitobni stolga qo‘ydim.'], ['Ali’nin annesi evde.', 'Alining onasi uyda.']], exc: ['Atoqli otlarda apostrof: İstanbul’a, Ankara’da, Ahmet’in.', 'su → suyu, suya, suyun.'], err: ['Noaniq to‘ldiruvchiga tushum qo‘shish: «Bir kitabı aldım» ✗ → «Bir kitap aldım» ✓.'], drill: [['okul + yo‘nalish = ?', 'okula', ''], ['ev + chiqish = ?', 'evden', ''], ['kitap + o‘rin-payt = ?', 'kitapta', ''], ['araba + tushum = ?', 'arabayı', '']], gen: 'case' },
  { id: 'korsatish', t: 'Ko‘rsatish olmoshlari (bu, şu, o)', intro: '«bu» — yaqindagi narsa (bu), «şu» — o‘rtacha uzoqlikdagi yoki ko‘rsatib aytilgan narsa (ana shu), «o» — uzoqdagi narsa (u). Kelishik olganda «n» bufer qo‘shiladi.', rules: ['bu → bunu, buna, burada/bunda, bundan, bunun.', 'şu → şunu, şuna, şurada/şunda, şundan, şunun.', 'o → onu, ona, orada/onda, ondan, onun.', 'Joy bildirganda: burası (bu yer), şurası, orası; burada, şurada, orada.', 'Ko‘plik: bunlar, şunlar, onlar.', 'Otdan oldin keladi va o‘zgarmaydi: bu kitap, bu kitaplar, bu kitabı.'], table: { h: ['Kelishik', 'bu', 'şu', 'o'], r: [['Bosh', 'bu', 'şu', 'o'], ['Tushum', 'bunu', 'şunu', 'onu'], ['Yo‘nalish', 'buna', 'şuna', 'ona'], ['O‘rin-payt', 'bunda', 'şunda', 'onda'], ['Chiqish', 'bundan', 'şundan', 'ondan'], ['Qaratqich', 'bunun', 'şunun', 'onun']] }, ex: [['Bu kitap çok güzel.', 'Bu kitob juda chiroyli.'], ['Şunu bana ver.', 'Anavini menga ber.'], ['Orada kim var?', 'U yerda kim bor?']], exc: ['«burada» (shu yerda) va «bunda» (bunda, bu narsada) farq qiladi.'], err: ['«buyu» ✗ → «bunu» ✓; «oya» ✗ → «ona» ✓.'], drill: [['bu + tushum = ?', 'bunu', ''], ['o + yo‘nalish = ?', 'ona', ''], ['şu + chiqish = ?', 'şundan', '']], gen: 'demo' },
  { id: 'kishilik', t: 'Kishilik olmoshlari', intro: 'ben (men), sen (sen), o (u), biz (biz), siz (siz), onlar (ular). Kelishikda ayrim shakllar notekis: bana, sana.', rules: ['ben → beni, bana (!), bende, benden, benim.', 'sen → seni, sana (!), sende, senden, senin.', 'o → onu, ona, onda, ondan, onun.', 'biz → bizi, bize, bizde, bizden, bizim (!).', 'siz → sizi, size, sizde, sizden, sizin.', 'onlar → onları, onlara, onlarda, onlardan, onların.', 'Olmosh ko‘pincha tushib qoladi, chunki fe’l shaxsni ko‘rsatadi: (Ben) geliyorum.'], table: { h: ['', 'ben', 'sen', 'o', 'biz', 'siz', 'onlar'], r: [['Tushum', 'beni', 'seni', 'onu', 'bizi', 'sizi', 'onları'], ['Yo‘nalish', 'bana', 'sana', 'ona', 'bize', 'size', 'onlara'], ['O‘rin-payt', 'bende', 'sende', 'onda', 'bizde', 'sizde', 'onlarda'], ['Chiqish', 'benden', 'senden', 'ondan', 'bizden', 'sizden', 'onlardan'], ['Qaratqich', 'benim', 'senin', 'onun', 'bizim', 'sizin', 'onların']] }, ex: [['Bana yardım et.', 'Menga yordam ber.'], ['Seni seviyorum.', 'Seni sevaman.'], ['Bizim evimiz küçük.', 'Bizning uyimiz kichik.']], exc: ['«bene», «sene» ✗ → «bana», «sana» ✓.', '«bizin» ✗ → «bizim» ✓.'], err: ['«Bende kitap var» = Menda kitob bor (o‘rin-payt) — «Benim kitabım var» bilan ma’nosi yaqin.'], drill: [['ben + yo‘nalish = ?', 'bana', ''], ['sen + tushum = ?', 'seni', ''], ['biz + qaratqich = ?', 'bizim', '']], gen: 'pron' },
  { id: 'soroq', t: 'So‘roq olmoshlari', intro: 'Savol so‘zlari gap boshida yoki fe’l oldida keladi. So‘roq olmoshi bo‘lgan gapda «mi» yuklamasi ishlatilmaydi.', rules: ['kim? — kim; ne? — nima; nerede? — qayerda; nereye? — qayerga; nereden? — qayerdan.', 'nasıl? — qanday; neden? / niçin? / niye? — nega, nima uchun.', 'ne zaman? — qachon; kaç? — nechta; kaçta? — soat nechada; hangi? — qaysi; ne kadar? — qancha.', 'kimin? — kimning; kime? — kimga; kimi? — kimni; kimden? — kimdan.', 'So‘roq olmoshi bor gapga «mi» qo‘shilmaydi: Nereye gidiyorsun? (Nereye gidiyor musun? ✗)'], table: { h: ['Turkcha', 'O‘zbekcha', 'Misol'], r: [['kim', 'kim', 'Bu kim?'], ['ne', 'nima', 'Bu ne?'], ['nerede', 'qayerda', 'Neredesin?'], ['nereye', 'qayerga', 'Nereye gidiyorsun?'], ['nereden', 'qayerdan', 'Nereden geliyorsun?'], ['ne zaman', 'qachon', 'Ne zaman geleceksin?'], ['nasıl', 'qanday', 'Nasılsın?'], ['neden', 'nega', 'Neden geç kaldın?'], ['kaç', 'nechta', 'Kaç yaşındasın?'], ['hangi', 'qaysi', 'Hangi kitap?'], ['ne kadar', 'qancha', 'Bu ne kadar?']] }, ex: [['Adın ne?', 'Isming nima?'], ['Kaç kardeşin var?', 'Nechta aka-ukang bor?'], ['Saat kaçta başlıyor?', 'Soat nechada boshlanadi?']], exc: ['«Neden» — ham «nega», ham «nimadan» (ne + den) ma’nosida.'], err: ['So‘roq olmoshi bilan «mi» ni birga ishlatish.'], drill: [['«qayerga?» turkchasi', 'nereye', ''], ['«qachon?» turkchasi', 'ne zaman', ''], ['«qaysi?» turkchasi', 'hangi', '']], mcq: [['___ gidiyorsun? — Okula.', ['Nereye', 'Nerede', 'Nereden', 'Ne zaman'], 0, 'Javob «okula» (yo‘nalish) → nereye.'], ['___ geliyorsun? — İşten.', ['Nereden', 'Nereye', 'Nerede', 'Kim'], 0, 'İşten — chiqish → nereden.'], ['___ oturuyorsun? — İstanbul’da.', ['Nerede', 'Nereye', 'Kaç', 'Nasıl'], 0, 'O‘rin → nerede.'], ['___ yaşındasın? — Yirmi.', ['Kaç', 'Ne', 'Hangi', 'Kim'], 0, 'Son → kaç.'], ['___ geldin? — Dün.', ['Ne zaman', 'Nereye', 'Kim', 'Nasıl'], 0, 'Vaqt → ne zaman.'], ['___ geç kaldın? — Otobüs gelmedi.', ['Neden', 'Nerede', 'Kaç', 'Hangi'], 0, 'Sabab → neden.'], ['Bu çanta ___? — Ayşe’nin.', ['kimin', 'kime', 'kimi', 'kimden'], 0, 'Egasi → kimin.'], ['Hediyeyi ___ verdin? — Anneme.', ['kime', 'kimin', 'kimi', 'kimde'], 0, 'Kimga → kime.'], ['___ renk seviyorsun? — Mavi.', ['Hangi', 'Kaç', 'Nasıl', 'Nereye'], 0, 'Tanlov → hangi.'], ['Bu elbise ___? — 200 lira.', ['ne kadar', 'kaçta', 'nerede', 'kim'], 0, 'Narx → ne kadar.'], ['Ders saat ___ başlıyor? — Dokuzda.', ['kaçta', 'kaç', 'nerede', 'ne'], 0, 'Soat nechada → kaçta.'], ['___? — İyiyim, teşekkürler.', ['Nasılsın', 'Neredesin', 'Kimsin', 'Ne zaman'], 0, 'Hol-ahvol → nasılsın.'], ['Sen ___ bekliyorsun? — Arkadaşımı.', ['kimi', 'kime', 'kimin', 'kimden'], 0, 'Kimni → kimi.'], ['Bu mektup ___ geldi? — Babamdan.', ['kimden', 'kime', 'kimi', 'kimde'], 0, 'Kimdan → kimden.'], ['Hangi gapda xato bor?', ['Nereye gidiyor musun?', 'Nereye gidiyorsun?', 'Gidiyor musun?', 'Ne zaman gidiyorsun?'], 0, 'So‘roq olmoshi bilan «mi» ishlatilmaydi.'], ['«Nima uchun?» qaysi biri?', ['niçin', 'nasıl', 'nerede', 'hangi'], 0, 'niçin = nima uchun.'], ['___ okuyorsun? — Bir roman.', ['Ne', 'Kim', 'Nereye', 'Kaç'], 0, 'Nimani → ne.'], ['Kapıda ___ var? — Postacı.', ['kim', 'ne', 'hangi', 'kaç'], 0, 'Shaxs → kim.'], ['___ kardeşin var? — İki.', ['Kaç', 'Hangi', 'Ne', 'Nasıl'], 0, 'Son → kaç.'], ['Evin okula ___ uzak? — Çok değil.', ['ne kadar', 'kaçta', 'kime', 'kim'], 0, 'Miqdor → ne kadar.']] },
  { id: 'sifat', t: 'Sifatlar', intro: 'Sifat otdan oldin keladi va o‘zgarmaydi: güzel bir ev, güzel evler. Qiyosiy daraja «daha», orttirma «en» bilan yasaladi.', rules: ['Sifat otdan oldin: büyük ev, yeni araba.', '«bir» noaniqlik artikli sifatdan keyin: güzel bir gün (bir güzel gün — boshqa ma’no: juda yaxshi).', 'Qiyosiy daraja: daha + sifat; taqqoslanadigan narsa chiqish kelishigida: Ali Ahmet’ten daha uzun.', 'Orttirma: en + sifat: en güzel, en büyük.', 'Kuchaytirish (pekiştirme): bem-beyaz, kap-kara, yem-yeşil, sım-sıcak, mas-mavi.', 'Yasovchi qo‘shimchalar: -lı/-li (tuzlu — sho‘r), -sız/-siz (tuzsuz), -cı/-ci (yalancı), -ca/-ce (güzelce).'], table: { h: ['Oddiy', 'Qiyosiy', 'Orttirma', 'Kuchaytirma'], r: [['güzel', 'daha güzel', 'en güzel', 'güpgüzel'], ['büyük', 'daha büyük', 'en büyük', 'büsbüyük'], ['beyaz', 'daha beyaz', 'en beyaz', 'bembeyaz'], ['sıcak', 'daha sıcak', 'en sıcak', 'sımsıcak'], ['yeşil', 'daha yeşil', 'en yeşil', 'yemyeşil']] }, ex: [['İstanbul Ankara’dan daha büyük.', 'Istanbul Anqaradan kattaroq.'], ['Bu sınıfın en çalışkan öğrencisi Ayşe.', 'Bu sinfning eng tirishqoq o‘quvchisi — Oysha.'], ['Kar bembeyaz.', 'Qor oppoq.']], exc: ['«iyi» qiyosi: daha iyi; «çok» bilan: çok güzel (juda chiroyli).'], err: ['Taqqoslashda «-dan» ni unutish: «Ali Ahmet daha uzun» ✗.'], drill: [['«eng katta» turkchasi', 'en büyük', ''], ['«oppoq» turkchasi', 'bembeyaz', ''], ['tuz + lı = ?', 'tuzlu', '']], gen: 'adj' },
  { id: 'ravish', t: 'Ravishlar', intro: 'Ravish fe’lning qanday, qachon, qayerda, qancha bajarilishini bildiradi. Ko‘p sifatlar ravish vazifasida ham ishlatiladi: güzel konuşuyor.', rules: ['Payt: şimdi (hozir), sonra (keyin), önce (oldin), bugün, yarın, dün, hemen (darhol), artık (endi), henüz (hali).', 'Holat: hızlı, yavaş, iyi, güzelce, sessizce, yavaş yavaş.', 'Miqdor: çok, az, biraz, daha, en, pek, fazla, oldukça.', 'O‘rin: içeri, dışarı, yukarı, aşağı, ileri, geri.', 'Takroriy: bazen (ba’zan), her zaman (doim), asla / hiç (hech qachon), sık sık (tez-tez), genellikle (odatda).', '-ca/-ce qo‘shimchasi: sessizce, güzelce, Türkçe.', '«hiç», «asla» inkor fe’l bilan: Hiç gitmedim.'], table: { h: ['Turkcha', 'O‘zbekcha', 'Misol'], r: [['şimdi', 'hozir', 'Şimdi geliyorum.'], ['hemen', 'darhol', 'Hemen gel!'], ['henüz', 'hali (hali-hanuz)', 'Henüz gelmedi.'], ['artık', 'endi', 'Artık çalışmıyor.'], ['bazen', 'ba’zan', 'Bazen sinemaya gideriz.'], ['sık sık', 'tez-tez', 'Sık sık arar.'], ['yavaş yavaş', 'sekin-asta', 'Yavaş yavaş yürü.']] }, ex: [['Yarın erken kalkacağım.', 'Ertaga erta turaman.'], ['Hiç Türkiye’ye gitmedim.', 'Turkiyaga hech bormaganman.'], ['Çok güzel konuşuyorsun.', 'Juda chiroyli gapirasan.']], exc: ['«hiç» savolda «umuman/biror marta» ma’nosida: Hiç İstanbul’a gittin mi?'], err: ['«asla» ni tasdiq fe’l bilan ishlatish: «Asla gidiyorum» ✗.'], drill: [['«darhol» turkchasi', 'hemen', ''], ['«hali (hali gelmedi)» turkchasi', 'henüz', ''], ['sessiz + ce = ?', 'sessizce', '']], mcq: [['Ali ___ gelmedi, bekliyoruz.', ['henüz', 'artık', 'hemen', 'sık sık'], 0, 'henüz + inkor = hali ... -magan.'], ['Ben ___ sigara içmiyorum. (endi)', ['artık', 'henüz', 'dün', 'hemen'], 0, 'artık = endi.'], ['___ gel, film başlıyor!', ['Hemen', 'Henüz', 'Dün', 'Asla'], 0, 'hemen = darhol.'], ['Ben ___ yalan söylemem.', ['asla', 'bazen', 'hemen', 'sık sık'], 0, 'asla + inkor = hech qachon.'], ['Kardeşim ___ beni arar. (tez-tez)', ['sık sık', 'asla', 'henüz', 'dün'], 0, 'sık sık = tez-tez.'], ['Lütfen ___ konuşun, bebek uyuyor.', ['sessizce', 'hızlıca', 'yüksek', 'çok'], 0, 'sessizce = jimgina.'], ['___ ben de seninle geleceğim. (ertaga)', ['Yarın', 'Dün', 'Geçen', 'Önce'], 0, 'yarın = ertaga.'], ['___ okula gittim. (kecha)', ['Dün', 'Yarın', 'Hemen', 'Artık'], 0, 'dün = kecha.'], ['Hangisi miqdor ravishi?', ['biraz', 'dün', 'içeri', 'hemen'], 0, 'biraz = biroz (miqdor).'], ['Hangisi o‘rin ravishi?', ['yukarı', 'yarın', 'çok', 'sık sık'], 0, 'yukarı = yuqoriga.']], gen: 'adv' },
  { id: 'sonlar', t: 'Sonlar', intro: 'Sanoq sonlar: bir, iki, üç, dört, beş, altı, yedi, sekiz, dokuz, on. O‘nliklar: yirmi, otuz, kırk, elli, altmış, yetmiş, seksen, doksan; yüz (100), bin (1000).', rules: ['Murakkab sonlar ketma-ket aytiladi: 25 — yirmi beş, 347 — üç yüz kırk yedi.', '100 va 1000 oldidan «bir» aytilmaydi: yüz, bin (bir yüz ✗).', 'Tartib son: -(ı)ncı/-(i)nci/-(u)ncu/-(ü)ncü: birinci, ikinci, üçüncü, dördüncü, altıncı.', 'Taqsim son: -(ş)ar/-(ş)er: birer, ikişer, üçer.', 'Kasr: yarım (yarim), çeyrek (chorak), buçuk (yarim — butun bilan: iki buçuk).', 'Sondan keyin ot birlikda: üç kitap.', 'Soat: Saat üç. Saat üç buçuk. Saat dördü çeyrek geçiyor.'], table: { h: ['Son', 'Turkcha', 'Tartib'], r: [['1', 'bir', 'birinci'], ['2', 'iki', 'ikinci'], ['3', 'üç', 'üçüncü'], ['4', 'dört', 'dördüncü'], ['5', 'beş', 'beşinci'], ['6', 'altı', 'altıncı'], ['10', 'on', 'onuncu'], ['20', 'yirmi', 'yirminci'], ['40', 'kırk', 'kırkıncı'], ['100', 'yüz', 'yüzüncü']] }, ex: [['Sınıfta yirmi beş öğrenci var.', 'Sinfda yigirma beshta o‘quvchi bor.'], ['Saat iki buçuk.', 'Soat ikki yarim.'], ['Birinci kattayım.', 'Birinchi qavatdaman.']], exc: ['dört → dördüncü (t → d).'], err: ['«bir yüz» ✗ → «yüz» ✓.', '«iki kitaplar» ✗ → «iki kitap» ✓.'], drill: [['15 = ?', 'on beş', ''], ['40 = ?', 'kırk', ''], ['«uchinchi» = ?', 'üçüncü', ''], ['1000 = ?', 'bin', '']], gen: 'num' },
  { id: 'boglovchi', t: 'Bog‘lovchilar', intro: 'Bog‘lovchilar so‘z va gaplarni bog‘laydi: ve (va), ama/fakat (lekin), çünkü (chunki), veya/ya da (yoki), de/da (ham), ile (bilan).', rules: ['ve — va: Ali ve Veli.', 'ama, fakat, ancak, lakin — lekin, ammo.', 'çünkü — chunki: Gelmedim, çünkü hastaydım.', 'veya, ya da, yahut — yoki.', 'de/da — ham (alohida yoziladi!): Ben de geliyorum.', 'hem ... hem (de) — ham ... ham: Hem okuyor hem çalışıyor.', 'ne ... ne (de) — na ... na: Ne çay ne kahve içer.', 'ya ... ya — yo ... yo; ki — -ki (ki); eğer — agar; bu yüzden / bu nedenle — shuning uchun.'], table: { h: ['Turkcha', 'O‘zbekcha'], r: [['ve', 'va'], ['ama / fakat', 'lekin'], ['çünkü', 'chunki'], ['veya / ya da', 'yoki'], ['de / da', 'ham'], ['hem ... hem', 'ham ... ham'], ['ne ... ne', 'na ... na'], ['bu yüzden', 'shuning uchun'], ['eğer', 'agar'], ['ki', 'ki']] }, ex: [['Yorgunum ama çalışmalıyım.', 'Charchaganman, lekin ishlashim kerak.'], ['Ben de Türkçe öğreniyorum.', 'Men ham turkcha o‘rganyapman.'], ['Ne yağmur ne kar yağdı.', 'Na yomg‘ir, na qor yog‘di.']], exc: ['«de/da» bog‘lovchisi ajratib yoziladi, «-de/-da» kelishik qo‘shib yoziladi: Ben de evdeyim.'], err: ['«Bende geliyorum» ✗ → «Ben de geliyorum» ✓.'], drill: [['«chunki» turkchasi', 'çünkü', ''], ['«yoki» turkchasi', 'veya', 'ya da ham to‘g‘ri'], ['«ham ... ham» turkchasi', 'hem hem', '']], mcq: [['Okula gitmedim, ___ hastaydım.', ['çünkü', 'ama', 've', 'veya'], 0, 'Sabab → çünkü.'], ['Çay ___ kahve? Hangisini istersin?', ['ya da', 'çünkü', 'ama', 'ki'], 0, 'Tanlov → ya da.'], ['Hava soğuk ___ güneşli.', ['ama', 'çünkü', 'veya', 'ki'], 0, 'Qarama-qarshilik → ama.'], ['Ali ___ Ayşe sinemaya gitti.', ['ve', 'ama', 'çünkü', 'ne'], 0, 'Biriktiruv → ve.'], ['Ben ___ seninle geliyorum. (ham)', ['de', 'da', 'ki', 've'], 0, 'Ben (oxirgi unli e) → de (alohida).'], ['O ___ akıllı ___ çalışkan.', ['hem / hem de', 'ne / ne', 'ya / ya', 'ama / ama'], 0, 'ham ... ham.'], ['___ çay ___ kahve içerim, sadece su.', ['Ne / n   { id: 'komakchi', t: 'Ko‘makchilar', intro: 'Ko‘makchilar otdan keyin keladi va ma’lum kelishikni talab qiladi: için (uchun), ile (bilan), gibi (kabi), kadar (qadar), göre (ko‘ra), sonra (keyin), önce (oldin).', rules: ['Bosh kelishik + için / ile / gibi / kadar: senin için, araba ile (arabayla), kuş gibi.', 'Olmoshlar qaratqichda: benim için, senin gibi, onun ile (onunla).', 'Yo‘nalish + göre, kadar, doğru, karşı: bana göre (menimcha), akşama kadar (kechgacha), eve doğru (uy tomon).', 'Chiqish + önce, sonra, beri, dolayı: dersten sonra, yemekten önce, 2010’dan beri.', '«ile» qisqa shakli: -(y)la/-(y)le: arabayla, kalemle, annemle.', 'Joy ko‘makchilari (egalik + kelishik): masanın üstünde, evin önünde, okulun yanında, kutunun içinde.'], table: { h: ['Ko‘makchi', 'Kelishik', 'Misol', 'Tarjima'], r: [['için', 'bosh / qaratqich', 'senin için', 'sen uchun'], ['ile', 'bosh / qaratqich', 'otobüsle', 'avtobus bilan'], ['gibi', 'bosh / qaratqich', 'aslan gibi', 'sherdek'], ['göre', 'yo‘nalish', 'bana göre', 'menimcha'], ['kadar', 'yo‘nalish', 'akşama kadar', 'kechgacha'], ['sonra', 'chiqish', 'dersten sonra', 'darsdan keyin'], ['önce', 'chiqish', 'yemekten önce', 'ovqatdan oldin'], ['beri', 'chiqish', 'sabahtan beri', 'ertalabdan beri']] }, ex: [['Bu hediye senin için.', 'Bu sovg‘a sen uchun.'], ['Dersten sonra parka gidelim.', 'Darsdan keyin parkka boraylik.'], ['Kitap masanın üstünde.', 'Kitob stolning ustida.']], exc: ['«ile» unli bilan tugagan so‘zdan keyin -yla/-yle: arabayla, Ayşe’yle.'], err: ['«ben için» ✗ → «benim için» ✓.', '«dersden sonra» ✗ → «dersten sonra» ✓.'], drill: [['«sen uchun» turkchasi', 'senin için', ''], ['«darsdan keyin» turkchasi', 'dersten sonra', ''], ['araba + ile (qisqa) = ?', 'arabayla', '']], mcq: [['Ders___ sonra eve gittim.', ['ten', 'e', 'de', 'i'], 0, 'sonra chiqish talab qiladi; s qattiq → -ten.'], ['Bu kitap ___ için.', ['senin', 'sen', 'sana', 'seni'], 0, 'Olmosh + için → qaratqich.'], ['Akşam___ kadar çalıştık.', ['a', 'da', 'dan',
