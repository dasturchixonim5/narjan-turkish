  { id: 'yor', t: 'Hozirgi zamon (-yor)', intro: '-yor — hozir bajarilayotgan ish-harakat (o‘zb. -yap). Shuningdek yaqin kelajak va odat uchun ham ishlatiladi: Yarın gidiyorum.', rules: ['Undosh bilan tugagan o‘zak: + ı/i/u/ü + yor: gel-i-yor, yap-ı-yor, gör-ü-yor, oku... ', 'Unli bilan tugagan o‘zak: a/e tushib, ı/i/u/ü ga aylanadi: başla → başlıyor, bekle → bekliyor, söyle → söylüyor.', 'ı/i/u/ü bilan tugasa — to‘g‘ridan-to‘g‘ri: oku-yor, yürü-yor.', 'Shaxs qo‘shimchalari: -um, -sun, -, -uz, -sunuz, -lar.', 'gitmek, etmek: t → d: gidiyor, ediyor.', 'ye-, de- → yiyor, diyor.', 'Inkor: -mı/-mi/-mu/-mü + yor: gelmiyor, yapmıyor.', 'So‘roq: geliyor musun? geliyor mu?'], table: { h: ['Shaxs', 'gelmek', 'okumak', 'başlamak'], r: [['ben', 'geliyorum', 'okuyorum', 'başlıyorum'], ['sen', 'geliyorsun', 'okuyorsun', 'başlıyorsun'], ['o', 'geliyor', 'okuyor', 'başlıyor'], ['biz', 'geliyoruz', 'okuyoruz', 'başlıyoruz'], ['siz', 'geliyorsunuz', 'okuyorsunuz', 'başlıyorsunuz'], ['onlar', 'geliyorlar', 'okuyorlar', 'başlıyorlar']] }, ex: [['Şimdi kitap okuyorum.', 'Hozir kitob o‘qiyapman.'], ['Ne yapıyorsun?', 'Nima qilyapsan?'], ['Yarın Ankara’ya gidiyoruz.', 'Ertaga Anqaraga ketyapmiz.']], exc: ['gitmek → gidiyor, etmek → ediyor, demek → diyor, yemek → yiyor.'], err: ['«başlayor» ✗ → «başlıyor» ✓.', '«gitiyor» ✗ → «gidiyor» ✓.'], drill: [['gelmek, ben = ?', 'geliyorum', ''], ['başlamak, o = ?', 'başlıyor', ''], ['gitmek, biz = ?', 'gidiyoruz', ''], ['yapmak, sen, inkor = ?', 'yapmıyorsun', '']], gen: 'tense:yor' },
  { id: 'di', t: 'O‘tgan zamon (-di)', intro: '-dı/-di/-du/-dü (qattiq undoshdan keyin -tı/-ti/-tu/-tü) — aniq, ko‘z bilan ko‘rilgan o‘tgan zamon (o‘zb. -di).', rules: ['O‘zak + -dı/-di/-du/-dü (4-li uyg‘unlik).', 'Qattiq undoshdan keyin d → t: yaptı, gitti, içti, konuştu.', 'Shaxs qo‘shimchalari (I tip): -m, -n, -, -k, -nız, -lar: geldim, geldin, geldi, geldik, geldiniz, geldiler.', 'Inkor: -ma/-me + dı: gelmedim, yapmadık.', 'So‘roq: geldin mi? geldi mi? geldiler mi?', 'Ot va sifatlarga ham qo‘shiladi: Hastaydım (kasal edim), evdeydi.'], table: { h: ['Shaxs', 'gelmek', 'yapmak', 'okumak', 'görmek'], r: [['ben', 'geldim', 'yaptım', 'okudum', 'gördüm'], ['sen', 'geldin', 'yaptın', 'okudun', 'gördün'], ['o', 'geldi', 'yaptı', 'okudu', 'gördü'], ['biz', 'geldik', 'yaptık', 'okuduk', 'gördük'], ['siz', 'geldiniz', 'yaptınız', 'okudunuz', 'gördünüz'], ['onlar', 'geldiler', 'yaptılar', 'okudular', 'gördüler']] }, ex: [['Dün sinemaya gittim.', 'Kecha kinoga bordim.'], ['Ödevini yaptın mı?', 'Uy vazifangni qildingmi?'], ['Hiç Türkiye’ye gitmedim.', 'Hech Turkiyaga bormaganman.']], exc: ['etmek → ettim (t → t, yumshamaydi, chunki undosh bilan boshlanuvchi qo‘shimcha).'], err: ['«yapdım» ✗ → «yaptım» ✓.', '«geldiz» ✗ → «geldik» ✓ (biz → -k).'], drill: [['yapmak, ben = ?', 'yaptım', ''], ['gitmek, biz = ?', 'gittik', ''], ['okumak, o = ?', 'okudu', ''], ['gelmek, sen, inkor = ?', 'gelmedin', '']], gen: 'tense:di' },
  { id: 'mis', t: 'Eshitilgan o‘tgan zamon (-miş)', intro: '-mış/-miş/-muş/-müş — ish-harakatni o‘zi ko‘rmagan, eshitgan yoki natijasidan bilgan holda aytish (o‘zb. -gan ekan, -ibdi).', rules: ['O‘zak + -mış/-miş/-muş/-müş.', 'Shaxs qo‘shimchalari (II tip): -ım, -sın, -, -ız, -sınız, -lar: gelmişim, gelmişsin, gelmiş, gelmişiz, gelmişsiniz, gelmişler.', 'Inkor: -ma/-me + mış: gelmemiş.', 'So‘roq: gelmiş mi? gelmiş miyim?', 'Ertaklarda: Bir varmış, bir yokmuş... (Bor ekan, yo‘q ekan...)', '-miş sifatdosh vazifasida: kızarmış ekmek (qovurilgan non).'], table: { h: ['Shaxs', 'gelmek', 'yapmak', 'okumak'], r: [['ben', 'gelmişim', 'yapmışım', 'okumuşum'], ['sen', 'gelmişsin', 'yapmışsın', 'okumuşsun'], ['o', 'gelmiş', 'yapmış', 'okumuş'], ['biz', 'gelmişiz', 'yapmışız', 'okumuşuz'], ['siz', 'gelmişsiniz', 'yapmışsınız', 'okumuşsunuz'], ['onlar', 'gelmişler', 'yapmışlar', 'okumuşlar']] }, ex: [['Ali dün İstanbul’a gitmiş.', 'Ali kecha Istanbulga ketgan ekan.'], ['Çok yorulmuşsun.', 'Juda charchabsan.'], ['Bir varmış, bir yokmuş.', 'Bor ekan, yo‘q ekan.']], exc: ['«-dı» bilan farqi: Geldi (o‘zim ko‘rdim) — Gelmiş (eshitdim).'], err: ['Ko‘rgan voqeani -miş bilan aytish.'], drill: [['gelmek, o = ?', 'gelmiş', ''], ['yapmak, onlar = ?', 'yapmışlar', ''], ['okumak, sen = ?', 'okumuşsun', '']], gen: 'tense:mis' },
  { id: 'ecek', t: 'Kelasi zamon (-ecek/-acak)', intro: '-acak/-ecek — kelajakda aniq bo‘ladigan ish (o‘zb. -aman, -moqchiman).', rules: ['O‘zak + -acak/-ecek (2-li uyg‘unlik).', 'Unli bilan tugagan o‘zakka bufer «y»: okuyacak, bekleyecek.', 'I shaxsda k → ğ: geleceğim, geleceğiz; boshqalarida k saqlanadi: geleceksin.', 'gitmek → gideceğim, etmek → edeceğim; demek → diyecek, yemek → yiyecek.', 'Inkor: -ma/-me + yacak/yecek: gelmeyeceğim.', 'So‘roq: gelecek misin? gelecek mi?'], table: { h: ['Shaxs', 'gelmek', 'okumak', 'gitmek'], r: [['ben', 'geleceğim', 'okuyacağım', 'gideceğim'], ['sen', 'geleceksin', 'okuyacaksın', 'gideceksin'], ['o', 'gelecek', 'okuyacak', 'gidecek'], ['biz', 'geleceğiz', 'okuyacağız', 'gideceğiz'], ['siz', 'geleceksiniz', 'okuyacaksınız', 'gideceksiniz'], ['onlar', 'gelecekler', 'okuyacaklar', 'gidecekler']] }, ex: [['Yarın seni arayacağım.', 'Ertaga senga qo‘ng‘iroq qilaman.'], ['Gelecek yıl Türkiye’ye gideceğiz.', 'Kelasi yil Turkiyaga boramiz.'], ['Bu akşam ne yapacaksın?', 'Bugun kechqurun nima qilasan?']], exc: ['I shaxs: k → ğ (geleceğim), lekin «gelecekler» da k saqlanadi.'], err: ['«gelecekim» ✗ → «geleceğim» ✓.', '«okuacak» ✗ → «okuyacak» ✓.'], drill: [['gelmek, ben = ?', 'geleceğim', ''], ['okumak, o = ?', 'okuyacak', ''], ['gitmek, biz = ?', 'gideceğiz', '']], gen: 'tense:ecek' },
  { id: 'r', t: 'Hozirgi-kelasi zamon (-r)', intro: '-r / -ar/-er / -ır/-ir — doimiy, odatiy ish, umumiy haqiqat, va’da yoki taklif (o‘zb. -aman, -adi).', rules: ['Unli bilan tugagan o‘zak: + r: okur, bekler, başlar.', 'Bir bo‘g‘inli undosh o‘zak: + ar/er: yapar, gider, yazar, içer.', 'Istisno 13 fe’l: + ır/ir/ur/ür: alır, bilir, bulur, durur, gelir, görür, kalır, olur, ölür, sanır, varır, verir, vurur.', 'Ko‘p bo‘g‘inli undosh o‘zak: + ır/ir/ur/ür: çalışır, konuşur, düşünür.', 'Shaxs qo‘shimchalari: -ım, -sın, -, -ız, -sınız, -lar: gelirim, gelirsin.', 'Inkor: -mam/-mem, -mazsın, -maz, -mayız, -mazsınız, -mazlar: gelmem, gelmez.', 'Taklif: Çay içer misin? (Choy ichasanmi?)'], table: { h: ['Shaxs', 'gelmek', 'yapmak', 'okumak', 'inkor (gelmek)'], r: [['ben', 'gelirim', 'yaparım', 'okurum', 'gelmem'], ['sen', 'gelirsin', 'yaparsın', 'okursun', 'gelmezsin'], ['o', 'gelir', 'yapar', 'okur', 'gelmez'], ['biz', 'geliriz', 'yaparız', 'okuruz', 'gelmeyiz'], ['siz', 'gelirsiniz', 'yaparsınız', 'okursunuz', 'gelmezsiniz'], ['onlar', 'gelirler', 'yaparlar', 'okurlar', 'gelmezler']] }, ex: [['Her sabah çay içerim.', 'Har ertalab choy ichaman.'], ['Kuşlar uçar.', 'Qushlar uchadi.'], ['Yardım eder misin?', 'Yordam berasanmi?']], exc: ['13 ta istisno fe’l: al, bil, bul, dur, gel, gör, kal, ol, öl, san, var, ver, vur → -ır.'], err: ['«gelerim» ✗ → «gelirim» ✓.', '«yapırım» ✗ → «yaparım» ✓.', '«gelmezim» ✗ → «gelmem» ✓.'], drill: [['gelmek, ben = ?', 'gelirim', ''], ['yapmak, o = ?', 'yapar', ''], ['almak, sen = ?', 'alırsın', ''], ['gelmek, ben, inkor = ?', 'gelmem', '']], gen: 'tense:r' },
  { id: 'buyruq', t: 'Buyruq mayli', intro: 'Buyruq mayli buyruq, iltimos va maslahatni bildiradi. «sen» shakli — fe’l o‘zagining o‘zi: Gel! Oku!', rules: ['sen: o‘zak: gel, oku, yap, git.', 'o: -sın/-sin/-sun/-sün: gelsin, okusun.', 'siz: -(y)ın/-(y)in, rasmiy -(y)ınız: gelin / geliniz, okuyun / okuyunuz.', 'onlar: -sınlar/-sinler: gelsinler.', 'Inkor: -ma/-me: gelme! yapmayın!', 'gitmek → gidin, etmek → edin (unli oldida t → d).', 'Muloyim iltimos: Lütfen oturun. Kapıyı kapatır mısın? (-r so‘roq shakli bilan).'], table: { h: ['Shaxs', 'gelmek', 'okumak', 'gitmek', 'inkor'], r: [['sen', 'gel', 'oku', 'git', 'gelme'], ['o', 'gelsin', 'okusun', 'gitsin', 'gelmesin'], ['siz', 'gelin(iz)', 'okuyun(uz)', 'gidin(iz)', 'gelmeyin'], ['onlar', 'gelsinler', 'okusunlar', 'gitsinler', 'gelmesinler']] }, ex: [['Lütfen kapıyı açın.', 'Iltimos, eshikni oching.'], ['Hemen buraya gel!', 'Darhol bu yerga kel!'], ['Geç kalmayın.', 'Kech qolmang.']], exc: ['et- → edin; git- → gidin; de- → deyin; ye- → yiyin.'], err: ['«gitin» ✗ → «gidin» ✓.'], drill: [['gelmek, siz = ?', 'gelin', ''], ['okumak, o = ?', 'okusun', ''], ['gitmek, siz = ?', 'gidin', ''], ['yapmak, sen, inkor = ?', 'yapma', '']], gen: 'tense:imp' },
  { id: 'istak-shart', t: 'Istak va shart mayllari', intro: 'Istak mayli (-a/-e) — taklif va xohish: Gidelim! (Boraylik!). Shart mayli (-sa/-se) — shart yoki orzu: Gelsem... (Kelsam...). Hozirgi-kelasi zamon + shart: gelirse (kelsa).', rules: ['Istak: ben -(y)ayım/-(y)eyim, biz -(y)alım/-(y)elim: gideyim, gidelim, okuyalım.', 'Istak ko‘pincha I shaxsda: Ne yapalım? Çay içelim mi?', 'Shart: -sa/-se + I tip shaxs: gelsem, gelsen, gelse, gelsek, gelseniz, gelseler.', 'Real shart: -r + sa: Yağmur yağarsa evde kalırız. (Yomg‘ir yog‘sa, uyda qolamiz.)', 'Orzu: Keşke + -sa: Keşke zengin olsam! (Qani endi boy bo‘lsam!)', 'Inkor: gelmesem, gelmezse.'], table: { h: ['Shaxs', 'Istak (gitmek)', 'Shart (gelmek)', '-r + sa (gelmek)'], r: [['ben', 'gideyim', 'gelsem', 'gelirsem'], ['sen', 'gidesin', 'gelsen', 'gelirsen'], ['o', 'gide', 'gelse', 'gelirse'], ['biz', 'gidelim', 'gelsek', 'gelirsek'], ['siz', 'gidesiniz', 'gelseniz', 'gelirseniz'], ['onlar', 'gideler', 'gelseler', 'gelirlerse']] }, ex: [['Hadi sinemaya gidelim!', 'Qani, kinoga boraylik!'], ['Zamanım olsa sana yardım ederim.', 'Vaqtim bo‘lsa, senga yordam beraman.'], ['Keşke burada olsaydın.', 'Qani endi shu yerda bo‘lsang edi.']], exc: ['Istakning sen/o/siz/onlar shakllari kundalik nutqda kam ishlatiladi.'], err: ['«gidelim mi» — taklif savoli to‘g‘ri; «gidiyim» ✗ → «gideyim» ✓.'], drill: [['gitmek, biz (istak) = ?', 'gidelim', ''], ['gelmek, ben (shart) = ?', 'gelsem', ''], ['okumak, biz (istak) = ?', 'okuyalım', '']], gen: 'tense:opt+sa' },
  { id: 'mali', t: 'Keraklilik mayli (-malı/-meli)', intro: '-malı/-meli — majburiyat, zarurat (o‘zb. -ishim kerak, -moqim lozim). Sinonimi: -mak/-mek zorunda (majbur), -mam lazım.', rules: ['O‘zak + -malı/-meli + II tip shaxs: gelmeliyim, gelmelisin, gelmeli, gelmeliyiz, gelmelisiniz, gelmeliler.', 'Inkor: -mamalı/-memeli: gelmemeliyim.', 'So‘roq: gelmeli miyim?', 'Muqobillari: gitmem lazım / gerek (borishim kerak), gitmek zorundayım (borishga majburman).', 'Maslahat: Daha çok çalışmalısın. (Ko‘proq ishlashing kerak.)'], table: { h: ['Shaxs', 'gitmek', 'okumak', 'inkor (gitmek)'], r: [['ben', 'gitmeliyim', 'okumalıyım', 'gitmemeliyim'], ['sen', 'gitmelisin', 'okumalısın', 'gitmemelisin'], ['o', 'gitmeli', 'okumalı', 'gitmemeli'], ['biz', 'gitmeliyiz', 'okumalıyız', 'gitmemeliyiz'], ['siz', 'gitmelisiniz', 'okumalısınız', 'gitmemelisiniz'], ['onlar', 'gitmeliler', 'okumalılar', 'gitmemeliler']] }, ex: [['Şimdi eve gitmeliyim.', 'Hozir uyga borishim kerak.'], ['Her gün kitap okumalısın.', 'Har kuni kitob o‘qishing kerak.'], ['Burada sigara içmemelisiniz.', 'Bu yerda chekmasligingiz kerak.']], exc: ['-malı o‘zakda yumshash bo‘lmaydi: gitmeliyim (gidmeliyim ✗).'], err: ['«gitmelim» ✗ → «gitmeliyim» ✓ (bufer y).'], drill: [['gitmek, ben = ?', 'gitmeliyim', ''], ['okumak, sen = ?', 'okumalısın', ''], ['çalışmak, biz = ?', 'çalışmalıyız', '']], gen: 'tense:mali' },
  { id: 'nisbat', t: 'Fe’l nisbatlari (çatı)', intro: 'Nisbat qo‘shimchalari fe’lning ma’nosini o‘zgartiradi: majhul (-ıl/-ın), orttirma (-dır/-t), o‘zlik (-ın/-ş), birgalik (-ış).', rules: ['Majhul (edilgen): -ıl/-il/-ul/-ül; l bilan tugasa yoki unlidan keyin -n: yazıldı (yozildi), okundu (o‘qildi), bilindi.', 'Orttirma (ettirgen): -dır/-dir/-tır, ko‘p bo‘g‘inli/unlidan keyin -t, ba’zan -ır/-ar: yaptırmak (qildirmoq), okutmak (o‘qitmoq), içirmek (ichirmoq), çıkarmak.', 'O‘zlik (dönüşlü): -ın/-in: yıkanmak (yuvinmoq), giyinmek (kiyinmoq), taranmak (taranmoq).', 'Birgalik (işteş): -ış/-iş: görüşmek (ko‘rishmoq), tanışmak (tanishmoq), yardımlaşmak, gülüşmek.', 'Majhulda bajaruvchi tomonidan: tarafından: Kitap Ali tarafından yazıldı.'], table: { h: ['Asos', 'Majhul', 'Orttirma', 'O‘zlik / Birgalik'], r: [['yazmak — yozmoq', 'yazılmak', 'yazdırmak', '—'], ['okumak — o‘qimoq', 'okunmak', 'okutmak', '—'], ['yıkamak — yuvmoq', 'yıkanmak', 'yıkatmak', 'yıkanmak (o‘zlik)'], ['görmek — ko‘rmoq', 'görülmek', 'göstermek', 'görüşmek (birgalik)'], ['bilmek — bilmoq', 'bilinmek', 'bildirmek', '—'], ['giymek — kiymoq', 'giyilmek', 'giydirmek', 'giyinmek (o‘zlik)']] }, ex: [['Bu ev 1990’da yapıldı.', 'Bu uy 1990-yilda qurildi.'], ['Saçımı kestirdim.', 'Sochimni oldirdim.'], ['Yarın görüşürüz.', 'Ertaga ko‘rishamiz.']], exc: ['görmek → göstermek (ko‘rsatmoq) — notekis orttirma.', 'Majhul bilan o‘zlik bir xil ko‘rinishi mumkin: yıkanmak (yuvilmoq / yuvinmoq).'], err: ['«yazıldı» va «yazdırdı» ni adashtirish: yozildi ≠ yozdirdi.'], drill: [['yazmak → majhul o‘tgan zamon (o) = ?', 'yazıldı', ''], ['okumak → orttirma masdar = ?', 'okutmak', ''], ['görmek → birgalik masdar = ?', 'görüşmek', '']], mcq: [['Mektup dün ___. (yozildi)', ['yazıldı', 'yazdı', 'yazdırdı', 'yazıştı'], 0, 'Majhul: yaz + ıl + dı.'], ['Öğretmen öğrencilere kitap ___. (o‘qitdi)', ['okuttu', 'okundu', 'okudu', 'okunuştu'], 0, 'Orttirma: oku + t + tu.'], ['Sabah erken kalkıp ___. (yuvindim)', ['yıkandım', 'yıkattım', 'yıkadım', 'yıkaştım'], 0, 'O‘zlik: yıka + n.'], ['Dün eski bir arkadaşımla ___. (ko‘rishdim)', ['görüştüm', 'gördüm', 'görüldüm', 'gösterdim'], 0, 'Birgalik: gör + üş.'], ['Bu kitap Orhan Pamuk tarafından ___.', ['yazıldı', 'yazdı', 'yazdırdı', 'yazındı'], 0, 'tarafından → majhul.'], ['Saçımı berbere ___. (oldirdim)', ['kestirdim', 'kesildim', 'kestim', 'kesiştim'], 0, 'Orttirma: kes + tir.'], ['Bana yolu ___ misiniz? (ko‘rsata olasizmi)', ['gösterir', 'görür', 'görülür', 'görüşür'], 0, 'görmek → göstermek.'], ['Çocuk kendi kendine ___. (kiyindi)', ['giyindi', 'giydirdi', 'giyildi', 'giydi'], 0, 'O‘zlik: giy + in.'], ['Partide yeni insanlarla ___. (tanishdik)', ['tanıştık', 'tanıdık', 'tanındık', 'tanıttık'], 0, 'Birgalik: tanı + ş.'], ['Kapı ___. (ochildi)', ['açıldı', 'açtı', 'açtırdı', 'açıştı'], 0, 'Majhul: aç + ıl.'], ['Annem bana ilaç ___. (ichirdi)', ['içirdi', 'içti', 'içildi', 'içişti'], 0, 'Orttirma: iç + ir.'], ['Bu soru kolayca ___. (tushunildi)', ['anlaşıldı', 'anladı', 'anlattı', 'anlandı'], 0, 'anlamak → anlaşılmak (majhul).'], ['Müdür raporu sekretere ___. (yozdirdi)', ['yazdırdı', 'yazıldı', 'yazdı', 'yazıştı'], 0, 'Orttirma: yaz + dır.'], ['Ev her hafta ___. (tozalanadi)', ['temizlenir', 'temizler', 'temizletir', 'temizleşir'], 0, 'Majhul: temizle + n + ir.'], ['Öğrenciler sınıfta ___. (kulishdi)', ['gülüştüler', 'güldüler', 'güldürdüler', 'gülündüler'], 0, 'Birgalik: gül + üş.'], ['Bu haber herkes tarafından ___. (bilinadi)', ['bilinir', 'bilir', 'bildirir', 'bilişir'], 0, 'bil + in (l bilan tugagani uchun -n).'], ['Ali bize olayı ___. (aytib berdi)', ['anlattı', 'anladı', 'anlaşıldı', 'anlandı'], 0, 'anlamak → anlatmak (tushuntirmoq, aytib bermoq).'], ['Çamaşırlar makinede ___. (yuvildi)', ['yıkandı', 'yıkadı', 'yıkattı', 'yıkaştı'], 0, 'Majhul ma’nosi.'], ['Çocuğu erken ___. (uxlatdik)', ['uyuttuk', 'uyuduk', 'uyundu', 'uyuştuk'], 0, 'Orttirma: uyu + t.'], ['Biz her gün telefonla ___. (gaplashamiz)', ['konuşuruz', 'konuşturuz', 'konuşulur', 'konuşur'], 0, 'konuşmak — o‘zi birgalik ma’noli.']] },
  { id: 'inkor', t: 'Inkor shakllari', intro: 'Fe’l inkori -ma/-me bilan, ot-sifat inkori «değil», mavjudlik inkori «yok» bilan ifodalanadi.', rules: ['Fe’l: o‘zak + ma/me: gelme-, yapma-: gelmiyor, gelmedi, gelmeyecek, gelmemiş.', '-yor oldidan -ma/-me → mı/mi/mu/mü: gelmiyor, okumuyor.', 'Hozirgi-kelasi: gelmem, gelmezsin, gelmez, gelmeyiz, gelmezsiniz, gelmezler.', 'Ot/sifat: değil: Ben öğrenci değilim. Bu kitap değil.', 'Mavjudlik: var ↔ yok: Param yok. (Pulim yo‘q.)', 'Inkor so‘zlar inkor fe’l bilan: hiç, kimse, hiçbir şey, asla: Kimse gelmedi.'], table: { h: ['Tasdiq', 'Inkor', 'Tarjima'], r: [['geliyorum', 'gelmiyorum', 'kelmayapman'], ['geldim', 'gelmedim', 'kelmadim'], ['geleceğim', 'gelmeyeceğim', 'kelmayman'], ['gelirim', 'gelmem', 'kelmayman (odatda)'], ['öğrenciyim', 'öğrenci değilim', 'o‘quvchi emasman'], ['var', 'yok', 'bor — yo‘q']] }, ex: [['Bugün okula gitmiyorum.', 'Bugun maktabga bormayapman.'], ['O, doktor değil.', 'U shifokor emas.'], ['Evde kimse yok.', 'Uyda hech kim yo‘q.']], exc: ['«değil» alohida yoziladi va shaxs oladi: değilim, değilsin, değil, değiliz.'], err: ['«Ben öğrenci yokum» ✗ → «Ben öğrenci değilim» ✓.', '«Kimse geldi» ✗ → «Kimse gelmedi» ✓.'], drill: [['geliyorum → inkor', 'gelmiyorum', ''], ['yaptık → inkor', 'yapmadık', ''], ['öğretmenim → inkor', 'öğretmen değilim', ''], ['para var → inkor', 'para yok', '']], gen: 'neg' },
  { id: 'soroq-gap', t: 'So‘roq gaplar', intro: '«Ha/yo‘q» savoli «mı/mi/mu/mü» yuklamasi bilan tuziladi. U alohida yoziladi va 4-li uyg‘unlikka bo‘ysunadi.', rules: ['mi — so‘roq qilinayotgan so‘zdan keyin alohida: Sen mi geldin? (Sen keldingmi?) Dün mü geldin?', 'Shaxs qo‘shimchasi mi ga qo‘shiladi (-yor, -r, -ecek, -miş da): Geliyor musun? Gelecek misiniz?', '-di o‘tgan zamonda shaxs fe’lda qoladi: Geldin mi? Geldiniz mi?', 'Ot-sifatda: Öğrenci misin? Evde mi?', 'III shaxs ko‘plik: Geliyorlar mı?', 'So‘roq olmoshi bor gapda mi kerak emas.'], table: { h: ['Gap', 'So‘roq', 'Tarjima'], r: [['Geliyorsun.', 'Geliyor musun?', 'Kelyapsanmi?'], ['Geldin.', 'Geldin mi?', 'Keldingmi?'], ['Gelecek.', 'Gelecek mi?', 'Keladimi?'], ['Öğrencisin.', 'Öğrenci misin?', 'O‘quvchimisan?'], ['Evdeler.', 'Evdeler mi?', 'Uydamilar?'], ['Türksün.', 'Türk müsün?', 'Turkmisan?']] }, ex: [['Çay ister misin?', 'Choy xohlaysanmi?'], ['Bu senin kitabın mı?', 'Bu sening kitobingmi?'], ['Dün okula gittin mi?', 'Kecha maktabga bordingmi?']], exc: ['«mı» doim alohida yoziladi: geldinmi ✗ → geldin mi ✓.'], err: ['«Geliyorsun mu?» ✗ → «Geliyor musun?» ✓.'], drill: [['Geliyorsun → so‘roq', 'geliyor musun', ''], ['Geldin → so‘roq', 'geldin mi', ''], ['Öğrencisin → so‘roq', 'öğrenci misin', '']], gen: 'question' },
  { id: 'sifatdosh', t: 'Sifatdosh va ravishdosh', intro: 'Sifatdosh (sıfat-fiil) fe’ldan sifat yasaydi: gelen adam (kelgan odam). Ravishdosh (zarf-fiil) fe’ldan ravish yasaydi: gelince (kelganda), gelip (kelib).', rules: ['-an/-en: harakatni bajaruvchi: okuyan öğrenci (o‘qiyotgan o‘quvchi), gelen misafir.', '-dık/-dik (+ egalik): okuduğum kitap (men o‘qigan kitob), gittiğimiz yer.', '-acak/-ecek: kelajak: okuyacağım kitap (o‘qiydigan kitobim).', '-mış: tugallangan: kızarmış ekmek, pişmiş yemek.', 'Ravishdoshlar: -ıp/-ip (-ib): gelip gitti; -arak/-erek (-ib, -gan holda): koşarak geldi; -ınca/-ince (-ganda): eve gelince; -madan/-meden (-masdan): kahvaltı etmeden.', '-dıkça (-gan sari), -ken (-ganda / ekan): okurken (o‘qiyotganda).'], table: { h: ['Shakl', 'Misol', 'Tarjima'], r: [['-(y)an/-en', 'koşan çocuk', 'yugurayotgan bola'], ['-dık/-dik', 'okuduğum kitap', 'men o‘qigan kitob'], ['-acak/-ecek', 'gideceğim yer', 'boradigan joyim'], ['-ıp/-ip', 'gelip oturdu', 'kelib o‘tirdi'], ['-arak/-erek', 'gülerek söyledi', 'kulib aytdi'], ['-ınca/-ince', 'eve gelince', 'uyga kelganda'], ['-madan/-meden', 'düşünmeden', 'o‘ylamasdan']] }, ex: [['Türkçe öğrenen öğrenciler çok.', 'Turkcha o‘rganayotgan o‘quvchilar ko‘p.'], ['Okula gelince beni ara.', 'Maktabga kelganingda menga qo‘ng‘iroq qil.'], ['Kahvaltı yapmadan çıktı.', 'Nonushta qilmasdan chiqdi.']], exc: ['-dık + egalik: k → ğ: okuduğum, gittiğin.'], err: ['«okuyan kitap» ✗ (kitob o‘qimaydi!) → «okunan kitap» / «okuduğum kitap» ✓.'], drill: [['gelmek + -en = ?', 'gelen', ''], ['gelmek + -ince = ?', 'gelince', ''], ['okumak + -ip = ?', 'okuyup', '']], gen: 'verbal' },
  { id: 'gap', t: 'Gap tuzilishi', intro: 'Turk gapida so‘z tartibi o‘zbek tiliga o‘xshaydi: Ega + To‘ldiruvchi + Kesim (SOV). Kesim gap oxirida turadi.', rules: ['Asosiy tartib: Ega — Hol — To‘ldiruvchi — Kesim: Ben her gün okula gidiyorum.', 'Aniqlovchi aniqlanmishdan oldin: güzel bir ev, Ali’nin kitabı.', 'Ta’kidlanadigan so‘z kesim oldiga qo‘yiladi: Ali dün sinemaya gitti / Dün sinemaya Ali gitti.', 'Ot kesim: -(y)ım, -sın, -dır...: Ben öğretmenim. O doktordur.', 'Ega ko‘pincha tushib qoladi (fe’ldan shaxs aniq): Okula gidiyorum.', 'Devrik gap (nutqda): Gel buraya! Gidiyorum ben.'], table: { h: ['Ega', 'Payt', 'O‘rin', 'To‘ldiruvchi', 'Kesim'], r: [['Ben', 'her sabah', '—', 'çay', 'içerim.'], ['Ali', 'dün', 'kütüphanede', 'kitap', 'okudu.'], ['Biz', 'yarın', 'İstanbul’a', '—', 'gideceğiz.'], ['Annem', 'şimdi', 'mutfakta', 'yemek', 'yapıyor.']] }, ex: [['Kardeşim üniversitede okuyor.', 'Ukam universitetda o‘qiydi.'], ['Dün akşam arkadaşlarımla sinemaya gittim.', 'Kecha kechqurun do‘stlarim bilan kinoga bordim.']], exc: ['Savol so‘zi kesim oldida: Sen nereye gidiyorsun?'], err: ['Kesimni boshda qo‘yish (ruscha/inglizcha tartib): «Ben gidiyorum okula» — faqat nutqda.'], drill: [['So‘z tartibi: «okula / ben / gidiyorum»', 'ben okula gidiyorum', ''], ['Turk gapida kesim qayerda turadi?', 'oxirida', '']], mcq: [['Qaysi gap to‘g‘ri tartibda?', ['Ben her gün okula gidiyorum.', 'Gidiyorum ben okula her gün.', 'Okula her gün gidiyorum ben her.', 'Her gün gidiyorum okula ben.'], 0, 'Ega — payt — o‘rin — kesim.'], ['Qaysi gap to‘g‘ri?', ['Ali dün kitap okudu.', 'Ali okudu dün kitap.', 'Okudu Ali kitap dün.', 'Kitap okudu Ali dün.'], 0, 'Kesim oxirida.'], ['«Güzel bir ev» da aniqlovchi qaysi?', ['güzel', 'bir', 'ev', 'yo‘q'], 0, 'Sifat aniqlovchi.'], ['«Ben öğretmenim» — kesim turi?', ['ot kesim', 'fe’l kesim', 'ravish', 'ko‘makchi'], 0, 'öğretmen + im — ot kesim.'], ['Qaysi gap to‘g‘ri tartibda?', ['Annem mutfakta yemek yapıyor.', 'Annem yapıyor yemek mutfakta.', 'Yapıyor a   { id: 'murakkab', t: 'Murakkab gaplar', intro: 'Murakkab gaplar bog‘lovchi, sifatdosh/ravishdosh yoki shart shakllari orqali tuziladi. Turk tilida ergash gaplar ko‘pincha sifatdosh va ravishdosh bilan ifodalanadi.', rules: ['Bog‘langan qo‘shma gap: ve, ama, çünkü, bu yüzden bilan: Yağmur yağdı ama soğuk değildi.', 'Ergash gap sifatdosh bilan: Dün gördüğüm film güzeldi. (Kecha ko‘rgan filmim yaxshi edi.)', 'Payt ergash gap: -ınca, -dığı zaman, -ken: Eve gelince yemek yedim.', 'Shart ergash gap: -sa/-se: Erken kalkarsan otobüse yetişirsin.', 'Sabab: -dığı için: Hasta olduğu için gelmedi. (Kasal bo‘lgani uchun kelmadi.)', 'Maqsad: -mak için: Türkçe öğrenmek için Türkiye’ye gitti.', '«ki» bilan: Biliyorum ki haklısın.', 'To‘ldiruvchi ergash gap: -dığını: Geleceğini biliyorum. (Kelishingni bilaman.)'], table: { h: ['Turi', 'Shakl', 'Misol'], r: [['Sabab', '-dığı için', 'Yorgun olduğum için uyudum.'], ['Maqsad', '-mak için', 'Okumak için geldim.'], ['Payt', '-ınca / -dığında', 'Gelince ara.'], ['Shart', '-sa / -rsa', 'Çalışırsan başarırsın.'], ['Aniqlovchi', '-dık / -an', 'Okuduğum kitap.'], ['To‘ldiruvchi', '-dığını', 'Geldiğini gördüm.']] }, ex: [['Hasta olduğum için okula gidemedim.', 'Kasal bo‘lganim uchun maktabga bora olmadim.'], ['Türkçe öğrenmek için her gün çalışıyorum.', 'Turkcha o‘rganish uchun har kuni shug‘ullanyapman.'], ['Sen gelince başlayalım.', 'Sen kelganingda boshlaylik.']], exc: ['-dığı için (sabab) va -mak için (maqsad) farqi muhim.'], err: ['«Hasta oldum için» ✗ → «Hasta olduğum için» ✓.'], drill: [['«kasal bo‘lgani uchun» = hasta ___ için', 'olduğu', ''], ['«o‘rganish uchun» = öğrenmek ___', 'için', '']], mcq: [['Yorgun ___ için erken yattım.', ['olduğum', 'oldum', 'olacak', 'olmak'], 0, 'Sabab: -dığı için.'], ['Türkçe öğren___ için kurs aldım.', ['mek', 'diğim', 'ince', 'ip'], 0, 'Maqsad: -mak için.'], ['Eve gel___ beni ara.', ['ince', 'mek', 'diği', 'meden'], 0, 'Payt: -ince.'], ['Çok çalış___ sınavı geçersin.', ['ırsan', 'tığı', 'mak', 'ınca']     const sel = st.ans[st.i];

  }

  ROUTE_CLEANUP = () => { clearInterval(timerId); persist(); };

function buildVocabTest(pool, n = 100) {
  const qs = []; const due = shuffle(S.mistakes.filter(m => !m.mastered && m.wordN && pool.some(w => w.n === m.wordN))).slice(0, Math.round(n * .25));
  due.forEach(m => { const prevT = m.lastType; const t = pick(VTYPES.filter(x => x !== prevT)); m.lastType = t; const q = vocabQ(WBYN[m.wordN], t); q.mistakeRef = m; qs.push(q); });
  const ws = shuffle(pool); let k = 0;
  while (qs.length < n && ws.length) { const w = ws[k % ws.length]; qs.push(vocabQ(w, VTYPES[(k + Math.floor(Math.random() * 3)) % VTYPES.length])); k++; }
  return shuffle(qs).slice(0, n);
}

function aiPersonal(act) { return `<div class="card"><h3>🤖 AI tahlili</h3><p class="small muted">AI barcha xatolaringizni ko‘rib chiqib, umumiy sababini va individual reja taklif qiladi.</p><button class="btn sm vio" data-aiplan="1">Tahlil qilish</button><div id="aip"></div></div>`; }
function errKeyName(k) { const [a, b] = k.split(':'); if (a === 'case') return 'Kelishik: ' + (TR.CASE_NAMES[b] || b); if (a === 'contrast') return 'Kelishiklarni farqlash'; if (a === 'tense') return 'Zamon: ' + (TENSE_UZ[b] || b); if (a === 'w') return 'Lug‘at'; if (a.startsWith('w')) return 'So‘z: ' + (WBYN[+a.slice(1)] ? cleanTr(WBYN[+a.slice(1)].tr) : a); if (a === 'topic') return 'Mavzu: ' + (G[GRAM_ID[b]]?.t || b); if (a === 'poss') return 'Egalik qo‘shimchalari'; if (a === 'uyg') return 'Unli uyg‘unligi'; if (a === 'verbal') return 'Sifatdosh/ravishdosh'; return { undosh: 'Undosh o‘zgarishi', plural: 'Ko‘plik', demo: 'Ko‘rsatish olmoshlari', pron: 'Kishilik olmoshlari', adj: 'Sifatlar', ant: 'Antonimlar', num: 'Sonlar', order: 'Gap tuzilishi', alifbo: 'Alifbo', harf: 'Harflar' }[a] || k; }

/* ===== Lug'at, grammatika, kelishiklar, o'yinlar ===== */
function translit(s) { return TR.low(s).replace(/ç/g, 'ch').replace(/ş/g, 'sh').replace(/c/g, 'j').replace(/([aeıioöuü])ğ/g, '$1:').replace(/ğ/g, '').replace(/ı/g, 'ı').replace(/ö/g, 'o‘').replace(/ü/g, 'ü'); }
function inflectHTML(trw) {
  const w = cleanTr(TR.low(trw));
  if (TR.isVerb(w)) { const ts = ['yor', 'di', 'ecek', 'r', 'mis', 'mali']; return `<div class="twrap"><table><tr><th></th>${ts.map(t => `<th>${TENSE_UZ[t].split(' (')[0]}</th>`).join('')}</tr>${TR.PERS.map(p => `<tr><td><b>${TR.PRON[p]}</b></td>${ts.map(t => `<td>${esc(TR.conj(w, t, p))}</td>`).join('')}</tr>`).join('')}<tr><td><b>inkor (ben)</b></td>${ts.map(t => `<td>${esc(TR.conj(w, t, '1sg', true))}</td>`).join('')}</tr></table></div>`; }
  if (/\s/.test(w)) return '';
  return `<div class="twrap"><table><tr><th>Kelishik</th><th>Birlik</th><th>Ko‘plik</th><th>Egalik (mening)</th></tr>${TR.CASES.map(c => `<tr><td>${TR.CASE_NAMES[c]}</td><td>${esc(TR.caseForm(w, c))}</td><td>${esc(TR.caseForm(TR.plural(w), c))}</td><td>${esc(TR.possCase(w, '1sg', c))}</td></tr>`).join('')}</table></div>`;
}
function bookExamples(trw, n = 3) { const idx = sentIndex()[norm(cleanTr(trw))]; return idx ? shuffle(idx).slice(0, n).map(i => BOOK.sents[i]) : []; }
function wordCard(w) {
  const tr = cleanTr(w.tr), syn = (SYN[TR.low(tr)] || []).filter(x => !x.endsWith('_x')), ant = ANT[TR.low(tr)], ex = bookExamples(tr), st = S.words[w.n];
  modal(`<div class="row"><h2 style="margin:0">${esc(tr)}</h2>${canSpeak() ? '<button class="btn sm sec" id="wcs">🔊</button>' : ''}<span class="sp"></span><button class="iconbtn" id="wcx">✕</button></div>
   <div class="muted small">[${esc(translit(tr))}] · ${esc(w.p || '')} · ${w.n < 1e4 ? wordLevel(w.n) + ' · ' + wordCat(w.n) : (w.lvl || '') + ' · AI lug‘at'}${st ? ' · SRS quti ' + st.box : ''}</div>
   <p style="font-size:18px;margin:10px 0"><b>${esc(w.uz)}</b></p>${w.note ? `<div class="note">⚠ ${esc(w.note)}</div>` : ''}

   ${w.ex ? `<p class="small"><b>Misol:</b> ${esc(w.ex)}<br><span class="muted">${esc(w.exuz || '')}</span></p>` : ''}
   ${ex.length ? `<h3>Kitobdan misollar</h3>${ex.map(s => `<p class="small">• ${esc(s[1])} <span class="muted">(${s[0]}-bet)</span></p>`).join('')}` : ''}
   <h3>Qo‘shimchalar bilan o‘zgarishi</h3>${inflectHTML(tr)}
   <div class="row" style="margin-top:12px"><button class="btn sm vio" id="wcai">🤖 To‘liq tahlil (AI)</button><button class="btn sm sec" id="wct">Shu so‘zdan 5 ta mashq</button></div><div id="wcaio"></div>`, (box, close) => {

    $('#wcai', box).onclick = async () => { const o = $('#wcaio', box); o.innerHTML = '<p><span class="spin"></span></p>'; try { const r = await aiLookup(tr); o.innerHTML = lookupHTML(r); } catch (e) { o.innerHTML = `<div class="note">${aiErr(e)}</div>`; } };
  });
}

  if (id === 'chain') { const dict = uniq(WORDS.filter(isSingle).map(w => TR.low(cleanTr(w.tr)))); let cur = pick(dict), used = new Set([cur]), sc = 0, lives = 3; const r = (msg = '') => { const last = cur.slice(-1); box.innerHTML = `<div class="card"><div class="row"><b>${sc} ball</b><span class="sp"></span><span>${'❤️'.repeat(lives)}</span></div><div class="q-prompt"><small>Oldingi so‘z</small><div class="w">${esc(cur)}</div><div class="muted small">«${last}» harfi bilan boshlanadigan so‘z yozing (lug‘atdagi)</div></div><div class="row"><input id="chi" style="flex:1" autocomplete="off"><button class="btn" id="chg">Yuborish</button></div><div class="small" style="margin-top:8px">${msg}</div><button class="btn ghost sm" id="chq" style="margin-top:8px">Tugatish</button></div>`; $('#chi').focus(); const send = () => { const w = TR.low($('#chi').value.trim()); if (!w) return; if (w[0] !== last) { lives--; return lives ? r(`❌ «${last}» harfi bilan boshlanishi kerak`) : gameEnd(id, sc, box); } if (used.has(w)) return r('⚠ Bu so‘z ishlatilgan'); if (!dict.includes(w)) { lives--; return lives ? r(`❌ «${esc(w)}» lug‘atda yo‘q`) : gameEnd(id, sc, box); } used.add(w); sc += 10; const next = shuffle(dict.filter(x => x[0] === w.slice(-1) && !used.has(x)))[0]; if (!next) return gameEnd(id, sc + 20, box, '<p>Kompyuter javob topa olmadi — siz yutdingiz!</p>'); used.add(next); cur = next; r(`✅ «${esc(w)}» qabul qilindi. Kompyuter: «${esc(next)}» (${esc((TR_INDEX[norm(next)] || [{}])[0].uz || '')})`); }; $('#chg').onclick = send; $('#chi').onkeydown = e => e.key === 'Enter' && send(); $('#chq').onclick = () => gameEnd(id, sc, box); }; r(); }
  if (id === 'quiz') runQuiz(box, Array.from({ length: 10 }, () => Math.random() < .55 ? vocabQ(pick(WORDS), pick(['tr2uz', 'uz2tr', 'pic', 'context'])) : genQ(pick(['case', 'tense:yor', 'tense:di', 'poss', 'plural', 'adj']))), { title: G0[2], tag: 'game', act: 'game', onFinish: rec => { const g = S.games[id] = S.games[id] || { best: 0, plays: 0 }; g.best = Math.max(g.best, rec.correct * 10); g.plays++; save(); } });
  if (id === 'battle') { let lives = 3, sc = 0, streakN = 0; const list = ws(); let i = 0; const r = (fb = '') => { const w = list[i % list.length]; box.innerHTML = `<div class="card"><div class="row"><b>${sc} ball</b><span class="pill v">seriya ×${streakN}</span><span class="sp"></span><span>${'❤️'.repeat(lives)}${'🤍'.repeat(3 - lives)}</span></div><div class="q-prompt"><small>Turkchasini yozing</small><div class="w">${esc(w.uz)}</div></div><div class="row"><input id="bi" style="flex:1" autocomplete="off"><button class="btn" id="bg">OK</button></div><div class="small" style="margin-top:8px">${fb}</div></div>`; $('#bi').focus(); const send = () => { const ok = acceptTr(w).includes(norm($('#bi').value)); srs(w.n, ok); i++; if (ok) { streakN++; sc += 10 * Math.min(5, streakN); r(`✅ To‘g‘ri!`); } else { streakN = 0; lives--; addMistake({ cat: 'imlo', key: 'w' + w.n, q: w.uz, wrong: $('#bi').value, right: cleanTr(w.tr), wordN: w.n, src: 'game' }); if (!lives) return gameEnd(id, sc, box, `<p>Oxirgi so‘z: ${esc(w.uz)} — <b>${esc(cleanTr(w.tr))}</b></p>`); r(`❌ To‘g‘ri javob: <b>${esc(cleanTr(w.tr))}</b>`); } }; $('#bg').onclick = send; $('#bi').onkeydown = e => e.key === 'Enter' && send(); }; r(); }
  if (id === 'listen') { if (!canSpeak()) { box.innerHTML = '<div class="card empty">Bu qurilmada turkcha ovoz topilmadi, shuning uchun bu o‘yin ishlamaydi. Brauzeringizda turkcha nutq ovozini o‘rnating yoki kompyuterdan oching.</div>'; return; } runQuiz(box, ws().slice(0, 10).map(w => vocabQ(w, 'listen')), { title: G0[2], tag: 'game', act: 'game', skill: 'listening', onFinish: rec => { const g = S.games[id] = S.games[id] || { best: 0, plays: 0 }; g.best = Math.max(g.best, rec.correct * 10); g.plays++; save(); } }); }
  if (id === 'daily') { if (S.dailyDone?.[todayStr()] != null) { box.innerHTML = `<div class="card empty">✅ Bugungi viktorina bajarildi (${S.dailyDone[todayStr()]} ball). Ertaga yangi savollar! Ketma-ket: ${dailyStreak()} kun.</div>`; return; } let seed = +todayStr().replace(/-/g, ''); const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280; const list = WORDS.filter(w => w.n < 1e4).sort(() => rnd() - .5).slice(0, 7); const qs = [...list.map((w, k) => vocabQ(w, ['tr2uz', 'uz2tr', 'context', 'detect', 'pic', 'blank', 'syn'][k])), caseQ(), tenseQ('di'), contrastQ()]; runQuiz(box, qs, { title: 'Kunlik viktorina', tag: 'game', act: 'game', onFinish: rec => { S.dailyDone = S.dailyDone || {}; S.dailyDone[todayStr()] = rec.correct * 10; const g = S.games.daily = S.games.daily || { best: 0, plays: 0 }; g.best = Math.max(g.best, rec.correct * 10); g.plays++; save(); } }); }
};

/* ===== Kutubxona, o'qish, tinglash, yozish, gapirish, tarjima, AI o'qituvchi, imtihon markazi ===== */
const BKEY = 'narjan_books_v1';
let UBOOKS = []; try { UBOOKS = JSON.parse(lsGet(BKEY) || '[]'); } catch (e) { UBOOKS = []; }
function saveBooks() { if (!lsSet(BKEY, JSON.stringify(UBOOKS))) toast('Qurilma xotirasi to‘ldi — kitob saqlanmadi'); }
function getBook(id) { if (id === 'b1') return { id: 'b1', title: 'Türkçe 100 Metin', author: 'A.B. Babjanova, E.M. Tubajanov (2021)', pages: BOOK.pages, toc: BOOK.toc, first: 7 }; return UBOOKS.find(b => b.id === id); }
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
function tokenSpans(text) { return esc(text).replace(/([A-Za-zÇĞİÖŞÜçğıöşüÂâÎîÛû’']+)/g, '<span class="w-tap">$1</span>'); }
function textOfToc(i) { const k = BOOK.toc.findIndex(t => t.i === i); if (k < 0) return ''; const a = BOOK.toc[k].p, b = (BOOK.toc[k + 1] || { p: a + 3 }).p; let out = []; for (let p = a; p < b && p <= BOOK.pages.length; p++) BOOK.pages[p - 1].b.forEach(([t, x]) => { if (t === 'p') out.push(x); }); return out.join('\n'); }

/* So'z ustiga bosish: mahalliy tahlil + AI */
function wordPopup(raw) {
  const w = raw.replace(/[’'].*$/, ''); const an = TR.analyze(raw).concat(TR.analyze(w)); const hit = uniq(an.map(x => x.root)).map(r => an.find(x => x.root === r));
  modal(`<div class="row"><h2 style="margin:0">${esc(raw)}</h2>${canSpeak() ? '<button class="btn sm sec" id="wps">🔊</button>' : ''}<span class="sp"></span><button class="iconbtn" id="wpx">✕</button></div>
   ${hit.length ? hit.map(x => `<div class="info"><b>${esc(x.root)}</b> — ${esc(x.e.uz)}<div class="small">${esc(x.desc)}</div></div>`).join('') : '<p class="small muted">Asosiy lug‘atda topilmadi.</p>'}
   <div id="wpai"><p class="small"><span class="spin"></span> AI tahlil qilmoqda...</p></div>
   <div class="row" style="margin-top:8px"><button class="btn sm" id="wpadd">+ Lug‘atga qo‘shish</button><a class="btn sm sec" href="#translate/word/${encodeURIComponent(w)}">To‘liq tahlil</a></div>`, async (box, close) => {
    $('#wpx', box).onclick = close; if ($('#wps', box)) $('#wps', box).onclick = () => speakTr(raw);
    let tr = null;
    $('#wpadd', box).onclick = async () => { const uz = tr || (hit[0] && hit[0].e.uz) || await askText('O‘zbekcha tarjimasi:'); if (uz) { addUserWord(tr ? (box.dataset.base || w) : w, uz); close(); } };
    try { const r = await aiJSON(`Turkcha so‘z: «${raw}». JSON: {"base":"lug‘at shakli","uz":"o‘zbekcha tarjima (shu shaklda)","analysis":"qo‘shimchalar tahlili, o‘zbekcha, qisqa"}`, { tier: 'quick' }); tr = r.uz; box.dataset.base = r.base; $('#wpai', box).innerHTML = `<div class="info"><b>${esc(r.base)}</b> → <b>${esc(r.uz)}</b><div class="small">${esc(r.analysis)}</div></div>`; } catch (e) { $('#wpai', box).innerHTML = `<p class="small muted">${aiErr(e)}</p>`; }
  });
}

function diffWords(a, b) {
  const A = a.split(/\s+/).filter(Boolean), B = b.split(/\s+/).filter(Boolean); const n = A.length, m = B.length; if (n * m > 400000) return esc(b);
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  let i = 0, j = 0; const out = [];
  while (i < n && j < m) { if (A[i] === B[j]) { out.push(esc(A[i])); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push(`<del>${esc(A[i])}</del>`); i++; } else { out.push(`<ins>${esc(B[j])}</ins>`); j++; } }
  while (i < n) out.push(`<del>${esc(A[i++])}</del>`); while (j < m) out.push(`<ins>${esc(B[j++])}</ins>`);
  return out.join(' ');
}

async function aiLookup(word) {
  return aiJSON(`Foydalanuvchi so‘z kiritdi: «${word}». U turkcha yoki o‘zbekcha bo‘lishi mumkin, xato yozilgan bo‘lishi ham mumkin.\nJSON: {"input":"${word.replace(/"/g, '')}","lang":"tr|uz","corrected":"agar xato yozilgan bo‘lsa to‘g‘ri turkcha shakli, aks holda null","base":"asosiy (lug‘at) shakli, agar qo‘shimchali bo‘lsa","translation":"asosiy tarjima (turkcha bo‘lsa o‘zbekchaga, o‘zbekcha bo‘lsa turkchaga)","meanings":["boshqa ma’nolar"],"pos":"so‘z turkumi (o‘zbekcha)","pronunciation":"o‘qilishi, o‘zbek lotinida, urg‘u bilan","usage":"turk tilida qanday ishlatilishi (o‘zbekcha)","examples":[{"tr":"..","uz":".."},{"tr":"..","uz":".."},{"tr":"..","uz":".."}],"synonyms":[".."],"antonyms":[".."],"analysis":"grammatik tahlil: o‘zak + qo‘shimchalar va ularning vazifasi (o‘zbekcha)","forms":[{"form":"..","uz":".."}]}. Agar fe’l bo‘lsa forms ga asosiy zamon shakllarini (hozirgi -yor, o‘tgan -di, kelasi -ecek, -meli va h.k., 1-shaxs) ber.`, { tier: 'default' });
}
function lookupHTML(r) {
  return `<div class="card" style="box-shadow:none;margin:8px 0 0">${r.corrected ? `<div class="note">✏️ To‘g‘ri yozilishi: <b>${esc(r.corrected)}</b></div>` : ''}<div class="row"><h2 style="margin:0">${esc(r.base || r.input)}</h2>${canSpeak() && r.lang !== 'uz' ? `<button class="btn sm sec" onclick="speakTr('${esc((r.corrected || r.base || r.input).replace(/'/g, ''))}')">🔊</button>` : ''}<span class="pill v">${esc(r.pos || '')}</span></div>
   <p style="font-size:18px"><b>${esc(r.translation)}</b></p>${r.meanings?.length ? `<p class="small"><b>Boshqa ma’nolari:</b> ${r.meanings.map(esc).join('; ')}</p>` : ''}<p class="small"><b>Talaffuzi:</b> ${esc(r.pronunciation || '')}</p><p class="small"><b>Ishlatilishi:</b> ${esc(r.usage || '')}</p>
   <h3>Misollar</h3><div class="list">${(r.examples || []).map(x => `<div class="it"><b>${esc(x.tr)}</b><div class="small muted">${esc(x.uz)}</div></div>`).join('')}</div>
   ${r.forms?.length ? `<h3>Shakllari</h3><div class="list">${r.forms.map(f => `<div class="it row"><b style="min-width:140px">${esc(f.form)}</b><span class="small">${esc(f.uz)}</span></div>`).join('')}</div>` : ''}
   <p class="small"><b>Sinonimlar:</b> ${(r.synonyms || []).map(esc).join(', ') || '—'} · <b>Antonimlar:</b> ${(r.antonyms || []).map(esc).join(', ') || '—'}</p><p class="small"><b>Grammatik tahlil:</b> ${esc(r.analysis || '')}</p><p class="tiny muted">AI tahlili</p></div>`;
}
function localLookup(q) {
  const n = norm(q), f = TR.fold(q); const out = { exact: [], forms: [], uz: [], fuzzy: [] };
  out.exact = WORDS.filter(w => norm(cleanTr(w.tr)) === n || TR.fold(cleanTr(w.tr)) === f);
  out.forms = TR.analyze(q).filter(x => !out.exact.includes(x.e));
  out.uz = WORDS.filter(w => norm(w.uz).split(/[\/,;()]\s*|\s+\/\s+/).some(p => p.trim() === n) || (n.length > 3 && norm(w.uz).includes(n))).slice(0, 8);
  if (!out.exact.length && !out.forms.length && !out.uz.length) out.fuzzy = WORDS.map(w => [w, TR.lev(TR.fold(cleanTr(w.tr)), f)]).filter(x => x[1] <= 2).sort((a, b) => a[1] - b[1]).slice(0, 5).map(x => x[0]);
  return out;
}
async function textAnalysisAI(text) {
  return aiJSON(`Turkcha matnni gapma-gap o‘zbekchaga tarjima qil va tahlil qil.\nMatn: """${text.slice(0, 3500)}"""\nJSON: {"full":"butun matnning o‘zbekcha tarjimasi","sentences":[{"tr":"asl gap","uz":"tarjima","structure":"gap tuzilishi: ega, kesim, to‘ldiruvchi (o‘zbekcha qisqa)","cases":[{"word":"..","case":"tushum|yo‘nalish|o‘rin-payt|chiqish|qaratqich","why":"nega shu kelishik"}],"verbs":[{"word":"..","root":"masdar","tense":"zamon/mayl","person":"shaxs","uz":"tarjimasi"}]}],"hard":[{"w":"murakkab so‘z yoki ibora","uz":"ma’nosi","note":"izoh"}]}`);
}
function textResultHTML(text, r) {
  let orig = esc(text); (r.hard || []).forEach(h => { if (h.w) orig = orig.replace(new RegExp(esc(h.w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), `<span class="hl" title="${esc(h.uz)}">${esc(h.w)}</span>`); });
  return `<div class="grid2"><div><h3>Asl matn</h3><div style="white-space:pre-wrap">${orig}</div></div><div><h3>Tarjima</h3><div style="white-space:pre-wrap" id="fulltr">${esc(r.full || '')}</div><button class="btn sm ghost" id="cpy" style="margin-top:6px">📋 Nusxalash</button></div></div>
   ${(r.hard || []).length ? `<h3>Murakkab so‘zlar</h3><div class="list">${r.hard.map(h => `<div class="it"><b>${esc(h.w)}</b> — ${esc(h.uz)} <span class="small muted">${esc(h.note || '')}</span></div>`).join('')}</div>` : ''}
   <h3>Gapma-gap tahlil</h3>${(r.sentences || []).map((s, k) => `<details class="card" style="box-shadow:none;padding:12px" ${k === 0 ? 'open' : ''}><summary><b>${esc(s.tr)}</b><div class="small muted">${esc(s.uz)}</div></summary><p class="small"><b>Tuzilishi:</b> ${esc(s.structure || '')}</p>${(s.cases || []).length ? `<p class="small"><b>Kelishiklar:</b></p><ul class="small">${s.cases.map(c => `<li><b>${esc(c.word)}</b> — ${esc(c.case)}: ${esc(c.why)}</li>`).join('')}</ul>` : ''}${(s.verbs || []).length ? `<p class="small"><b>Fe’llar va zamonlar:</b></p><ul class="small">${s.verbs.map(c => `<li><b>${esc(c.word)}</b> ← ${esc(c.root)} · ${esc(c.tense)} · ${esc(c.person)} — ${esc(c.uz)}</li>`).join('')}</ul>` : ''}</details>`).join('')}<p class="tiny muted">AI tarjimasi va tahlili.</p>`;
}
function localAnalysisHTML(text) {
  const toks = uniq((text.match(/[A-Za-zÇĞİÖŞÜçğıöşü]+/g) || []).map(t => t));
  const rows = toks.map(t => [t, TR.analyze(t)[0]]).filter(x => x[1]);
  return `<h3>Oflayn tahlil (lug‘atdagi so‘zlar)</h3><div class="twrap"><table><tr><th>So‘z</th><th>Asos</th><th>Ma’no</th><th>Shakl</th></tr>${rows.map(([t, a]) => `<tr><td>${esc(t)}</td><td>${esc(a.root)}</td><td>${esc(a.e.uz)}</td><td class="small">${esc(a.desc)}</td></tr>`).join('') || '<tr><td colspan="4">Lug‘atdagi so‘z topilmadi</td></tr>'}</table></div><p class="tiny muted">${rows.length}/${toks.length} ta so‘z oflayn tanildi. To‘liq tarjima uchun AI kerak.</p>`;
}

    box.onclick = e => { const b = e.target.closest('[data-n]'); if (!b) return; const n = +b.dataset.n, seen = new Set(S.seen); const out = []; let g = 0; while (out.length < n && g++ < n * 6) { const r = Math.random(); const q = r < .35 ? vocabQ(pick(WORDS), pick(VTYPES)) : r < .55 ? genQ('case') : r < .75 ? genQ(pick(['tense:yor', 'tense:di', 'tense:ecek', 'tense:r', 'tense:mis', 'tense:mali', 'neg', 'question'])) : r < .9 ? genQ(pick(['poss', 'plural', 'undosh', 'verbal', 'pron', 'demo', 'adj', 'num'])) : topicQuestions(pick(G), 1)[0]; if (!q || seen.has(q.q) && g < n * 4) continue; seen.add(q.q); seenAdd(q.q); out.push(q); } if (b.dataset.speed) runQuiz(box, out, { title: 'Vaqt bilan test', tag: 'mixed', timed: +b.dataset.t * 60, onClose: () => route() }); else runExam(box, out, { title: `Aralash test (${n})`, tag: 'mixed', timed: +b.dataset.t * 60, draftKey: 'mixed' + n, onClose: () => route() }); };

     <div class="grid">${[['easy', 'Oson', 'B1'], ['mid', 'O‘rta', 'B2'], ['hard', 'Qiyin', 'C1']].map(x => `<button class="tile" data-d="${x[0]}" data-l="${x[2]}"><b>${x[1]}</b><small>${x[2]} darajadagi matn va topshiriqlar</small></button>`).join('')}</div></div>`;
    if ($('#mres')) $('#mres').onclick = () => mockStage(box);

    box.onclick = async e => { const b = e.target.closest('[data-d]'); if (!b) return; if (S.mockRun && !(await ask('Tugallanmagan imtihon bekor qilinadi. Davom etasizmi?'))) return; S.mockRun = { lvl: b.dataset.l, diff: b.dataset.d, stage: 0, sec: {}, d: todayStr() }; if (S.drafts) Object.keys(S.drafts).filter(k => k.startsWith('mock')).forEach(k => delete S.drafts[k]); save(); mockStage(box); };

const MOCK_ORDER = ['reading', 'listening', 'writing', 'speaking'], MOCK_SEC = { reading: 'O‘qish', listening: 'Tinglash', writing: 'Yozish', speaking: 'Gapirish' };
function mockNext(box) { S.mockRun.stage++; save(); mockStage(box); }
async function mockStage(box) {
  const M = S.mockRun; if (!M) return route(); const sec = MOCK_ORDER[M.stage];
  if (!sec) return mockFinish(box);
  box.onclick = null;
  const L = M.lvl;
  if (sec === 'reading') {
    if (!M.readQs) {

      const texts = shuffle(BOOK.toc.filter(t => t.i > 1 && textLevel(t.i) === L)).slice(0, 2); const pr = PLACE_READ.find(p => p.l === L);
      let qs = pr.q.map(x => ({ kind: 'mc', cat: 'oqish', key: 'mock:read', label: 'Matnni o‘qing', prompt: pr.t, sub: '❓ ' + x[0], small: true, opts: shuffle(x[1]), answer: x[1][x[2]], q: x[0] }));
      for (const t of texts) { const tx = textOfToc(t.i); try { const arr = await aiJSON(`Turkcha matn bo‘yicha ${L} darajali 5 ta o‘qib tushunish savoli tuz (turkcha, 4 variant).\nMatn: """${tx.slice(0, 4000)}"""\nJSON: [{"q":"..","options":["..","..","..",".."],"answer":0,"explain":"o‘zbekcha"}]`); qs.push(...arr.map(x => ({ kind: 'mc', cat: 'oqish', key: 'mock:read', label: `«${t.t}» matni`, prompt: tx.slice(0, 1800) + (tx.length > 1800 ? '…' : ''), sub: '❓ ' + x.q, small: true, opts: shuffle(x.options), answer: x.options[x.answer] ?? x.options[0], why: x.explain, q: x.q }))); } catch (e) { qs.push(...clozeQs(tx, 5).map(q => ({ ...q, label: `«${t.t}» — bo‘shliqni to‘ldiring` }))); } }
      M.readQs = qs; save();
    }
    return runExam(box, M.readQs, { title: 'Sinov imtihoni · O‘qish', tag: 'mock-read', timed: 25 * 60, draftKey: 'mock_read', onSubmit: rec => { M.sec.reading = Math.round(rec.pct / 4); delete M.readQs; addSkill('reading', rec.pct); mockNext(box); } });
  }
  if (sec === 'listening') {
    if (!canSpeak()) { M.sec.listening = null; box.innerHTML = '<div class="card"><h2>Tinglash bo‘limi</h2><div class="note">Bu qurilmada turkcha nutq ovozi yo‘q, shuning uchun tinglash bo‘limi baholanmaydi.</div><button class="btn" id="mn">Keyingi bo‘lim →</button></div>'; $('#mn').onclick = () => mockNext(box); return; }
    if (!M.lisQs) { const ds = DIALOGS.filter(d => d.l === L); const qs = []; ds.forEach(d => { const full = d.lines.map(l => l[1]).join(' '); d.q.forEach((x, k) => qs.push({ kind: 'mc', cat: 'tinglash', key: 'mock:listen', label: `Dialog: ${d.t} — tinglang`, hidePrompt: true, speak: k === 0 ? full : full, prompt: '🔊', sub: x[0], opts: shuffle(x[1]), answer: x[1][x[2]], q: x[0] })); }); PLACE_LISTEN.filter(x => x[0] === L).forEach(x => qs.push({ kind: 'mc', cat: 'tinglash', key: 'mock:listen', label: 'Eshitganingizni tanlang', hidePrompt: true, speak: x[1], prompt: '🔊', opts: shuffle(x[2]), answer: x[1], q: x[1] })); M.lisQs = qs; save(); }
    box.innerHTML = '';
    return runExam(box, M.lisQs.map(q => ({ ...q, prompt: q.sub ? q.sub : q.prompt, hidePrompt: true })), { title: 'Sinov imtihoni · Tinglash', tag: 'mock-listen', timed: 15 * 60, draftKey: 'mock_listen', onSubmit: rec => { M.sec.listening = Math.round(rec.pct / 4); delete M.lisQs; addSkill('listening', rec.pct); mockNext(box); } });
  }
  if (sec === 'writing' || sec === 'speaking') {
    const isW = sec === 'writing'; const task = isW ? (M.wTask = M.wTask || pick(WRITE_TASKS[L])) : (M.sTask = M.sTask || pick(['Kendinizi tanıtın ve Türkçeyi neden öğrendiğinizi anlatın. Ardından: Teknoloji eğitimi nasıl değiştiriyor? Görüşünüzü örneklerle açıklayın.', 'Yaşadığınız şehri tanıtın. Ardından: Büyük şehirde mi, küçük bir kasabada mı yaşamak daha iyidir? Nedenleriyle anlatın.', 'Unutamadığınız bir yolculuğu anlatın. Ardından: Seyahat etmek insanı nasıl değiştirir?']));
    const dk = 'mock_' + sec; S.drafts = S.drafts || {}; let left = S.drafts[dk]?.left ?? (isW ? 1800 : 600); let usedMic = false, stopM = null;
    box.innerHTML = `<div class="card"><div class="row"><b>Sinov imtihoni · ${MOCK_SEC[sec]}</b><span class="sp"></span><span class="timer pill a" id="mt">⏱ ${fmtT(left)}</span></div><p><b>Topshiriq:</b> ${esc(task)}</p>${!isW ? `<p class="small muted">${micSupported() ? 'Mikrofon tugmasini bosib gapiring (matnga o‘giriladi).' : 'Bu qurilmada mikrofon orqali matnga o‘girish yo‘q — javobni yozing (talaffuz baholanmaydi).'}</p>${micSupported() ? '<button class="btn sec" id="mmic">🎙️ Gapirish</button>' : ''}` : ''}<textarea id="mtx" style="min-height:220px;margin-top:8px">${esc(S.drafts[dk]?.text || '')}</textarea><div class="row" style="margin-top:8px"><span class="small muted" id="mwc"></span><span class="sp"></span><button class="btn green" id="msub">Topshirish</button></div><div id="mst"></div></div>`;
    const persist = () => { S.drafts[dk] = { text: $('#mtx').value, left }; save(); };
    $('#mtx').oninput = () => { $('#mwc').textContent = ($('#mtx').value.match(/\S+/g) || []).length + ' so‘z'; persist(); };
    if ($('#mmic')) $('#mmic').onclick = () => { if (stopM) { stopM(); stopM = null; $('#mmic').textContent = '🎙️ Gapirish'; return; } usedMic = true; $('#mmic').textContent = '⏹ To‘xtatish'; stopM = startMic((t, fin) => { if (fin) { $('#mtx').value += ' ' + t; persist(); } }, s => { if (s === 'idle') { stopM = null; $('#mmic').textContent = '🎙️ Gapirish'; } }); };
    let tid = setInterval(() => { left--; $('#mt') && ($('#mt').textContent = '⏱ ' + fmtT(left)); if (left % 10 === 0) persist(); if (left <= 0) { clearInterval(tid); toast('Vaqt tugadi — avtomatik topshirildi'); submit(); } }, 1000);
    ROUTE_CLEANUP = () => { clearInterval(tid); persist(); };
    const submit = async () => {
      clearInterval(tid); const text = $('#mtx').value.trim(); $('#msub').disabled = true;
      if (!text) { M.sec[sec] = 0; delete S.drafts[dk]; return mockNext(box); }
      $('#mst').innerHTML = '<p><span class="spin"></span> AI baholamoqda...</p>';
      try {
        const r = await aiJSON(`Turk tili sinov imtihoni (${L} daraja), ${isW ? 'YOZISH' : 'GAPIRISH (' + (usedMic ? 'ovozdan matnga o‘girilgan' : 'yozib kiritilgan') + ')'} bo‘limi. Topshiriq: ${task}\nJavob: """${text}"""\nCEFR mezonlari bo‘yicha (topshiriqni bajarish, grammatika, lug‘at, bog‘lanish${isW ? ', imlo' : ', ravonlik'}) 0–25 ball qo‘y. JSON: {"score":0-25,"level":"A1..C1","comment":"o‘zbekcha 2-3 gap","errors":[{"orig":"..","fix":"..","why":".."}]}`);

      } catch (e) { M.sec[sec] = null; M[sec + 'Fb'] = aiErr(e); }
      delete S.drafts[dk]; save(); mockNext(box);
    };
    $('#msub').onclick = async () => { if (await ask('Topshirasizmi?', 'Topshirish')) submit(); };
  }
}
function mockFinish(box) {
  const M = S.mockRun; const vals = MOCK_ORDER.map(k => M.sec[k]); const graded = vals.filter(x => x != null);
  const total = graded.length ? Math.round(graded.reduce((a, b) => a + b, 0) * (4 / graded.length)) : 0;
  const rec = total >= 89 ? 'C1+' : total >= 71 ? 'C1' : total >= 55 ? 'B2' : total >= 40 ? 'B1' : 'A2 yoki past';
  const minOk = graded.every(x => x >= 12.5);
  const weak = MOCK_ORDER.filter(k => M.sec[k] != null).sort((a, b) => M.sec[a] - M.sec[b])[0];
  S.mocks = S.mocks || []; S.mocks.push({ d: todayStr(), lvl: M.lvl, diff: M.diff, sec: { ...M.sec }, total, rec }); S.tests.push({ type: 'mock', title: 'Sinov imtihoni', d: todayStr(), total: 100, correct: total, pct: total }); logAct('mock', 30);

   ${barChart(MOCK_ORDER.map(k => ({ l: MOCK_SEC[k], v: M.sec[k] ?? 0, c: M.sec[k] == null ? 'var(--line)' : 'var(--blue)' })), { max: 25 })}</div>
   <div class="card"><h3>Bo‘limlar tahlili</h3><div class="list">${MOCK_ORDER.map(k => `<div class="it row"><b style="flex:1">${MOCK_SEC[k]}</b><span>${M.sec[k] == null ? 'baholanmadi' : M.sec[k] + '/25'}</span></div>`).join('')}</div>${fb.w ? `<p class="small"><b>Yozish:</b> ${esc(fb.w)}</p>` : ''}${fb.s ? `<p class="small"><b>Gapirish:</b> ${esc(fb.s)}</p>` : ''}
   <h3>Keyingi tayyorgarlik rejasi</h3><ul>${weak ? `<li>Eng zaif bo‘lim — <b>${MOCK_SEC[weak]}</b>: har kuni <a href="#${weak}">${MOCK_SEC[weak]} bo‘limida</a> kamida bitta mashq.</li>` : ''}<li><a href="#errors">Xatolar daftari</a>dagi yangi xatolarni 3 kun ichida takrorlang.</li><li>Keyingi sinov imtihonini 14 kundan keyin topshiring.</li></ul><p class="tiny muted">Ball oralig‘i ilovaning ichki taxminiy shkalasi; rasmiy chegaralar uchun tys.yee.org.tr ni tekshiring. Bu natija rasmiy sertifikat emas.</p><a class="btn" href="#exam">Imtihon markaziga qaytish</a></div>`;
}
