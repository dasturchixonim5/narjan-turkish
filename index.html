etmekte olan bu sanat çok sevilmiş ve dünyanın her tarafında ilgiyle takip edile bir merak haline gelmiştir."],["l","A. Aşağıdaki soruları yanıtlayınız."],["l","1. Origami bir kağıdı .........., kesme, yapıştırma vb. gibi işlemlerden hiçbirine başvurmadan ............. oluşturma sanatıdır."],["l","a) katlayarak – figürler c) başvurarak - origami"],["l","b) yapıştırarak – kağıtlar d) kullanarak - figürler"],["l","e) yapıştırarak – figürler"],["l","2. Çiçek ve insan figürü gibi daha pek çok ................................. oluşturulabilir"],["l","a) nesne b) şey c) figűr d) kağıt e) özne"],["l","3. Sonra da bütün dünyaya yayılmış olan .......... ve ............ kağıt katlama sanatıdır."],["l","a) matimatiksel-görsel b) matimatiksel-zekasal"],["l","c) matimatiksel-akıllısal d) matimatiksel-gösterişsel"],["l","e) matimatiksel-görűşsel"],["l","4. Bizim bildiğimiz anlamda origami kelimesi ancak ....... yüzyılın sonlarında ve ...... yüzyılın başlarında kullanılmaya başlandı."],["l","a) 20.............19 b) 21..............18 c) 19................20"],["l","d) 19.................18 e) 19............21"]]},{"n":44,"b":[["l","5. Origami sadece .............sanatı mıdır?"],["l","a) metal b) madde c) kağıt d) parça e) kumaş"],["l","6. Origami kelimesinin anlamı nedir?"],["l","a) kağıt katlamak b) kağıt kesmek c) kağıt yapıştırmak"],["l","d) kağıt yırtmak e) kağıt boyamak"],["l","7. Origami ilk defa nerede ortaya çıkmıştır?"],["l","a) Japon Kraliyet Sarayında b) Çin Kraliyet Sarayında"],["l","c) İspanya Kraliyet Sarayında d) Yoshizawa Kraliyet Sarayında"],["l","e) Origami Tsuki Kraliyet Sarayında"],["l","8. Origami nasıl bir hobidir?"],["l","a) hem dinlenebileceğiniz hem de sanatsal"],["l","b) hem dinleyebileceğiniz hem de sanatsal"],["l","c) hem katlayarak hem de keserek"],["l","d) hem yapıştırarak hem de keserke"],["l","e) hem ilgi çekici hem de enteresan"],["l","9. Origami nasıl bir sanattır?"],["l","a) figürler kesme b) figürler yapıştırma c) figürler oluşturma"],["l","d) metal kesme e) madde kesme"],["l","10. Origami ile ne yapılır?"],["l","a) yiyecek ve içecekler b) hayvan, kuş ve insan figürleri"],["l","c) madde figürleri d) metal figürleri"],["l","e) hayvan, kuş ve metal figürleri"],["h","SAĞLIK VE SPOR"],["p","Günümüz insanının yaşamdan pek çok beklentisi var. İyi bir kariyer yapmak, iyi para kazanmak, gösterişli bir arabaya ve büyük bir eve sahip olmak... Ancak hepimizin tek bir ortak beklentisi var sanırım, mutlu olmak. Peki, mutlu olabilmemiz için fiziksel ve ruhsal yönden sağlıklı olmamız gerekmez mi?"],["p","“Sağlıklı olmak” herkes için farklı bir anlam taşıyabilir."]]},{"n":45,"b":[["p","Çoğumuz için ağrısız sızısız hareket edebilmek sağlıklı olmanın bir göstergesidir. Bazılarımıza göre ise sağlıklı olmanın gece yarılarına kadar dans edebilecek güce sahip olmaktır. Aslında işin özü “Kendimi çok iyi hissediyorum.” diyebilmektir."],["p","Formda ve sağlıklı bir insanın iyi bir dış görünüşü vardır, kasları kuvvetli, vücudu esnek, kalp ve damar sistemi dayanıklıdır. Ancak daha önemlisi o insan streslerinden, günlük yorgunluklarından kurtulabilmiş, yaşamdan mutluluk duymayı öğrenmiştir."],["p","Elbette sağlık için herkesin beslenmesine ve uyku düzenine dikkat etmesi, sigara gibi zararlı alışkanlıklardan uzak durması gereklidir, fakat bunlar yeterli değildir. Çünkü bedenimizin en önemli gereksinimlerinden biri de harekettir. Ancak bügun teknolojik araçlarla dolu hayatımızda yeterince hareket etmek neredeyse imkansızdır. Yürüyen merdivenler, asansörler, arabalar... Kabul etmeliyiz ki spor yapmak hepimiz için kaçınılmaz bir gereklilik artık. Hiç değilse kısa aralıklarla egzersiz yapmak yenilenmemizi ve kendimizi çok daha iyi hissetmemizi sağlayacaktır."],["p","Yalnız, şunu da unutmamak gerekir ki ancak düzenli egzersizler sağlığımızı olumlu etkileyebilir. Bu nedenle sporu günlük hayatımızın merkezine taşımamız gerekir."],["l","1. Aşağıdaki ifadelerin metinde olanlarını (V), yok olanlarını (Y) ile işaretleyiniz. 1- ( ) Sağlıklı olmak insanlar için ne anlama gelir? 2- ( ) Sağlıklı olmak için neler yapmalıyız? 3- ( ) Hangi sporlar vücudumuz için daha yararlı? 4- ( ) Günümüzde insanların hareketsizliğinin sebepleri nelerdir?"],["l","2. Aşağıdaki ifadelerin doğru olanlarını (D), yanlış olanlarını (Y) ile işaretleyiniz. 1- ( ) Fiziksel ve ruhsal açıdan sağlıklı olmadan tam olarak mutlu olamayız. 2- ( ) Kısa aralıklarla egzersiz yapmanın bize hiçbir yararı olmaz."]]},{"n":46,"b":[["p","3- ( ) Bedenimizin hareket ihtiyacını karşılayabilmek için spor yapmamız gerekir."],["p","4- ( ) Düzensiz egzersiz yapmak sağlığımızda önemli bir olumlu etki yaratmaz."],["p","Lütfen, soruları yanıtlayınız."],["l","1. Sağlıklı bir yaşam için neler yapmalıyız ?"],["l",".................................................................................................."],["l","2. Fiziksel ve Ruhsal sağlik için neler yapmak lazim ?"],["l",".................................................................................................."],["l","3. Abur cubur yemenin zararları nelerdir ?"],["l",".................................................................................................."],["l","4. Sağlıklı yiyecekleri sıralayınız."],["l",".................................................................................................."],["l","5. Insan nasıl uzun yaşar ?"],["l",".................................................................................................."],["p","Kelimeleri kendi dilinizde çeviriniz ve tanımını yapınız."],["p","ruhsal–"],["p","kasları –"],["p","gereksinimlerinden–"],["p","araçlarla–"],["p","Elbette–"],["h","SİGARA VE SAĞILIK"],["p","Dünyada önlenebilir hastalık ve erken ölüm nedenleri arasında en ön sırayı sigaraya bağlı olanlar alıyor. İçilen her sigara insan ömrünü 5 dakika kısaltıyor. Sigaranın içinde bulunan maddelerin çoğu kanser yapan maddelerdir. Sigara sadece içen kişiye değil, yanında sigara içilen kişilere de zarar vermektedir. Sigara içen annelerin doğurduğu çocuklarda zeka düşüklüğü ve zor öğrenme gibi hastalıklar görülmektedir."],["p","Sigara içme alışkanlığı hem binlerce kişinin erken ölümüne sebep olur hem de yol açtığı hastalıklar sebebiyle ekonomiye büyük yük getirir. Sigaranın sağılık ve ekonomik bakımdan getirdiği"]]},{"n":47,"b":[["p","zararları farkeden gelişmiş ülkelerde sigara karşıtı hareketler başlamıştır. Ama az gelişmiş ve gelişmekte olan ülkelerde sigara içme alışkanlığı gittikçe artarak her yıl bir milyona yakın insanın erken ölümüne sebep oluyor."],["p","Gelişmiş ülkelerde sigara tüketimi 1965 lerden sonra azalmış ama azgelişmiş ülkelerde sigara tüketimi artmaya devam ediyor. Çünkü kendi ülkelerinde sigara tüketimini azaltmaya çalışan gelişmiş ülkeler, ürettikleri sigarayı azgelişmiş ülkelere satmak için büyük reklamlar yaparak sigara içilmesini özendiriyorlar."],["p","Sigara karşıtı çalışmaların basın, yayın, televızyon, radio gibi araçların yardımıyla insanlara iletmesi gerekir. Temel amacı sigaranın sebep olduğu hastalıkları ve erken ölümleri azaltmak olacak bir programın uygulanmasıyla, binlerce insanın hastalık ve ölümlerden acı çekmesi ve bu problem için harcanan milyonlarca paranın ekonomiye verdiği zarar önlenecektir."],["l","A. Aşağıdaki Soruları Cevaplayınız."],["l","1. Sigara tüketimi hangi ülkelerde ne zaman azalmaya başlamıştır?"],["l","………………………………………………………………"],["l","2. Sigara tüketimi hangi ülkelerde artıyor? Niçin?"],["l","………………………………………………………………"],["l","3. Sigara topluma hangi yönlerde zarar veriyor?"],["l","………………………………………………………………"],["l","4. Sigaranın insan sağlığına etkileri nelerdir?"],["l","…………………………………………………………....…"],["l","5. Sigara karşıtı hareketlerin faydası nedir? Bu hareketler nasıl daha etkili olur?"],["l","………………………………………………………………"],["l","B. Aşağıdaki Cümlelerden Doğru Olanları D ,Yanlış Olanları Y ile işaretleyiniz."],["l","1. ( ) Gelişmiş ülkelerde sigara üretimi azalmıştır."],["l","2. ( ) Sigara sadece sağlığa değil,ekonomiye de zarar veriyor."],["l","3. ( ) Gelişmiş ülkelerde sigara içme alışkanlığı her yıl 1"]]},{"n":48,"b":[["p","milyon insanın ölümüne sebep oluyor."],["l","4. ( ) Azgelişmiş ülkelerde sigara karşıtı hareketler başarılı olmuştur."],["l","5. ( ) İçilen her sigara ömrünü biraz daha azaltır."],["h","SHREK"],["p","Çok eski zamanlarda, çok uzaklardaki bir bataklıkta Shrek adında yeşil ve kötü huylu bir canavar yaşamaktadır. Shrek çirkin görünümlü bir canavardır. Ancak bu durum Shrek’in canını hiç sıkmaz. Kendisine göveni tam olduğu için korkutucu dış görünümüne hiç aldırmaz. Sessiz sedasız sürüp giden düzeni birbirinden ilginç masal karakterlerinin ortaya çıkmasıyla içinden çıkılmaz bir hâl alır. Pamuk Prenses ve Yedi Cüceler, Kırmızı Başlıklı Kız, Pinokyo, Hain Kurt ve diğer tüm masal kahramanları kötü Lord Farquaad tarafından sürgün edilmiştir ve çareyi Shrek’in bataklığına sığınmakta bulmuşlardır. Yemeğinin içinde kör fareler, yatağında kötü kurtlar, evsiz barksız domuzlar ve daha niceleri dolaşmaktadır. Bu durumdan fazlasıyla raharsız olan Shrek, kahramanları bataklığından çıkarmak için harekete geçer. Lord Farquaad Shrek’e, nişanlısı güzel prenses Fiona’yı kurtarması karşılığında masal kahramanlarını bataklığından çıkaracağına söz verir. Bu yolculuğunda kendisine, onun için her şeyi yapmaya hazır geveze dostu akıllı eşek de yardım edecektir. Prenses Fiona’yı ağzından ateşler saçan ejderhanın elinden kurtarmak kolay olmayacaktır. Kendisine yardım etmek için görevlendirilen eşek ile birlikte yola çıkan Shrek prensesi ejderhadan kurtarmayı başarır. Ancak prensesin anlattıkları bu görevin henüz tamamlanmadığını göstermektedir. Yol boyunca onları birçok sürpriz beklemektedir."],["p","Asıl problem, güzel prensesin esrarengiz sırlarının ortaya çıkmasıyla başlayacaktır..."],["l","A. Aşağıdaki Soruları Cevaplayınız."],["l","1. Shrek nasıl bir yaratıktır?"],["l",".................................................................................................."],["l","2. Shrek’in rahatı niçin kaçmıştır?"],["l",".................................................................................................."]]},{"n":49,"b":[["l","3. Shrek’in yaşadığı yere kimler gelmiştir?"],["l",".................................................................................................."],["l","4. Shrek nasıl bir karaktere sahiptir?"],["l",".................................................................................................."],["l","5. Eşeğin karakteri nasıldır?"],["l",".................................................................................................."],["l","B. Okuduğunuz parçaya göre aşağıdaki cümlelerden doğru olanın başına “D” yanlış olanın başına “Y” yazınız."],["l","a. ( ) Shrek kraliçeyi kurtarmak için yola çıkar."],["l","b. ( ) Shrek dış görünüşüne aldırış etmez."],["l","c. ( ) Masal kahramanlarının bataklığa gelmesi Shrek’i mutlu eder."],["l","d. ( ) Eşek çok geveze bir hayvandır."],["l","e. ( ) Shrek bir çizgi filmdir."],["l","7. Okuduğunuz parçaya göre aşağıdaki cümlelerin boşluklarını tamamlayınız."],["l","a. Bu ........................................... Shrek’in canını hiç sıkmaz."],["l","b. Masal kahramanları Shrek’in bataklığına .............. mışlardır."],["l","c. Lord, Shrek’in bataklığını temizlemeye ....................... verir."],["l","d. Yol boyunca onları bir çok ............................. beklemektedir."],["l","e. Shrek filmi 74. Oscar ödüllerinde en iyi ...... film ödülü aldı."],["h","MODA TASARIMI"],["p","Türkiye’nin motor sektörlerinden biri tekstil sektörüdür. Ancak sektör son yıllarda üretim maliyetlerinin son derece düşük olduğu Çin, Hindistan gibi ülkelerin dünya tekstil piyasasında giderek artan hakimiyetleri sonucu önemli bir tehdit altındadır. Örneğin, 2000-2009 yılları arasında tekstil ürünlerinin toplam ihracat içindeki payı % 17’den % 9’a gerilemiştir. Pazar payında gerçekleşen bu yarı yarıya kayıp, sektörün ayakta kalmak için yeni stratejiler geliştirmesini zorunlu kılmaktadır."],["p","Moda tasarım sektörü bu bağlamda oldukça yenidir ve hızlı bir gelişim ivmesi sergilemektedir. Gerek artan tasarımcı"]]},{"n":50,"b":[["p","sayısı gerekse Türkiye’nin bu alanda marka olması için yürütülen çalışmalardaki artış dikkat çekicidir. Moda tasarım sektörü İstanbul odaklı gelişmektedir. 2010 yılında Moda Tasarım Derneği’n kayıtlı toplam 92 tasarımcı bulunmaktadır ve bunların hepsi İstanbul’da faaliyet göstermektedir."],["p","Moda tasarım sektöründe faaliyet gösteren işletmeler gerek istihdam gerekse sermaye açısından küçük ve orta ölçekli firmalardır. Bu nedenle kitlesel üretimde, dış pazarlara açılmada ve yeni teknolojilerin kullanımında çeşitli problemler yaşamakta ve kaynak sıkıntısı çekmektedirler. Moda tasarım sektörünün kalkınması, moda tasarımcılarının marka yaratarak tekstil ve hazır giyimin küresel ölçekte rekabet edebilmesi için moda tasarımcılarına finansal destek sağlanması gerekmektedir."],["l","(Kültür-Sanat Dergisi, Nisan 2013) Aşağıdaki test sorularına cevap veriniz."],["l","1. Türkiye’de gelişen sektörü belirleyiniz:"],["l","A) teknoloji B) teknik C) tekstil"],["l","D) hamur işler E) iletişim araçları"],["l","2. Hangi sektör hızlı gelişmektedir:"],["l","A) teknik B) moda tasarım C) teknoloji"],["l","D) iletişim araçları E) ayakkabı üretim"],["l","3. Moda tasarım sektörü Türkiye’nin hangi şehrinde gelişim göstermektdir?"],["l","A) Ankara B) İzmir C) İstanbul"],["l","D) Alanya E) Bursa"],["l","4. Moda tasarımcıları nerede faaliyet göstermektedir?"],["l","A) İzmir B) Ankara C) İstanbul"],["l","D) Bursa E) Eskişehir"],["l","5. Moda tasarım sektörünün kalkınması için ne gerekmektedir?"],["l","A) devlet adamlarıyla görüşme B) yurt dışına çıkmak"],["l","C) finansal destek D) fikir paylaşmak E) dernek kurmak"],["h","KELEBEĞİN ÖMRÜ"],["p","İşte hayat hikayem. Bir ilkbahar sabahıydı. Güneş, pırıl pırıl altın ışıklarını yer yüzüne yolluyordu. Bu ışınları gören kozalardan o"]]},{"n":51,"b":[["p","sabah beyaz bir kelebek çıktı. Çok büyük ve tül gibi ince bembeyaz kanatları vardı. Birden kendini bir bahçenin çiçekleri arasında buldu. Önce keşif uçuşuna çıkıp bahçeyi dolaştı. Sonra dinlenmek için kırmızı bir güle kondu. Dinlenirken, kanatlarını dikleştirip birleştirmişti. Etrafına baktı. Doyasıya yeşilliğe daldı saatlerce seyretti. Dinlenmişti. Şimdi dolaşma vaktiydi, yaşamalıydı, önünde uzun zamanı vardı. Ağaçlara uçtu. Çiçeklere kondu. Mutluydu, özgürdü. Herkes ona bakıp “ne güzel” diyordu. Akşama kadar çiçekten çiçeğe, daldan dala uçup durdu. Güneş batarken bir garip his kapladı içini, artık öğrenmişti. Sadece bir günlük olan ömrü bitmişti. Son bir kez etrafına baktı. Batan güneşe daldı. Ve bir daha hiç uyanmadı."],["l","I. Aşağıdaki sorulara cevap veriniz."],["l","1. Metinin ana fikri nedir?"],["l","………………………………………………………………"],["l","2. Olay nerede geçiyor?"],["l","………………………………………………………………"],["l","3. Hikayenin kahramanları kimlerdir?"],["l","………………………………………………………………"],["l","4. Bu hikayeden nasıl bir ders çıkardınız?"],["l","………………………………………………………………"],["p","II. Aşağıdaki cümlelerin doğru olanlarını “D” yanlış olanlarını “Y” ile işaretleyiniz."],["l","1. ( ) Bir sonbahar sabahıydı."],["l","2. ( ) Kelebek dinlenmek için kırmızı bir güle kondu."],["l","3. ( ) Kimse kelebeğe bakmadı."],["l","4. ( ) O sabah pembe bir kelebek çıktı."],["l","5. ( ) Geceye kadar çiçekten çiçeğe, daldan dala uçup durdu."],["p","III. Aşağıdaki cümlelerin var olanlarını “V” yok olanlarını “Y” ile işaretleyiniz."],["l","1. ( ) Kelebeğin rengi"],["l","2. ( ) O gün hakkında bilgi"],["l","3. ( ) Kuşlar nasıl uçuyorlar"]]},{"n":52,"b":[["l","4. ( ) Kelebeğin dinlemek için yerler"],["l","5. ( ) Kırmızı kelebek hakkında"],["p","IV. Aşağıdaki cümlelerdeki boşlukları tamamlayınız."],["l","1. Güneş, pırıl pırıl altın .......... .......... yüzüne yolluyordu."],["l","2. Şimdi dolaşma vaktiydi, yaşamalıydı, önünde ...... .....vardı."],["l","3. Sadece .......... ......... olan ömrü bitmişti"],["l","V. Lütfen aşağıdaki kelimeleri manalarıyla eşleştiriniz. Kanat: Dik duruma getirmek Ilkbahar: Uyku durumundan çıkmak Uyanmak: Kuzey yarım kürede mart, nisan ve mayıs aylarını içine alan mevsim Dikleştirmek: Bir günlük sürenin yirmi dörtte birine eşit, altmış dakikalık zaman dilimi, zaman parçası Saat: Kuşlarda ve böceklerde uçmayı sa"],["h","İNSAN VE SEVGİ"],["p","Sevgi nedir? Bu kelimenin gerçek anlamını biliyor muyuz, ya da düşündük mü?"],["p","Sevgi üzerine herkes kendince bir fikir yürütür. Aslında sevgi, duyguların en iyisi ve en güzelidir. Güzel olduğu kadar da özveri gerektirir. Canlıların en gelişmişi, en akıllısı bile bu özveriye muhtaçtır. Yaşamak işin sağlığa, mutluluğa, paraya ne kadar ihtiyacın varsa karşılıklı sevgiye de o kadar ihtiyacımız vardır. Çünkü insanı sevgi kadar yücelten ve sevgi kadar mutlu eden unsur daha yoktur."],["p","Sevgisiz büyüyen bir çocuğun ruhsal ve bedensel gelişmesi normal olmayacağı gibi sosyal ilişiklileri de yeterli düzeyde olmaz. Sevgiden yoksun büyüyen bir kişinin nerede, ne zaman ne yapacağını kimse bilemez. Böyle bir insan ileriki yıllarında acımasız bir kişiliğe sahip olabilir."],["p","Bunun gibi sevgiden yoksun büyüyen bireylerden oluşan bir toplumda huzur, barış gelişmez ve hoşgörü beklenmez."],["p","Sevgi ve sevmek deyince akla sadece insanlara duyulan sevgi gelmemelidir. Bizler, çevremizdeki her şeye sevgi duyabiliriz. Örneğin kuşları, çiçekleri, ağaçları hatta eşyaları bile severiz. Kimisini bize bir şeyler ifade ettiği, kimisini de içimizden geldiği için severiz. Çevremizde bulunanlara ilgi göstermemiz, sevmemiz, aynı zamanda bizim insanlığımızı yansıtmaktadır."]]},{"n":53,"b":[["p","Çevremizdeki hayvanları sevmek, bizde onları koruma hissi uyandırır. Genellikle korumamız altındaki hayvanları, hayvan olarak değil, bir dost, bir arkadaş olarak görürüz."],["p","İnsanlara duyduğumuz sevgi ise, sevgilerin en yücesi ve en güzelidir. Sevgi insanları iyi, şefkatli birer birey haline getirir."],["p","İnsanın sevgiye ihtiyacı vardır. Çünkü sevgi insanı insan kılan en önemli gereksinimdir."],["p","Sevgi bir ihtiyaçtır. Çünkü onsuz yaşamak güçtür. Yine insan sevgiye muhtaçtır, çünkü yaşama arzusunu içinde sürekli tutabilmesi buna bağlıdır."],["l","I. Aşağıdaki sorulara yanıt veriniz."],["l","1. Sevgi nedir? Sevgi hakkında neler düşünüyorsunuz?"],["l","2. Yaşamak için nelere ihtiyacımız var?"],["l","3. Sevgisiz toplumda ne gibi sorunlar ortaya çıkar?"],["l","4. İnsan niçin sevgiye muhtaçtır?"],["l","5. Sevmek insanları nasıl bir birey haline getirir?"],["p","II. Aşağıdaki test sorularını okuduğunuz metne göre yanıtlayınız."],["l","1. Sevgisiz büyüyen bir çocuğun ............... ."],["l","A. Ruhsal ve bedensel gelişimi normaldir."],["l","B. Ruhsal ve bedensel gelişimi normal değildir."],["l","C. Sosyal ilişkileri yeterli düzeyde değildir."],["l","D. Hem ruhsal ve bedensel hem de sosyal ilişkileri yeterli düzeyde değildir."],["l","E. Hem ruhsal ve bedensel hem de sosyal ilişkileri yeterli düzeydedir."],["l","2. Çevremizdeki şeylere ilgi göstermemiz, sevmemiz, .................... ."],["l","A. İnsanlığımızı yansıtır."],["l","B. Çok meraklı olduğumuzu gösterir."],["l","C. Her şeyi çok sevdiğimizi gösterir."],["l","D. Hiçbir şeye ilgi göstermediğimizi gösterir."],["l","E. Hayvanları koruduğumuzu gösterir."],["l","3. Sevgi ....................... ."],["l","A. Sadece iki kişi arasında olan duygudur."],["l","B. Herkesin hissettiği bir duygudur."],["l","C. En iyi ve en güzel duygudur."],["l","D. Mantık ve hesap üzerine kurulan bir duygudur."],["l","E. İnsanları mutlu eden bir duygudur."]]},{"n":54,"b":[["l","4. Sevgisiz büyüyen insan ..................... bir kişiliğe sahiptir."],["l","A. Akılsız"],["l","B. Acımasız"],["l","C. Ahlaksız"],["l","D. Amaçsız"],["l","E. Alımsız"],["l","5. Sevgiyle büyüyen insan .................... bir kişiliğe sahiptir."],["l","A. Şerefli"],["l","B. Şatafatlı"],["l","C. Şevketli"],["l","D. Şuurlu"],["l","E. Şefkatli"],["p","III. Aşağıdaki cümlelerin doğru olanını “D”, yanlış olanını “Y” olarak işaretleyiniz."],["l","1. Sevgi ve sevmek deyince akla sadece insanlara duyulan sevgi gelmelidir. ( )"],["l","2. Kimisini bize bir şeyler ifade ettiği, kimisini de içimizden geldiği için severiz. ( )"],["l","3. İnsan, sevgiye muhtaç değildir, onsuz yaşamak mümkündür ( )"],["l","4. Çevremizdeki hayvanları sevmek, bizde onları koruma hissi uyandırır. ( )"],["l","5. İnsanı sevgi kadar yücelten ve sevgi kadar mutlu eden unsur yoktur. ( )"],["p","IV. Aşağıdaki kelime ve kelime gruplarını birer cümle içerisinde kullanınız."],["l","A. Birey:"],["l","B. Sevgi:"],["l","C. Korumak:"],["l","D. İhtiyaç duymak:"],["l","E. Yaşama arzusu:"],["h","SULTANAHMET CAMİSİ"],["p","İstanbul’a minareler ve kubbeler şehri demek doğru olur. Çünkü dünyada camisi ve minaresi en çok olan şehir İstanbul’dur."],["p","Bu camilerin içinde dünyada eşi benzeri olmayan camiler de vardır. Sultanahmet Camisi bunlardan bir tanesidir. Dünyada altı"]]},{"n":55,"b":[["p","minaresi, on altı şerefesi olan tek camidir. İki yanı meydanlarla ve parklarla kaplıdır. 17.yüzyılda Osmanlı padişahı birinci Sultan Ahmet’in emriyle yapılmıştır. Yapan mimar ise Sedefkar Mehmet Ağa. Yapılışı altı yıl sürmüş. Caminin iç duvarları çok değerli ve çok çeşitli renkli çinilerle süslenmiş. Pencerelerinden İstanbul limanı, Boğaziçi, Çamlıca tepesi... her yer görünür."],["p","260 tane penceresi var. Bu yüzden caminin içi çok aydınlıktır. İstanbul’a giderseniz, Ayasofya’nın hemen karşısındaki bu muhteşem yapıyı mutlaka geziniz."],["h","AYASOFYA"],["p","İstanbul abideler şehridir. Bu abidelerin en eskilerinden ve en ünlülerinden biri de Ayasofya’dır. Tarihi bir hayli eskidir. Birkaç defa yıkılmış, tekrar yapılmıştır, yapılan bina da 532 ayaklanmasında yanmış ve yıkılmıştı. Kalıntıları şimdiki Ayasofya’nın avlusunda 2,5-5,5 metre derinlikte bulunmuş. Ayasofya’nın ilk defa İsa’dan sonra 326’da yapıldığı kabul edilmektedir. Bu ilk bina bir depremde yıkıldığı için, onun yerine daha büyük bir bina yapılmıştı. Doğunun en büyük kilisesiydi. Ahşap çatılıydı. Bu bina da 404 tarihinde bir ayaklanma sırasında yanmıştı. 415’te yeniden uştur."],["p","İmperator 2. Thebdosios’un emriyle bugünkü bina 537 tarihinde büyük bir törenle açılmıştı. Açıldığı zaman dünyanın en büyük kilisesiydi."],["p","İç duvarları, türlü çağlarda, çok değerli mozaiklerle süslenmiştir."],["p","1453 yılında İstanbul Türkler tarafından fethedilince, ayasofya camiye çevrildi. Caminin duvarlarında çatlaklıklar görülünce dört tarafına birer minare eklenerek yıkılması önlenmiştir. Ayasofya 1935’te müzeye çevrildi."],["p","Bugün dünyanın her köşesinden gelen turistler Ayasofya’yı ziyaret etmeden gitmezler."],["l","I. Aşağıdaki ifadeler doğru mu (D), yanlış mı (Y)? 1- ( ) Ayasofya birkaç kez yıkılmış ve tekrar yapılmıştır. 1- ( ) Bugünkü bina V.y.y’da yapılmıştır. 2- ( ) Ayasofya’nın içi değerli taşlarla süslenmiştir. 3- ( ) Türkler İstanbul’u 1453’te alınca Ayasofya’yı müze yapmışlardır. 4- ( ) Ayasofya dünyanın en büyük kilisesidir."]]},{"n":56,"b":[["p","5- ( ) Sultanahmet Camisini Sultan Ahmet yapmıştır."],["p","6- ( ) Sultanahmet Camisinin 16 tane minaresi vardır."],["p","7- ( ) Camisinin içi çok süslüdür."],["p","8- ( ) Sultanahmet Camisi Ayasofya’nın karşısındadır."],["p","9- ( ) Mimar camiyi 6 yılda yapmıştır. II. Aşağıdaki kelimeleri eş anlamlarıyla veya yakın anlamlarıyla eşleştiriniz."],["p","1Deprem isyan"],["p","2Kalıntı şark"],["p","3Abide asır"],["p","4Doğu zelzele"],["p","5Ayaklanma yıl"],["p","6Yüzyıl enkaz"],["p","7Sene anıt III. Aşağıdaki boşluklara kaplı, aydınlık, var, kilise, cami, çatı kelimelerinden uygun olanlarını doğru şekilde yerleştiriniz."],["p","1Bu camiler içinde dünyada eşi benzeri olmayan camiler de"],["l","......................................................................................................... . 2- Dünyada altı minaresi on altı şerefesi olan tek .................."],["l","......................................................................................................... . 3- İki yanı meydanlarla ve parklarla .................................. . 4- Caminin çocuklardan meydana gelir. Yüzyıllar boyunca insanlar aileler içinde yaşamışlardır. Bazı aileler çok kalabalık olmuş, bazıları da birkaç kişiden meydana gelmıştır. Kalabalık aileler beraber çalışırlar, beraber yaşarlar ve çocuklarını büyütürler. Çocuklar büyüyüp evlenince anne-babalarının evinden ayrılarak başka bir ev tutarlar. Çünkü, onlar da artık birer aile olmuşlardır."],["p","Kalabalık ailelerin masrafı da fazla olur. Çünkü, çocukların okul paraları ve giyim masrafları daha fazla olur. Çocuklar büyüdükçe toplumun kaidelerini ve yasaklarını öğrenirler. Ayrıca, okullarda çocuklara faydalı bilgiler de verilir. Kız ve erkek öğrenciler aynı okullarda, aynı dersleri okurlar ve bu okulları bitirerek istedikleri mesleği seçerler. Bugünün modern kadını, evinde oturup yalnız ev işlerini yapmaz. Aynı zamanda dışarda da çalışır. Ailede sakatlar, çocuklar, yaşlılar ve hastalar çalışmaz. Aileyi yıkan en büyük olay boşanmadır. Bu durum çocuklar için de büyük bir problemdir. Aile içindeki problemlere kimi zaman da çocuklar neden olur. Sakat doğan çocuklar, anne-baba için her zaman problem olmuştur. Ama herşeye rağmen aile, toplumun temel taşlarından biridir."],["l","A. Aşağıdaki soruları cevaplandırınız."],["l","1. Aile nedir ? .………………………………………………………………"],["l","2. Kalabalık aileler nasıl yaşarlar ?"],["l","………………………………………………………………"],["l","3. Çocuklar büyüyüp evlenince anne-babalarından niçin ayrılırlar ? .………………………………………………………………"]]},{"n":60,"b":[["l","4. Kalabalık ailelerin masrafı niçin fazladır ? .………………………………………………………………"],["l","5. Ailede kimler çalışmaz ? .………………………………………………………………"],["l","B. Aşağıdaki boşlukları doldurunuz."],["l","1. Bugünün …… kadını evinde ……. yalnız ev işleri yapmaz."],["l","2. Herşeye ragmen ……… toplumun temel ………… biridir."],["l","3. Çocuklar büyüdükçe toplumun ………. ve ……. öğrenirler."],["l","4. Kız ve erkek öğrenciler aynı …………. aynı dersleri"],["l","……. ve bu okulları bitirerek istedikleri ………… seçerler."],["l","C. Aşağıdaki doğru cevapları işaretleyiniz."],["l","1. Çocuklara faydalı bilgiler nerede verilir ?"],["l","A) okullarda B) kurslarda C) dershanelerde D) evde"],["l","2. Aileyi yıkan en büyük olay nedir?"],["l","A) yangındır B) boşanmadır C) ölümdür D) çocuksuzluktur"],["l","3. Boşanma ailede en çok kimi etkiler ?"],["l","A) babayı B) dedeyi C) akrabaları D) çocukları"],["l","4. Aile içindeki problemlere kimler neden olur ?"],["l","A) anne B) teyze C) sakat çocuklar D) baba"],["h","BASIN-YAYININ ÖNEMİ"],["p","Günümüz dünyası hızlı bir şekilde değişmektedir. Bu değişimi anında basın yayın organlarından takip etmekteyiz. Basın-yayın, dünyanın bir başka yerindeki bir olayı, bir yeniliği bize haber veren kuruluşlardır. Bunların içine gazeteleri, televizyonları, dergileri ve interneti koyabiliriz."],["p","Teknoloji ilerledikçe koskoca dünyamız küçük bir kçy haline geldi. Önceleri insanlar sadece kendi çevrelerinden haber alırlardı. Günümüzde ise gazete ve televizyon aracılığıyla hemen her yerden haber almak çok kolaydır."],["p","Bugün insanlar seslerini duyurabilmek için basın yhayın organlarını kullanmaktadır. Özellikle demokrasilerde basın yayın, insanların haklarını korumakta ve halkı bilinçlendirmektedir."]]},{"n":61,"b":[["p","Günümüzde en etkili yayın kuruluşlarından biri de televizyonlardır. Çünkü televizyon hem görsel, hem de işitsel yönden insanları bilinçlendirmektedir. 21. yüzyılda televizyon ile internet büyük bir yarışa girmiş durumdadır. Sizce yarışı kim kazanacak?"],["l","A. Aşağıdaki soruları cevaplayınız."],["l","1. Ülkemizin en büyük gazetesi hangisidir?"],["l",".................................................................................................."],["l","2. Hangi yayın oraganını takip ediyordunuz?"],["l",".................................................................................................."],["l","3. Okuduğunuz gazetede en çok ilginizi çeken sayfalar hangileridir?"],["l",".................................................................................................."],["l","4. En beğendiğiniz köşe yazarı kimdir? Niçin?"],["l",".................................................................................................."],["l","5. Gazete okumanın faydalı olduğuna inanıyor musunuz?"],["l",".................................................................................................."],["l","6. Gazeteci olmak ister misiniz?"],["l",".................................................................................................."],["l","B. Aşağıdaki cevaplara uygun sorular yazınız."],["l","A. ............................................................................................."],["l","B. Bence en etkili yayın organı gazetedir."],["l","2. A. .........................................................................................."],["l","B. Evet, aksiyon dergisine aboneyim."],["l","3. A. .........................................................................................."],["l","B. Daha çok magazin haberleri ilgimi çekiyor."],["l","4. A. .........................................................................................."],["l","B. Evet, gazeteci olmak isterim."],["l","5. A. .........................................................................................."],["l","B. Okuduğum gazetenin tirajı 300,000’dir."],["h","İŞ VE ZAMAN"],["p","İnsan yaşamak için çalısmak, belli bir iş tutmak zorundadır. Bu nedenle, yaşamayı çalışmaktan ayrı düşünmemeliyiz. İnsanları"]]},{"n":62,"b":[["p","bakkal, öğretmen, mühendis, memur, tüccar olarak çalışmaya iten başlıca güç, yaşamak zorunluluğudur."],["p","Kuşkusuz, her insanın belli bir işi yanında, yapması gereken başka işleri de verdır. Önemli olan, kişinin hem mesleği ile iıgili, hem de diğer işlerini zamanında yapmasıdır. Söz gelimi, bir doktor, hastalarıyla uğraşmasının yanısıra bir mektubu zamanında okuyabilmeli, çocuğunun okul ihtiyaçlarını zamanında giderebilmelidir. Böyle davranmazsa belki yarın daha önemli bir işle uğraşacak, bugünkü işlerini yapmaya zaman bulamayacaktır. Yani mektubu cevaplayamayacak, gazetelerini okuyamayacak, çocuğunun okul ihtiyaçlarını karşılayamayacaktır."],["p","İşleri günü gününe yapmamak, onların üst üstte birikmesine, giderek altından kalkılamaz duruma gelmesine de yol açar. Mesela, bir öğrenci konular ilerledikçe ve ödevler biriktikçe artık bunların altından kalkamayacaktır. Giderek, umutsuzluğa kapılacak ve başarısızlığa itilecektir."],["p","Ayrıca, kimi işler zamanında yapılmazsa, önemini yitiri verir. Bir tanıdığın nişan törenine, tören bittikten sonra gidemezsiniz. Yine bir arkadaşınızın bayramını, zamanı geçtikten bir kaç ay sonra, kart yazarak kutlayamazsınız. Çünkü, bu ve benzeri görevler, mutlaka zamanında yapılmalıdır. Aksi halde hiç bir anlam taşımazlar."],["p","Kısacası, insan, her türlü işini zamanında yapmalıdır. İsler günü gününe yapılırsa, insanın günlük hayatı düzenli, başarılı olur. “Bugünün işini yarına bırakmamak” için, sorumluluk taşımak, çalışkan olmak gerekir. Zaten, çevremize bir göz atarsak, başarılı kişilerin sorumlu ve çalışkan olduklarını görürüz."],["p","Yaşar YÖRÜK"],["l","A. Okuduğumuzu anladık mı? cevap verelim."],["l","1. Bir insanın asıl görevinin dışında yapması gereken başka hangi işleri olabilir?"],["l",".....……………………………………………………………"],["l","2. Okuduguğunuz yazıya göre, işlerini zamanında yapmayan kişi hangi durumlarla karşılaşabilir?"],["l","………………………………………………………………"]]},{"n":63,"b":[["l","3. Derslerine zamanında çalışmayan biraz ögren sonuçta hangi güçlüklerle karşılaşabilir?"],["l","………………………………………………………………"],["l","4. Bazı göreveler zamanında yapılmazsa önemini niçin kaybeder? Açıklayınız."],["l","………………………………………………………………"],["l","5. Başarılı olmak için neler yapmalıyız?"],["l",".....……………………………………………………………"],["l","B. Aşağıdaki Soruları Cevaplayınız."],["l","1. İnsan sevmediği bir işi yapmalımıdır? Neden?"],["l","2. Hayalinizdeki iş nedir ?"],["l","3. Bugünün işini yarına bırakma ne demek?"],["l","4. Başarılı olmak için neler yapılmalıdır?"],["l","C. Kelimeleri kendi dilinizde çeviriniz ve tanımını yapınız. görevlerAksisorumluluk - uğraşacakbakkal-"],["h","SİNEMA"],["p","Üç arkadaş uzun zamandır sinemaya gitmek istiyorlardı ama işlerinden dolayı gidemiyorlar. Onlar bir yerde buluşup bu hafta sonu sinemaya gitmeye karar verdiler. Önce bir gazete alıp film ilanlarına baktılar ve hepsi bir film beğendiler. Bu film Akün Sinema’sındaydı ve Oskar Ödülü almıştı."],["p","Biletleri alması için Ahmet’i görevlendirdiler. Çünkü Ahmet’in evi sinemaya yakındı. Ertesi gün sinemanın önünde buluşmak üzere ayrıdılar. Cumartesi günü üç arkadaş da sinemanın önündeydi. Filim başlamasına daha zaman vardı. Bu yüzden sinemanın arkasındaki kafeteryaya gidip birşeyler atıştırdılar. Sonra da konuşa konuşa sinemanın kapısına kadar geldiler."],["p","Biletci onlara biletlerini göstemelerini söyledi. Ahmet elini cebine attı, biletler yoktu. Öbür cebine baktı, cüzdanına baktı ama biletler yoktu. Ahmet sonradan bu sabah yeni pantalonunu giydiğini"]]},{"n":64,"b":[["p","ve biletlerin dünkü giydiği pantalonunun cebinde kaldığını hatırladı. Bu duruma üç arkadaş da çok üzülmüştü. Çünkü bu flime gitmeyi çok istemişlerdi. Fakat şimdi yapacak bir şey yoktu. Bu yüzden Kızılay’a gidip gezmeye karar verdiler. Sinemaya ise gelecek hafta gitmeye karar verdiler. Lütfen, soruları cevaplayınız."],["l","1. “Biletleri alması için Ahmet’i görevlendirdiler.” cümlesinde altı çizili sözcüğün anlamı, seçeneklerden hangisnde aynıdır?"],["l","A) hizmetlendirdi B) sorumlu kıldı C) cevaplı kıldı"],["l","D) mecbur kıldı E) zorunlu kıldı"],["l","2. Lütfen, “Arkadaşlar nasıl filimi seçtiler?” sorusunun cevabını bulunuz."],["l","A) Gazete olanı seçtiler B) Oskar Ödüllü olanı seçti"],["l","C) Sinemaya gidip seçti D) Tracedi filim seçti"],["l","E) Komedi filimi seçti"],["l","3. Lütfen “Arkadaşlar neden sinemaya giremediler?” sorusunun cebabını bulunuz."],["l","A) paraları yoktu B) zamanları yoktu C) biletleri yoktu"],["l","D) biletlerini evde unutmuşlar E) sinema kapalıydı"],["l","4. Lütfen, boşluğu tamamlayınız. Ahmet elini …......... attı, biletler yoktu"],["l","A) havaya B) pantalona C) omuza D) cüzdana E) cebine"],["l","5. Lütfen, boşluğu metine göre tamamlayınız. Biletci onlara …............... göstemelerini söyledi."],["l","A) kimliklerini C) paralarını E) ellerini B) biletlerini"],["l","D) cüzdanlarını"],["h","GÜRÜLTÜ"],["p","Hızlı kentleşme,sanayileşme ve nüfus artışından kaynaklanan gürültü, çağımızın önemli sorularından biri haline geldi. Gürültünün insan sağlığını önemli ölçüde etkilediği de artık herkes tarafından biliniyor."],["p","Bir arabanın motor sesine kulaklarımızı tıkarız da sevdiğimiz"]]},{"n":65,"b":[["p","bir müzik parçasını sonuna kadar açar, büyük bir zevkle dinleriz. Sesin gürültü niteldiği taşıması kişiye gore değişmektedir."],["p","Nedir öyleyse gürültü? Gürültü, uyumsuz, istenmeyen, hoşa gitmeyen ses olarak tanımlanabilir. Bu yüzden bizim hoşumuza giden bir müzık,başkalarının hoşuna gitmeyebilir ve gürültü sayılabilir. Kısaca ilgi duyduğumuz konulardaki sesler bizi rahatsız etmez de, ilgi göstermediğimiz sesleri gürültü olarak kabul ederiz."],["p","Gürültü insanda psikolojik bozukluklar meydana getirir. Yorgunluk,başağrısı vs.gibi… Sesleri dinlersek gürültüyü yaratanın insanın kendisi olduğunu anlarız. Buzdolabı, radyo, televizyon sesleri zamanına gore bizi çok rahatsız eder. Bunlar çok basit örneklerdir ama bizi sonuca götürür. Uygarlık ne kadar gelişirse gürültü de o oranda artmaktadır."],["p","O halde gürültüyle savaşmalıyız. Bu basit araçların sesi insanda gerilimlere yol açıyor. Böylece mutluluk getiren uygarlık beraberinde mutsuzluğu da getiriyor."],["l","I. Lütfen, soruları metine göre cevaplayınız."],["l","1. Gürültü nedir? Tanımlayınız."],["l","……………………………………………………….....……"],["l","…………………………………………………………….…"],["l","2. Gürültünün insane üzerindeki etkileri nelerdir?"],["l","………………………………………………………………"],["l","………………………………………………………………"],["l","3. Gürültünün esas kaynağı nedir?"],["l","………………………………………………………………"],["l","………………………………………………………………"],["l","4. Uygarlık nasıl hem mutluluk, hem de mutsuzluk getiriyor? Kısaca açıklayın."],["l","………………………………………………………………"],["l","………………………………………………………………"],["l","5. Çeşitli sesler hakkında neler düşünüyoruz?"],["l","………………………………………………………………"],["l","………………………………………………………………"]]},{"n":66,"b":[["p","II. Aşağıdaki cümlelerden doğru olanları “D”, yanlış olanları “Y” ile işaretleyiniz."],["l","1. ( ) Ugarlık ne kadar gelişirse gürültü de o oranda artmaktadır."],["l","2. ( ) Mutluluk getiren uygarlık, aynı zamanda mutsuzluk da getiriyor."],["l","3. ( ) Gürültü insanda psikolojik bozukluklar meydana getirmez."],["l","4. ( ) Sesin gürültü niteliği taşıması kişiye gore değişmektedir."],["l","5. ( ) Gürültüye yaratan insane değildir."],["p","III. Aşağıdaki cümlelerin boş bırakılan yerlerini doldurunuz."],["l","1. Bizim hoşumuza giden bir müzık, başkalarının ……….ve"],["l","………………….............................................................................."],["l","2. Gürültünün insane sağlığını önemli ölçüde………………. artık herkes ..…..….....................................................................…."],["l","3. Buzdolabı, ………….…… sesleri zamanına gore ……….."],["l","4. Sevdiğimiz bir müzik parçasını sonuna kadar…………."],["l","5. Gürültü, …………..,……………………. tanımlanabilir."],["h","DOĞUM GÜNÜ HEDİYESİ"],["p","Fırına geldiğimde ortalıkta ekmek görünmüyordu. Eski bir dostum olan fırıncı, “Biraz bekleyeceksin hocam”, dedi. “İki-üç dakikaya kadar çıkartıyorum”. Kenardaki tabureye oturup beklemeye koyulurken, içeriye yaşlıca bir adamın girdiğini gördüm. Eskimiş ceketinin sol yakası altında bir madalya parıldıyor ve yürürken hafifçe topallıyordu. Selam verdikten sonra, fırıncının tezgahına yaklaşarak, “Ekmeklerimi alayım”, dedi. “Benim ikizler acıkmıştır”. Fırıncı, adamın kendisine uzattığı torbayı alarak tezgahın altına eğildi ve bir gün öncesine ait olduğu anlaşılan ekmeklerden dörtbeş tane çıkardı. Ben o arada oturması için kendi yerimi o adama vermiş, tezgahın yanına iyice yaklaşmıştım. Ekmeklerden birkaç tanesinin şekli değişmiş, katılaşmış, taş gibi olmuştu. Fısıltı şeklinde fırıncıya sordum. Neden taze ekmeği beklemesini söylemiyorsun? Biraz sonra çıkacak ya!. “Bayat ekmekleri kendisi istiyor.” Dedi"]]},{"n":67,"b":[["p","fırıncı. “Çok fakir olduğundan, ona yarı fiyatına veriyorum”. “Kim bu adam?” diye sordum."],["p","“Kore gazilerinden” dedi. “Oğluyla gelini bir trafik kazasında vefat edince, ikiz torunlarını yanına almıştı. Yıllardır onlara bakıyor, hem de çok az bir maaşla.”"],["p","Fırıncının anlattıkları karşısında içimin yandığını hissediyor ve ufak da olsa bir şeyler yapmak istiyordum. “Aradaki farkı ben vereyim”, dedim. “Hiç olmazsa bugün taze ekmek yesinler”. Fırıncı, teklifimi kabul etti ve biraz sonra da, fırından yeni çıkan taze ekmekleri adamın torbasına doldururken şekli bozuk, bayat ekmekleri de tezgahın altına koydu. “Çok şanslısın hacı amca”, dedi. Çocuklar için sana bugün pasta gibi ekmek vereceğim. Yaşlı adam, bir evlat sevgisiyle kucakladığı torbayı göğsüne bastırırken. “Allah, senden razı olsun evladım” dedi."],["p","“Bugün onların doğum günü olduğunu nereden biliyordun?”"],["p","Soru: Yukarıdaki hikâyeyi ele alan eleştirisel bir yazı yazınız."],["l","1. Aşağıdaki ifadelerden doğru olanı (D), yanlış olanı (Y) ile işaretleyiniz."],["l","1. ( ) Fırına geldiğimde ortalıkta ekmek vardı."],["l","2. ( ) Fırıncı adama şekli değişmiş, katılaşmış ekmekleri vermek istedi."],["l","3. ( ) Adam çok fakir olduğundan, fırıncı ona yarı fiyatına veriyor."],["l","4. ( ) Çocukların doğum günü olduğu için fırıncı adama taze ekmek verdi."],["l","5. ( ) Çocukların anne babası vefat etmiştir."],["l","2. Aşağıdaki boşlukları metne göre tamamlayınız."],["l","1. Çocuklar için sana bugün ......... ........... ................ vereceğim."],["l","2. Yıllardır ............................, hem de çok az bir maaşla."],["l","3. Hiç olmazsa bugün ............................... yesinler."],["l","3. Aşağıdaki test sorularına cevap veriniz."],["l","1. Yazar nereye geldi?"],["l","A) eve B) denize C) ekmek satın almak için fırıncıya"]]},{"n":68,"b":[["l","D) parkta gezmeye E) kahve içmeye"],["l","2. Fırıncı bayat ekmekleri kime veriyordu?"],["l","A) küçük kıza B) hocasına C) arkadaşına"],["l","D) fakir adama E) köpeğe"],["l","3. Adamın kaç çoçuğu var?"],["l","A) 2 B) 5 C) 3 D) 1 E) 4"],["l","4. Fırıncı adama nasıl ekmekler vermek istedi?"],["l","A) taze B) bayat C) sıcak D) kara E) büyük"],["l","4. Aşağıdaki kelimeleri maanalarıyla eşleştiriniz. Bayat Bozulmamış, bayatlamamış olan Taze Birinden yapılması zor, eziyetli bir iş isteme Fakir Özelliğini yitirmiş, taze olmayan Teklif Ölmek Vefat etmek Geçimini güçlükle sağlayan, yoksul, fukara"],["l","5. Aşağıdaki kelimelerin zıt anlamlarını bulunuz. Yaşlı ................................................... Bayat ................................................... Vefat etmek ................................................... Fakir ................................................... Acıkmak ..................................................."],["l","6. Aşağıdaki sorulara cevap veriniz."],["l","1. Fırına gelen yaşlı nasıl bir insan?"],["l",".................................................................................................."],["l","2. Fırıncı neden bayat, eski ekmekleri adama verdi?"],["l",".................................................................................................."],["l","3. Yazar sizce nasıl bir insan? O neden adama yardım etti?"],["l",".................................................................................................."],["l","4. Adamın kaç çoçuğu var?"],["l",".................................................................................................."],["l","5. Siz de yazar gibi fakir insanlara yardım eder miydiniz?"],["l",".................................................................................................."]]},{"n":69,"b":[["h","SAFRANBOLU EVLERİ"],["p","Ben Safranbolluyum. Aynı zamanda Safranbolu belediye başkanıyım. Size yaptığımız çalışmalardan çok, Safranbolu evlerinden bahsetmek istiyorum. Safranbolu’yu dünyaya tanıtan en önemli özellik, geleneksel Türk mimarisi tarzındaki evlerdir. Safranbolu’da hiçbir ev derme çatma yapılmamıştır. Tüm evler bahçe içinde, çoğunlukla üç katlı, 6-8 odalı, geniş ve büyük evlerdir."],["p","Safranbolu evleri çevreye son derece saygılıdır. Doğa-evinsan, sokak-ev, sokak-çarşı ilişkileri oldukça düzenli ve dengelidir. Safranbolu evlerinin çevreye olduğu kadar komşuya da saygısı vardır. Hiçbir ev diğerinin manzarasını engellemez. Kısacası Safranbolu’da manzara, adaletli bir şekilde paylaşılmıştır."],["p","Evin bahçesiyle sokak bir taş duvarla ayrılmıştır. Büyükçe bir kapıyla bazen bahçeye, bazen de eve girilir. Her kapının üzerinde kocaman kilitler vardır. Kilitlerin yanında “şakşak” halkaları vardır. Bu halkalar vurularak kapı çalınır."],["p","Zemin kat: Evin girişinde, yani zemin katta “hayat” vardır. Aynı zamanda odunların kurutulması için bir bölüm yer alır. Zemin katta ayrıca ahırlar, büyük kazan ocakları ve ambarlar bulunur."],["p","Üst kat: Üst kata ahşap bir merdivenle çıkılır. Burası diğer katlara göre daha basıktır. Bu katta gerektiğinde yatak odası olarak da kullanılabilen bir mutfak bulunur. Gündelik yaşam bu katta geçer. Çünkü bu katın soğuk kış günlerinde ısıtılması daha kolay olur."],["p","Üçüncü kat: Üçüncü kat, Safranbolu evlerinde mükemmeliğe varılan noktadır. Bu katta tavanlar daha yüksektir. Odaların giriş kapıları köşelerdedir. Kapı ve oda arasında direk teması önleyen ahşap paravanlar vardır."],["l","1. Okuduğunuz parçaya göre aşağıdaki cümlelerden doğru olanın başına “D”, Yanlış olanın başına “Y” yazınız."],["l","a. ( ) Safranbolu, dünyada en çok safran bitkisiyle tanınmıştır."],["l","b. ( ) Safranbolu’da evler genellikle iki katlıdır."],["l","c. ( ) Hiç bir ve diğerinin manzarasını engellemz."],["l","d. ( ) Ahırlar ve kazan ocakları evden ayrı bir yerde bulunur."],["l","e. ( ) Üst kat diğer katlara göre daha basıktır."]]},{"n":70,"b":[["p","f. ( ) Üçüncü katta her odada duş kabinleri vardır."],["p","g. ( ) Üst kattaki mutfakta gerektiğinde yatabilirsiniz."],["l","2. Aşağıdaki soruları okuduğunuz parçaya göre cevaplayınız."],["l","a. Safranbolu evlerinin çevreyle ilişkisi nasıldır?"],["l","……………………………………………………………….."],["l","b. Zemin katta neler vardır?"],["l","……………………………………………………………….."],["l","c. İkinci katta neler bulunmaktadır?"],["l","……………………………………………………………….."],["l","d. Gündelik yaşam niçin orta katta geçer?"],["l","……………………………………………………………….."],["l","e. Odalarda oturma düzeni nasıldır?"],["l","……………………………………………………………….."],["h","TÜRKİYE’NİN İLK AKILLI EVİ"],["p","Türkiye’nin bilgisayarla donatılmış ilk akıllı evi Comlpex fuarında tanıtıldı. Akıllı ev; mutfak, hobi odası, salon, çocuk odası ve çalışma odasından oluşuyor. Akıllı ev ve içindeki cihazlar günün yirmi dört saati boyunca internet erişimli herhangi bir araçtan, kilometrelerce uzaktan bile kontrol edilebiliyor. Cep telefonu ya da benzerli internet erişimli bir cihaz ile evin sıcaklığı ayarlanabiliyor."],["p","Akıllı buzdolabı, çamaşır ve bulaşık makinesi, aspiratör ve fırın, internet erişimli herhangi bir cihazdan kontrol edilebiliyor. Buzdolabı, içindeki ürünleri tanıyabiliyor. Markette alışveriş yaparken cep telefonuyla buzdolabına bağlanarak alışveriş listesi alabiliyorsunuz. Bulaşıkları ve çamaşırları iş yerinden vereceğiniz bir talimatla yıkatabiliyorsunuz. Tüm ürünler, arıza durumunda servise ve size mesaj göndererek durum raporu verebiliyor."],["p","Akıllı evlerde hırsızlara da geçit yok. Hırsızın eve girmesiyle birlikte evin ışıkları ve panjurları otomatik olarak açılıyor. Kısa mesaj ile hırsız size bildiriliyor."],["p","Çalışan anne ve babalar için akıllı ev, çocuklarıyla her an ilgilenebilme imkanı veriyor. İş yerinden evdeki kamera sistemine bağlanarak televizyon üzerinden çocuklarınızı kontrol edebiliyor"]]},{"n":71,"b":[["p","ve onlarla konuşabiliyorsunuz. Çocuklarınızın okuldan döndüğünü size haber verebilen akıllı ev, yine bilgisayarınızın üzerindeki fırın menüsü ile yemekleri ısıtmanızı sağlıyor."],["p","Siz evde televizyon seyrederken, evin dışındaki kamera kapınıza gelen misafiri otomatik olarak ekrana yansıtabiliyor."],["p","Peki bu evin fiyatını merak ediyor musunuz? 145 metrekarelik bu ev 119 milyar lira. Yani yaklaşık olarak 85.000 dolar."],["l","A. Okuduğunuz parçaya göre aşağıdaki cümelelerden doğru olanın başına “D”; yanlış olanın başına “Y” yazınız."],["l","a. ( ) Türkiye’nin bilgisayarla donatılmış ilk akıllı evi Compex fuarında tanıtıldı."],["l","b. ( ) Akıllı ev; mutfak, hobi odası, salon, çocuk odası ve çalışma odasından oluşuyor."],["l","c. ( ) Akıllı ev hırsızları öldürüyor."],["l","d. ( ) Akıllı evdeki buzdolabına bağlanarak bir alışveriş listesi alabilirsiniz."],["l","e. ( ) Çocuklar için akıllı evler çok tehlikelidir. f. ( ) Akıllı ev yaklaşık olarak 85.000 dolardır."],["l","B. Aşağıdaki soruları okuduğunuz parçaya göre cevaplayınız."],["l","a. Türkiye’nin bilgisayarla donatılmış ilk akıllı evi nerede kuruldu?"],["l","……………………………………………………………….."],["l","b. Akıllı eb ahngi odalardan oluşuyor?"],["l","……………………………………………………………….."],["l","c. Akıllı eve hırsız girdiğinde ev sizi nasıl haberdar ediyor?"],["l","……………………………………………………………….."],["l","d. Akıllı ev hırsızlara karşı nasıl bir tepki veriyor?"],["l","……………………………………………………………….."],["l","e. Akıllı evin fiyatı kaç lira?"],["l","……………………………………………………………….."],["h","PARIS"],["p","Paris, bir sevgili şehri, Fransa’nın sembolü, devrimler şehri ve hayaller şehridir. Bununla birlikte, Fransa’dazor, ancak dünyanın"]]},{"n":72,"b":[["p","diğer ülkelerinde olduğu gibi, sevgi ve romantizm ruhu ile dolu çok hoş bir köşe var. Burada her sokak, her avlu ve köşe Fransız ruhunun özel bir atmosferi ile doyurulur. Her zaman en büyük sanatçılar burada ilhamalırken, şairler ve yazarlar eserlerinde Paris’i seslendirdi ve bu konuda efsaneler besteledi."],["p","Tarihi 2000 yılı aşkın bir süredir devam eden olağan üstü güzel Paris şehri, Seine kıyılarında yer almaktadır."],["p","Ancak bu şehrin antik bir soluk aldığını ve olağan üstü pitoresk doğal manzaralarla göze çarptığını düşünmeyin. Romantik, macera, eğlence, harika alışveriş olan akları ve son derece lezzetli Fransız çikolatası – gezginlerin hayal edebileceği her şeye sahiptir."],["p","Paris, yılın her hangi bir zamanında güzeldir. Sonbaharda kırmızı ve sarı yapraklar kokar, ilkbahar veya yazların da yeşilpembe-sarı renklerde çiçeklenir, kışın ise gri sisle örtülür. Kar nadiren buraya düşer, ancak bu gerçekleştiğinde Paris gerçek bir kış masalına dönüşür."],["p","Fransa’nın başkentinde her zaman iyi ve ilginç. Festivaller, fuarlar ve diğer festivaller bu şehirde tüm yıl boyunca gerçekleşiyor. Böylece, Paris’te her sonbahar, Sonbahar Festivali gerçekleşir – dünyanın dört bir yanından gelen sanatçıların çalışmalarını sundukları sanat festivali. Bahar, spor mevsimidir. Yılın bu zamanında, şehir bir tenis turnu vasına ve ünlü Paris Maratonuna ev sahipliği yapıyor. Yaz aylarında, Gül Festivali burada kutlanır ve kışın Parisliler Noel bayramlarına dalır ve tüm sevenler Sevgililer Günü’nü kutlar."],["p","Paris’in güzelliği ve çekiciliği abartılması zor. Paris, aşık olmamak kesinlikle mümkün olmayan bir rüya şehridir. İlk dakikadan itibaren, büyüleyici ve onun anıları yaşam için kalır. Kısacası, Paris yaşamak, yaratmak ve sevmek için ilham veren bir masal!"],["l","I. Aşağıdaki soruları yanıtlayınız."],["l","1. Paris hangi şehir?"],["l",".................................................................................................."],["l","2. Fransa’nın sembolü?"],["l","................................................................................................"],["l","3. Eyfel Kulesi nerede?"]]},{"n":73,"b":[["l",".................................................................................................."],["l","4. Paris manzaraları nelerdir?"],["l",".................................................................................................."],["l","1. Fransa’nın başkentinde ............... …..........…iyi ve ilginç."],["l","2. …..........bu zamanında, şehir bir tenis turnu vasına ve ünlü Paris Maratonuna ev sahipliği yapıyor."],["l","3. Paris’in güzelliği ve çekiciliği…............… ."],["l","4. Burada her sokak, her …........................ ...................…"],["l","…....… Fransız ruhunun özel bir atmosferi ile doyurulur."],["l","5. …........, Paris yaşamak, yaratmak ve sevmek için ilham veren birmasal."],["h","BİR YILDIZ HİKAYESİ: ELVİS PRESLEY"],["p","Elvis Presley 16 Ağustos 1977’de öldü. O gün bütün televizyonlar ve radyolar programlarını yanda kestiler ve onun ölüm haberini verdiler. Daha sonra cenazesinde seksen bin kişi vardı. Bütün caddeler insanlarla ve arabalarla doldu. Her yerde onun şarkıları çaldı."],["p","O, 8 Ocak 1935’te, Missisipi’de doğdu. Ailesi çok fakirdi, bunun için hiç müzik dersi almadı. Ama çok küçük yaşta kiliselerde şarkı söyledi. 13 yaşında ailesiyle birlikte Memphis’e taşındı. Bundan beş yıl sonra okulu bıraktı ve kamyon şoförü oldu. Aynı yıl annesinin doğum günü için bir şarkı yaptı. Bunu bir iş adamı dinledi ve çok beğendi. Daha sonra Elvis’i bu şarkısıyla kendi şehrindeki herkes tanıdı. 1 yıl sonra beş kaset daha yaptı."],["p","Artık çok ünlüydü ama hâlâ zengin değildi. Plak şirketi ona çok para vermedi. Bu sebeple başka bir şirketle anlaştı ve çalıştı. Bu şirkette on dört kaset yaptı ve bunların hepsi bir numara oldu."],["p","1958’de askere gitti ve iki yıl Almanya’da kaldı. Orada karısı Priscilla’yı tanıdı ve ona aşık oldu. Elvis Amerika’ya döndü. Sekiz yıl sonra burada evlendiler. Bir kızları oldu. Onlar zengin ve mutluydular. Ama Elvis’in içki ve uyuşturucu problemi vardı. Sonunda karısı onu terketti. 1973’te ayrıldılar."],["p","Elvis, bundan sonra çok fazla çalıştı, çok alkol aldı, çok"]]},{"n":74,"b":[["p","şişmanladı. Kötü ve zor bir hayatı vardı. Bir gün kalp krizi geçirdi ve öldü. Bütün parasını kızına bıraktı. Kızı dünyanın en zengin insanlarından biri oldu ve sadece dokuz yaşındaydı."],["l","A. Lütfen, aşağıdaki sorulara cevap veriniz."],["l","1. Elvis önce nerede, nasıl ünlü oldu?"],["l",".................................................................................................."],["l","2. Elvis, plak şirketini niçin değiştirdi?"],["l","..............................................................................................."],["l","3. Elvis’in ölüm gününde neler oldu?"],["l",".................................................................................................."],["l","4. Priscilla, Elvis’i niçin bıraktı?"],["l",".................................................................................................."],["l","5. Amerikalılar Elvis Presley’i seviyorlar mı? Bunu hangi cümlelerden anlıyorsunuz? En az 3 cümle ile anlatınız."],["l",".................................................................................................."],["l","................................................................................................."],["l",".................................................................................................."],["l","B. Lütfen, aşağıdaki sözcüklerin metindeki karşılıklarını bulup yazınız."],["l","1. o gün :"],["l","2. o:"],["l","3. bunu:"],["l","4. orada:"],["l","C. Lütfen, aşağıdakilerden doğru olanı işaretleyiniz."],["l","1. Elvis ve Priscilla"],["l","a) Almanya’da evlendiler."],["l","b) Almanya’da çocuk sahibi oldular."],["l","c) Almanya’da tanıştılar."],["l","d) Almanya’da ayrıldılar."],["l","2. Elvis’in kızı .................................................................................."],["l","a) çocuk yaşta dünyanın en zengin insanı oldu."],["l","b) çocuk yaşta çok para kazandı ve zengin oldu."]]},{"n":75,"b":[["l","c) çocuk yaşta en zengin insanlardan biri oldu."],["l","d) çocuk yaşta çok zengin ve mutsuz oldu."],["l","3. Elvis .................................................................................... öldü."],["l","a) 35 yaşında b) 38 yaşında c) 40 yaşında d) 42 yaşında"],["l","D. Lütfen, doğruları “D”, yanlışları “Y” ile işaretleyiniz. Yanlışların doğrularını yazınız."],["l","1. ( ) Elvis, Memphis’te ilk kasetini yaptı."],["l","2. ( ) Elvis, kilisede müzik dersleri aldı."],["l","3. ( ) Priscilla’yla her zaman çok mutluydular."],["l","4. ( ) Elvis, annesine doğum günü için bir kaset hediye etti."],["l","E. Lütfen, aşağıdaki boşlukları parçadaki uygun sözcüklerle tamamlayınız. Elvis Presley dünyanın en.................... şarkıcılarından biridir. Çok ........................... bir hayat yaşadı. Çocukluk yıllarında çok"],["l","......................... Daha sonra zengin oldu ama ......................... ve"],["l","......................... kullandı. Sonunda .............................. nedeniyle öldü ........................... seksen bin kişi katıldı."],["h","TÜRK BİLEZİKLERİ"],["p","Bileziğin geçmişi insanlık tarihi kadar eskidir. Birçok takı çeşidinde olduğu gibi üzerindeki figürler işlemler incelendiğinde ilk takıların gizli güçlere, büyüye karşı yapıldığı anlaşılmaktadır. İlk bilezikler ahşap, taş ve yumuşak madenlerden yapılmıştır. Daha sonra da yaygın olarak altın, gümüş gibi değerli madenlerden yapılmaya başlanmıştır. Tabi bunların gerçekleşmesi için binlerce yıl geçmiştir."],["p","Zamanımızda ise bilezik yapımı iki ayrı zevk ve beğeniyle hiç önemini yitirmemiştir. Bunlardan birincisi eskiyi taklit eden klasik tarz; diğeri ise çağın durumuna göre değişen modern tarzdır. Bilezikler ev kadınından kraliçelere kadar her kültür seviyesinden kadının zevkle taşıdığı bir süs eşyasıdır."],["p","Bu bileziklerin kutsallıklarının yanı sıra birçok faydalı özelliklerinin olduğuna inanılmaktadır. Bakır bileziğin çeşitli"]]},{"n":76,"b":[["p","ağrılara iyi geldiği. Türkler için çok önemli olan akik taşının zehirli hayvanların ısırıklarına karşı koruduğuna, bakır veya gümüş bileziğin insanın vücudundaki elektriği aldığına inanılmaktadır. Çağımızda bilezikler daha çok altından yapılsa da gümüşten yapılan üstü nakışlı bilezikler apayrı bir yer tutar. Bileziklerin günümüzde plastikten tutun da boncuklarla yapılan birçok çeşidine rastlanmaktadır."],["p","Türkiye’de yapılan bilezikler yapıldığı yörenin kültürel özelliklerini ve o yörenin adını taşır. Kayseri Burması, Trabzon Hasırı, Halep İşi gibi ve bunlardan başka birçok çeşidi vardır. Altın bilezikler özellikle düğünlerde genç kızlarımızın vazgeçilmez takıları arasındadır. Erkeğin zenginlik durumuna göre geline mutlaka altın bilezikler takılır."],["p","Bileziğin ayağa takılanlarına “Halhal” denmektedir. Bu kelime Arapça’da ayak bileği anlamına gelmektedir. Bu halhallar Hindistan’dan Afrika’ya Anadolu’ya kadar birçok yerde kullanılmıştır. Halhal güzel zarif görünüşünün yanı sıra güzel hoş bir ses çıkarır. Anadolu’da kadınlardan başka bağda bahçede çalışan işleriyle meşgul olan analar küçük çocuklarının ayaklarına da takmışlar kolayca çocuklarının nerede oynadıklarını bulmuşlardır."],["p","Bilezikler Türk toplumunun kendi kültüründen özellikler taşıyarak ayrılmaz bir parçası olmuştur."],["p","Lütfen, soruları okuduğunuz metine göre yanıtlayınız."],["l","1. Bilezikler ilk önceleri niçin yapılmıştır?"],["l","A) Güzel görünmek için B) Dikkat çekmek için"],["l","C) Gizli güçlere ve büyüye karşı korunmak için"],["l","D) Sağlık için E) Zenginliği göstermek için"],["l","2. İlk bilezikler nelerden yapılmıştır?"],["l","A) Ahşap, taş ve yumuşak madenlerden"],["l","B) Bakır, demir ve altından C) Gümüş, altın ve elmastan"],["l","D) İplik ve sert madenlerden E) Plastik ve naylon ürünlerden"],["l","3.Türkler için çok önemli olan akik taşının ne faydası olduğuna inanılmaktadır?"],["l","A) Stresi aldığına B) Vücuttaki elektriği aldığına"]]},{"n":77,"b":[["l","C) Zehirli hayvanların ısırıklarına karşı koruduğuna"],["l","D) Vücudu dinlendirdiğine E) Uğur getirdiğne"],["l","4. Halhal neye denmektedir?"],["l","A) Kola takılan bileziğe B) Kulağa takılan küpeye"],["l","C) Parmağa takıla yüzüğe D) Altın bileziklere"],["l","E) Ayağa takılan bileziğe"],["l","5. Bakır veya gümüş bileziğin insan sağlığına ne fayda verdiğine inanılmaktadır?"],["l","A) Vücuttaki elektriği aldığına"],["l","B) Vücudu zararlı böceklerden koruduğuna"],["l","C) Vücuttaki kan dolaşımını hızlandırdığına"],["l","D) Vücut ısısını artırdığına E) Vücudu serin tuttuğuna"],["l","6. Halhallar nerelerde kullanılmıştır?"],["l","A) Hindistan’dan Afrika’ya Anadolu’ya kadar birçok yerde"],["l","B) Hindistan’da C) Orta Asya’da"],["l","D) Avrupa’da E) Amerika’da"],["h","ADALAR"],["p","Marmara Denizi’nde büyüklü küçüklü birçok ada vardır. İstanbul’un güneyinde bir gerdanlık gibi Marmara Denizi’ni süsleyen adalar, İstanbul’un en önemli dinlenme alanlarını ve sayfiyelerini barındırmaktadır. Bu adalar sessiz, sakin, temiz ve yemyeşildir. Püfür püfür bir vapur yolculuğu sonrası ulaşılan adalar, ferah ve sakin atmosferiyle daha ilk adımda misafirini rahatlatır. Bu adalarda araba kullanmak yasaktır. Sadece, atların çektiği faytonlar vardır. Plajları, yeşil dokusu, yürüyüş yolları, çam ormanlarıyla örtülü vadileri, tepeleri ve kıyılarıyla Adalar eskiden beri bilinen, kullanılan en önemli dinlenme alanlarıdır. Prens Adaları veya Kızıl Adalar olarak da isimlendirilen Adalar üç grupta sınıflandırılabilir. Kınalıada, Burgazada, Heybeliada, Büyükada ve Sedef adası, üzerinde yerleşim olan, turizme açık adalardır. Kaşık Adası ve Pide Adası özel mülktür. Adaya çıkmak bu nedenle mümkün değildir."]]},{"n":78,"b":[["p","Yassıada, Sivriada ve Balıkçı Adası’nda yerleşim yoktur."],["p","İstanbul halkı hafta sonlarını geçirmek için bu adalara gitmeyi çok sever. Piknik yapmak isteyenler akşamdan yemeklerini hazırlar. Çocuklar heyecandan ne yaptıklarını bilmez. Yapacakları şeyleri tek tek anlatırlar."],["p","Sabah erkenden kalkılır. Hazırlıklar tamamlandıktan sonra vapur iskelesine gelinir. Çocukların heyecanı biraz daha artar. Vapur sesleri birbirine karışır. Çocuklar “Bu vapurla mı gideceğiz?” diye sormaya başlarlar. Tatil gününü herkes adada geçirmek istediği için iskele çok kalabalıktır. Çocuklar annelerinin veya babalarının eline sıkıca yapışırlar. Sonunda vapura binilir. Ve yolculuk başlar. Yolculuk yaklaşık bir veya bir buçuk saat sürer."],["p","Vapur hafta sonları çok kalabalık olduğu için kimin ne konuştuğu anlaşılmaz. Sadece vapur garsonlarının “Buz gibi ayran, gazoz içen var mı?” diye bağırdıkları duyulur."],["p","Vapur adalara teker teker uğrayarak yolcularını indirir. Son durak Büyük Ada’dır. Adalarda inen yolcuların bir kısmı piknik yerlerine, bir kısmı da lokantalara doğru giderler."],["p","Bütün gün eğlenen yolcuların dönüşleri, gelişleri gibi olmaz tabi. Ama mecbur oldukları için şehrin gürültüsüne geri dönerler."],["l","1. Yukarıdaki parçaya göre aşağıdaki cümlelerden hangisi doğru değildir?"],["l","A) Bazı adalar özel mülk olduğu için bu adalara çıkmak imkânsızdır."],["l","B) Adalara gelenler mecbur oldukları için şehre geri dönerler."],["l","C) Tüm adalarda yerleşim alanları vardır."],["l","D) Marmara Denizi’ndeki adalarda araba kullanmak yasaktır."],["l","E) Marmara Denizi’nde büyüklü küçüklü birçok ada vardır."],["l","2. Yukarıdaki parçaya göre “Adalar İstan­bul’un güneyinde bir…………………..gibi Marmara Denizini” cümlesi aşağıdakilerden hangisi ile tamamlanmalıdır?"],["l","A) inci - dizilmektedir"],["l","B) altın kolye - göstermektedir"],["l","C) hazine - şekil vermektedir"]]},{"n":79,"b":[["l","D) gerdanlık - süslemektedir"],["l","E) bilezik - takılmaktadır"],["l","3. Yukarıdaki parçaya göre “Bu adalarda ………………… kullanmak yasaktır. Sadece, atların çektiği vardır.” cüm­lesinde boş bırakılan yerlere aşağıdakilerden hangileri gelmelidir?"],["l","A) fayton - bisiklet"],["l","B) bisiklet - motorlu araç"],["l","C) vapur - faytonlar"],["l","D) araba - faytonlar"],["l","E) bisiklet - araba"],["l","4. Yukarıdaki parçaya göre “Bütün gün eğlenen yolcuların dönüşleri,"],["l","……………………. gibi olmaz.” cümlesi aşağıdakilerden hangisi ile tamamlanmalıdır?"],["l","A) gidişleri"],["l","B) varışları"],["l","C) dönüşleri"],["l","D) gelişleri"],["l","E) uçuşları"],["l","5. Aşağıdakilerden hangisi adaların özel­liklerinden değildir?"],["l","A) Adalar yabancı turizme kapalıdır."],["l","B) Adalar sessiz, sakin ve temizdir."],["l","C) Adalarda dinlenme yerleri vardır."],["l","D) Bazı adalarda yerleşim yoktur."],["l","E) Adalarda bisiklet yoktur."],["l","6. Adalar genel olarak aşağıdakilerden hangisiyle isimlendirilmiştir?"],["l","A) Prens Adaları veya Kızıl Adalar"],["l","B) Burgaz Ada veya Kınalı Ada"],["l","C) Kaşık Adası veya Pide Adası"],["l","D) Turizme açık adalar veya özel mülk olan adalar"],["l","E) Ada tepeler"],["l","7. Bazı adalara çıkmak neden imkânsızdır?"],["l","A) Yerleşim olmadığı için"],["l","B) Özel mülk olduğu için"]]},{"n":80,"b":[["l","C) Yerli turizme kapalı olduğu için"],["l","D) Dinlenme yerleri bulunduğu için"],["l","E) Toprak olmadığı için"],["l","8. İstanbul halkı adalara niçin gidiyor?"],["l","A) Çalışmak için"],["l","B) Hafta sonlarını geçirmek için"],["l","C) Vapurla seyahat etmek için"],["l","D) Mecbur oldukları için"],["l","E) Alışveriş yapmak için"],["l","9. İstanbul halkı niçin şehre geri dönmek istemiyor?"],["l","A) Şehir gürültülü bir yerdir."],["l","B) Çünkü şehirde işleri vardır."],["l","C) Dönmek zorunda olduklarından"],["l","D) Piknik yerleri ve lokantalar olmadığı için"],["l","E) Şehir uzak olduğu için"],["l","10. Adalarda ulaşım nasıl sağlanıyor?"],["l","A) Faytonlarla"],["l","B) Arabalarla"],["l","C) Vapurla"],["l","D) Yürüyerek"],["l","E) Uçakla"],["h","RESSAM VE ÇOCUK"],["p","Paris’in büyük bir resim galerisinin girişinde gördüğü resmi çok beğenen bir çocuk bu resmi satın almak istedi. Çocuk bu resim için kumbarasında biriktirdiği bütün parayı verecekti. Galeri sahibi çocuğun bu isteği karşısında gülmemek için kendini zor tuttu. Fakat henüz 12 – 13 yaşlarında olan çocuğu üzmek de istemedi. “Bu resim, ülkemizin çok ünlü ressamlarından birine aittir” – dedi."],["p","Çocuk, ressamı tanımadığını ve kendisi için çok önemli olmadığını söyledi: “Ben resmi çok beğendim ve onu satın almak istiyorum” – dedi. “Bir hafta sonra kardeşimin doğum gününü kutlayacağız. Ona doğum günü armağanı almak istiyorum”. Galeri sahibi, çocuğa büyük bir adamla konuşuyormuş gibi davrandı."]]},{"n":81,"b":[["p","“İzin verirseniz resmin sahibi olan ressama telefon açayım ve senin teklifini söyleyeyim” – dedi. Sonra da ünlü ressama telefon etti ve çocuğun teklifini iletti. Ressam galeri sahibine, “Çocuğun verdiği parayı al ve resmi çocuğa ver.” dedi. Galeri sahibi ressamın söylediklerine çok şaşırdı. Ressama: “Size durumu tam anlatamadım galiba!” dedi. “Çocuğun kumbarasındaki parayı saymadım ama en fazla 10 doları vardır”. Ressam, “Hayır, yanlış anlaşılma yok” – dedi. Sonra da sözlerini şöyle tamamladı:"],["p","“Ben bu tabloma binlerce dolar verebilecek yüzlerce kişi bulabilirim ama bütün servetini verebilecek ikinci bir kişi bulamam”"],["l","– dedi."],["p","Lütfen, soruları okuduğunuz metine göre yanıtlayınız."],["l","1. Resim galerisi hangi şehirde bulunmaktadır?"],["l","A) İstanbul B) Paris C) New York D) Londra E) Roma"],["l","2. Çocuk galerideki resme kaç para vermek istedi?"],["l","A) Kumbarasındaki paraların yarısını"],["l","B) Kumbarasındaki paraların hepsini"],["l","C) Kumbarasındaki paraların bir kısmını"],["l","D) Cebinde bulunan paraların hepsini"],["l","E) Cebinde bulunan paraların yarısını"],["l","3. Çocuk kaç yaşlarında?"],["l","A) 9-10 B) 12 C) 13 D) 12-13 E) 10"],["l","4. Çocuk resmi niçin satın almak istiyor?"],["l","A) Annesine doğum günü hediyesi olarak"],["l","B) Babasına doğum günü hediyesi olarak"],["l","C) Kardeşine doğum günü hediyesi olarak"],["l","D) Ablasına doğum günü hediyesi olarak"],["l","E) Kendi odasına asmak için"],["l","5. Galeri sahibi resmin kime ait olduğunu söyledi?"],["l","A) Çok yeteneksiz bir ressama ait olduğunu söyledi"],["l","B) Çok ünlü bir ressama ait olduğunu söyledi"]]},{"n":82,"b":[["l","C) Çok zengin bir ressama ait olduğunu söyledi"],["l","D) Çok fakir bir ressama ait olduğunu söyledi"],["l","E) Kendisine ait olduğunu söyledi"],["l","6. Galeri sahibi çocuğa nasıl davrandı?"],["l","A) Büyük bir adamla konuşuyormuş gibi davrandı"],["l","B) Aşağılıyor bir şekilde davrandı"],["l","C) Umursamaz bir şekilde davrandı"],["l","D) Sinirli bir şekilde davrandı"],["l","E) Alay eder gibi davrandı"],["l","7. Ressam çocuğun teklifini duyunca galeri sahibine ne dedi?"],["l","A) Çocuğun verdiği parayı al ve resmi çocuğa ver, dedi."],["l","B) Çocuğu hemen kov, dedi."],["l","C) Çocuktan biraz daha para iste, dedi."],["l","D) Çocuktan para alma ve resmi hediye et, dedi."],["l","E) Çocuğu hemen benim yanıma getir, dedi."],["l","8. Çocuğun kumbarasında yaklaşık ne kadar para var?"],["l","A) 100 Dolar B) 1 Dolar C) 5 Dolar"],["l","D) 20 Dolar E) 10 Dolar"],["l","9. Galeri sahibi ressamın sözlerine niçin çok şaşırdı?"],["l","A) Çünkü resim çok pahalıydı ve ressam bu resmi ucuza satıyordu."],["l","B) Çünkü ressam resmi satmak istemiyordu."],["l","C) Çünkü ressam çocuğu daha önceden tanıyordu."],["l","D) Çünkü ressam çocuğa resmi satmak istemiyordu."],["l","E) Çünkü resim çok değersizdi, çocuk çok para veriyordu."],["l","10. Ressam bu kadar pahalı bir resmi niçin az paraya sattı?"],["l","A) Resim uzun zamandır satılmıyordu."],["l","B) Resim eskiydi."],["l","C) Ressam çocuğun babasını daha önceden tanıyordu."],["l","D) Ressam çocuğa acımıştı."]]},{"n":83,"b":[["l","E) Çocuk resme servetinin tamamını verdi, başka hiç kimse bunu yapmaz diye düşündü."],["h","TRUVA ATI"],["p","Eski zamanlarda, Truva adlı meşhur bir şehir vardı. Yüksek duvarlar ve sağlam kapılarla korunuyordu. Yunan ordusu yıllarca Truva şehrini ele geçirmeye çalıştı, fakat başarısız oldu. Şehir duvarlarının etrafında sürekli kamp kuruyorlardı."],["p","Bir gün Truvalılar uyandıklarında düşmanlarını göremediler. Yunanlılar kuşatmadan vazgeçip, gemilerine binip gitmiş gibiydiler. Truvalılar buna çok sevindiler. Sonra şehrin kapılarının önünde büyük ahşap bir at heykeli buldular. Bunu düşmanlarından bir hediye zannedip içeriye aldılar. O gece, Yunan ordusunun ayrılışı kutlandıktan sonra herkes uyudu. Fakat uyanık olan birileri vardı. Atın içinden sesler geliyordu. Aniden bir kapı açıldı. Yunan askerleri heykelin dılına çıkmaya başladılar. Sessizce şehrin kapılarına ulaşıp açtılar. Dışarıda, saklanan Yunan ordusunun diğer askerleri bekliyorlardı. Askerler hemen şehre girip her yeri ateşe vermeye ve uyuyan Truvalıları öldürmeye başladılar. Kurnazlıkları işe yaramıştı ve uzun süredir istedikleri şehri ele geçirmişlerdi."],["p","Truva Atı’nın hikayesi çok eskidir ve insanlar yüzyıllarca bunun doğru olduğuna inanmışlardır. Fakat sonunda hayali olduğu kanaatine varıldı. Bugün arkeologlar Türkiye’nin Ege kıyılarında eski Truva’nın kalıntılarını bulduklarını söylemektedirler. Birçok bilim adamı Truva Atı Efsanesi’nin kısmen doğru olabileceğini düşünmektedirler."],["p","I.Aşağıdaki ifadeler doğru mu (D), yanlış mı (Y)?"],["l","1. ( ) Yunanlılar, Truva kuşatmasından vazgeçip ülkelerine döndüler."],["l","2. ( ) Başlangıçta Truvalılar atın, düşmanlarından bir hediye olduğuna inanmadılar."],["l","3. ( ) Yunanlıların ayrılışını kutladıktan sonra Truva askerleri şehri beklediler."],["l","4. ( ) Truvalılar attan hoşlandılar."]]},{"n":84,"b":[["l","5. ( ) Arkeologlar şimdi Truva Savaşı’nın yapıldığına inanmaktadırlar. II. Aşağıdaki kelimeleri anlamlarıyla eşleştiriniz."],["l","1. Düşman a. Kazanmak, galip gelmek"],["l","2. Zafer b. Savunulan bir etrafını çevirmek"],["l","3. Ordu c. bir ülkenin askeri gücü"],["l","4. Ele geçirmek d. zorla almak"],["l","5. Kuşatmak e. size sevmeyen ya da zarar vermek isteyen birisi III. Aşağıdaki sorulara cevap veriniz."],["l","1. Hikayedeki ünlü şehrin adı neydi?"],["l","2. Yunanlılar niçin kuşatmayı bırakıyormuş gibi yaptılar?"],["l","3. Truvalılar niçin mutluydular?"],["l","4. Yunanlılar niçin once kapıları açtılar?"],["l","5. Truvalılar uyuduktan sonar Yunanlı askerler ne yaptılar?"],["h","TÜRKİYE COĞRAFYASI"],["p","Türkiye Cumhuriyeti, 1923 yılında Mustafa Kemal Atatürk tarafından kurulmuştur."],["p","Türkiye, hem Avrupa hem de Asya kıtasında toprakları bulunan bir ülkedir. Türkiye’nin Avrupa kıtasında bulunan bölümüne Trakya; Asya kıtasında bulunan bölümüne ise Anadolu denir. Asya kıtası ile Avrupa kıtası İstanbul Boğazı, Marmara Denizi ve Çanakkale Boğazı ile ayrılır. Dünyada iki kıtada toprakları bulunan ülkeler sadece Türkiye, Rusya Federasyonu ve Mısır’dır."],["p","Türkiye, üç tarafı denizlerle çevrili bir ülkedir. Türkiye’nin güneyde Akdeniz, kuzeyde Karadeniz, batıda Ege Denizi ve bir iç deniz olan Marmara Denizi ile kıyısı vardır. En uzun deniz kıyısı Karadeniz iledir."],["p","Türkiye; kuzeybatıda Yunanistan ve Bulgaristan; güneydoğuda Suriye ve Irak; doğuda İran, Azerbaycan, Ermenistan ve Gürcistan ile komşudur. En uzun kara sınırı Suriye iledir."],["p","Türkiye 814.578 kilometre karelik yüz ölçümü ile Rusya Federasyonu’ndan sonra Avrupa’nın en büyük yüzölçümüne sahip ülkesidir. Türkiye’nin nüfusu ise 2003 yılı Ocak ayı verilerine göre 70"]]},{"n":85,"b":[["p","milyondan fazladır. Türkiye nüfus olarak Avrupa’da Almanya’dan sonra ikinci sıradadır. Dünya’da ise on beşinci büyük nüfusa sahip ülkedir."],["p","Türkiye’de 81 vilâyet vardır. En kalabalık şehir 15 milyondan fazla insanın yaşadığı İstanbul’dur. İstanbul’un yarısı Asya’da, yarısı Avrupa’dadır. Böyle iki kıtada toprakları olan şehir dünyada sadece İstanbul’dur. İstanbul’dan sonra en büyük şehirler Ankara, İzmir, Adana, Bursa ve Konya’dır."],["p","Türkiye’de yedi coğrafî bölge vardır. Bunlar; Marmara Bölgesi, Ege Bölgesi, Akdeniz Bölgesi, Karadeniz Bölgesi, İç Anadolu Bölgesi, Doğu Anadolu Bölgesi ve Güneydoğu Anadolu Bölgesi’dir. Nüfusun en yoğun olduğu bölge İstanbul’un da bulunduğu Marmara Bölgesi’dir. Ayrıca Marmara Bölgesi sanayileşmenin en yoğun olduğu bölgedir. Yüzölçümü en geniş olan bölge ise Doğu Anadolu Bölgesi’dir. Ayrıca Doğu Anadolu Bölgesi dağların en yoğun olduğu bölgedir. Tarıma en elverişli bölgeler Ege ve Akdeniz Bölgeleri’dir. Turistik yerlerin en yoğun olduğu bölgeler ise Akdeniz, Ege ve Marmara Bölgeleri’dir."],["l","A. Doğru cevabı işaretleyiniz."],["l","1. Yukarıdaki parçaya göre aşağıdaki bilgilerden hangisi doğru değildir?"],["l","A) Türkiye Cumhuriyeti, 1923 yılında kurulmuştur."],["l","B) Türkiye’nin yüz ölçümü 814.578 kilometre karedir."],["l","C) Türkiye’de son nüfus sayımı 2003 yılında yapıldı."],["l","D) İstanbul, yüz ölçümü en büyük olan şehirdir."],["l","E) Türkiye’de 7 coğrafî bölge vardır."],["l","2. Dinlediğiniz parçaya göre aşağıdaki bilgilerden hangisi yanlıştır?"],["l","A) Tuz Gölünden tuz elde edilir."],["l","B) Asya ile Avrupa İstanbul Boğazı, Marmara Denizi ve Çanakkale Boğazı ile ayrılır."],["l","C) Türkiye’nin Asya tarafında bulunan kısmına “Anadolu” denir."],["l","D) Türkiye’nin en uzun deniz kıyısı Ege Denizi iledir."]]},{"n":86,"b":[["l","E) Türkiye’nin güneyinde Akdeniz vardır."],["l","3. Türkiye’de kaç il vardır?"],["l","A) 82 B) 18 C) 81 D) 88 E) 78"],["l","4. Avrupa’nın en çok nüfusa sahip ülkesi hangisidir?"],["l","A) İspanya B) Almanya C) Romanya"],["l","D) Türkiye E) İngiltere"],["l","5. Okuduğunuz parçaya göre “Türkiye’nin en ………….. şehri 15 milyondan fazla yaşadığı İstanbul’dur.” cümlesi aşağıdakilerden hangisi ile tamamlanmalıdır?"],["l","A) Yoğun B) Kalabalık C) Büyük"],["l","D) Geniş E) Kalabalık"],["l","6. İki kıtada toprakları bulunan ülkeler aşağıdakilerden hangileridir?"],["l","A) Türkiye, Ukrayna ve Mısır"],["l","B) Türkiye, Suriye ve Pakistan"],["l","C) Türkiye, Bulgaristan ve Meksika"],["l","D) Türkiye, Rusya ve Mısır"],["l","E) Türkiye, İspanya ve Irak"],["l","7. Aşağıdaki şıklardan hangisinde turizmin en yoğun olduğu üç bölge birlikte verilmiştir?"],["l","A) Akdeniz Bölgesi, Ege Bölgesi, Doğu Anadolu Bölgesi"],["l","B) Akdeniz Bölgesi, Ege Bölgesi, Güney Doğu Anadolu Bölgesi"],["l","C) Akdeniz Bölgesi, Marmara Bölgesi, Doğu Anadolu Bölgesi"],["l","D) Akdeniz Bölgesi, İç Anadolu Bölgesi, Doğu Anadolu Bölgesi"],["l","E) Akdeniz Bölgesi, Ege Bölgesi, Marmara Bölgesi"],["l","8. Aşağıdakilerden hangisi Türkiye’ye komşu ülkelerden değildir?"],["l","A) Mısır B) Irak C) Bulgaristan"],["l","D) Yunanistan E) Gürcistan"]]},{"n":87,"b":[["l","9. Aşağıdakilerden hangisi “İstanbul’’ için söylenemez?"],["l","A) Türkiye’nin en kalabalık şehridir."],["l","B) Dünyanın on beşinci büyük nüfusa sahip şehridir."],["l","C) İstanbul Boğazı ile ikiye ayrılır."],["l","D) Türkiye’nin en önemli turizm şehirlerindendir."],["l","E) İki kıtada toprakları olan tek şehirdir."],["l","10. Dağların yoğun olduğu, yüz ölçümü en büyük olan bölge aşağıdakilerden hangisidir?"],["l","A) İç Anadolu Bölgesi B) Güney Doğu Anadolu Bölgesi"],["l","C) Doğu Anadolu Bölgesi D) Akdeniz Bölgesi"],["l","E) Marmara Bölgesi"],["l","11. Türkiye’nin en yeşil bölgesi hangisidir?"],["l","A) AkdenizB) Karadeniz"],["l","C) Marmara Bölgesi D) İç Anadolu Bölgesi"],["l","E) Ege Bölgesi"],["l","12. Aliya Türkiye’de en çok nereyi merak ediyor?"],["l","A) Hoşgörünün temsilcisi Mevlana’nın şehri Konya’yı"],["l","B) Medeniyetler şehri İstanbul’u"],["l","C) Bembeyaz Pamukkale’yi"],["l","D) Masmavi denizi bulunan Antalya’yı"],["l","E) Başkent Ankara’yı"],["l","13. Aliya İstanbul’dan sonra nereye gidecek?"],["l","A) Antalya B) İzmir C) Pamukkale D) Konya"],["l","E) Ankara"],["l","14. Türkiye’de kış turizmi nerelerde yapılmamaktadır?"],["l","A) Bursa-Uludağ B) Erzurum-Palandöken"],["l","C) Bolu-Kartalkaya D) Kayseri-Erciyes E) Antalya-Alanya"],["l","15. Karadeniz bölgesinde hangi tür turizm vardır?"],["l","A) Kış turizmi B) Yaz turizmi C) Yayla turizmi"],["l","D) Deniz turizmi E) Tarihi turizm"]]},{"n":88,"b":[["h","MİRAS"],["p","Yalı amca iki sene önce canından çok sevdiği eşini toprağa vermişti. Çünkü eşi zatüriye olmuştu ve köy de doktor olmadığı için hastalığı ilerlemişti zamanın da müdahale yapılmadığı için ölmüştü. Yaşlı amcanın iki tane (otuzdört, otuzbeş) yaşların da oğulları vardı. Eşinin ölümünü amca kaldıramamış hasta düşmüştü. Az zamanı kaldığını biliyordu ve oğullarına mirasını açıkladı."],["l","- “Hangisini istersiniz çocuklar, altın kaplama bir silah mı, yoksa bir tas su mu?” diğerek sordu? Bunun üzerine küçük kardeş bir tas suyu istedi. Büyük abisi altın silahı aldı. Büyük oğlu şöyle düşündü: “Babam öldükten sonra silahı satar parasını yerim!”. Bundan sonra babaları haftasına kalmada öldü. Babalarını annelerinin yanına gömdüler. Babasını toprağa verdikten sonra abisi büyük şehire silahı satmak için gider. Ne olduysa o arada olur abisi bir daha geri gelmez. Daha sonra gelen haberlere göre kendisi bir kavgaya karışmış ve birini öldürmüştü. Bundan dolayı abisi üç sene hapis bekliyordu. Bu haberden üzüntü içinde olan küçük kardeş yolda gelirken sokaktan geçen bir dilenci görür. Dilenci iç acıcı bir durumda ondan su ister. Küçük kardeş dilincinin bu halini acır ve ona elindeki bir tas suyu verir. Dilenci suyu kana kana içtikten sora boş tası verirken küçük çocuğa şunları der. “-Allah tuttuğunu altın etsin!” derken çocuk tası tutar. Bu sırada tas altın olmuştur. Çocuk şaşırmıştır dilenciye sarılır sonsuz teşekkürlerini eder ve yanındaki yiyecekleri ona verip yoluna devam eder. Köye gider annesinin ve babasının mezarını ziyaret eder. Yanında getirdiği altın tasla mezarlarına su döker ve dua eder. Sonra canından çok sevdiği abisini kurtarmak için şehre yola koyulur. Şehirde pazarda elindeki altın tası satar ve karşılığına bol para alır. Şehrin baş hekimine gelir ve kadeşi kurtarır. Bundan sonra iki kardeş köye dönerler babadan miras kalan toprağı işletir ve uzun mutlu bir hayat sürerler."],["l","A. Lütfen, soruları metine göre cevaplayınız."],["l","1. Yaşlı amca neden hasta olmuştu?"],["l",".................................................................................................."]]},{"n":89,"b":[["l","2. Yaşlı amca çocuklarına ne miras bırakmıştır?"],["l",".................................................................................................."],["l","3. Çocuklar mirası nasıl kullanmıştır?"],["l",".................................................................................................."],["l","4. Neden küçük kardeşin elendeki tas altına dönüşür?"],["l",".................................................................................................."],["l","B. Lütfen, metine göre cümleleri doğru olanını (D), yanlış olanını"],["l","(Y) şeklinde işaretleyiniz."],["l","A) ( ) Çocukların anneleri babalarının ölümüne dayanamamış ölmüş."],["l","B) ( ) Babaları iki kardeşe biras olarak hiçbir şey bırakmamış."],["l","C) ( ) Büyük kardeş daha akıllı olduğundan dolayı altın silahı almış."],["l","D) ( ) Küçük kardeş daha iyilik sever ve insancıl birine benzer."],["l","E) ( ) Hikayenin sonu mutlu bitmekte iki kardeş gerçekten birbirlerini severler."],["h","İLK YARDIM"],["p","İlk yardımın ilk başlangıcı ilk insanlara kadar uzanmaktadır. Avlanmakla yaşamını sürdüren ilk insanların yaralanma sırasında, yarasını iyileştirmek için gösterdiği çaba basit anlamda ilk yardım olarak değerlendirilebilir."],["p","Günümüzün insanı ise tekniğin meydana getirdiği karmaşık yaşam içerisinde daha fazla tehlikelerle karşı karşıya kalmaktadır. Trafik kazalarında her yıl yüz binlerce insan yaralanmakta, on binlerce insan da hayatını kaybetmektedir. Harp araçları müthiş denilecek derecede gelişmiş, bir atom bombasının patlaması binlerce insanın hayatına mal olmaya başlamıştır. Sosyal ve ekonomik zorunluluklar bir arada yaşama gereğini doğurmuş, bu da büyük şehirlerin doğmasına sebep olmuştur."],["p","Bir yandan savaşlar, diğer yandan teknik araç ve gereçlerin kullanılmasına bağlı kazalar, deprem ve sel baskınları gibi tabii afetler ile trafik kazaları, ev ve iş kazaları her gün bir çok insanın yaralanmasına veya ölmesine sebep olmaktadır."]]},{"n":90,"b":[["p","Çalıştığınız işyerinden evinize gelinceye kadar günün her saatinde herhangi bir şekilde yaralanabilirsiniz. Anneniz, babanız, kardeşleriniz, çocuklarınız ya da tanıdık
