<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Narjan Turkish — turk tili va sertifikatga tayyorlov</title><meta name="theme-color" content="#0d1b4c">
<style>:root{--navy:#0d1b4c;--navy2:#16286b;--blue:#2f6bff;--blue2:#e9f0ff;--violet:#7b4dff;--violet2:#f1ebff;--bg:#f5f7fc;--card:#fff;--ink:#121a33;--muted:#68728c;--line:#e3e8f3;--green:#0f9d63;--green2:#e6f7ef;--red:#d93a49;--red2:#fdecee;--amber:#d98a00;--amber2:#fff5df;--shadow:0 10px 30px #1a2b6b12;--r:18px}
[data-theme=dark]{--bg:#0b1020;--card:#141b31;--ink:#e8ecf8;--muted:#98a2bd;--line:#26304d;--blue2:#1a2650;--violet2:#241c45;--green2:#0f2b22;--red2:#33161b;--amber2:#33280f;--shadow:0 10px 30px #0006}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--violet));display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;letter-spacing:-1px;flex:none}
.brand b{display:block;font-size:15px;letter-spacing:.5px}.brand small{display:block;font-size:10.5px;opacity:.7}
.side a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:11px;color:#dfe6ff;text-decoration:none;font-size:14px;margin:1px 0}
.side a:hover{background:#ffffff14}.side a.on{background:#ffffff22;color:#fff;font-weight:700}
.side .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;opacity:.5;padding:12px 12px 4px}
.main{flex:1;min-width:0;padding:22px 26px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.top h1{font-size:24px;margin:0;line-height:1.2}.top .sub{color:var(--muted);font-size:13.5px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;cursor:pointer;display:grid;place-items:center;font-size:17px;flex:none}
.mtop{display:none}
.bnav{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:18px}.card h3{margin:14px 0 8px;font-size:15.5px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.grid2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-decoration:none;color:inherit;display:block;transition:.15s}
.tile:hover{border-color:var(--blue);transform:translateY(-1px)}
.tile .ic{font-size:24px}.tile b{display:block;margin:6px 0 2px}.tile small{color:var(--muted);font-size:12.5px;display:block}
.hero{background:linear-gradient(130deg,var(--navy),var(--blue) 70%,var(--violet));color:#fff;border-radius:22px;padding:22px;margin-bottom:14px;position:relative;overflow:hidden}
.hero h2{margin:0 0 4px;font-size:22px}.hero p{margin:0;opacity:.85}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hchip{background:#ffffff22;border-radius:12px;padding:8px 12px;font-size:13px}.hchip b{font-size:17px;display:block}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none;font-size:14px}
.btn.sec{background:var(--blue2);color:var(--blue)}.btn.vio{background:var(--violet)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11.5px}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:700;background:var(--blue2);color:var(--blue)}
.pill.v{background:var(--violet2);color:var(--violet)}.pill.g{background:var(--green2);color:var(--green)}.pill.r{background:var(--red2);color:var(--red)}.pill.a{background:var(--amber2);color:var(--amber)}
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2f6bff22}
textarea{min-height:130px;resize:vertical}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 13px;white-space:nowrap;cursor:pointer;font-size:13.5px;font-weight:600}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
[data-theme=dark] .tabs button.on{background:var(--blue);border-color:var(--blue)}
.bar{height:8px;border-radius:10px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--violet));border-radius:10px;transition:width .3s}
.q-prompt{background:var(--blue2);border-radius:16px;padding:20px 14px;text-align:center;margin:10px 0 14px}
.q-prompt small{display:block;color:var(--muted);font-weight:700;font-size:12px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.q-prompt .w{font-size:26px;font-weight:800;overflow-wrap:anywhere}.q-prompt .s{font-size:18px;font-weight:600}
.q-prompt .emo{font-size:64px;line-height:1.1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:13px;padding:13px;text-align:left;font-weight:650;cursor:pointer;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.ok{border-color:var(--green);background:var(--green2);color:var(--green)}.opt.no{border-color:var(--red);background:var(--red2);color:var(--red)}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14px}.fb.ok{background:var(--green2);color:var(--green)}.fb.no{background:var(--red2);color:var(--red)}
.fb .why{color:var(--ink);margin-top:6px;font-size:13.5px}
.tok{display:inline-block;border:1.5px solid var(--line);border-radius:10px;padding:7px 11px;margin:3px;cursor:pointer;background:var(--card);font-weight:600}
.tok.used{opacity:.3;pointer-events:none}
.ans-line{min-height:48px;border:1.5px dashed var(--line);border-radius:12px;padding:6px;margin-bottom:8px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--blue2);font-size:13px}
.twrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
.list .it{padding:11px 0;border-bottom:1px solid var(--line)}.list .it:last-child{border:0}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.kv div{background:var(--bg);border-radius:13px;padding:12px}.kv b{display:block;font-size:21px}.kv span{font-size:12px;color:var(--muted)}
.para{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.para .tr{font-size:15.5px;overflow-wrap:anywhere;min-width:0}.para .uz{min-width:0;overflow-wrap:anywhere}.para.solo{grid-template-columns:1fr;padding:8px 0}.para .uz{color:var(--ink);opacity:.9;border-left:3px solid var(--violet);padding-left:12px}
.para.h .tr{font-weight:800;font-size:18px}.para.l .tr{font-size:14px}
.para.flag .uz{border-color:var(--red);background:var(--red2)}
.w-tap{cursor:pointer;border-radius:4px}.w-tap:hover{background:var(--blue2)}
.hl{background:var(--amber2);border-bottom:2px solid var(--amber);border-radius:3px;cursor:pointer}
.chat{display:flex;flex-direction:column;gap:9px;max-height:58vh;overflow:auto;padding:4px}
.msg{max-width:85%;padding:10px 13px;border-radius:15px;white-space:pre-wrap;font-size:14.5px}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;z-index:99;font-size:14px;box-shadow:var(--shadow);max-width:90vw}
.modal{position:fixed;inset:0;background:#0008;z-index:90;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--card);width:min(640px,100%);max-height:86vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:22px}}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.diff del{background:var(--red2);color:var(--red)}.diff ins{background:var(--green2);color:var(--green);text-decoration:none}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mem button{aspect-ratio:1/1;border-radius:13px;border:1.5px solid var(--line);background:var(--blue2);font-weight:700;font-size:13px;cursor:pointer;padding:4px;overflow-wrap:anywhere}
.mem button.open{background:var(--card)}.mem button.done{background:var(--green2);border-color:var(--green);color:var(--green)}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.chart svg{width:100%;height:auto;display:block}
.lock{opacity:.55}
.note{background:var(--amber2);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:8px 0}
.info{background:var(--blue2);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:8px 0}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.qnav{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.qnav button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:12px}
.qnav button.ans{background:var(--blue2);border-color:var(--blue)}.qnav button.cur{outline:2px solid var(--violet)}
@media(max-width:860px){
 .side{display:none}.main{padding:12px 12px 96px}
 .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 12px 10px;margin:-12px -12px 10px;border-bottom:1px solid var(--line)}
 .mtop b{font-size:14px;letter-spacing:.4px}.mtop small{display:block;font-size:10px;color:var(--muted)}
 .top h1{font-size:20px}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bnav a{flex:1;text-align:center;font-size:10.5px;color:var(--muted);text-decoration:none;padding:4px 0}
 .bnav a span{display:block;font-size:20px;line-height:1.2}.bnav a.on{color:var(--blue);font-weight:700}
 .opts,.grid2,.para{grid-template-columns:1fr}
 .para .uz{border-left:0;border-top:2px solid var(--violet);padding:8px 0 0}
 .grid{grid-template-columns:repeat(2,1fr)}
 .card{padding:14px}
}

..........................195"],["l","101. Bufalo .................................................................................................200"],["l","102. Görme, Anlama Merakı ......................................................................204"]]},{"n":6,"b":[["p","АЛҒЫ СӨЗ"],["p","Тіл-ұлтаралық қарым-қатынастың ең негізгі құралының бірі. Мәдениет пен ұлттың алтын көпірі болып келген тіл, достық пен бауырластықтың өркендеуінде маңызды рөл атқарады."],["p","Қазақстанның егемендігін алғаш таныған бауырлас Түркия мемлекеті мен Қазақстан арасындағы мәдени және саяси арақатынастар қарқынды дамуда. Елімізде түрік тіліне деген қызығушылық арта түсуде. Сол себепті, заманымыздың талабына сай, жоғары оқу орындарында түрік тілі мен әдебиеті бөлімдері ашылып, жыл өткен сайын бұл бөлімдердегі студенттердің саны артып келеді."],["p","Түрік тілінің «Türkçe 100 Metin» оқу құралы түрік тілі негізгі пән және екінші шетел тілі ретінде оқытылатын факультеттерге арналған. Түрік тілі үйренушілерінің қазіргі сұранысын және әдістемелік бағыттарды басшылыққа ала отырып түрік тіліндегі мәтіндер жинақталды. Оқу құралындағы мәтіндер мазмұны мен материалдарды деңгейлік оқыту әдісіне негізделеді."],["p","Әрбір мәтіндің соңында студенттердің деңгей бойынша жинақталған білімді сөйлеу, жазу, түсіну, оқу дағдыларын тұтастай айқындауға мүмкіндік беретін тест сұрақтарымен тапсырмалар түрік тілінің фонетикалық, лексикалық, грамматикалық жүйесі, құрылымы мен әдістемелік мағлұматқа ие."]]},{"n":7,"b":[["h","PİKNİK"],["p","Bugün hava çok güzel ve güneşli. TÖMER’in öğrencileri Çubuk Barajı’na pikniğe gidiyorlar. Okuldan bir otobüse biniyorlar. Pikniğe 30 öğrenci ve 8 öğretmen gidiyor. Orada yemek için meyveler, peynir, ekmek ve salam alıyorlar. Bir öğrencinin teybi ve güzel kasetleri var. Bazı öğrencilerin de topları var. Otobüs saat 11’de kalkıyor ve 20 dakikada Baraja gidiyor. Orada tahta masalar ve sıralar var. Öğrenciler ve öğretmenler masalarda oturuyorlar, yemek yiyorlar, müzik dinliyorlar ve konuşuyorlar. Biraz da çalışıyorlar, çünkü yarın onların Türkçe sınavları var. Onlar çok çalışıyorlar, çünkü çabuk Türkçe öğrenmek istiyorlar."],["p","Otobüs saat dörtte geliyor ve hepsi okula dönüyorlar. Güzel bir gün… Ama şimdi yorgundurlar. Artık dinlenmek istiyorlar."],["l","A. Aşağıdaki sorulara cevap veriniz."],["l","1. Öğrenciler ve öğretmenler piknikte ne yapıyorlar?"],["l",".................................................................................................."],["l","2. Öğrenciler piknikte niçin ders çalışıyorlar?"],["l",".................................................................................................."],["l","B. Doğru cevabı işaretleyiniz."],["l","1. Bugün hava nasıl?"],["l","a) Bugün hava çok güzel ve güneşli."],["l","b) Bugün hava güneşli ve güzel."],["l","c) Bugün hava çok güzel ve biraz rüzgarlı."],["l","d) Bugün hava çok güzel ama güneşli değil."],["l","2. Öğrenciler piknikte yemek için neler alıyorlar?"],["l","a) Onlar yemek için meyveler, reçel, ekmek alıyorlar."],["l","b) Onlar yemek için meyveler, peynir, ekmek ve salam alıyorlar."],["l","c) Onlar yemek için meyveler, peynir ve salam alıyorlar."],["l","d) Onlar yemek için meyveler, yumurta ve salam alıyorlar."]]},{"n":8,"b":[["l","C. Aşağıdaki boşlukları tamamlayınız."],["l","1. TÖMER’..... öğrencileri Çubuk ................ ...................... gidiyorlar."],["l","2. Öğrenciler …… öğretmenler …………….. oturuyorlar, biraz da …………….."],["l","3. Otobüs ....... ........... geliyor ve ............. ................. dönüyorlar."],["l","D. Aşağıdaki cümlelerden doğru olanı “D” , yanlış olanı “Y” ile işaretleyiniz."],["l","1. ( ) Öğrenciler dinlenmek istemiyorlar, çünkü onlar yorgun değiller."],["l","2. ( ) Öğrencilerin yarın sınavları var."],["l","3. ( ) Onlar çok çalışmıyorlar, ama çabuk Türkçe öğrenmek istiyorlar."]]},{"n":9,"b":[["h","MEVSİMLER"],["p","Türkiye’de bir yılda dört mevsim vardır. Bu mevsimler ilkbahar, yaz, sonbahar, kıştır. Her mevsim üç ay sürer. Aralık, ocak, şubat kış ayları, mart, nisan, mayıs ilkbahar ayları, haziran, temmuz, ağustos yaz ayları, eylül, ekim, kasım da sonbahar aylarıdır."],["p","İlkbaharda güneş hem daha erken doğar, hem de daha geç batar. Bunun için günler uzun olur. Ağaçlar çiçek açar. Her yer yemyeşil olur, bazı hayvanlar kış uykusundan uyanır göçmen kuşlar uzak ülkelerden gelir. İlkbaharda sık sık yağmur yağar, gök gürler, şimşek çakar. Ama, sonra hemen güneş açar. İlkbahar ne soğuk ne de sıcaktır. İlkbaharda genellikle havalar ılık olur. İnsanlar evlerinde ilkbahar temizliği yaparlar."],["p","Yazın havalar iyice ısınır. Bütün okullar tatil olur. Denizlerin, göllerin, nehirlerin suyu ısınır. Herkes denizlere, dağlara veya ormanlara koşar. Deniz ve güneş sağlığımız için çok yararlıdır. Yazın meyveler, sebzeler olgunlaşır. Bütün bitkiler biraz daha büyürler."],["p","Sonbaharda artık uzun günler yavaş yavaş kısalır. Havalar da artık çok şıcak değildir. Sonbaharda çok yamur yağar. Üşümemek için daha kalın elbiseler giyeriz. Tatil biter okullar ve dersler başlar."],["p","Kışın havalar iyice soğur. Gündüzler kısa geceler uzundur. Kışın ağaçların hiç yaprağı kalmaz. Sadece çam gibi bazı ağaçlar kışın da yeşil kalır. Kışın hasta olmamak ve üşümemek için en kalın elbiselerimizi giyeriz."],["p","Lütfen, soruları okuduğunuz metine göre yanıtlayınız."],["l","1. Seçeneklerin hangisinde sonbahar ayları verilmiştir?"],["l","A) Mart, Nisan, Mayıs B) Haziran, Temmuz, Ağustos"],["l","C) Eylül, Ocak, Aralık D) Kasım, Aralık, Ekim"],["l","E) Eylül, Ekim, Kasım"],["l","2. Seçeneklerin hangisi ilkbahar mevsimi özelliklerinden değildir?"],["l","A) Gündüz geceye göre daha uzundur"],["l","B) Hayvanlar ve bitkiler uykudan uyanır."]]},{"n":10,"b":[["l","C) Meyve ağaçları ürün verirler"],["l","D) Karlar ve donlar erirle"],["l","E) Kuşlar soğuk ülkelerden gelirler."],["l","3. Seçeneklerin hangsinide mevsimler sırasıyla verilmiştir?"],["l","A) yaz-kış-ilkbahar-sonbahar B) kış-sonbahar-ilkbahar-yaz"],["l","C) sonbahar-yaz-ilkbahar-kış D) ilkbahar-sonbahar-yaz-kış"],["l","E) ilkbahar-yaz-sonbahar-kış"],["l","4. Lütfen, “Yazın meyveler, sebzeler ..................” cümleyi tamamlayınız."],["l","A) yetişir B) pişer C) olgunlaşır D) gelişir E) büyür"],["l","5. Hangi mevsimlerde öğrenciler tatile çıkarlar?"],["l","A) Yaz ve ilkbharda B) Kış ve sonbaharda"],["l","C) Yaz ve kışın D) İlhbahar ve sonbaharda"],["l","E) Kış ve ilkbaharda"],["h","SOKAK KÖPEĞİ"],["p","Zeynep, Erol’un kızkardeşidir. Zeynep şimdi ortaokul ikinci sinifa gidiyor. Ağabeyi ise lise ikide. Zeynep hergün okula yürüyerek gidiyor. Zeynep yine bir gün okuldan eve yürüdü ve eve geldi. Evlerinin kapısının önünde bir yavru köpek gördü. Evde annesi, babası yoktu. Hemen köpeği içeri almak istedi. O sırada ağabeyi Erol geldi. Erol köpeği görünce çok şaşırdı. Zeynep “Bu köpeği eve alayım mı?” diye sordu. Ağabeyi Erol “Hayır, alma, o bir sokak köpeği, belki de kuduz.” dedi. Fakat Zeynep ağabeyinin sözünü dinlemedi, köpeği içeri aldı. Biraz sonra, babası geldi. Evde köpeği gördü ve çok şaşırdı. Zeynep’e çok çok kızdı. “Belki köpek kuduz, o zaman kudüz aşısı olacaksın” dedi. Zeynep çok korktu. Hemen doktora gittiler. Doktor köpeği muayene etti. Köpek kuduz değildi. Zeynep çok sevindi. Babası da Zeynep’in bu köpeğe evde bakmasına izin verdi."]]},{"n":11,"b":[["l","A. Aşağıdaki sorulara cevap verin. l. Zeynep köpeği nerede buldu?"],["l","............................................................................................................"],["l","2. Babası Zeynep’e niçin kızdı?"],["l","............................................................................................................"],["l","3. Zeynep niçin korktu?"],["l","............................................................................................................"],["l","4. Sizce, hayvanları sevmek gerekli mi?"],["l","............................................................................................................"],["l","B. Aşağıdaki cümlelerden doğru olanları (D), yanlış olanları (Y) olarak işarctleyiniz."],["l","1. ( ) Erol, Zeynep’e köpeği alması için çok ısrar etti."],["l","2. ( ) Zeynep ağabeyinin sözünü dinlemedi."],["l","3. ( ) Babası Zeynep’e kızmadı, çünkü o da köpekleri çok seviyor."],["l","4. ( ) Zeynep ve babası köpeğe doktorun bakmasına izin verdi."],["h","AKILLI- DİLENCİ"],["p","Bir köylü kadın ikinci defa evlendi. Mutfakta birinci kocasını düşündü. Birinci kocası şimdiki kocasından daya iyiydi. Bu arada bir dilenci kapıyı çalmadan içeri girdi. Köylü kadından bir şeyler vermesini rica etti. Çünkü dilenci çok açtı. Köylü kadın dilenciye: “Nereden geliyorsun?” diye sordu. Dilenci “Çanakkale’den geliyorum” diye cevap verdi. Köylü kadın Çanakkale’yi duymadı ve bunu cennet gibi anladı. Kadın: “Birinci kocam geçen yıl öldü. Cennette onu gördün mu?” diye sordu. Dilenci: “Tabii, sevgili bayan, kocanızı taniyorum. Kocanız orada gömleksiz, şapkasız büyük bir elbiseyle dolaşıyor” dedi. Köylü kadın: Ah! Benim zavallı kocam dedi ve dilenciye: “Cennete ne zaman dönüyorsun?” diye sordu. Dilenci: “Yarın hazırlanıp on dört gün sonra cennete dönecegim.” dedi. Köylü kadın: “Birinci kocama bir şeyler götürür müsün?” diye sordu. Dilenci; “Tabii” diye cevap verdi ve “Deli bir kadın! Belki Ölü kocasına para ve elbise gönderir” diye düşündü. Köylü kadın"]]},{"n":12,"b":[["p","pantolon, gömlek, ayakkabı ve 12 tane altın, bir sucuk ve üzümü getirip torbaya koydu. Köylü kadın, dilenciye; “Bunların hepsini kocama götür ve ona selamımı söyle” dedi. Dilenci torbayı alip gitti. Biraz sonra kadının kocası geldi. Köylü kadın kocasına “Birinci kocama biraz önce bir dilenciyle giyecek, altın ve sucuk gönderdim” dedi. Kocası: “Aman Tanrım! Deli kadın” diye düşündü. Karısına hiçbir çey söylemeden atını getirdi ve binip dilencinin arkasından gitti. Dilenci nal sesleri duydu, durup baktı ve köylüyü gördü. Hemen torbayı bir ağacın arkasına saklayıp torbanın üstünü örttü ve yolun kenarına oturdu. Köylü geldi ve dilenciye; “Torbalı bir dilenci gördün mü?” diye sordu. Dilenci; “Evet gördüm Şu tarafa gitti.” dedi. Köylü dilenciye: “Atımı tut” diye rica etti ve o tarafa doğru koşmaya başladı. Dilenci torbayı aldı ve ata binip gitti. Köylü tabii dilenciyi bulamadan geri döndü baktı ama at ve o adam yoktu. Her şeyi o zaman anladı. Köylü: “Ben karımdan daha deliyim. Dilenciye atımı kendim verdim” dedi ve eve yürüyerek döndü. Karısı: “Yürüyerek mi geldin?” diye sordu. Köylü: “Evet, cennete daha çabuk, gitsin ve eşyalari birinci kocana ulaştırsın diye atımı dilenciye verdim” dedi."],["l","A. Aşağıdaki doğru cevapları işaretleyiniz."],["l","1. Dilenci köylü kadından niçin bir şeyler vermesini rica etti?"],["l","a. Çünkü, onu tanıyordu. ( )"],["l","b. Çünkü, o cennetten geldi. ( )"],["l","c. Çünkü, çok açtı. ( )"],["l","d. Dilencinin parası yoktu. ( )"],["l","2. Köylü kadının birinci kocası ne zaman öldü?"],["l","a. Üç yıl önce öldü. ( )"],["l","b. Ankara’da öldü. ( )"],["l","c. Dün öldü. ( )"],["l","d. Geçen yıl öldü. ( )"],["l","3. Dilenci köylü kadının kocasını tanıyor mu?"],["l","a. Dilenci köylü kadının kocasını hiç görmedi ( )"],["l","b. Köylü kadının kocasını cennetten tanıyor ( )"],["l","c. Evet, dilenci köylü kadnın kocasını tanıyor. ( )"],["l","d. Dilenci cennetten geldi. ( )"]]},{"n":13,"b":[["l","4. Köylü kadın dilenciyle birinci kocasına neler gönderiyor?"],["l","a. Köylü kadın, dilenciyle birinci kocasina pantolon, gömlek, ayakkabı, 12 tane altın, sucuk ve üzüm gönderiyor"],["l","( )"],["l","b. Rakı gönderiyor. ( )"],["l","c. Hiçbir şey göndermiyor. ( )"],["l","d. Elma, armut gönderiyor. ( )"],["l","5. Köylü eve niçin yürüyerek döndü?"],["l","a. Çünkü, çok yoruldu. ( )"],["l","b. Çünkü, yürümek istedi. ( )"],["l","c. Çünkü, atı öldü. ( )"],["l","d. Çünkü, dilenci ata binip gitti. ( )"],["l","B. Aşağıdaki boşluklari tamamlayınız."],["l","1. Dilenci ................................. “geliyorum” diye sevap verdi."],["l","2. Birinci kocası,..................... ................................... iyiydi."],["l","3. Birinci kocam geçen yıl ......................................... cennette onu ........................?"],["l","4. ........................................................ bir dilenci gördün mü?"],["l","5. .............................................. diye rica etti ve o tarafa dogru ................................."],["h","ÇİFTLİĞİMİZ"],["p","Benim adım Selçuk. Biz üç kardeşiz. Ben hepsinden büyüğüm. Kardeşimin biri dört yaşında, diğeri beş buçuk yaşında. Annem, babam, kardeşlerim ve büyükannemle birlikte bir çiftlik evinde oturuyoruz. Evimiz iki katlı, tam altı odası var. Evimiz ve çiftliğimiz Bursa’da. Ama, Bursa’nın biraz dışında. Ne büyük, ne küçük, orta büyüklükte. Çiftliğimizde çok hayvan var. İnekler, atlar, koyunlar, tavuklar bir kedi ve bir köpek var. Ben en çok atları severim. Ata binmek ve atla gezmek çok güzel. Biz her gün çiftlikte taze yumurta yeriz, taze süt içeriz. Ben şimdi ailemle birlikte kalmıyorum. Ankara’da bir yurtta kalıyorum. Çünkü Hukuk Fakültesinde okuyorum. İki yıl sonra avukat olacağım."]]},{"n":14,"b":[["p","Ben her tatilde ailem için hediyeler alıp Bursa’ya gidiyorum. Genellikle Bursa’ya otobüsle gidiyorum. Bugün ben çok mutluyum. Çünkü bu çarşamba bayram ve bir hafta sonra benim tatilim başlıyor."],["l","A. Lütfen aşağıdaki sorulara cevep veriniz."],["l","1. Selçuk niçin yurtta kalıyor?"],["l",".................................................................................................."],["l","2. Çiftlikte her gün ne yiyorlar?"],["l",".................................................................................................."],["l","3. Selçuk en çok ne yapmayı seviyor?"],["l",".................................................................................................."],["l","4. Çiftlikte hangi hayvanlar var?"],["l",".................................................................................................."],["l","5. Selçukların çiftliği nerede?"],["l",".................................................................................................."],["l","B. Lütfen doğruları ‘’D’’ , yanlışları ‘’Y’’ ile işaretleyiniz."],["l","1. ( ) Selçukların çiftliğinde birkaç hayvan var."],["l","2. ( ) Selçuk’un ondan küçük iki kızkardeşi var."],["l","3. ( ) Selçuk bisklete binmeyi ve gemiyi çok seviyor."],["l","4. ( ) Büyükanne de Selçuk’un ailesiyle birlikte kalıyor."],["l","5. ( ) Onların çiftlikleri Ankara’nın biraz dışında bir köyde."],["l","C. Lütfen doğru cevabı bulunuz."],["l","1. Selçukların çiftliği nasıl?"],["l","A) Hem büyük hem güzel. B) Ne küçük ne güzel."],["l","C) Ne büyük ne küçük,orta büyüklükte. D) Ne büyük ne iyi."],["l","2. Selçuk’un evinde kimler kalıyor?"],["l","A) İki erkek kardeşi, büyükannesi ve büyükbabası."],["l","B) İki kızkardeşi, annesi, babası ve büyükannesi."],["l","C) Üç kardeşi ve annesi."],["l","D) Ağabeyi ablası ve annesi"],["l","D. Lütfen boşlukları doldurunuz."],["l","1. Tatilde çiftliğimize .......................................................... ."]]},{"n":15,"b":[["l","2. Bursa’daki evimiz .........................ve altı....................... var."],["l","3. Ben şimdi ailemle ................................................................."],["h","FATMA HANIM"],["p","Ali ile Fatma evliler. İki kız çocukları var. Çocuklar çok küçük, okula gitmiyorlar. Karı koca çalışıyor. Ali Bey şoför. Bir şirkette kamyonla İzmir’den Ankara’ya yük taşıyor. Fatma Hanım da aynı şirkette sekreter. Çocuklar ise, şirkete yakın bir kreşte kalıyor. Şimdi İzmir’de Konak’ta küçük bir evde oturuyorlar. Ev iki oda, bir salon. Fatma Hanım ailesini ve evi çok seviyor. Evi güzel çiçeklerle süslüyor. Ailede her şey güzel ama, Fatma Hanım çok yoruluyor. Çünkü tatilde Ali Bey futbol maçı seyrediyor, gazete okuyor, müzik dinliyor. Ama, Fatma Hanım tatilde ev işi yapıyor, çocuklara bakıyor. Fatma Hanım bugünlerde biraz sinirli. Her şeye kızıyor. Ali Bey eşiyle konuşuyor. Küçük bir tatil yapmak istiyorlar. Çocukları Ayşe Hanım’a bırakıyorlar. Trenle Mersin’e gidiyorlar. Fatma Hanım şimdi çok mutlu ama, evi ve çocukları özlüyor."],["p","Aşağıdaki test sorularını okuduğunuz metne göre yanıtlayınız."],["l","I. Ali ile Fatma’nın kaç çocuğu var?"],["l","A) Bir B) Beş C) Iki D) Yedi E) Üç II. Ali Bey ne iş yapıyor?"],["l","A) Çöpçü B) Şoför C) Savcı"],["l","D) Mimar E) polis III. Fatma Hanım nerede çalışıyor?"],["l","A) Okulda B) Bankada C) Tarlada"],["l","D) Bahçede E) şirkette IV. Nasıl bir evde oturuyorlar?"],["l","A) Küçük B) Büyük C) Güzel"],["l","D) Kirli E) Kapalı"],["l","V. Ali Bey tatil günleri ne yapıyor?"],["l","A) Evi temizliyor, çamaşır yıkıyor, maç seyrediyor."],["l","B) Kitap okuyor, müzik dinliyor, dans ediyor."],["l","C) Gazette okuyor, TV. Seyrediyor."],["l","D) Maç seyrediyor, kitap okuyor, müzik dinliyor."],["l","E) Bahçede çalışıyor, maça gidiyor, müzik dinliyor."]]},{"n":16,"b":[["p","VI. Fatma Hanım tatil günleri ne yapıyor ?"],["l","A) Ev işi yapıyor, çocuklara bakıyor."],["l","B) Evi süslüyor, yemek yapıyor."],["l","C) Ev işi yapıyor ve dinleniyor"],["l","D) Kitap okuyor ve çocuklara bakıyor."],["l","E) Çocuklara bakıyor ve onlarle oynuyor. VII. Tatil için nereye gitmek istiyorlar?"],["l","A) Marmaris’e"],["l","B) Mersin’e"],["l","C) Ankara’ya"],["l","D) İstanbul’a"],["l","E) Hiçbir yere VIII. Mersin’e neyle gidiyorlar?"],["l","A) Tramvayla B) taksiyle C) arabayla"],["l","B) D) trenle E) troleybüsle IX. Ali ile Fatma çocukları kime bırakıyorlar?"],["l","A) Annelerine B) Ayşe Hanıma"],["l","C) Arkadaşına D) Akrabalarına"],["l","E) Aysel Hanıma"],["l","X. Fatma Hanım tatilde mutlu mu?"],["l","A) Mutlu B) meraklı C) sinirli"],["l","D) yorgun E) neşeli Mutlu"],["h","HEDİYE"],["p","Faruk Bey mühendistir. Güler Hanım da bir bankada çalışıyor. Onların sekiz yaşında bir çocukları var. Adı Murat. Murat ilkokula gidiyor. O okulu ve öğretmenini seviyor. Onlar bu hafta sonu büyükannelerine gitmek istiyorlar. Büyükanneleri Ankara’dan biraz uzakta, Bursa’da oturuyorlar. Onlar büyükanneye güzel bir hediye almak istiyorlar. Bir mağazaya giriyorlar. Güzel bir bluz alıyorlar. Murat da bir hediye almak istiyor, ama parası yok."],["p","Cumartesi sabah saat on birde arabaya biniyorlar ve yola çıkıyorlar. Hava biraz soğuk ama güneşli. İki sat sonra Bolu’ya geliyorlar ve orada lokantada öğle yemeği yiyorlar. Murat döneri çok seviyor ve iki tabak döner yiyor. Ama yemekten sonra"]]},{"n":17,"b":[["p","Bursa’ya kadar karnı ağrıyor. Saat dört buçukta Bursa’ya geliyorlar. Büyükanne pencerede onları bekliyor. Güler Hanım hemen bluzu büyükanneye vermek istiyor. Bavulu açıyor ama paket bavulda yok. Çok üzülüyor. Büyükanne “Üzülmeyin! Ben hediye istemiyorum, sizi görmek istiyorum” diyor."],["l","A. Aşağıdaki sorulara cevap veriniz."],["l","1. Faruk Bey ve Güler Hanım ne iş yapıyorlar?"],["l",".................................................................................................."],["l","2. Onlar nereye ve kime gitmek istiyorlar?"],["l",".................................................................................................."],["l","3. Murat hediye alıyor mu? Niçin?"],["l",".................................................................................................."],["l","4. Murat’ın karnı niçin ağrıyor?"],["l",".................................................................................................."],["l","5. Onlar niçin üzülüyorlar?"],["l",".................................................................................................."],["l","B. Aşağıdaki doğru seçeneği işaretleyiniz."],["l","1. a. Murat sekiz yaşında, okula gidiyor. ( )"],["l","b. Murat on yaşında, ilkokula gidiyor. ( )"],["l","c. Murat sekiz yaşında, ilkokula gidiyor. ( )"],["l","d. Murat sekiz yaşında, okula gitmiyor. ( )"],["l","2. a. Onlar Bursa’da döner yiyorlar. ( )"],["l","b. Onlar Bolu’da döner yiyorlar. ( )"],["l","c. Onlar Ankara’da döner yiyorlar. ( )"],["l","d. Onlar büyükanne’de döner yiyorlar. ( )"],["l","3. a. Ankara’dan Bursa’ya yol on bir saat sürüyor. ( )"],["l","b. Ankara’dan Bursa’ya yol dört buçuk saat sürüyor. ( )"],["l","c. Ankara’dan Bursa’ya yol beş buçuk saat sürüyor. ( )"],["l","d. Ankara’dan Bursa’ya yol iki saat sürüyor. ( )"],["l","C. Aşağıdaki boşlukları tamamlayınız verilen kelimelerle doldurunuz. Faruk Bey ve ailesi ................. günü Bursa’ya ............"]]},{"n":18,"b":[["p","istiyorlar. ............... Faruk Bey ‘in annesi oturuyor. Onlar ............ güzel bir .............. alıyorlar ama ................ unutuyorlar. .................... “Ben hediye değil sizi ..............istiyorum” diyor."],["p","Bolu’da / hediye /girmek / Murat / büyükanneye/ evde/ Cumartesi/ Bursa’da/ gitmek/ büyükanne"],["h","BİR YILBAŞI GÜNÜ"],["p","Benim adım Selma. Size bir anımı anlatmak istiyorum. O akşam yılbaşıydı. Sabahleyin çok erken kalktım. Çünkü her zaman yılbaşını annem, babam, kardeşim Osman ve büyükannemle yani ailemle beraber kutlarım. Ama, bu defa yılbaşını arkadaşlarımla beraber kutlayacağız. Onun için çok mutluyum."],["p","Kahvaltımı ailemle beraber heyecanla yaptım. Onlara «Hosçakalın» dedim, evden çıktım. Doğru Kızılay’a gittim. Çünkü, hem ailemle, hem de arkadaşlarıma hediye almak istiyorum. Anneme desenli bir atkı, babama yünlü bir çorap ve eldiven, Osman’a kurmalı bir araba, büyükanneme de üzerine «SEVGİLER» yazılı süt fincanı aldım. Tabii arkadaşlarıma da hediye ne pahalı ne büyüktü, ama hepsi de bence çok şirindi."],["p","Eve akşamüstü dört buçukta geldim. Çok multuydum. Hemem hediyelerin üzerine unutmamak için arkadaşlarımın ve ailemin adlarını yazdım. Ailemin şimdiden yeni yılını kutladım. «Dolaptaki sürprizi saat 12’de alın» dedim. Aceleyle evden çıktım. Arkadaşlarımla buluşmaya geç kalmak istemedim."],["p","Ertesi sabah geç uyandım. Ama o da ne! Karşımda büyükannemi gördüm. Bana hem gülüyor, hem de parmağını sallıyordu. Daha sonra anladım. Kardeşim fincanı için de mutluydu."],["l","A. Aşağıdaki sorulara doğru cevabı veriniz."],["l","1. Selma’nın ailesi kaç kişi? Kimler var?"],["l",".................................................................................................."],["l","2. Selma Kızıla’ya niçin gidiyor?"],["l",".................................................................................................."],["l","3. Selma o yılbaşı niçin daha çok multu ve heyecanlı?"],["l",".................................................................................................."]]},{"n":19,"b":[["l","4. Sabahleyin büyükannesi sizce Selma’ya ne söyledi?"],["l",".................................................................................................."],["l","B. Lütfen doğrulardı “D”, yanlışları “Y” ile işaretleyiniz."],["l","1. ( ) Selma her zaman yılbaşını ailesiyle kutlar."],["l","2. ( ) Selma babaannesine bir çay fincanı aldı."],["l","3. ( ) Selma hediyelerin üzerine numara yazdı."],["l","4. ( ) Selma ailesinin hediyelerini masaya koydu."],["h","YOLCULUK"],["p","Benim adım Ahmet. Ben Ürdün’lüyüm. Şimdi Türkiye’de TÖMER’de Türkçe ögreniyorum."],["p","Bugün biz Kapadokya’ya gidiyoruz. Otobüsümüz onbeş dakika sonra saat sekizde hareket edecek. Yoculuğumuz, -tahmin ediyorum, dört ya da belki dört buçuk saat sürecek. Biz, yani TÖMER’in öğretmenleri ve öğrencileri otobüste şarkılar söyleyeceğiz, fıkra anlatacağız; sohbet edeceğiz, yani hem güleceğiz, hem eğleneceğiz. Hemen hemen bütün yolculuklarda insanlar hem gülmek, hem de eğlenmek isterler, şarkılar söylemek, fıkra anlatmak, espriler yapmak isterler. Ama bütün bunlar her yolculuk ve herkes için mümkün olmaz. Bazı insanlar için yolculukta gülmek, eğlenmek mümkün değildir. Çünkü, otobüste başka insanlar belki dinlenmek isterler, ses, gürültü istemezler. O zaman sessiz olmak, başka insanları rahatsız etmemek lazımdır."],["p","Dünyada herkes hazin bu şehirden başka bir şehre, bir ülkeden başka bir ülkeye gider. Seyahat etmek birçok yer görmek, birçok insan tanımak, okumak, çalışmak ve iç için, gezmek, eğlenmek için olur."],["p","Biz gezmek, görmek, Türkiye’yi ve Türk insanları tanıtmak, eğlenmek için bu yolculuğa çıktık. Şimdi hep birlikte şarkı söylüyoruz. Otobüste herkes eğleniyor. Sanıyorum bu gezi çok güzel olacak. Şimdi saat 10,30 otobüsümüz hızla gidiyor. Aşağı yukarı bir buçuk saat sonra Ürgüp’te olacağız."]]},{"n":20,"b":[["l","A. Aşagıdaki sorulara lütfen cevap veriniz. l. Ahmet’le TOMER’in başka, öğrencileri ve öğretmenleri nereye gidiyorlar?"],["l",".................................................................................................."],["l","2. Otobüs ne zaman (saat kaçta) hareket edecek?"],["l",".................................................................................................."],["l","3. Yolculuk aşağı yukarı ne kadar zaman sürecek?"],["l",".................................................................................................. 4 Otobüsle eğlenmek bazen niçin mümkün değildir?"],["l",".................................................................................................."],["l","5. Ahmet’le neler (yapmak) için bu yolculuğa çıktılar?"],["l",".................................................................................................."],["l","B. Aşağıdaki cümleleri lütfen tamamlayınız. l. “Dünyada herkes..................... bir şehirden........................., bir ülkeden...................gider”."],["l","2. “Şimdi hep............. söylüyoruz ........................... eğleniyor”."],["l","C. Lütfen aşağıdaki doğru cümleleri (D), yanlış cümleleri (Y) ile işaretleyiniz. l. ( ) Hemen hemen bütün yolculuklarda insanlar ne gülmek, ne de eğlenmek isterler."],["l","2. ( ) Birçok yer görmek, birçok insan tanımak, okumak, çalışmak ve iş için, gezmek, eğlenmek için seyahat ederiz."],["l","3. ( ) Dünyada hiç kimse her zaman yolculuk yapmaz."],["l","D. Lütfen aşağıdaki soruların doğru cevabını bulunuz. l. Neden bazan otobüste gülmek, eğlenmek olmaz?"],["l","a. Çünkü, otobüs hızlı gider."],["l","b. Çünkü, yolculuklar genellikle kısa olur."],["l","c. Çünkü, otobüste başka insanlar belki ses, gürültü istemezler,"],["l","........ dinlenmek isterler."],["l","d. Çünkü, otobüs şoförü kızar."],["l","2. Kapadokya’ya kimler gidiyor?"],["l","a. Öğretmenler ve onların arkadaşları."]]},{"n":21,"b":[["l","b. Öğrenciler"],["l","c. Anneler, babalar ve çocuklar"],["l","d. TÖMER’ın öğretmenleri ve öğrencileri"],["l","3. Ahmet “Bu gezi............................................................” diyor."],["l","a) Çok kötü olacak b) Belki iyi, belki kötü olacak."],["l","c) Kötü olmayacak d) Sanıyorum, çok güzel olacak."],["l","4. Otobüste bazı insanlar ses, gürültü istemezler, dinlenmek isterler, o zaman onları ........................................ lazımdır."],["l","a) Rahatsız etmek b) Çağırmak c) Rahatsız etmemek"],["l","d) Terk etmek"],["l","5. Şimdi saat 10.30 Ahmetler bir buçuk saat sonra nerede olacaklar?"],["l","a) Kayseri’de b) Ürgüp’de c) Uçhisar’da d) Konya’da"],["h","KIŞ TATİLİ"],["p","Bu sene on beş Şubatta okullar kapandı. On beş günlük bir tatilimiz vardı ve bütün derslerimiz çok iyiydi. Birkaç arkadaşla sıçak bir yerde tatil yapmak istedik. Ailelerimize sorduk ve izin aldık. Bizce Mersin tatil için güzel bir yerdi. Biletlerimizi almadan önce Mersin’de bir otele telefon edip yer ayırttık. Altı arkadaş soğuk bir şubat günü Ankara’dan yola çıktık. Hepimiz çok sevinçliyiz. Çünkü Mersin’i ve yüksek Toros dağlarını ilk defa göreceğiz. Öğleyin karlı ve sisli Toros dağlarına geldik. Otobüs çok yavaş gitmeye başladı. Yol çok tehlikeliydi. Biraz korktuk. Sonra yeşil çam ormanlarının arasından geçtik. Hava ılık, tatlı bir bahar gibiydi yeşil portakal bahçeleri, agaçlar ve manzara çok güzeldi."],["p","Mersin, temiz ve güzel bir şehir. Çok beğendik. Otelimize gidip biraz dinlendik. Sonra hemen şehri gezmeye başladık. Deniz kenarında çok güzel parklar ve bahçeler var. Bir gün portakal bahçesine gittik. Bol bol portakal topladık. Ağaçların altında oturup yedik."],["p","Son gün de Erdemli’ye gittik. Burada halk kış mevsiminde yaz sebzeleri yetiştirip bütün Türkiye’ye gönderiyor."],["p","Biz bu tatilde kış mevsiminde baharı yaşadık. Ailelerimize küçük birer hediye aldık. Gelecek sene şubat tatilinde tekrar buruya gelmek istiyoruz."]]},{"n":22,"b":[["l","A. Aşağıdaki sorulara cevap veriniz."],["l","1. Onlar ne zaman tatile çıktılar?"],["l",".................................................................................................."],["l","2. Nerede tatil yapmak istediler?"],["l",".................................................................................................."],["l","3. Biletlerini almadan önce ne yaptılar?"],["l",".................................................................................................."],["l","4. Nereleri ilk defa görecekler?"],["l",".................................................................................................."],["l","5. Mersin nasıl bir şehir?"],["l",".................................................................................................."],["l","6. Mersin’ de halk kışın ne yapıyor?"],["l",".................................................................................................."],["l","B. Boşlukları doldurunuz."],["l","1. Bu.......... ................ Şubatta okullar......................."],["l","2. Ailelerimize .......... ................... aldık."],["l","3. Hava .......... .......... .......... gibiydi."],["l",".......... .......... portakal bahcesi.......... cok guzeldi."],["l","4. Burada halk kış.......... .......... sebzeleri .........."],["l",".......... Türkiye’ ye..........................................."],["l","D. Doğru cümleleri (D) yanlış cümleleri (Y) ile işaretleyiniz. l. ( ) Altı arkadaş soğuk bir şubat günü Antalya’ya yola çıktık."],["l","2. ( ) Sonra yeçil çam ormanlanmn arkasından geçtik."],["l","3. ( ) Mersin, temiz ve güzel bir şehirdir."],["l","4. ( ) Son gün de Erdemli’ye gittik."],["l","5. ( ) Gelecek sene şubat tatilinde tekrar Samsun’a gelmek istiyoruz."],["h","HAVRA SOKAĞI"],["p","Diğer şehirler gibi İzmir’de de insanlar yaşıyor. Bu şehre birçok turist gelir. Turistler de, Izmirliler de mutlaka alışveriş yapmak için Kemeraltı’na giderler. Kemeraltı İzmir’in en uzun ve en kalabalık sokağıdır. Hem yiyecek hem giyecek hem de kitap,"]]},{"n":23,"b":[["p","çiçek, ev eşyası gibi çeyleri orada bulursunuz. Kemeraltı’nın en ünlü sokağı “Havra Sokağıdır”. Bu sokakta satıcılar, tüm mevsimlere göre sebze ve meyvelerini satarlar. Meyve ve sebzeler mevsimlere göre farklıklar göstermez, bu sokakta. Hem turistler hem tamirliler Kemeraltı’nda bu sokağı gezmeden geri dönmezler. Bu sokakta balıkçılar, çerezciler, manavlar, tenekeciler vardır. Eskiden her tenekeci için iki metrekarelik dükkanlar var ve her tenekeci aynı huni, kazan, ibrik ürettiler. Ama, şimdi sadece dört tenekeci var ve aynı dükkanda çalışıp aynı şeyleri üretiyorlar. Belki, tenekecilerin çocuklan onlar gibi baba mesleklerini yapmayacaklar. Kış ortasında karpuz, kavun, domates, çilek, yaz ortasında elma, portakal, ıspanağı burada görürsünüz. Eskiyi ve yeniyi beraber orada tanırsınız."],["l","A. Aşağıdaki sorulara cevap veriniz. l. İzmir’de kimler, nereye gidiyorlar?"],["l",".................................................................................................."],["l","2. Kemeraltı nasıl bir sokaktır?"],["l",".................................................................................................."],["l","3. Kemeraltı’nda neler almak mümkündür?"],["l",".................................................................................................."],["l","4. Havra Sokağnda hangi dükkanlar vardır?"],["l",".................................................................................................."],["l","5. Dükkanlar eskiden nasıldı? Şimdi nasıl?"],["l",".................................................................................................."],["l","B. Boşlukları doldurunuz. l. Tenekeciler......................., ..................., ...............yaparlar."],["l","2. ..................................... baba mesleklerini yapmayacaklar."],["l","3. Eski ve yeni esnaf kültürlerini ............................... tanırız."],["l","4. Hangi mevsimlerin meyve ve sebzelerini satarlar?"],["l","a) ilkbahar b) Sonbahar c) Hepsi d) Yaz"],["l","5. Havra Sakağında ............................................. yoktur."],["l","a) Balıkçlar b) Mobilyacılar"],["l","c) Çerezler d) Manavlar"]]},{"n":24,"b":[["l","C. Doğru cümleleri “D” yanlış cümleleri “Y” ile işaretleyiniz. l. Bütün tenekeciler aynı dükkanda çalışıyorlar."],["l","2. Hiç kimse Havra sokağını gezmeden geri dönmez."],["h","BÜYÜK SÜPRİZ"],["p","Hakan lisede okuyor. O, bu sene liseyi biterecek. Üniversiteye başlayacak. Hakan’ın babası Murat Bey avukat, annesi Meltem Hanım ev hanımdır. Sibel ise Hukuk Fakultesinde öğrencidir. Sibel babası gibi başlırı bir avukat olmak istiyor.Hakanların evinde sabahları en erken Meltem Hanım uyanır. Kahvaltıyı hazırlar, sonra herkesi uyandırır. Onlar hep birlikte kahvaltı yaparlar. Kahvaltıdan sonra Hakan, babası ve ablasıyla evden çıkar. Babaları Murat Bey, Hakan’ı ve ablasını okullarına bırakıp bürosına gider. Murat Beyin çok geniş ve güzel bir arabası var."],["p","Bu sabahta en erken Hakan uyandı. Saate baktı saat altıydı. O hemen mutfağa gitti. Çünkü annesine güzel bir sürpriz yapmak istedi. Önce çay yaptı. Sonra güzel bir kahvaltı sofrası hazırladı. Hakan çok sessiz hareket etti ve hiç kimseyi uyandırmadı. Saat yedi oldu. Hakan’ın annesi uyandı. Meltem hanım önce eşini uyandırdı, sonra Sibel’i çağırdı. Meltem Hanım Hakan’ı da uyandırmak için odasına gitti. Fakat Hakan yatakta yoktu. O biraz telaşlandı ve korktu. «Belki bugün okula erken gitti» diye düşündü. Meltem Hanım odadan çıkıp hazırlamak için mutfağa gitti. Mutfağın kapısı açtı. Hakan’ı kahvaltı masasında gördu. O biraz şaşırdı. Bu, onun için gerçekten güzel bir sürprizdi. Biraz sonra Hakan’ın babası ve ablası mutfağa geldiler. Onlar da çok şaşırdılar ve sevindiler. Bütün aile güzel ve neşili bir kahvaltı yaptılar. Herkes çok mutluydu. Hakan hepsiden daha mutluydu."],["l","A. Aşağıdaki sorulara cevap veriniz."],["l","1. Hakan’ın anne, baba ve ablasının adı nedir?"],["l",".................................................................................................."],["l","2. Hakan’ın evinde her zaman en erken kim uyanır, neler yapar?"],["l",".................................................................................................."],["l","3. Hakan mutfakta neler yaptı, niçin?"],["l",".................................................................................................."]]},{"n":25,"b":[["l","4. Hakan ve ablası okula nasıl gidiyorlar?"],["l",".................................................................................................."],["l","5. Hakan’ın ablası hangi okulda okuyor ve ne olmak istiyor?"],["l",".................................................................................................."],["l","B. Aşağıdaki cümlelerin dognılanm “D” yanlışlannı “Y” ile işaretleyiniz. l. Hakanlarin evinde her zaman en crken Hakan kalkar."],["l","2. Bu sabah Hakan saat altıda uyandı."],["l","3. Meltem Hanım, Hakan’m odasından çıkıp mutfağa gitti."],["l","4. Hakan çok gürültü yaptı ve herkesi uyandırdı."],["l","5. Hakan okuta babası ve ablasıyla gider."],["h","UNUTKANLIK"],["p","Cengiz ile Metin liseden arkadaştırlar. Cengiz liseyi bitirdikten sonra üniversiteyi kazanamamış ve turizm işine başlamıştır. Metin ise üniversite 2 sınıfta mühendislik eğitimi yapmaktadır. Bir gün Cengiz, Metin’den aldığı mektupta arkadaşının okuldaki arkadaşlarıyla birlikte, çalıştığı otele gelerek tatil yapacağını öğrenir. Buna çok sevinen Cengiz hemen hazırlıklara başlar. En iyi odayı arkadaşı Metin’e ayırır, odayı çiçeklerle süsler."],["p","Cengiz, Metin’in geleceği gün onu karşılamak için tren istasyonuna gider. Tren perona girince sevinçten havaya uçacağını sanır. Çünkü, tam karşısında arkadaşı Metin durmaktadır. Uzun yıllar birbirlerini görmedikleri için koşarak birbirlerine sarılırlar ve eski günleri anarak otele giderler. Fakat, otele geldiklerinde Metin eşyalarının bulunduğu valizi trende unuttuğunu anlar. Uzun yıllar sonra karşılaşmanın sevinciyle eşyalarını trende unutan Metin telaşlanır."],["p","Cengiz üzülmemesini bir telefonla valizini otele getirtebileceğini söyler. Metin rahatlar ve odasına çıkmak ister. Cengiz, Metin’i odasına çıkarıp ona sürpriz yapmak ister. Çiçeklerle süslü odaya girince Cengiz çok şaşırır. Bütün çiçekler solmuş ve bazıları da tamamen kurumuştur. Çünkü, Cengiz de o günün heyacanıyla çicekleri sulamayı unutmuş. Metin de Gengiz’e"]]},{"n":26,"b":[["p","üzülmemesini söyleyerek onun gönlünü alır. Birlikte çiçeklere sularken lise günlerini hatırlalarlar. Bir hafta boyunca çok güzel günler geçirirler. Ayrılık günü gelmiştir. Tren isyasyonunda Cengiz Metin’e valizini bir daha unutmamasını hatırlatır. Metin de Cengiz’e çiçekleri sulamayı unutmayasın diye gülerek ayrılırlar."],["p","Lütfen, soruları okuduğunuz metine göre yanıtlayınız."],["l","1. Seçeneklerin hangisi “İki arkadaşın yolları neden ayrılmış?” sorusunun cevabı olabilir?"],["l","A) İkisi bir birlerinde darılmışlar."],["l","B) Onlar farklı yerlere taşındırları için ayrılmışlar."],["l","C) Cengiz üniversiteyi kazanmış, Metin iş hayatına başlamış."],["l","D) Arkadaşlardan biri yurt dışına gitmiş."],["l","E) Birbirlerini kaybetmişlerdir."],["l","2. “Tren perona girince sevinçten havaya uçacağını sanır.” cümlesinde “sevinçten uçmak” deyimi hangi durumu anlatmaktadır?"],["l","A) mutluluğu B) kederi C) tedirginliği"],["l","D) heyecanı E) üzgünlüğü"],["l","3. Lütfen, “Metin arkadaşı Cengiz’i nasıl şaşırttı?”sorusunun cevabını bulunuz."],["l","A) Tren istasiyonunda karşılamadı"],["l","B) Valişlerini trenden aldırarak şaşırttı"],["l","C) Ona yeni bir araba aldı"],["l","D) Çiçeklere su koymayarak şaşırttı"],["l","E) Ona çiçeklerle süslü oda ayırakak şaşırttı"],["l","4. “Gengiz’e üzülmemesini söyleyerek onun gönlünü alır” altı çizili sözcüğün yerine seçeneklerin hangsi gelebilir?"],["l","A) gözünü alırv B) aklını alır C) avutur"],["l","D) aldatır E) sevindirir"],["l","5. Lütfen, “birbirlerine sarılırlar” altı çizili sözcüğün eş anlamını bulunuz."],["l","A) dolanır B) sarmaşır C) darılır D) kucaklaşır E) bürünür"]]},{"n":27,"b":[["h","KEDİLER"],["p","Kediler yalnız yaşamayı seven, özgürce davanan, bağımsız yaratılışı hayvanlardır. Evcil hayvanlar gibi sahiplerinin isteklerine her zaman boyun eğmezler. Kediler aç kaldıkları zaman miyavlar. Daha bunlar gibi pek çok hareketle insanlara istedikleri mesaji verirler."],["p","Kedilerin minik patileri, tehlike anında âdeta yırtıcı bir aslan pençesine dönüşür. Tırnaklarını patilerinin içinde saklarlar. Tehlike anında bu tırnaklar devreye girer ve keskin, aynı zamanda sivri birer silah oluverirler. “Dört ayağı üzerine düşmek” deyimi kediler için söylenebilecek doğru bir sözdür. Metrelerce yükseklikten düşseler bile her zaman dört ayakları üzerine düşerler. Bunun gerçek sebebi, onların düşerken dengelerini sağlamak için kuyuklarını kullanmaları ve gövdelerinin ağırlık merkezini değiştirip, patileri üzerine düşebilmeleridir."],["p","Ağaçların üzerinde, yüksek yerlerde dolaşmayı seven bu sevimi hayvanlar, düşme tehlikesi anında bu koruyucu özelliklerini kullanırlar."],["p","Kedilerin gözleri geceleri parıl parıl parlar. Karanlıkta büyüyerek yuvarlaklaşan, bu sayede ışığı daha fazla toplayan gözbebeklerine sahiptirler. Bu özellikleri aynı zamanda geceleri çok iyi görmelerini de sağlar. Bir nesneyi görebilmeleri için azıcık ışık yeterlidir."],["p","Kediler evdeki zaralı böceklerin, yılanların ve farelerin en büyük düşmanıdır. Kediler tavuk, horoz gibi kümes hayvanlarına ilişmezler."],["l","A. Aşağıdaki sorulara cevap veriniz."],["l","1. Kedilerin patileri ne işe yarar?"],["l","2. Kediler için “Dört ayağı üzerine düşmek” deyimi niçin doğrudur?"],["l","3. Kediler hangi hayvanlardan hoşlanmazlar?"],["l","4. Kedilerin diğer evcil hayvanlardan farkı nedir?"],["l","5. Kediler aç kaldıkları zaman ne yaparlar?"]]},{"n":28,"b":[["l","B. Okuduğunuz parçaya göre aşağıdaki cümlelerden doğru olanın başına “D” yanlış olanın başına “Y” yazınız."],["l","a. ( ) Kediler diğer evcil hayvanlar gibi sahiplerinin her dediğini yapar."],["l","b. ( ) Kediler çok iyi duyan hayvanlardır."],["l","c. ( ) Kedilerin gözleri karanlıkta daha iyi görür."],["l","d. ( ) Kediler kümes hayvanlarının düşmanıdır."],["l","e. ( ) Kediler yüksek yerden düştüğünde kuyruğunu kullanarak tehlikeden korunur."],["l","C. Okuduğunuz parçaya göre aşağıdaki cümlelerin boşluklarını tamamlayınız."],["l","a. Kediler ………………………… yaratılışlı hayvanlardır."],["l","b. …………………... yerlerde, ………………… üzerinde gezmeyi severler."],["l","c. Tırnaklarını …………......……………….. içinde saklarlar."],["l","d. Kediler yüksekten düştüklerinde ……………………… üzerine düşerler."],["l","e. Kedilerin ……...……………… geceleri parıl parıl parlar."],["h","ANADOLU’DA DÜĞÜN"],["p","Anadolu’da düğün çok önemli bir törendir. Herkes mutlaka düğün yaparak evlenmek ister. Anadolu’nun her bölgesinde düğünler değişik şekillerde yapılır. Şimdi Konya ve çevresi düğünlerine bir göz atalım."],["p","Bu bölgede düğünler Çarşamba ve Cumartesi günleri başlar. Bu günlerin dışında kesinlikle hiçbir gün düğün başlamaz. Çünkü uğursuz sayılır. Cumartesi günü sabahtan erkek evinin çatısına veya balkonuna bayrak dikilir. Öğleyin davul-zurna ekibi düğün evine gelir. Düğünler salonlarda değil evlenen erkeğin ve kızın evlerinde olur. Erkeğin ailesi davetlilere yemek verir. Davetliler yemekleri mutlaka burada yemelidirler. Yemekten sonra davul-zurna eşliğinde oyunlar oynanır. Akşam yemek için ara verilir. Akşam yemeğinden sonra tekrar eğlenmeye başlarlar. Gece 23’e kadar erkek evinde eğlenilir. Daha sonra kız evinde eğlenmeye giderler. Gece uzak"]]},{"n":29,"b":[["p","yerlerden gelen davetlileri komşular evlerine götürüp yatırırlar."],["p","Pazar günü öğleye kadar herkes dinlenir. Öğleyin tekrar tören başlar. İkindiye kadar eğlence devam eder. Kız evine giderek kızı alırlar ve davul-zurna eşliğinde oynayarak erkek evine gelirler."],["l","A. Aşağıdaki sorulara cevap veriniz."],["l","1. Konya ve çevresinde düğünler hangi günler başlar?"],["l",".................................................................................................."],["l","2. Düğünler nerede olur?"],["l",".................................................................................................."],["l","3. Düğün için hangi müzik aletleri kullanılıyor?"],["l",".................................................................................................."],["l","4. Düğün hangi gün, ne zaman sona erer (biter)?"],["l",".................................................................................................."],["l","B. Aşağıdaki boşlukları tamamlayınız."],["l","1. ...............herkes.............düğün yaparak.............. ................."],["l","2. ................. ......................... kesinlikle düğün ..................... Çünkü, ...................... .......................... ."],["l","3. Yemekler ......................... ........................ evinde yenir."],["l","C. Aşağıdaki cümlelerden doğru olanı (D), yanlış olanı (Y) ile işaretleyiniz."],["l","1. ( ) Gece 23’e kadar kız evinde eğlenilir."],["l","2. ( ) Anadolu’da düğünler düğün salonlarında veya evlerde olur."],["l","3. ( ) Cumartesi günü erkek evinin çatısına veya balkonuna bayrak dikilir."],["l","D. Aşağıdakilerden yanlış olan cevabı bulunuz"],["l","1. Konya’da ve çevresinde düğünler nasıldır?"],["l","a) Hafta içi yapılmaz."],["l","b) Evlerde yapılır."],["l","c) Davetliler otellerde kalır."],["l","d) Davul-zurna eşliğinde gelin getirilir."]]},{"n":30,"b":[["h","ÇOCUK EĞİTİMİ"],["p","Eğitim, insanı daha iyiye daha güzele, daha doğruya götürmek için yapılır. Çocuk eğitimi ise çok önemli ve bilgi gerektiren bir iştir. Çocuk eğitimde dikkat edilecek ilk şey, çocuğu kendi duygu ve düşüncelerimiz açısından değil, onun psikolojik yapısı bakımından değerlendirmektir. Çocuğun çoğu kez bize yabancı gelen duygu ve düşüncelerini anlamaya çalışmalıyız."],["p","Maalesef, eğitimin çok geliştiği günümüzde bile birçok anne ve baba çocuk eğitiminde hata yapmaktadır. Kendilerine yabancı gelen çocuk duygu ve düşüncesini, anlamaya çalışmayıp, onları kendi istekleri doğrultusunda eğitmek isterler. Çocuk kendine ait orijinal dünyası olan bir varlıktır. Çevresinde gördüğü şeyleri, o dünyanın ölçüleriyle değerlendirir. Bu nedenle çocukların öğrenmek amacıyla büyüklere sordüğü, sonu gelmeyen sorulara büyük bir sabırla cevap vermeliyiz. Yani, çocuk eğiticilerinin sahip olmaları gereken en önemli iki şey, sabır ve anlayıştır. Bu iki şeye, çocuğun doğduğu günden başlayarak eğitiminde en önemli rolü oynayan, anne ve babaların özellikle dikkat etmeleri gerekir."],["l","A. Aşağıdaki soruları yanıtlayınız."],["l","1. Eğitimin amacı nedir?"],["l",".................................................................................................."],["l","2. Çocuk eğitiminde dikkat etmemiz gereken en önemli şeyler nelerdir?"],["l",".................................................................................................."],["l","3. Anne ve babaların çocuk eğitiminde yaptıkları yanlışlar nelerdir?"],["l",".................................................................................................."],["l","4. Çocuk nasıl bir varlıktır, çevresini nasıl değerlendirir?"],["l",".................................................................................................."],["l","5. Çocuğun eğitiminde en önemli rolü olan kimlerdir, nasıl olmaları gerekir?"],["l",".................................................................................................."],["l","B. Lütfen aşağıdaki boşlukları doldurunuz."]]},{"n":31,"b":[["l","1. Çocuğun, çoğu kez bize yabancı gelen ............................... ve............................anlamaya çalışmalıyız."],["l","2. Çocukların öğrenmek amacıyla ........................... sorduğu, sonu gelmeyen ............. büyük bir ............... ................. vermeliyiz."],["l","3. Birçok anne ve baba ................. ......................... hata ......."],["l","C. Aşağıdaki cümlelerin doğru olanlarını D, yanlış olanlarını Y ile işaretleyiniz."],["l","1. ( ) Çocuğun duygu ve düşüncelerini anlamadan eğitmeye çalışmak yanlıştır."],["l","2. ( ) Çocuk, kendine ait orijinal dünyası olan bir varlıktır."],["l","3. ( ) Anne ve babalar, çocuk eğitiminde hata yapmazlar."],["l","4. ( ) Çocuğun, bize mantıksız gelen sorularına cevap vermemeliyiz."],["l","D. Sizce bu metnin ana fikri nedir?"],["l",".................................................................................................."],["l",".................................................................................................."],["l","E. Lütfen paragrafları adlandırınız."],["h","GÜRÜLTÜ"],["p","Hızlı kentleşme, sanayileşme ve nüfus artışından kaynaklanan gürültü, çağımızın önemli sorularından biri haline geldi. Gürültünün insan sağlığını önemli ölçüde etkilediği de artık herkes tarafından biliniyor."],["p","Bir arabanın motor sesine kulaklarımızı tıkarız da sevdiğimiz bir müzik parçasını sonuna kadar açar, büyük bir zevkle dinleriz. Sesin gürültü niteldiği taşıması kişiye gore değişmektedir."],["p","Nedir öyleyse gürültü? Gürültü, uyumsuz, istenmeyen, hoşa gitmeyen ses olarak tanımlanabilir. Bu yüzden bizim hoşumuza giden bir müzık, başkalarının hoşuna gitmeyebilir ve gürültü sayılabilir. Kısaca ilgi duyduğumuz konulardaki sesler bizi rahatsız etmez de, ilgi göstermediğimiz sesleri gürültü olarak kabul ederiz."],["p","Gürültü insanda psikolojik bozukluklar meydana getirir."]]},{"n":32,"b":[["p","Yorgunluk, başağrısı vs. gibi… Sesleri dinlersek gürültüyü yaratanın insanın kendisi olduğunu anlarız. Buzdolabı, radyo, televizyon sesleri zamanına gore bizi çok rahatsız eder. Bunlar çok basit örneklerdir ama bizi sonuca götürür. Uygarlık ne kadar gelişirse gürültü de o oranda artmaktadır."],["p","O halde gürültüyle savaşmalıyız. Bu basit araçların sesi insanda gerilimlere yol açıyor. Böylece mutluluk getiren uygarlık beraberinde mutsuzluğu da getiriyor."],["l","I. Lütfen, soruları metine göre cevaplayınız."],["l","1. Gürültü nedir? Tanımlayınız."],["l","……………………………………………………………"],["l","………………………………………………………………"],["l","2. Gürültünün insane üzerindeki etkileri nelerdir?"],["l","………………………………………………………………"],["l","………………………………………………………………"],["l","3. Gürültünün esas kaynağı nedir?"],["l","………………………………………………………………"],["l","………………………………………………………………"],["l","4. Uygarlık nasıl hem mutluluk, hem de mutsuzluk getiriyor? Kısaca açıklayın."],["l","………………………………………………………………"],["l","………………………………………………………………"],["l","5. Çeşitli sesler hakkında neler düşünüyoruz?"],["l","………………………………………………………………"],["l","………………………………………………………………"],["p","II. Aşağıdaki cümlelerden doğru olanları “D”, yanlış olanları “Y” ile işaretleyiniz."],["l","1. ( ) Ugarlık ne kadar gelişirse gürültü de o oranda artmaktadır ."],["l","2. ( ) Mutluluk getiren uygarlık,aynı zamanda mutsuzluk da getiriyor ."],["l","3. ( ) Gürültü insanda psikolojik bozukluklar meydana getirmez."]]},{"n":33,"b":[["l","4. ( ) Sesin gürültü niteliği taşıması kişiye gore değişmektedir."],["l","5. ( ) Gürültüye yaratan insane değildir."],["p","III. Aşağıdaki cümlelerin boş bırakılan yerlerini doldurunuz."],["l","1. Bizim hoşumuza giden bir müzık, başkalarının ……………. ve ………………….."],["l","2. Gürültünün insane sağlığını önemli ölçüde………………. artık herkes ..…..……."],["l","3. Buzdolabı, ………………….…… sesleri zamanına gore"],["l","…………………….."],["l","4. Sevdiğimiz bir müzik parçasını sonuna kadar ……………….,"],["l","…………………."],["l","5. Gürültü, …………….., …………….., ……. tanımlanabilir."],["h","YASEMİN`İN ÇİÇEKLERİ"],["p","Yasemin’in her gün işi, oturdukları apartmanın bahçesine diktiği çiçekleri sulamaktır. Hepsini ayrı ayrı sever, bakımlarına özen gösterına özen gösterirdi. Yasemin’e bakıp komşu apartmanlar da çicek yetiştirmeye başladılar. Ama hiç biri Yasemin’in çiçekleri gibi canlı ve ölmüyordu."],["p","Bir gün Yasemin çiçeklerini sularken yaşlı bir amca seslenerek:"],["l","- Kızım benım de çiçeklerim var; ama, seninkiler gibi güzel değil. Çiçeklerini nasıl baktığnı bana da anlatır mısın? Yasemin:"],["l","- Amcacığım, ben çiçeklerimi yanlız sulayıp çapalamam. Ben onlarla dost gibi konuşuyorum, onları seviyor, okşuyorum. Yaşlt amca şaşkın bir vaziyette:"],["l","- Konuşuyor musun? Çiçeklerle konuşulur mu? Onlar senin söylediklerini anlaı mı? Yasemin gülerek:"],["l","- Biz karşılıkı gayet iyi anlaşıyoruz. Siz de çiçeklerinizi sever, onlarla konuşursanız, daha canlı, daha güzel olacaklardır, dedi. Aradan bir hafta kadar zaman geçti. Yasemin yine bahçesinde çiçeklerine bakıyordu. Birisinin “Yasemin, kızım” diye seslendiğini duydu. Başını kaldırdı. Karşısında o yaşlı adam duruyordu:"]]},{"n":34,"b":[["l","- Kızım senın dediklerini yaptım. Benim çiçeklerim de canlandılar, sanki neşelendiler. Böylece apartmanımız, renklenip güzelleşti. Bana yaptığın bu iyilik için sana teşekkür etmeye geldim."],["l","(DERLEME)"],["h","KELİMELERİN DİLİ"],["l","- ozen gostermek: Bir şeyin iyi olması için gayret etmek."],["l","- çapalamak: Çapa ile toprağı kabartmak."],["l","- dost: Sevilen, güvenilen yakın arkadaş."],["l","A. OKUDUĞUMUZU ANLADIK MI? CEVEP VERELİM."],["l","1. Yasemin, her gün ilkolarak hangi işleri yapıyordu?"],["l",".................................................................................................."],["l","2. Yaşlı amca, Yasemin’e ne dedi?"],["l",".................................................................................................."],["l","3. Yasemin, yaşlı amcaya ne cavap verdi?"],["l",".................................................................................................."],["l","4. Aldığı cevep üzerine yaşlı amca niçin şaşırdı?"],["l",".................................................................................................."],["l","5. Yaşlı amca, Yasemin’e niçin teşekkür etti?"],["l",".................................................................................................."],["l","6. Sokağımızı güzelleştirmek için neler yapmalıyız?"],["l",".................................................................................................."],["l","B. Asagidakilere doğru olana (D) yanlış olana (Y) yazınız."],["l","1. ( ) Yasemin agaç yetiştiriyor."],["l","2. ( ) Yaseminin dedesi çiçek yetişteremiyor."],["l","3. ( ) Yasemin çiçeklerden neferet ediyor."],["l","4. ( ) Çiçekleri yetistirmek icin konuşmak lazim."],["l","C. Kelimeleri kendi dilinizde çeviriniz ve tanımını yapınız."],["l","- ozen gostermek-"],["l","- çapalamak-"],["l","- dost-"]]},{"n":35,"b":[["l","D. Doğru bir şekilde cümleleri yerine koyunuz."],["l","1. Yasemin – dede – konuştular – hakkında – çiçek."],["l","2. sordu – dede – lazım – yapmak – ne – çicekler – için."],["l","3. etti – teşekkür – dede – iylik – yaptığı – için"],["h","RÜSTEM AMCA"],["p","Babam bizım apartmanın yöneticisidir. Bahçenin düzenlenmesi, temiz tutulması, kaloriferin yaktırıması, hep onun görevi. Bu konuda babamın tek yardımcısı kapıcı Rüstem amcadır."],["p","Rüstem amca, yetenekli bir adamdır. Beceremediği hiç bir iş yoktur. İlkbahar gelince kazmasını, küreğini alıp gül fidanlarının diplerini temizler. Bütün ağaçları budar."],["p","Sonbahar rüzgarları esmeye başlayınca Rüstem amcanın görevi değişir. Eski tulumlarını sırtına geçirip, kalorifer kazanının bakımını yapar. Yanmaya hazır hale getirir. Elektrik işlerinden de anlar. Kimin sigortası atsa, ütüsü, fırını bozulsa, hemen Rüstem amcaya koşar."],["p","Geçenlerde asonsörümüz bozuldu. Aynı gün bizim mahallenin pazarıydı. Apartmandaki hanımlar, ellerinde pazar çantalarıyla merdivenleri kan ter içinde çıktılar. Rüstem amca durumu görünce çok üzüldü. Çekicini ve tornavidasını alıp asansöre koştu. Yarım saat içinde onu da çalışır hale getirdi. Babam, başını sallayarak:"],["p","“Butün bunlar Yaramaz çocukların yüzünde uymamız gereklli gereksiz oynuyorlar.” diye mırıldandı. Daha sonra apartmanda uymamamız gereken kuralları bir kağıda yadı. İlan tahtasına astı. Rüstem amca da bu işi sıkı takip ediyor. Artık etmek yok. Rüstem amca diyor ki:"],["l","- Murat, bu kurallara önce sen uymalısın. Çünkü sen yöneticinin oğlusun."],["p","KELİMELER"],["p","tulum : Gömlek ve pantalon kısmı bitişik iş eibisesi."],["p","sigorta : Elektrik devresinde akımı kesmeye yarayan güvenlik düzeni."],["p","asansör : Yüksek binalarda yük ve insan taşımak amca ile kullanılan elektrikli araç."]]},{"n":36,"b":[["p","takip ediyor : İsin peşini bırakmıyor, kontrol ediyor."],["p","kan ter içinde : Çok yorgun, aşırı terlemiş halde."],["l","A. Aşağıdaki Soruları Cevaplayınız."],["l","1. Bu yazıda anlatıldığına göre, apartman yöneticisinin görevleri nelerdir? Yardımcısı kimdir?"],["l","………………………………………………………………"],["l","2. Kapıcı Rüstem amca, hangi işlerde yetenekli ?"],["l","………………………………………………………………"],["l","3. Yönetici asansörün bozulmasını hangi sebebe bağlıyor ?"],["l","………………………………………………………………"],["l","4. Yönetici, apartmanda uyulması gereken kuralları nasıl duyuruyor ?"],["l","………………………………………………………………"],["l","B. Aşağıdaki ifadeler doğru mu (D), yanlış mı (Y)?"],["l","1. ( ) Kapıcı Rüstem cok tembel birisidir."],["l","2. ( ) Kapıcı Rüstem asansoru bozmustur."],["l","3. ( ) Asansor Cuma günü bozulmuştur."],["l","4. ( ) Tüm işlere kapıcı Rüstem koşuyordu."],["l","C. Kelimeleri kendi dilinizde çeviriniz ve tanımını yapınız. kan ter içinde - araç takip ediyor - asansör - sigorta - tulum -"],["h","GAZETELER"],["p","Gazeteler bugünkü uygar dünyamızda önemli yeri olan yayın organlarıdır. Osmanlılar zamanında yayınlanan ilk gazetenin ismi Takvimi Vekayı’dır. Bu gazete 11 Kasım 1831’de yayınlanmıştır."],["p","Gazeteler, günlük, haftalık olabileceği gibi aylık olarak da çıkabilir. Gazetelerde halkın anlayabileceği bir dil kullanılır. Sayılan yüzbinleri geçen gazeteler artık birkaç saat gibi kısa bir"]]},{"n":37,"b":[["p","sürede basılabilmektedir. Ancak bir gazele basılmadan önce yapılan çalışmalar, sabahın erken saatlerinden başlayarak, akşamın geç saatlerine kadar, hatta gece saat iki veya üçe kadar sürer."],["p","Basılan gazeteler yurdun çeşitli bölgelerinde bulunan gazete satıcılarına kamyon, otobüs, tren veya uçaklarla süratle gönderilir. Böylece sabahın erken saatlerinde gazeteler elimize geçer."],["p","Kimimiz bu gazeteleri sımsıcak yatağımızda, kimimiz kahvaltı yaparken, kimimiz de işe giderken otobüslerde aceleyle okuruz. Bu gazetelerde politikadan spora, spordan magazine kadar her türlü haberler resimli ya da resimsiz olarak yer alır. Gazete okuyan insanlar sadece kendi memleketlerindeki olaylardan değil, tüm dünyadaki olaylardan haberdar olurlar."],["l","I. Aşadaki sorulara cevap veriniz."],["l","1. İnsanlar gazeteleri nerelerde okular?"],["l",".................................................................................................."],["l","2. İlk gazetenin ismi nedir?"],["l",".................................................................................................."],["l","3. Gazetelerde hangi haberler yer alır?"],["l",".................................................................................................."],["p","II. Aşadaki doğru cevaplari işaretleyin."],["l","1. İlk gazete 11 Kasım 1821’de yayınlanmıştır. Doğru Yanlış"],["l","2. Gazete okuyan insanlar sadece kendi memleketlerinde olan olaylardan haberdar olurlar. Doğru Yanlış"],["p","III. Aşadaki boşlukları tamamlayınız."],["l","1. Basılan gazetelerin sayıları .............................. geçmektedir."],["l","2. Basılan gazeteler yurdun çok çeşitli ............................... bulunan gazete satıcılarına .................................. ..........................."],["l",".............., ve uçakla süratle gönderilir."],["l","3. İlk gazete ................................ zamanında yayınlanmıştır."],["l","4. Gazetelerde bütün haberler bazan ...... bazan da ...... yer alır."]]},{"n":38,"b":[["p","IV. Doğru cümleyi işaretleyin."],["l","A) Gazetelerin dili ağırdır."],["l","B) Gazetelerin dili kolaycadır."],["l","C) Gazetelerin dili halkın anlayabileceği şekildedir."],["h","BİR FİLM ANISI"],["p","Sanırım on üç yaşındaydım. İstanbul’da okuyan bir Antepli... Yatılıydım. Güz gelince İstanbul’a göçüyor, şubata kadar orada kalıyordum. Yarıyıl tatilimiz şubattaydı. Üç hafta. Tatil başladığı gün, ver elini Haydarpaşa! Poşu treni. İki gün iki gece sonra Narlı. Bir “Austin” otobüs, iki buçuk saat sonra Antep. Tatil bitince yaza kadar yine İstanbul."],["p","Yarıyıl utilimin son gecesiydi. Bir cumartesi gecesi. Ertesi akşam trenle İstanbul’a dönecektim."],["p","O cumartesi gecesi, annemle babam sinemaya götürdüler beni. Hangi sinema olacak, Nakıp Alinin sinemasına. Filmi hatırlamıyorum, ama bütün filmler gibi keyifle seyrettim. Yine de bir “burukluk” vardı içimde. Çünkü filmden önce bir parça gösterilmişti: Gelecek program! Onu kaçıracaktım, öyle de görmek istediğim bir filmdi ki....."],["p","Sinamadan çıkarken Nakıp Ali gördü bizi."],["p","“Nasıl, sevdin mi filmi?” dedi."],["p","“Sevdim” dedim, “Ama gelecek programı göremeyeceğim. Ona üzüldüm.”"],["p","“Haftaya görürsün”"],["p","“Nasıl görürüm Ali Amca? Yarın akşam İstanbul’a dönüyorum.”"],["p","“Talihine küs” dedi Nakıp Ali."],["p","Ama ertesi sabah erkenden evin kapısı çalındı. Açtım. Sinemadan bir adam."],["p","“Nakıp Ali seni istiyor” dedi."],["p","Koşa koşa sinemaya gittim. Nakıp Ali gişenin önünde bir iskemle atmış, beni bekliyor."],["p","“Çağırdın mı Ali Amca?”"],["p","“Evet” dedi, salonun kapısını açtı sonra."]]},{"n":39,"b":[["p","“Gir”."],["p","Girdim"],["p","“Otur”."],["p","Oturdum."],["p","Ve koskoca Nakıp Ali, on üç yaşındaki bir çocuğa, görmek istediği filmi oynattı o Pazar sabahı."],["l","I. Aşadaki sorulara cevap veriniz."],["l","a) Parçadaki çocuk Isatanbul’da ne yapıyor?"],["l",".................................................................................................."],["l","b) Çocuk Antep’e kadar neyle geliyor. Nasıl yolculuk yapıyor?"],["l",".................................................................................................."],["l","c) Niçin son cumartesi gecesi film seyrederken içinde bir “burukluk” vardı?"],["l",".................................................................................................."],["l","d) Nakıp Ali pazar sabahı çocuğa o filmi niçin oynattı?"],["l",".................................................................................................."],["l","e) Parçaya göre Nakıp Ali nasıl bir kişidir? Onu tanıtın."],["l",".................................................................................................."],["p","II. Cümleleri uygun yüklemle tamamlayın:"],["l","a) Karşıdan gelen adamı .................. 1. el sallıyorlar."],["l","b) Dün gece gördüğüm rüya ............ 2. hemen kirlendi."],["l","c) Çocuk görmek istediği filmi ....... 3. yola çıktılar."],["l","d) Tatil başladığı gün ....................... 4. yok."],["l","e) Yavaş yavaş giden otobüs ........... 5. seyredebildi. f) O akşam gittikleri sinemada ....... 6. tanıyor gibiyim. g) Nakıp Ali, üzülen çocuğa ............ 7. çöpe attı. h) Ali’nin yeni alınan gömleği ......... 8. güzel bir film izlediler. ı) Annem çürümüş domatesleri...... 9. çok korkunçtu. i) Trende oturacak yer..................... 10. filmi oynattı."],["h","TÜRKİYE’DE SPOR"],["p","Türkive’de son yillarda spor, insan yaşamında önemli yer almaktadır. Türkiye’de her dalda spor yapılır. Basketbol,"]]},{"n":40,"b":[["p","futbol, güreş, voleybol, yüzme, atletizm, hentbol, tenis, halter, karete, boks yapılan sporların başlıcalarıdır. Son yıllarda adından tüm dünyada söz ettiren Dünya Halter Şampiyonu Naim Süleymanoğlu, halter sporunun Türkiye’de sevilmesinde önemli rol oynamıştır."],["p","Kendi öz sporumuz olan güreşten sonra Türkiye’de en çok sevilen spor futboldur. Türkiye’nin her şehrinde futbol sahası ve kapalı spor salonu bulunur. Gençler en çok futbolu severler. Çünkü futbol maçları çok heyecanlı oluyor. Tuttukları takımın bütün maçlarını seyretmek isteyen taraftarlar yaz, kış demeden takımlarıyla beraber bütün Türkiye’yi dolaşıyorlar. Onları destekliyorlar."],["p","Türkiye’de belli başlı futbol klüpleri şunlardır:"],["p","Beşiktaş, Fenerbahçe, Galatasaray arasında çekişmeli bir şampiyonluk mücaadelesi yapılır."],["l","A. Lütfen aşağıdaki soruların doğru cevabını bulunuz."],["l","1. Türkiye’de en çok sevilen spor……………………….’dur."],["l","a) Yüzme b) Tenis c) Futbol d) Basketbol"],["l","2. Dünya Halter Şampiyonu kimdir?"],["l","a) Ahmet Karacadağ b) Naim Süleymanoğlu"],["l","c) Metin Tekin d) Mehmet Terzi"],["l","3. Türklerin kendi öz sporları aşağıdakilerden hangisidir?"],["l","a) Atletizm b) Güreş c) Basketbol d) Futbol"],["l","B. Aşağıdaki boşlukları doldurun."],["l","1. Türkiye…….. her dal…… spor ya…….."],["l","2. Türkiye……..en çok sev…….. spor…….. dur."],["l","3. Gençler en çok……….... severler."],["l","4. Futbol maçları çok……….... ol…….. ….."],["l","5. Maçları seyretmek iste …………. taraftarlar …………… demeden akımları …………… bütün Türkiye…………….. dolaşıyorlar."]]},{"n":41,"b":[["l","C. Aşağıdaki sorulan cevaplayınız."],["l","1. Türkiye’de hangi spor dalları vardır?"],["l",".................................................................................................."],["l","2. Türkiye’deki belli başlı futbol klüpleri nelerdir?"],["l",".................................................................................................."],["l","3. Taraftarlar niçin yaz, kış demeden Türkiye’yi dolaşıyorlar?"],["l",".................................................................................................."],["l","4. Sizce sporun insan hayatındaki önemi nedir?"],["l",".................................................................................................."],["h","SONBAHAR"],["p","SONBAHAR 23 Eylül’de başlar ve 20 Aralık’ta sona erer. Yaz sonunda ya da sonbahar başında yapraklar sararmaya ve dökülmeye başlar. Fakat, çam ve manolya gibi bazı ağaçlar her zaman yemyeşildirler. Sonbaharda bol bol yağmur yağar. Sıcaklık giderek azalır. Manavlarda her çeşit meyve ve sebze görülmeye başlar. Sarı sarı portakallar, mandalinalar, elmalar, armutlar, çeşit üzümler, iri iri muzlar, incirler, cevizler, kestaneler, ayvalar."],["p","Bu mevsimde bağbozumu yapılır. Yani, bağlardan, bahçelerden üzümler kesilerek sepetlere doldurulur. Sonra, şehirlere getirilir. Kara üzümü seven birçok insan vardır. Bazıları da şıraya yani üzümün suyuna bayılır. Şıra bol vitaminlidir. Çocuklara içirmek yararlıdır. Ayrıca, üzümden şarap, rakı gibi alkollü içkiler de yapılır."],["p","Sonbahar kıştan sıcak, yazdan soğuktur. Sonbahar sonuna doğru kalın elbiseler, kazaklar giyilmeye başlanır. Şehirlerde tatile yazlığa gidenler yavaş yavaş evlerine dönerler. Artık, okullar da açılmıştır. Köylüler için sonbahar bir çalışma mevsimidir. Tarlalarını sürüp buğday ve arpa ekerler. Kışlık odunlarını ormanlardan toplayıp evlerine getirirler."],["l","A. Lütfen aşağıdaki sorulara cevep veriniz."],["l","1. Sonbahar ne zaman başlar, ne zaman sona erer?"],["l",".................................................................................................."],["l","2. Yapraklar ne zaman dökülmeye başlar?"],["l","................................................................................................."]]},{"n":42,"b":[["l","3. Hangi ağaçlar her zaman yeşildirler?"],["l",".................................................................................................."],["l","4. Sonbaharda hangi işler yapılır?"],["l",".................................................................................................."],["l","5. Sonbaharda hava nasıl olur?"],["l",".................................................................................................."],["l","B. Lütfen doğruları ‘’D’’ , yanlışları ‘’Y’’ ile işaretleyiniz."],["l","1. ( ) Sonbaharda hava çok sıcaktır."],["l","2. ( ) Kara üzümü birçok insan seviyor."],["l","3. ( ) Sonbaharda çok yağmur yağar."],["l","4. ( ) Şıra çocuklara yararlıdır."],["l","5. ( ) Sonbaharda okullarda tatil."],["l","6. ( ) Köylüler için sonbahar bir dinlenme mevsimidir."],["l","7. ( ) Tarlalara buğday ve arpa ekerler."],["l","C. Lütfen boşlukları doldurunuz."],["l","1. Sonbaharda sıcaklık ................. ................................ ."],["l","2. ...................... üzümler .................. sepetlere ..................... ."],["l","3. Şehirlerde ............... gidenler ................. evlerine ............. ."],["h","ORİGAMİ"],["p","Origami boş zamanlarınızı değerlendirirken hem dinlenebileceğiniz hem de sanatsal ürünler ortaya çıkarabileceğiniz bir hobidir."],["p","Origami bir kağıdı katlayarak, kesme, yapıştırma vb. gibi işlemlerden hiçbirine başvurmadan figürler oluşturma sanatıdır. Origami ile kuş, hayvan, böcek, çiçek ve insan figürü gibi daha pek çok nesne oluşturulabilir."],["p","Origamide bütün şekiller daima kağıt bir kareden çıkar. Gerisi hazır modelleri yapmanıza ve hayal gücünüze bağlıdır. Origami ilk defa Japon Kraliyet Sarayında ortaya çıkmış, sonra da bütün dünyaya yayılmış olan matimatiksel ve görsel kağıt katlama sanatıdır."],["p","Origami sadece kağıt sanatı mıdır? Yoksa metal ve benzeri diğer maddeleri de içine alır mı? Origami genellikle kağıdın bükülüp"]]},{"n":43,"b":[["p","katlanmasıyla ortaya konur. Origami kelimesinin kökü Japonca’ya dayanır. Oru, katlamak; kami ise kağıt demektir."],["p","Japon’lar tarafından kullanılan origami kelimesi, bizim şimdi anladığımız origami kelimesinden farklı anlamda kullanılıyordu. Onlar kağıt bükmek anlamında origami kelimesini kullanmak yerine, kağıt sertifikalara origami diyorlardı."],["p","1963’te yazdığı bir makalede Yoshizawa kendi ülkelerinde “Origami Tsuki” diye bir terim olduğunu ve bunun “garanti edilmiş” veya “belgelenmiş” anlamına geldiğini söylemiştir. Bizim bildiğimiz anlamda origami kelimesi ancak 19. yüzyılın sonlarında ve 20. yüzyılın başlarında kullanılmaya başlandı."],["p","Halen devam
