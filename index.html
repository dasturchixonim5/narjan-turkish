üp arkaya bakması... acıların en dayanılmazıdır."],["p","Yangını atlatmak, beri sırtlara sıçratmamak için, ğünlerce dağlarda kaları, myangın yerlerinde geceleyen kurtlar çoktur. “Korkmadın mı?” diye soran köylülere, “Ne varmış korkacak, yangının çıktığı yerde böcek olmaz?” derlerdi."],["p","Dünyanın en korkunç, en acıkh manzaralarından biri, belki birincisi yanan orman sahasıdır. Ağaçların gövdesi simsiyah olur. Dalları kara kara, uçlari incelmiş, bükülmüs, burkulmuştur. Dallar kömür, yapraklar küldür."],["p","Bizim köylüler, orman kolcusunun, jandarma erlerinin kendilerini yangın söndürmeye çağırmalarını beklemezlerdi. Yangın söndürmeye gitmekten kaçan erkek, savaştan kaçanlara benzetilir kınanırdı."]]},{"n":176,"b":[["p","KELİMELER"],["p","ünlemek : 1. Yüksek sesle çağırmak"],["l","2. Yüksek sesle bildirmek. aklını başından almak : Düşünemeyecek bir duruma getirmek, çok şaşırtmak kınamak : Yapılan bır işin kötü olduğunu belirten bir biçimde söz söylemek, ayıplamak. pürçük : Bitkilerin saçakli kökü ve ya püskülü. Aşağıdaki soruları yanıtlayınız."],["l","1. Yaz aylarında, köylülerin gözünün dağlarda olmasının sebebi nedir ?"],["l",".................................................................................................."],["l","2. Okuduğunuz yazıya göre, köy tellalı neyi haber veriyor ? Köyde ne gibi değişiklikler oluyor?"],["l",".................................................................................................."],["l","3. Yangının çabuk önlenmesi nelere? Niçin?"],["l",".................................................................................................."],["l","4. Ormandaki yangını çevreye sıcratmamak için köylüler nasıl hareket ediyorlar?"],["l",".................................................................................................."],["l","5. Yangından ormandaki hayvanlar nasıl etkileniyorlar?"],["l",".................................................................................................."],["l","6. Hayvanlar insanlara niçin yaklaşıyor?"],["l",".................................................................................................."],["l","7. Yangından sonra ormanın görüntüsü nasıl olurmuş?"],["h","ÇİÇEK VE UMUT"],["p","Çocukluğumun yedi yaşına kadarki altin çağı tütün tarlalarında geçti. Altın çağı diyorum; çünkü renkleri, çiçekleri, ağaçları, küçük badem kabuklarını, deve dikenlerini tannıdığım çağdır bu."],["p","Sanki her şey bana gülümseridi. Toprak, gökyüzü, badem ağaçları ve akşam sefaları... Em güzel gülümseyen de koyu pembe açmış çiçekleriyle akşam sefalarıydı."]]},{"n":177,"b":[["p","Akşam vakti, kavak yaprakları nazlı nazlı kımıldar ve bizi ayaklarımızı yıkamak için tulumbanın başına inerdik, tulumbayı bazen dedeme benzettiğim olurdu. Dedem de öksürü, her öksürme sesi onun sesi onun var olduğuna işaret ederdi."],["p","Ayaklarımızı yıkarken daima yanımızda olur, tulumbanın kenarına çömelir ve bizi seyrederdi. Annem yukarıdan, iyi yakanmamızı, yüzümüzü, ayaklarımızı sabunlamamızı tenbih ederdi. Dedem bunları bakışlarıyla tasdik eder, mavi gozlerinden içimize sevgi akıtırdı."],["p","Yıkama işinden sonra, bütün ilgimiz akşam safalarına kayadı. Tulumbayı çepe çevre sarmışlardı. Yemyeşıl yaprakları, incecik dalları ve orta boylarıyla birbirine girmiş, elet tutuşmuş gibi dururlardı. Akşam vakti de koyu pembe çıçekleri kapanmış olurdu."],["p","Her akşam vakti; dedem bize, sabah bu çiçeklerin açtığı anı göstermek için söz verirdi. Fakat biz bu anı, hiç yakalayamazdık."],["p","Sabak annem ve bebam tütüne gider, dedemle anne annem tarla evinde kalırdı. Tütüne çok erken gidilir, kahvaltı tepsisi taşınırdı. Annemle babamın kahvaltısını dedem götürür, bu görevini yaptıktan sonra bizi kaldırırdı. Bu zamana kadat güneş doğmuş olmazdı. Sırtımıza ceketlerimizi verir ve birlikte tulumbaya inerdik. “Çiçekler bizi beklememişler, açmişlar” diye, çiçeklerin dedeme şikayet ederdik. Dedem “yarın” derdi. Ne güzel şeydi yarını beklemek. Açarken görmesek bile."],["l","- Yüzümüzü tulumbanın soğuk suyuyla değil de çiçeklerin pembe ve yeşilleriyle yıkamış gibi olurduk. Sonra dedem bizi, anne ve babamızın yanına götürürdü. Bizim aile sabah erken kalkmaktan hiç bir zaman şikayet etmezlerdi. Içimden “Annem, babam, çalışmayı çiçeklerden öğreniyorlar. Çünkü akşam onlar gibi kapanip, sabah erkenden uyanıp açıyorlar,” dedim. Kahvaltı tepsisini eve kardeşimle geri getirirdik. Dedem orada biraz daha kalırdı. Biz kuş cıvıltıları içinde çiçeklerin etrafinda koşar, şarkılar söylerdik. Bir sabah yine umutla, akşam sefalarının açaçağı anı görmek için kalkmışuk, tulumbanın başına indik. Akşam sefaları açmamıştı."]]},{"n":178,"b":[["p","Şaşırmıştık. Yeni mi açacaklardı acaba? Bekledik sabıla, umutla... Güneş, dağların ardından altın başını gösterinceye kadar bekledik. İçimizde birşeyler eridi, renkler soluklaştı. Çiçekler açmıyordu."],["p","Hala o bekleyişteyim! Kapanan akşam sefaları açılacak ve dedem, tahta merdivenlerden tulumbanın başına inecek ve biz yüzümüzü yıkayacağız."],["p","Ayşe İLKER"],["h","KELİMELER"],["p","çocukluğumun altın çağı : En parlak ve mutlu dönemi."],["p","deve dikeni : Yol ve tarla kenarlarında"],["p","yetişen, bonyu 30-100 cm."],["p","uzunluğunda bir bitki."],["p","tulumba : Suyu derin kuyulardan"],["p","çekmeye ve ya yüksek"],["p","yerlere iletmeye yarayan"],["p","araç."],["p","tenbih etmek : Bir işin yapılmasını öğütlemek."],["p","tasdik etmek : Doğrulamak, onaylamak."],["p","Aşağıdaki soruları yanıtlayınız."],["l","1. Yazarın yedi yaşına kadarki zamanı nasıl geçmiştir? Bu çağa neden altın çağ diyor?"],["l",".................................................................................................."],["l","2. Yazar, dedesi ile tulumba arasında nasıl bir benzerlik buluyor? Neden?"],["l",".................................................................................................."],["l","3. Çocuklar, tulumbanın başında sabah temizliğini yaparken anne ve dedesi ne yapıyor?"],["l",".................................................................................................."],["l","4. Akşam sefası nasıl bir çiçekmiş? Tanıtınız."],["l",".................................................................................................."],["l","5. Her akşam dede çocuklara ne sözü veriyor? Bu sözü neden bir türlü gerçekleştiremiyorlar?"],["l",".................................................................................................."]]},{"n":179,"b":[["l","6. Yazarın anne ve babası hangi işte çalışıyorlar? Bu işin özelliğini belirtiniz."],["l",".................................................................................................."],["l","7. Bu metnin ana fikri nedir?"],["l",".................................................................................................."],["h","HAYAT AĞACINDA BİR YAPRAK"],["p","Çocuk yaşından beri çalışan, yıpranmış elleriyle yapıyordu işini. Çok konuşkan, çok neşeli ve güleryüzlü, diyordu arkadaşları onun için. Oysa o sadece, bütün hüznünü kapıda bırakmayı iyi bilen biriydi, hepsi bu. Kahkahaları, içinde yanan ateşin bir dışavurumuydu, kimse bilmiyordu bunu."],["p","Yasemin’idi adı, geçmişte aşık olmuş, en güvendikleri, sevdasını vurmuş, o’da ona bırakılan son çareyi seçip aşkına koşmuş. Yasemin herşeye rağmen sevdiği adamla evlenmiş."],["p","Yasemin, altı yıldır Ahmet ile evli, aşkı ilk günkü gibi sıcak, dünyanın en güzel varlığına, bir evlada sahip. Her genç kızın kurduğu gibi bir hayali vardı elbet. Hiçbir zaman giymediği beyaz gelinlik, babasının beline bağlamadığı kırmızı kuşak, öpülemeyen eller, mutluluk ve sevinç dolu sözler."],["p","Ahmet’in ailesi hiçbir zaman affetmedi onları, Yasemin’in ailesinin evinde kalıyorlar. İkisi de hergün sabahtan akşama kadar çalışıyor, çalışıyorlar ama ne yetiyor ne de artıyor. Hayatlarının ne kadar kısa yada uzun olduğunu bilmeden, çocuklarının yanında olamadan, ailelerinin suçlayan bakışlarına katlanarak yaşıyorlar."],["p","Yasemin bazen düşünüyor, sevdanın bedeli bu kadar ağır mı olmalı? Ben sevmişim, ailem neden buna saygı duymadı, neden kendimi suçlu duruma düşürmemi sağladı? Bir şekilde evlenmişim neden destek olmadı? Biz karnımızı zor doyururken onlar evlerinde bedava oturduğumuz için bizden faturalarını ödememizi istiyorlar, çocuğumu parasızlık yüzünden kreşe yollayamazken öz annem benden çocuğuma baktığı için para bekliyor. Biliyorum, ailem vefasızlığımın bedelini vefasızlıkla ödetiyor, biliyorum ama sesim çıkmıyor."]]},{"n":180,"b":[["p","Sevdam için herşeyden vazgeçtim, gelinlikten, ailemden belki şimdi de çocuğumdan. Yaşamak için çalışmak zorundayız, kimseden yardım göremediğimiz için, birşekilde cezalandırıldığımız için."],["p","Oğlum birgün beni yanında olmamakla suçlayacak, ne derim bilmiyorum, oysa herşey hep birarada durmak için, değer verdiğim herkez için. Umarım birgün savaşımızın nedenini anlar. Anlayamadığı tek şey ise aşka açılan savaş olacak. O’da benim gibi bunu hiçbir zaman anlayamayacak."],["l","A. Lütfen, soruları metine göre cevaplayınız."],["l","1. Yasemin’in hayali neydi ? Hayalini gerçekleştirebilmiş miydi?"],["l",".................................................................................................."],["l","2. Ailesi neden onlara iyi davranmıyordu?"],["l",".................................................................................................."],["l","3. Yasemin ve Ahmet aşkları için neler yapmışlar?"],["l",".................................................................................................."],["l","4. Yasemin yaptıkları bu davranış için pişman mıdır?"],["l",".................................................................................................."],["l","5. Yasemin oğlu hakkında ne düşünüyor?"],["l",".................................................................................................."],["l","6. Sevgi ile aşk arasındaki fark nedir ?"],["l","………………………………………………………………"],["l","7. Yaseminin yerinde siz olsaydınız ne yapardınız ?"],["l","………………………………………………………………"],["l","B. Kelimeleri kendi dilinizde çeviriniz ve tanımını yapınız. kuşakgelinlikparasızlıkkreşdeğer-"],["h","LÜTFEN KEMERLERİNİZİ TAKINIZ"],["p","Uçakta seyahat edenler iyi bilirler, hava yolculuğu esnasında uçak kalkarken. İnerken ve kötü hava şartlarında uçarken, görevliler şu uyarıyı yaparlar “Lütfen kemerlerinizi bağlayınız!”."]]},{"n":181,"b":[["p","Hatta görevliler iyi hava şartlarında bile bütün yolculuk boyunca kemerlerin bağlı kalmasını önerirler."],["p","Yolcuların kemer kullanarak araca veya koltuğa bağlanmalarının geçmişi on dokuzuncu yüzyıla dayanır. İlk defa 1885 yılında bozuk yollarda seyreden at arabaları ve posta arabaları, sarsıntı yüzünden yolcular arabadan düşmesin diye kemer kullanmaya başlamışlardı. Amerika Birleşik Devletleri Hava Kuvvetleri’nde uçaklarda pilotların kayış kemerle koltuğa bağlanmalarının başlangıcı ise 1910 yılına rastlar. 1922 yılında da yarış otomobillerindeki sürücüler emniyet kemeri kullanmaya başlamışlardır."],["p","Günlük yaşantımızın bir bölümü haline gelen trafik ise emniyet kemeri ile 1969 yılında tanıştı. Emniyet kemeri kullanma yükümlülüğü ilk defa 1969 yılında Çekoslovakya’da ve 1970 yılında da Fildişi sahillerinde uygulanmaya kondu. Daha sonraki yıllarda bu uygulama diğer ülkelere yayılmaya başladı."],["p","Bugün birçok ülkede hem karayollarında hem de şehir içi trafiğinde seyrederken emniyet kemerinin takılı olması mecburiyeti vardır. Kısacası direksiyon başına oturan sürücü derhal emniyet kemerini takacaktır. Bu kural yalnız sürücü için değil, ön koltukta oturan herkes için geçerlidir. Avusturya, Kanada, Norveç, İsveç gibi bazı ülkeler işi daha sıkı tuttular ve otomobilin arka koltuğunda oturanlara da emniyet kemeri takma yükümlülüğünü getirdiler. Bu sebeple otomobil firmaları artık yeni modellerin de arka koltuk emniyet kemerini standart olarak yapıyorlar. Yine bazı ülkelerde otobüslerin ön sıraları ile en arka sıradaki koridor hizasına gelen arka koltukta da aynı mecburiyet vardır. Bu ülkelerde kamyonlar ve minibüsler de bu kapsam içerisine alındılar."],["p","Otomobilin içerisinde herhangi bir yere bağlanmamış, insan ve eşyanın başına, kaza olmasa dahi ani duruş halinde neler gelebileceğini, yapılan deneme ölçümleri verilerine göre kısaca canlandırmaya çalışalım."],["l","- Saatte 25 kilometre hızla giden, yani oldukça yavaş hareket eden bir otomobil, aniden durmak mecburiyetinde kalır ve sürücü birden frene basarsa ve ön koltukta oturan yolcu bunun farkında değilse, başını muhakkak ön cama hızla çarpar."]]},{"n":182,"b":[["l","- Saatte 40 kilometre hızla giden bir otomobil aynı şekilde ani durursa ve ön koltukta bir çocuk oturuyorsa ve bunun farkında değilse, ön cama çarpma hızı bir binanın dördüncü katından düşüp yere çarpmasına eşittir."],["l","- Saatte 60 kilometre hızla giden bir otomobil ani duruş yaptığı anda, otomobilin içindeki hareketli cisimlerin çarpma ağırlığı 20 misli artar. 15 kilogram ağırlığındaki bir bebeğin kucaktan fırlayarak ön cama çarpmasını bir de siz hesaplayın."],["l","- Modern çağın gelişimi paralelinde artan teknik imkanlar ve bunun sonucu hızlanan ve yoğunlaşan trafik içerisinde yine aynı hızla artan trafik kazalara karşı, yenilenme şansı olmayan hayatınızı devam ettirmek için bize sunulan koruyucu uygulamalardan yararlanmak en akıcı davranıştır. Onun için: Emniyet kemeri kullanmak kazayı önlemez, ama sizi fazla zarar görmekten kurtarır. “Lütfen emniyet kemerlerinizi kullanınız”."],["l","I. Aşağıdaki ifadeler doğru mu (D), yanlış mı (Y)?"],["l","1. ( ) Günümüzdeki otomobillerde, kazalardaki zararı önlemek için emniyet kemerleri vardır."],["l","2. ( ) İlk defa 1885 yılında bozuk yollarda at arabalarında ve posta arabalarında emniyet kemeri kullanılmaya başlanmıştır."],["l","3. ( ) Yolcuların kemer kullanarak koltuğa bağlanmalarının geçmişi 18.yüzyıla dayanır."],["l","4. ( ) 1920 yılında da yarış otomobillerinde emniyet kemeri kullanılmaya başlandı."],["l","5. ( ) Kanuni olarak emniyet kemeri kullanılma yükümlülüğü ilk defa 1969 yılında Çekoslovakya’da uygulanmaya konuldu."],["l","6. ( ) Emniyet kemeri kullanma zorunluluğun sadece şoförlere getirilmiştir."],["l","7. ( ) Saatte 40 kilometre hızla giden bir otomobil aynı şekilde ani bir fren yaparsa ve ön koltuktaki bir çocuk eğer bunun farkında değilse, bu çocuk dört katlı bir binadan düşmüş gibi olur."],["l","8. ( ) Emniyet kemeri kullanmak kazaları önler."]]},{"n":183,"b":[["p","II. Aşağıdaki kelimeleri anlamlarıyla eşleştiriniz."],["p","1Seyahat gezi, yolculuk"],["p","2Emniyet kemeri can veya mal kaybına, zararına"],["p","sebep olan kötü olay."],["p","3Sürücü yerleşim merkezlerini karadan"],["p","birbirlerine bağlayan yol."],["p","4Kara yolu uçaklarda, otomobillerde vb."],["p","Güvenlik için bele takılan şey."],["p","5Fren şoför."],["p","6Kaza ulaşım yollarının yayalar ve"],["p","her türlü taşıt araçları"],["p","tarafından kullanılması."],["p","7Trafik bir makinenin veya taşıtın"],["p","hızını kesmeye veya onu"],["p","durdurmaya yarayan"],["p","mekanizma."],["p","III. Aşağıdaki kelimelerin eş anlamlarını yazınız."],["p","1Seyahat ...................................."],["p","2Görevli ...................................."],["p","3Uyarı ...................................."],["p","4Sürücü ...................................."],["p","5Kural ...................................."],["p","6Yükümlülük ...................................."],["p","IV. Aşağıdaki boşlukları yukarıdaki metinden faydalanarak doldurunuz."],["p","1Uçak seyahati esnasında görevliler sık sık: “Lütfen"],["l","....................... bağlayınız” diye uyarıda bulunurlar. 2- İlk defa ............. yılında arabalarda ve posta arabalarında yolcular emniyet kemeri kullanmaya başlamışlardır. 3- Günlük yaşantımızın bir parçası haline gelen"],["l","........................... . 4- Emniyet kemeri kullanmak kazayı ..................... ."]]},{"n":184,"b":[["l","V. Lütfen aşağıdaki test sorularını cevaplayınız."],["l","1. Aşağıdaki araçlardan hangisi farklıdır?"],["l","A) Taksi B) Kamyon C) Otobüs D) Gemi"],["l","2. Aşağıdaki araçlardan hangisi karada gitmez?"],["l","A) Troleybüs B) Otomobil C) Yarış arabası"],["l","D) Helikopter"],["l","3. Ulaşım yollarında bulunan taşıt ve yayaların tümüne ne ad verilir?"],["l","A) Ulaşım B) Otoyol C) Trafik D) Seyahat"],["l","4. Uçak kullanan kimseye ............ denir?"],["l","A) Makinist B) Pilot C) şoför D) Kaptan"],["l","5. Yerleşim merkezlerini karadan birbirlerine bağlayan yola ............. denir."],["l","A) Hava yolu B) Kara yolu C) Patika D) Oto park"],["l","6. Trafik kazalarını en aza indirmek için .......................... ."],["l","A) trafikteki araçlar azaltılmalıdır."],["l","B) trafik polislerinin sayısı çoğaltılmalıdır."],["l","C) birtakım koruyucu önlemler geliştirilmelidir."],["l","D) yollar çift şerit yapılmalıdır. VI. Aşağıdaki sorulara cevap veriniz. 1- Yolcuların kemer kullanmasının geömişi ne zamana dayanır?"],["l","……………………………………………………………… 2- Kanuni olarak emniyet kemeri kullanma zorunluluğu ilk defa ne zaman ve nerede uygulamaya konulmuştur?"],["l","……………………………………………………………… 3- Uçakla seyahat sırasında görevlilerin yaptığı uyarılar nelerdir?"],["l","……………………………………………………………… 4- 25 kilometre hızla giden bir otomobil aniden durursa ve yolcular da bunun farkında değilse ne olur?"],["l","………………………………………………………………"],["h","KAMYON"],["p","Üç sene evvel Ayvalık’tan Balıkesir’e geliyordum. Yarı yolda bir kamyona tesadüf ettimki tıpkı bayramlarda Cinci Meydanı’na"]]},{"n":185,"b":[["p","kurulan eski salıncaklara benziyordu. Dört tarafında peykeler, ortasında gene iki peyke... Kenarlarında: çocuklar düşmesin diye, tırabzan biçiminde yeşile, kırmızıya, sarıya boyanmış korkuluklar."],["p","Fark, yalnız şurada ki birbirinin kucağında oturan bayram çocukları otuzar, kırkar, ellişer yaş ihtiyarlamışlar, sakallanmışlar, bir de yandan yana sallanacakları yere aşağıdan yukarı hopluyorlar. Sonra, bayram elbiseleri de artık çok eskimiş, çok paramparça olmuş..."],["p","Fakat ne ziyanı var? Gönüller şen olsun. Bu araba mihneti kendine zevk etmiş peygamber ahlaklı Anadolu fakirinin arabasıdır."],["p","Maksat, günlerce sürecek bir yolu üç beş saatte aşmak, ayağı yerden kaldırmak değil mi? Pekala güle eğlene gidiliyor... Allah bunu da aratmasın."],["p","Yol kenarında bekleyenler için “Ya kamyonda yer bulunmazsa...” korkusu da yoktur. Onlar çok kere zerzevat arabası gibi tepeleme dolu gelir. Fakat “Yer yok” diye müşteri çevrildiği görülmüş şey değildir."],["p","Bir ses: “Az müsaade. Az sıkışalım” diye bağırır. Arabanın içinde hafif bir çalkantı olur. Öndeki jandarma neferinin kucağına bir çocuk yahut kuzu, delikanlı biroğulun dizine ihtiyar anası oturtulur. Kamyonun patronu içeriden çamurluğa, çamurlukta seyahat eden şöför yamağı, kamyonun üstündeki denkler, fıçılar arasına çıkar, böylece yeni yolculara ve yüklerine de yer açılmış olur."],["p","Biraz ötede iki,üç kişi daha mı el sallıyor? Gene korkmayın! Onlara da Allah’ın izniyle yer bulunacak, hatırları hoş edilecektir. Allah’ın izniyle diyorum: çünkü bu kadar az yere bu kadar insan aldırmak fizik kanunlarına sığmaz: ancak Allah’ın izniyle kabil olur."],["p","Çocukken pek ziyade şaştığım bir şey vardı. Karagöz’ün Yalova Safası oyununda perdenin ortasına minimini bir karar konur, bu karara Arap, Acem, Arnavut, Laz belki on kişi girerdi."],["p","Kamiyonların bu hudutsuz adam alma kabiliyeti bana dayma bu dolmaz kararı hatırlatır."],["p","İstanbul tren yahut vapurunda hele bir kimseyi biraz sıkıştırın: hemen çarpılır,çay semaveri gibi oyurduğu yerde fıkır fıkır kaynamaya başlar. Anadolulu Kamyon yolcusu, kamyona yeni adam"]]},{"n":186,"b":[["p","almak için sıkıştırıldıkça darılmıyor, kızmıyor: “Başkasının karı için ben niye rahatsız olayım!” demeyi aklından geçirmiyor."],["p","Yanımda yer açmaya çalışırken gösterdiği gayrete, güler yüze bakılırsa hatta bundan bir zevk, kendini daima ihmal etmiş, hayatını başkalarının saadeti için harcamaya alışmış bir insanın zevkini de duyuyor."],["p","Reşat Nuri GÜNTEKİN"],["p","Anadolu Notları"],["p","SÖZLÜK ÇALIŞMALARI"],["l","a. Kelimeler Peyke, tırabzan, mihnet, zerzevat, nefer, yamak, ziyade, karar kelimelerinin anlamını öğreniniz. Bu kelimelerin büyük ses uyumuna uyup uymadığını söyleyiniz."],["l","b. Deyim ve Gruplar Gönlü şen olmak, peygamber ahlaklı deyimlerinin anlamını öğreniniz. ”Gönül” kelimesiyle yapılmış başka deyimler söyleyiniz. Bunları birer cümlede kullanınız. METİN ÜZERİNDE ÇALIŞMALAR"],["l","a. Metni Anlayalım"],["l","1.Yazar,anlattığı kamyonu nerede görüyor? Bu kamyonu neye benzetiyor? Niçin?"],["l","2. Metinde, “mihneti kendine zevk edinmiş peygamber ahlaklı” sözüyle Anadolu halkının hangi özellikleri anlatılmaktadır?"],["l","3. Kamyon çok dolduğu zaman bile yeni yolcular alıyor mu? Nasıl?"],["l","4. Ayvalık’la Balıkesir arasındaki kamyon yolculuğuyla İstanbul tren yahut vapurlarındaki yolculuğu karşılaştırınız."],["l","5. Bu metinden yola çıkarak Anadolu halkının özelliklerini belirtiniz."],["l","6. Okuduğunuz metinde zaman zaman nükteli (gülünç) ve alaylı ifadelere yer verilmiştir. Bunları gösteriniz."],["h","RÜŞVET"],["p","Kuvvetli bir rüzgar esiyordu. Avukat Hacı Namık Efendi, kağıtlarım uçmasın diye, dükkanının kapısını kapattı."]]},{"n":187,"b":[["p","Açık olan kapısını iterken, küçük boylu, atının yuları elinde, yuvarlak bir köylünün yaklaştığını gördü."],["l","- “Merhaba Ali Hoca” dedi. “Böyle zamansız ne arıyorsun burada? Daha pazara iki gün var.”"],["l","- Merhaba, efendi! Belaya düştüm. Bir dava için geliyorum. Diye başını salladı:"],["l","- İyi gel biraz konuşalım, bakalım."],["l","- Konuşalım"],["l","- Derdini anlat bana bakalım"],["l","- Senden başka zaten kime anlatacağım Atını bir direğe bağladı. Küçük dükkana girdi ve geçip oturdu. Namık Efendinin uzattığı sigarayı yakarken problemini anlattı. Hasmi, köyün muhtarı Kolsuzoğluydu. Ona ait bir arsanın üzerine, Ali Hoca vaktiyle bir ev yapmıştı. Kolsuzoğlu şimdi bu evin yapıldığı arazi benim diyordu. Halbuki bina kimin ise yer de onun demektı. Namık Efendi Ali Hoca’yı dinledikten sonra."],["l","- “Sen haksızsın Ali Hoca!” dedi."],["l","- Haksız mıyım?"],["l","- Evet"],["l","- Hayır, ben haklıyım. Niye binayı yaparken sesini çıkarmadı."],["l","- Çıkarmasın"],["l","- Ben haklı olduğumu biliyorum, Namık Efendi. Davadan vazgeçmem."],["l","- Kaybedeceksin!"],["l","- Edeyim, zararı yok. Ama davadan vazgeçmem. Namık Efendi haksız davalar almazdı. Bu davayı kabul etmek istemiyordu. Ama “Bozüyük” köyünün halkı 30 senelik müşterileri idi. İşleri her düştüğünde Namık Efendi’ye gelirlerdi. Sonunda:"],["l","- “Pekala senin bu işine bakayım, kaybedersem bana darılmayasın ama,” dedi."],["l","- Darılmam, ama neye kaybedeceksin?"],["l","- Çünkü haksızsın."],["l","- Hakime güzel bir koç göndereyim mi?"],["l","- Ne ?"],["l","- O vakit davayı kazanamaz mıyım?"]]},{"n":188,"b":[["l","- O vakit kesinlikle kaybedersin."],["l","- Niçin?"],["l","- Yeni hakim senin bildiğin admlardan değil... Ali Hoca, Namık Efendi’den yeni hakimin övgüsünü uzun uzadıya dinledi. Bu kişi rüşvetin, hediyenin düşmanıymış. En haklı bir davacı kendisine rüşvet vermeye kalksa, o saatte onu haksız çıkarırmış. Sonunda Ali Hoca ve Namık Efendi anlaştılar. Avukat çok ümitsizdi. İşi hatır için alıyordu. Haksızlık o kadar meydanda idi ki... İki hafta sonra Ali Hoca dükkanın kapısında tekrar göründü. Dava sonuçlanmıştı. Namık Efendi müşterisini görünce güldü; “Hoş Geldin! Ne dersin davayı kazandık!” dedi. Bu kadar haksız bir hükmü, hakimin nasıl verdiğine bir haftadır şaşıyordu. Ali Hoca soğukkanlı:"],["l","- “Benim gönderdiğim koç sayesinde kazandık!” cevabını verdi."],["l","- Ne!..sen hakime bir koç mu gönderdin?"],["l","- Evet"],["l","- Buna cesaret ettin ha!.."],["l","- Evet ama sen bana “Rüşvet düşmanıdır, kim hediye verirse haksız çıkar” dememiş miydin?"],["l","- Evet"],["l","- Ben de koçu gönderirken kendi ismimi vermedim."],["l","- Ya ne yaptın?"],["l","- Hasmım, Muhtar Kolsuzoğlunun ismini verdim. !!!"],["l","I. Aşağıdaki ifadelr doğru mu (D), yanlış (Y) mı olduğunu işaretleyiniz. 1- ( ) Ali Hoca’nın bazı problemleri vardır. 2- ( ) Ali Hoca ve Muhtar Kolsuzoğlu birbirlerini çok seviyorlar. 3- ( ) Kolsuzoğlu Ali Hoca’nın evini elinden almak istiyor. 4- ( ) Ali Hoca haksız olduğu için, avukat Namık Efendi davayı kabul etmiyor. 5- ( ) Hakim rüşvet almayı seven birisidir."]]},{"n":189,"b":[["p","6- ( ) Ali Hoca, hakime bir koç gönderiyor ve bu yüzden davayı kazanıyor."],["p","7- ( ) Hakim haksız bir karar vermiştir."],["p","8- ( ) Namık Efendi, hakimin kararına inanamıyor. II. Aşağıdaki sorulara cevap veriniz."],["p","1Hacı Namık Efendi kimdir?"],["l",".................................................................................................. 2- Davayı kim kazanıyor?"],["l",".................................................................................................. 3- Hakim nasıl bir insan?"],["l",".................................................................................................. 4- Ali hoca ile Kolsuzoğlu arasındaki problem nedir?"],["l",".................................................................................................. 5- Hacı Namık Efendi, Ali Hoca’nın haksız olduğunu bile bile, davayı niçin kabul ediyor?"],["l",".................................................................................................. 6- Size göre kim haklıdır?"],["l",".................................................................................................."],["p","III. Aşağıdaki kelimeleri manalarıyla eşleştiriniz."],["p","1Rüşvet alıcı"],["p","2Hasım küsmek, kızmak"],["p","3Dava bir işi yaptırırken verilen mal veya"],["p","para"],["p","4Arsa hukuki haklarını korumak için"],["p","yargıya başvurma"],["p","5Müşteri düşman"],["p","6Darılmak üzerine bina yapılmak için ayrılmış"],["p","yer"],["h","TUZLU KAHVE"],["p","Kıza bir partide rastlamıştı.. Harika bir şeydi. O gün peşinde o kadar delikanlı vardı ki.. Partinin sonunda kızı kahve içmeye davet etti. Kız parti boyu dikkatini çekmeyen oğlanın davetine şaşırdı, ama tam bir kibarlık gösterisi yaparak kabul etti. Hemen köşedeki"]]},{"n":190,"b":[["p","şirin kafeye oturdular. Delikanlı öyle heyecanlıydı ki, kalbinin çarpmasından konuşamıyordu. Onun bu hali kızın da huzurunu kaçırdı.. “Ben artık gideyim” demeye hazırlanırken, delikanlı birden garsonu çağırdı.. “Bana biraz tuz getirir misiniz” dedi.. “Kahveme koymak için..”"],["p","Yan masalardan bile şaşkın yüzler delikanlıya baktı.."],["p","Kahveye tuz!.."],["p","Delikanlı kıpkırmızı oldu utançtan, ama tuzu kahvesine döktü ve içmeye başladı. Kız, merakla “Garip bir ağız tadınız var” dedi.."],["p","Delikanlı anlattı: “Çocukken deniz kenarında yaşardık. Hep deniz kenarında ve denizde oynardım. Denizin tuzlu suyunun tadı ağzımdan hiç eksilmedi. Bu tatla büyüdüm ben.. Bu tadı çok sevdim. Kahveme tuz koymam bundan. Ne zaman o tuzlu tadı dilimde hissetsem, çocukluğumu, deniz kenarındaki evimizi ve mutlu ailemi hatırlıyorum. Annemle babam hala o deniz kenarında oturuyorlar.. Onları ve evimi öyle özlüyorum ki..”"],["p","Bunları söylerken gözleri nemlenmişti delikanlının.. Kız dinlediklerinden çok duygulanmıştı. İçini bu kadar samimi döken, evini, ailesini bu kadar özleyen bir adam, evi, aileyi seven biri olmalıydı. Evini düşünen, evini arayan, evini sakınan biri.. Ev duyusu olan biri.."],["p","Kız da konuşmaya başladı.. Onun da evi uzaklardaydı.. Çocukluğu gibi.. O da ailesini anlattı. Çok şirin bir sohbet olmuştu.. Tatlı ve sıcak.."],["p","Ve de bu sohbet öykümüzün harikulade güzel başlangıcı olmuştu tabii.."],["p","Buluşmaya devam ettiler ve her güzel öyküde olduğu gibi, prenses, prensle evlendi. Ve de sonuna kadar çok mutlu yaşadılar. Prenses ne zaman kahve yapsa prensine içine bir kaşık tuz koydu, hayat boyu.. Onun böyle sevdiğini biliyordu çünkü.."],["p","40 yıl sonra, adam dünyaya veda etti. “Ölümümden sonra aç” diye bir mektup bırakmıştı sevgili karısına.. Şöyle diyordu, satırlarında.."],["p","“Sevgilim, bir tanem.. Lütfen beni affet. Bütün hayatımızı bir yalan üzerine kurduğum için beni affet. Sana hayatımda bir"]]},{"n":191,"b":[["p","tek kere yalan söyledim.. Tuzlu kahvede.. İlk buluştuğumuz günü hatırlıyor musun?.Öyle heyecanlı ve gergindim ki, şeker diyecekken “Tuz” çıktı ağzımdan.. Sen ve herkes bana bakarken, değiştirmeye o kadar utandım ki, yalanla devam ettim. Bu yalanın bizim ilişkimizin temeli olacağı hiç aklıma gelmemişti. Sana gerçeği anlatmayı defalarca düşündüm. Ama her defasında korkudan vazgeçtim. Şimdi ölüyorum ve artık korkmam için hiçbir sebep yok.. İşte gerçek.. Ben tuzlu kahve sevmem. O garip ve rezil bir tat.. Ama seni tanıdığım andan itibaren bu rezil kahveyi içtim. Hem de zerre pişmanlık duymadan. Seninle olmak hayatımın en büyük mutluluğu idi ve ben bu mutluluğu tuzlu kahveye borçluydum. Dünyaya bir daha gelsem, her şeyi yeniden yaşamak, seni yeniden tanımak ve bütün hayatımı yeniden seninle geçirmek isterim, ikinci bir hayat boyu daha tuzlu kahve içmek zorunda kalsam da..”"],["p","Yaşlı kadının gözyaşları mektubu sırılsıklam ıslattı."],["p","Lafı açıldığında bir gün biri, kadına “Tuzlu kahve nasıl bir şey” diye soracak oldu... Gözleri nemlendi kadının..."],["p","“Çok tatlı!..” dedi..."],["p","Soru: Yukarıdaki hikâyeyi ele alan eleştirisel bir yazı (esse) yazınız."],["l","1. Aşağıdaki ifadeler doğru mu (D), yanlış mı (Y)?"],["l","1. ( ) Delikanlı kıza pazarda rastlamıştı."],["l","2. ( ) Kızı parka davet etti."],["l","3. ( ) Delikanlı öyle heyecanlıydı ki, kalbinin çarpmasından konuşamıyordu."],["l","4. ( ) Kız dinlediklerinden çok duygulanmıştı."],["l","5. ( ) Sonuna kadar çok mutlu yaşadılar."],["l","2. Aşağıdaki cümleleri metne göre tamamlayınız."],["l","1) Bütün hayatımızı bir yalan .......................................... beni affet."],["l","2) İlk .................................. hatırlıyor musun?"],["l","3) Annemle babam .....................................oturuyorlar."],["l","3. Aşağıdaki test sorularına cevap veriniz."],["l","1. Delikanlı kızı nereye davet etti?"]]},{"n":192,"b":[["l","A) eve B) denize C) balık tutmaya"],["l","D) parkta gezmeye E) kahve içmeye"],["l","2. Kızın evi nerede?"],["l","A) uzakta B) yakında C) evi hakkında anlatmadı"],["l","D) şehirde E) evi yok"],["l","3. Adam ne zaman dünyaya veda etti?"],["l","A) 40 yaşında B) 40 yıl sonra C) 40 günden sonra"],["l","D) 50 yaşında E) 20 yıl sonra"],["l","4. Delikanlı garsondan neyi rıca etti?"],["l","A) şeker B) kum C) bal"],["l","D) tuz E) hiç bir şey rıca etmedi"],["l","5. Delikanlının anlattığına göre aylesi ile çocukken nerede yaşamıştı?"],["l","A) şehirde B) köyde C) deniz kenarında"],["l","D) apartmanda E) komşusunun evinde"],["l","4. Aşağıdaki kelimeleri maanalarıyla eşleştiriniz. Sırılsıklam Büsbütün ıslak, çok ıslak Huzur Söz, lakırtı Sohbet gönül rahatlığı Yalan yârenlik, konuşma Laf gerçeğe uymayan söz"],["l","5. Aşağıdaki kelimelerin eş anlamlarını bulunuz. Gerçek ................................................. Hayat ................................................. Kenar ................................................. Dünyaya veda etmek ................................................. Delikanlı ................................................. Mutlu ................................................."],["l","6.Aşağıdaki sorulara cevap veriniz."],["l","1. Delikanlı neden yalan söyledi?"],["l",".................................................................................................."],["l","2. Delikanlı kendisi hakkında anlatırken kız nasıl etkilendi?"],["l",".................................................................................................."],["l","3. Kız hayat boyunca kahveyi nasıl hazırlıyordu?"]]},{"n":193,"b":[["l",".................................................................................................."],["l","4. Onlar bir birini seviyorlar mı?"],["l",".................................................................................................."],["l","5. İki genç bir birini nasıl bulmuşlar?"],["l",".................................................................................................."],["h","YORULANLAR"],["p","Bir yarış başladığı zaman, ilk anlarda bütün yarışçılar aynı hizada, aynı enerji ile koşarlar. Biraz sonra bir takımın azıcık geride kaldığı görülür. Daha sonra yarışçıların önde, ortada, arada, en geride olmak üzere birkaç gruba ayrılması mukadderdir. Fakat henüz hiçbirisinde yılgınlık yoktur. Hatta zaman geçtikçe aradakilerden bazılarının öndekilerden bazılarını geçmesi, öndekilerden bazılarının da kesilerek daha gerilere kalması olağandır."],["p","Nihayet kritik anlar gelir. Mesafe uzamış, ciğerlerle kaslar yorulmuş, sinir gücü yıpranmıştır. Artık bundan sonrası inanç, karakter ve şeref meselesidir."],["p","Turlar birer birer atlandıkça koşucuların arasındaki mesafeler çoğalacaktır. Yorulanlar birer ikişer, türlü bahanelerle yarışı bıraktıkları, onu şeref ve inanç meselesi yapanların ise yarışa devam ettikleri görülecektir. Yarışanların arasında bazılarının pek bitkin olduğu, fakat karakterleri icabı yarışı bırakmadıkları sezilecektir. Hatta bu bitkinler arasında, en ileride koşanlardan bazıları da vardır. Kimisi de maddî gücü elvermediği için çok geride kalmış olmasına rağmen ruh ve inanç kuvvetiyle yarışmaktadır."],["p","Uzun yarışı bitirenler, başlayanlara göre oldukça azdır. Hatta bunlar arasında yarışı bitirdikten sonra kalp durmasından ölenler de bulunabilir."],["p","İpi ilk göğüsleyenlerle son göğüsleyen arasında bazen çok uzun zaman da bulunabilir. Fakat bu sonuncular maddî olarak kaybetikleri yarışta şeref ve karakter mükâfatını kazanmışlardır."],["p","Bütün yarışlar böyledir. Yarış başlarken pek neşeli olanların, büyük bir hızla ileriye atılıp ilk hamlede diğerlerini geçenlerin, biraz sonra yorulup yarışı bıraktıkları çok görülmüştür."],["p","Yarışı terkedenler arasında da karakter farkı vardır. Soluğunun"]]},{"n":194,"b":[["p","tıkandığını, gücünün yetmediğini itiraf eden yiğitler pek azdır. Çoğunluk, yarış arkadaşlarında suç bulmak sevdasındadır. Bunlar, yarış arkadaşları tarfından boyuna yollarının kesildiğini, kendilerine kasdi çarpmalar yapıldığını, deparda ötekilerin nizamsız olarak daha önce fırladıklarını söyler. Bunların aslı, faslı yoktur."],["p","Dünya durdukça yarışlar böyle olacaktır. Kendisini ölçmeden yarışa katılan zayıflar, yarı yolda yarışı bırakacak, sonra bir bahane uyduracaktır."],["p","Mızıkçılık birçok insanların mayasıdır. Kendi kendisini eğitemeyen insanlar yaşlanıp kocasalar bile mızıkçı çocuk olarak kalırlar. Mızıkçılık, kendi eksiğini ve başarısızlığını başkasına atmak hastalığıdır."],["p","Kendisini atlet sanıp da yarışa giren kimse bu alandaki kabiliyetsizliğini bilmiyorsa ciddiyetten yoksunmuş demektir."],["p","Her yarış bir dâvadır. O dâvanın adamı olmak gerektir. Halterci ile güreşçinin koşuda işi ne? Onlar koşuda elverişsiz gövde yapılarıyla yarışabilirler mi? Halter ve güreş de spor olduğu için onları yarış sporu ile karıştırmak ne büyük gaflettir. Yük kaldırmak başka, koşmak başkadır. Ağırlık kaldıran adam halterci olabilir. Fakat yarışçı... Asla!.."],["p","Yarışlar böyledir. Yarı yolda yorulup bırakanlar bulunur. Hatta yarışı terketmeden önce yanındakine çelme atanlar da bulunabilir. Bunlar olağandır."],["p","Dünya durdukça yarışlar yapılacak ve onu şerefle bitirenler, az da olsa, daima bulunacaktır."],["l","I. Lütfen, soruları metine göre cevaplayınız."],["l","1. Yarışçılar arasında kopmalar ne zaman olmaktadır?"],["l","2. Yorulmasına rağmen yarışa devam edenleri hangi faktörler etkilemektedir?."],["l","3. Kişinin yaşlansa da mızıkçı olarak kalması neye bağlıdır?"],["l","4. Yarıştan kopmamak veya geride kalmamak için ne yapmalıyız?"],["l","5. Yazarın “yarış” sözüyle anlatmak istediği ne olabilir? Spor teriminde başka bir manası olabilir mi?"]]},{"n":195,"b":[["p","II. Aşağıdaki test sorularını cevaplayınız"],["l","1. Yarışın ilk anlarında bütün yarışçılar ........................ koşarlar."],["l","A) farklı enerjü ile B) aynı mesafede"],["l","C) farklı mesafede D) aynı hizada"],["l","E) birlikte"],["l","2. Turlar atlandıkça koşucuların arasındaki mesafe"],["l","....................... ."],["l","A) görülecektir B) bitecektir"],["l","C) azalacaktır D) artacaktır"],["l","E) olacaktır"],["l","3. ...................... tıkandığını, gücünün yetmediğini itiraf eden yiğitler pek azdır."],["l","A) göğsünün B) nefesinin C) gücünün"],["l","D) boğazının E) gırtlağının"],["l","4. Mızıkçılık, kendi ..................... ve başarısızlığını başkasına atmak hastalığıdır."],["l","A) kusurunu B) değerini C) öfkesini"],["l","D) karakterini E) sorumsuzluğunu"],["l","5. Her ……….. bir dâvadır."],["l","A) halter B) koșmak C) yarış"],["l","D) yarışçı E) koșu"],["p","III. Aşağıdaki kelimeleri cümle içerisinde kullanın"],["p","Kritik anlar, bahane, yarışı terketmek, başarısızlık, inanç."],["l",".................................................................................................."],["l",".................................................................................................."],["l",".................................................................................................."],["l",".................................................................................................."],["l",".................................................................................................."],["h","BIR SAATINIZ KALDI"],["p","Acil servisteydim. Mesleğe yeni başlamanın heyecan ve zevkini yaşıyor, “doktor bey!” hitabına alışmaya çalışıyordum. Her büyük hastanenin acil servisinde olduğu gibi, burada da nöbet"]]},{"n":196,"b":[["p","hareketli geçiyordu. Tecrübeli uzman hekimlerin yanında, bana pek sorumluluk düşmüyordu. Ben sadece olup bitenleri dikkatlice izleyerek tecrübe kazanmaya çalışıyordum."],["p","Saat gecenin bir buçuğuydu. İki bayan, kollarından tuttukları, 16-17 yaşlarında, esmer, topluca bir delikanlıyı hastaneye getiriyordu. Delikanlının babası olduğu anlaşılan bir bey arkalarından soluk soluğa geliyor, bir yandan da şöyle sesleniyordu:"],["l","- Kurtarın yavrumu, kurtarın çocuğumu! Nöbetçi doktor, gecenin yorgunluğuyla gömüldüğü koltuğundan doğruldu. Bu arada hemşireler yeni gelenleri karşılıyordu. Ben doktorun yanında ayakta bekliyordum. Adam konuşmaya devam ediyordu:"],["l","- Doktor bey, oğlum intihar niyetiyle ilâç içmiş. Annesi fark edince, hemen getirdik."],["l","- Aldığı ilâçlar yanınızda mı? Adam, ceketinin ceplerinden hap kutularını çıkarıp doktora gösterdi."],["l","- Şu haptan on beş-yirmi tane, şundan on kadar, şundan da üç-beş tane içmiş. Ne zaman içtiğini biliyor musunuz?"],["l","- İki saat kadar olmuş. Doktor hap kutularını uzun uzun inceledikten sonra, bir delikanlıya, bir de kutulara baktı. Ardından kafasını sağa sola sallayıp yüzünü buruşturarak:"],["l","- Hımm! Yazık, çok yazık! Aile endişe ve merak içinde, doktorun bir şeyler söylemesini bekliyor, ama doktordan ses çıkmıyordu. Bense, gencin midesini yıkayacağımızı düşünüyordum. Kısa süren bir sessizlik, babanın sorusuyla bozuldu:"],["l","- Ne yapacağız doktor bey? Doktorun yüzü gerginleşti. Bakışlarını ümitsizce kaldırdı. Dudaklarını ısırdı. Başını çaresizce sağa sola salladı. Elleriyle de çaresizlik işareti yaptı. Ağzından dökülen son sözler, hasta ve yakınları için kurşun gibiydi."]]},{"n":197,"b":[["l","- Üzgünüm! Yapılacak bir şey yok. Hem bu ilâçlar... Üstelik de geç kalmışsınız. Ben göz ucuyla aileye baktım. Hepsinin gözleri fal taşı gibi açılmış, beti benzi atmıştı. Delikanlının yüzü korkuyla gerilmişti. Annesi ve kız kardeşinin desteğiyle ayakta zor duran delikanlı, birden doğrulup pür dikkat doktora baktı. Doktorun ifadelerindeki kesinliği ve yüzündeki ciddiyeti görünce sarsıldı. Dizlerinin bağı çözülmüşçesine kendini yere bıraktı. Aile fertlerinin ayakta duracak mecalleri kalmamış olacak ki, her biri bir kenara çöktü. Baba ve anne, bir şeyler mırıldanıyorlardı. Uzun süren bir suskunluk ve şaşkınlıktan sonra:"],["l","- Ne olacak doktor bey? Hiçbir şey yapamaz mısınız?"],["l","- Artık çok geç. Bu durumda maalesef bir şey yapamayız. Yapsak da yararı olmaz. Herhalde bir saate kadar hastayı kaybederiz. Gene de hastayı müşahede altına alalım. Ben de en az aile kadar şaşırmıştım. Delikanlının yüzüne bakıyordum. Ölüm endişesi ve ümitsizlik, iliklerine kadar işlemiş gibiydi. Kendimce neler hissettiğini düşündüm. Ölüme bu kadar yaklaşmak, gerçekten zor bir durum olmalıydı. Hem, insan bir saat sonra öleceğini bilse neler düşünür, neler hisseder, neler yapardı? Aslında her birimizin, ölüme bir saat yaklaşacağı an gelmeyecek miydi? Hayatın karmaşa ve med-cezirleri arasında, ölüm gerçeğini nasıl da atlıyor veya kendimize uzak görüyorduk. Şimdi bu delikanlı, geçmişini, arkadaşlarını, ailesini düşünüyor olmalıydı. Veya ölümden sonraki hayatı; yani bir saat sonrasını... Belki de arkasından neler düşünüleceğini, konuşulacağını... Hâlbuki ne kadar çok plânı vardı. Şimdi ise, o plânları düşünmek bir yana, son saatini nasıl geçireceğine dair doğru düşünme melekesini bile kaybetmiş gibiydi. Diğer taraftan, hayat devam ediyordu. İçeride yatmakta olan bir hastanın yakınları doktora bir şeyler sorarken, sedye ile bir hasta daha getiriliyordu. O ara başka bir doktor kapıdan içeri giriyordu. Biliyorum, sohbet için geliyor. Az ötede, hemşirelerin küçük teybinden, bir arabesk parça yükseliyor: Batsın bu dünya! “Hayatla ölümün iç içeliği galiba bu” diyorum kendi kendime."]]},{"n":198,"b":[["p","Baba toparlandı. Yalvaran bir eda ile sorusunu tekrarladı:"],["l","- Hiçbir şey yapamaz mısınız doktor bey? Hiç mi ümit yok? İçeri yeni giren doktor, kaş-göz işaretiyle ne olduğunu sordu. Doktor ayağa kalkıp kesin bir ifade ile cevap verdi:"],["l","- İntihar girişimi doktor bey. Geç kalmışlar maalesef. Durum da ciddi. Yapılacak bir şey kalmamış. Sonra raporunu tanzim ederiz. Söylenenleri dikkatle dinleyen delikanlıyı ölüm gerçeği ile yüzleşmek ürkütmüştü. Pişmanlık duygusu içerisinde ve titrek bir sesle doktora; “Kurtulmak için ne yapmak gerekiyorsa yapmaya hazırım. Ne olur doktor! Beni kurtarın, ölmek istemiyorum!” dedi. Doktor oralı bile olmadı. Ölüme bu kadar yakın bir kimseyi daha önce hiç görmemiştim. Üstelik çok da gençti. Hayalen morga gidip, gencin otopsisini düşünüyorum. Demek, karşımda duran bu diri beden birazdan ölecek, otopsi için açılacak ve biz bir rapor tanzim edip bırakacağız! Hayat ve ölüm... Yaşamak ve ölmek... Genç olmak, yaşlı olmak, hayatı anlamak, ölümü benimsemek... Hayatı ölüme bir girizgâh olarak değerlendirebilmek... Ölüme her an hazır olmak... Veya kendini hazır hissetmek... Kısacası ölümü kuşanmak... Hayata ve ölüme anlam kazandırmak... Bir sürü düşünce beynime doluşuyor. Doktor oradan uzaklaştı. Ben de peşinden gittim. Biraz acemilik kokan bir tavırla sordum:"],["l","- Doktor bey! Serumla bol mayi verip, bir yandan da idrar söktürücülerle kanını temizleyemez miydik? Doktor dönüp, gözlerimin içine baktı:"],["l","- Kardeşim görüyorsun, burada ayakta zor duran yaşlılar bile biraz daha hayatta kalmak için mücadele ederken, bu delikanlı daha on yedi yaşında ve intihara kalkışıyor. Ölmek istiyorsa, neden ona mâni olalım? Biraz isteği ile baş başa kalsın bakalım. Ölüm ne imiş, hayat ne imiş düşünsün! Yaşamanın değerini, ailesine ne kadar acı çektirdiğini fark etsin! Dahası Allah’ı hatırlasın; kul olmayı... Ölümü ve sonrasını da tabii ki... Arkasından, beni bir kez daha şaşırtan bir kahkaha atıp şöyle dedi:"],["l","- Yoksa sen de mi inandın öleceğine?"],["l","- Ne yani, delikanlı ölmeyecek mi?"]]},{"n":199,"b":[["p","Gülerek, ilaç kutularını gösterdi. Elindekiler, vitamin hapı, öksürük kesici ve balgam sökücülerdi."],["p","Dr. Nazım İntepe"],["p","Pür dikkat: Çok dikkatli olarak, bütün dikkatini vererek dinlemek"],["p","Med-cezir: Ayın etkisiyle denizdeki hareket. (Mecaz: Akla gelip giden değişik düşünceler veya bir şeyi yapıp yapmamaya karar verememek) Girizgâh: giriş yeri, başlangıç"],["p","Müşahede: kontrol, gözetim. Tanzim etmek: düzenlemek Mecal: güç"],["l","I. Aşağıdaki soruları yanıtlayınız."],["l","1. Delikanlı hastaneye niçin getiriliyor?"],["l","2. Doktorun hasta gence vermek istediği ders nedir?"],["l","3. Çocuğun ailesinin psikolojisi nasıldır?"],["l","4. Doktorun ders vermek amacıyla yaptığı bu davranışını nasıl değerlendiriyorsunuz?"],["l","5. Hasta delikanlı bir saati kaldığını öğrenince ne yapıyor?"],["p","II. Aşağıdaki test sorularını okuduğunuz metne göre yanıtlayınız."],["l","1. Stajyer doktor neye alışmaya çalışmaktadır? A). Gece çalışmasına C). Hastane kokusuna B). “Doktor Bey!” hitabına D). Kıyafetine E). İlaçlara"],["l","2. “Doktorun yüzü gerginleşti.” İfadesinin yerine hangi cümle kullanılırsa anlamda değişiklik olmaz?"],["l","A) Hekimin suratı asıldı."],["l","B) Doktorun suratı güldü."],["l","C) Hekimin yüzü ekşidi."],["l","D) Doktorun suratı değişti."],["l","E) Doktorun bedeni gerildi."],["l","3. Aşağıdakilerden hangisi stajyer doktorun yaşadığı psikolojilerden biri değildir?"],["l","A) Acemilik duygusu B) Üzüntü C) Şaşkınlık"],["l","D) Tembellik E) Duygusallık"]]},{"n":200,"b":[["l","4. Aşağıdakilerden hangisi doktorun vermek istediği derslerden biri değildir?"],["l","A. Yaşamın kıymetini anlatmak"],["l","B. Ölüm psikolojisini öğretmek"],["l","C. Ailesine masraf çıkardığı için ders vermek"],["l","D. Ailesine ne kadar acı çektirdiğini fark ettirmek"],["l","E. Ölümü ve sonrasını hatırlatmak"],["l","5. “Biraz acemilik kokan bir tavırla sordum” cümlesindeki altı çizili sözcüğün yerine aşağıdakilerden hangisi gelebilir?"],["l","A) deneyimsiz B) Bilgisiz C) Kıdemsiz"],["l","D) vasıfsız E) Yeni"],["p","III. Aşağıdaki cümlelerin doğru olanını “D”, yanlış olanını “Y” olarak işaretleyin."],["l","1. Çocuk grip ilaçları içmiş. ( )"],["l","2. Doktor delikanlıya iyi bir ders vermek istemiştir. ( )"],["l","3. Stajyer doktor ölüme bu kadar yakın bir kimseyi daha önce hiç görmemişti. ( )"],["l","4. Olay acil serviste geçiyor. ( )"],["l","5. Doktorun yaptığı olay delikanlıya iyi bir ders olmuştur."],["l","( )"],["p","IV. Aşağıdaki kelime, kelime gruplarını kullanarak anlamlı cümle kurunuz."],["l","1. Pür dikkat"],["l","2. Med-cezir"],["l","3. Müşahede"],["l","4. Tanzim etmek"],["l","5. Mecal"],["h","BUFALO"],["p","Asya’dan Avrupa’ya geçiyorum. İşe… Trafik fena değil. Akıyor. Derken… Zınk! Neredeyse patlatıyordum önümdekine. “Niye tıkandı aniden” demeye kalmadan, anlaşılıyor. İntihar var. Gene… Köprüye çıkmış biri."]]},{"n":201,"b":[["p","Kısa boylu. Kazaklı. Mont yok. Sakalı uzamış. Surat harita… Kederin bütün çizgileri çakıyla kazınmış adeta. Yaşını çıkaramıyorum bu yüzden… 30 desen de olur, 50 desen de. Bir eliyle tutunmuş korkuluklara, öbür eliyle derdini anlatmaya çalışıyor, bu taraftan dil döken polislere."],["p","Kaysa eli… Ya da ayağı. Gitti. 60 metre."],["p","Adettir İstanbul’da…"],["p","Köprüde intihar varsa, trafik durur. Seyredecekler illa. Milim milim giderler… Ki, atlarsa, kaçırmasın. Görsün o anı."],["p","Malum, herkese nasip olmaz!"],["p","Bakıyorum etrafıma…"],["p","Sağımdaki otomobilde iki kişi… Sağ koltukta bir kadın. Camı indirdi. Direksiyondaki adam cep telefonunu çıkardı, basıyor şakır şakır. İstanbul hatırası bir nevi… Arkadaşlarına gösterecek. İnanmazlar yoksa."],["p","Solumda belediye otobüsü…"],["p","Bir teyze, 60′ında filan. Öğreten ebeveyn olmanın gururu ile gösteriyor intiharcıyı kucağındaki küçük kıza… Torunu herhalde. 5 ya da 6 yaşında. N’apsın çocuk. El sallıyor. Bana değil. İntiharcıya."],["p","İki üç koltuk arkalarında, bir genç kız. Üniversiteli muhtemelen. Kulağında iPod. Çıkarıyor. Şöyle bir bakıyor. 56 saniye. Tekrar takıyor kulaklığını. Gömülüyor koltuğuna. Dönüyor önüne. Adam sende. Ona ne."],["p","Hiç tanımıyorum bu genç kızı. Ama bu tavrı çok iyi tanıyorum. Çocuklarımızda, kardeşlerimizde görmeye alıştığımız bir tavır… Öyle öğrettik çünkü. Elalemin derdi, seni mi gerdi?"],["p","Germiyor doğal olarak."],["p","Arkamdaki, korna çalıyor. Ama öyle böyle değil. Bas bas… Bakıyorum dikize. Bana bakmıyor. Gözü intiharcıda. Ona çalıyor. Artık bilemiyorum… “Hazır ben buradayken atla” mı demek istiyor, yoksa “aman sakın birader” demek mi… Bilemiyorum."],["p","Önümdeki taksici dayanamıyor, iniyor hışımla… Bağırıyor. “Trafiği mahvettin ulan, git başka yerde geber…” Şeytan diyor, git taksiciye giriş… E haklı şeytan. Çekiyorum el frenini… Tam ineceğim. Fırsat kalmıyor. Açılıyor trafik. Gazlıyoruz mecburen. Hep beraber."]]},{"n":202,"b":[["p","Böyle bu işler çünkü…"],["p","Parayla değil. Sırayla."],["p","Yerimizi yeni meraklılara, yeni meraksızlara, yeni teyzelere, yeni gençlere, yeni çocuklara, yeni taksicilere bırakmamız lazım."],["p","Seyretme sırası onlarda…"],["p","Gazeteye geldim. Soru, beynimi kemiriyor. Çınlıyor. Acaba atladı mı? Oraya telefon, buraya telefon. Öğreniyorum nihayet. Atlamamış… Şükür. Uzatmış sonunda elini, babacan bir komisere… Bu sefer ikinci soru. Kimmiş? Nedenmiş? İşsizmiş meğer. Ayakkabı boyacılığı yapıyormuş, Beyoğlu’nda falan. 33 yaşında. 3 evlat babası. Köprünün korkuluklarından önce, kredi kartına tutunmuş… Sonrası ortada. Borç. Faiz. Ayvayı yemiş. “Yetti” demiş, “yaşamak buysa, benden bu kadar…”"],["p","Soyadı bende saklı. İsmini sorarsanız…."],["p","İki gözüm önüme aksın, Yaşar’mış."],["p","Yaşar."],["p","Sonra oturdum ekran başına… Bırak, dünyayı başkaları kurtarsın. Sen, Yaşar’ı yaz."],["p","Yaşadığını zanneden öbürlerini yaz."],["p","Şöyle başla mesela…"],["p","“Vahşi Batı filmlerindeki bufalolara benziyoruz artık. Yanımızdaki vurulup, düşüyor. Göz ucuyla bakıp, yolumuza devam ediyoruz… Ruhsuz… Duygusuz…”"],["l","I. Aşağıdaki soruları yanıtlayınız."],["l","1. Yazar “Surat harita” demekle ne anlatmak istiyor?"],["l","2. Adam niçin intihar etmek istiyor?"],["l","3. Yazar bizleri niçin bufaloya benzetiyor?"],["l","4. Yazarın beynini kemiren ne?"],["l","5. Yazının ana fikri nedir? II. Aşağıdaki test sorularını okuduğunuz metne göre yanıtlayınız."],["l","1. “Elalemin derdi, seni mi gerdi?” deyimi hangi anlamda kullanılır?"],["l","A) Başkalarının problemlerinden sanane, seni niçin ilgilendiriyor."]]},{"n":203,"b":[["l","B) Başkalarının problemlerine dikkat et"],["l","C) Başkaları ne yaparsa yapsın görmemezlikten gel"],["l","D) Başka insanları tanı ama muhatap olma"],["l","E) Başkaları derdiyle dertlen"],["l","2. Aşağıdaki cümlelerin hangisinde “ayvayı yemek” deyimi gerçek anlamda kullanılmıştır?"],["l","A) Öğretmen aniden sınav yapınca hepimiz ayvayı yedik."],["l","B) Yarın babam bizi bu halde görürse ayvayı yedik."],["l","C) Kardeşimle bahçeye indik ve ağaçtaki son ayvayı da yedik."],["l","D) Ayşe de parasız gelirse bugün ayvayı yedim."],["l","E) Polis kırmızı ışıkta geçtiğini görürse ayvayı yersin."],["l","3. Yazar niçin taksiciye sinirleniyor?"],["l","A) Taksicinin duygusuz davranması sebebiyle"],["l","B) Taksicinin yolu tıkaması sebebiyle"],["l","C) Taksicinin kornaya basması nedeniyle"],["l","D) Taksicinin tipine gıcık olduğu için"],["l","E) Taksicinin bağırması sebebiyle"],["l","4. Yaşlı kadının yaptığı yanlış nedir?"],["l","A) Torununa böyle bir olayı normalmiş gibi göstermesi"],["l","B) Torununun gözünü kapaması"],["l","C) Torununa kızması sebebiyle"],["l","D) Torununun hatalarını anlatmamsı sebebiyle"],["l","E) Torununu ayakta tutması"],["l","5. İntiharcı kimdir?"],["l","A) Yılmaz Özdil B) Yaşar C) Komiser"],["l","D) Yaşlı kadın E) Taksici III. Aşağıdaki cümlelerin doğru olanını “D”, yanlış olanını “Y” olarak işaretleyin."],["l","1. ( ) Trafik kazası olduğu için trafik tıkanmıştır."],["l","2. ( ) Adam sonunda intihar etmiştir."],["l","3. ( ) Adamın yüzü yaşamın zorluğuyla çizik çizik olduğu için yaşı belli olmuyor."],["l","4. ( ) İntiharcıyı babacan bir komiser kurtarmıştır."],["l","5. ( ) Yaza çevredeki insanlarının tavırlarını eleştiriyor."]]},{"n":204,"b":[["p","IV. Aşağıdaki kelime, kelime gruplarını kullanarak anlamlı cümle kurunuz."],["l","1. Korkuluk: ______________________________________"],["l","2. Dil dökmek: ____________________________________"],["l","3. Malum: ________________________________________"],["l","4. Ebeveyn: ______________________________________"],["l","5. Ayvayı yemek: __________________________________"],["h","GÖRME, ANLAMA MERAKI"],["p","Eskiden çocuklar daha mı öğrenme meraklısıydılar dersiniz? Yoksa bugünkü çocukların merakı başka konulara mı çevrildi? Ne zaman bir küçüğe; Hindistan’a, Kutuplara, Çin Seddi’ne, Mısır piramitlerine, lokomotifin icadına ilişkin soru sorarsanız şu cevabı alıyorsunuz:"],["l","- Daha bunları okumadık! Demek ki, zamanımız çocukları ve gençleri, tarihe, coğrafyaya, keşif ve icatlara, dünya çapındaki dâhilere dair ancak okulda edindikleri bilgilerle kalıyorlar. Kendiliklerinden bu konularda bilgi sahibi olmak tecessüsünü göstermiyorlar. İlgilerini her halde başka şeylere saklıyorlar. Hâlbuki elde, düne göre çok daha bol öğrenme imkânları vardır. Ansiklopediler, cilt cilt seyahat kitapları, tarihi eserler, biyografiler, karşılaştırmalı istatistikler, propaganda broşürleri, radyo, televizyon programları, filmler, internet sayfaları, her türlü meraka cevap verecek kadar bol ve çeşitli. Bizim çocukluğumuzda ise imkânlar ne kadar azdı. Doymak bilmeyen meraklarımızı avutmak için ne çocukça çarelere başvururduk. Elimizdeki coğrafya kitaplarını didik didik etmek yetmiyormuş gibi, haritaları oyun malzemesi olarak kullanır, enlem ve boylam çizgileri arasına karışmış küçücük şehir isimlerini birbirimize sorardık. Bütün devletlerin merkezlerini adıyla, nüfus ve yeriyle su gibi bilirdik. O zamanlar çikolataların içinden çıkan bayrak, harita, şehir resimleriyle büyük adam portrelerinden koleksiyonlar yapardık. Pul biriktirirdik, ama ticaret için değil, sırf çeşitli memleketlere ait manzaraları, tarihi şahsiyetleri, sembolleri görmek ve öğrenmek içindir. Yine aynı maksatla kartpostal toplardık."]]},{"n":205,"b":[["p","Jule Verne (Jül Vern)’in ne kadar romanı çıkmışsa hepsini bulur okurduk. Bu sayede Kutupları, Antil Adalarını, Afrika’nın balta girmemiş ormanlarını, Çin’i, denizaltı âleminin öğrenirdik. Zevaco (Zevako)’nun romanları, bize bir devrin Fransa, İtalya ve İspanya’sını öğretirdi. Kılıcı karşısında herkesin titrediği roman kahramanlarıyla birlikte, tarihe mal olmuş şahsiyetlerle tanışmış olurduk. Biri bize Saint Barthelmy (Sen Barthelmi) olayını sorsa, bülbül kesilirdik. İspanya’daki engizisyon mahkemelerinin nasıl işlediğini en ince ayrıntılarına kadar bilirdik. Aramızda bunların ve diğerlerinin bahsi geçerdi. Bilmeyeni ayıplardık. Tarih öğretmenlerimiz, sözlü yoklamalarda bildiğimizden hayrete düşerdi. Edebiyat derslerinde de öğrendiklerimizle öğretmenlerimizi hayran ederdik. Okul idareleri de her dönemde teşekkür ve takdir yazılarıyla bizi ödüllendirirdi."],["p","Hepimiz, bir karış boyumuzla, Rönesans devri adamlarının oburluğu ile sağdan soldan boyuna bilgi edinmeye çalışırdık. Bizde doymak bilmez bir merak vardı. Yanımızda bir şey konuşulduğu zaman konunun cahili olmaktan ödümüz kopardı. Zamanımızda çıkan gazete ve dergilerin her sahadaki ilerlemelerle ayırdıkları sayfaları yutarcasına okumak en büyük zevkimizdi."],["p","Ama ayakkabı eskitmek korkusuyla top peşinde pek koşmazdık. Babamızdan aldığımız gündelik, sinemaya girmeye yetmediği için, sık sık film seyretmeye gitmezdik. Sokakta oynamak da haysiyetimize dokunurdu. Hatta bazı akşamlar fincan ve papazkaçtı oynayan ev halkına bile uymazdık. Misafirliğe gitsek; konsol üstünde veya duvarda gördüğümüz hatıra hakkında bilgi edinmeden içimiz rahat etmezdi. Mahallemizdeki caminin, çeşmenin, imaretin kitabelerini pek sökemezdik ama büyüklerimizden sorup öğrenmeyi de ihmal etmezdik. Kısacası biz, çocukluğumuzda bilgi edinmeyi bir oyun, hatta bir huy haline getirmiştik."],["p","Acaba iyi mi yapıyorduk, kötü mü? Belki kafamızı abur cuburla dolduruyorduk. Elimizdeki malzeme bugünküne göre eksik, hatta hatalı idi. Fakat mesele bu değil. Nasıl ve neler öğrendiğimizin önemi yok. Asıl önemli olan şey, daima öğrenmeye hazır, daima iştahlı bir merakımız vardı. Bu merak, müsait şartlar bulsaydı, pekâlâ"]]},{"n":206,"b":[["p","araştırıcılığa ve yapıcılığa dönebilirdi. Bugünün şartları elbette çok daha elverişli. Fakat çocuklarımızda o eski merak ve ilgiden pek eser yok gibi geliyor bana. Lakin merak, büsbütün ortadan kalkarsa, araştırıcılık ve yapıcılığın yolunu bulmak da imkânsız. Merakı, yapıcılık doğrultusunda geliştirmek gerekir."],["p","Prof. Sabri Esat SİYAVUŞGİL"],["p","Engizisyon: Orta Çağda Katoliklerde dini inançlara karşı gelenleri cezalandıran mahkeme adı."],["p","Tecessüs: Merakını gidermeye çalışma, görme, anlama merakı."],["p","İmaret: Yoksullar ve öğrencilere yiyecek dağıtmak için kurulmuş hayır kurumu."],["l","I. Aşağıdaki soruları yanıtlayınız."],["l","1. Dünkü çocuklarla bugünkü çocukların yetişme tarzı aynı mıdır? Niçin?"],["l","2. Bugünkü çocuklar hangi konularda bilgi sahibi oluyorlar, nelere merak sarıyorlar?"],["l","3. Dünkü çocuklar yeni bilgiler öğrenmek için neler yaparlarmış?"],["l","4. Çocukların merakları uygun şartlar bulsaydı, neler ortaya çıkabilirdi?"],["l","5. Çocuklar bilgisiz kalmamak için nelere merak sarmalı? II. Aşağıdaki test sorularını okuduğunuz metne göre yanıtlayınız."],["l","1. Eskiden öğrenciler ne meraklısıydı?"],["l","A. Oyun C. İnternet B. Bilgi"],["l","D. Resim E. Coğrafya"],["l","2. Metinde hangi bilgi kaynağından bahsedilmiyor?"],["l","A. İnternet C. Sözlük B. Ansiklopedi"],["l","D. Televizyon E.Radyo"],["l","3. Bütün devletlerin merkezlerini adıyla, nüfus ve yeriyle su gibi bilirdik. Cümledeki deyim anlamı aşağıdakilerden hangisidir?"],["l","A. Az bilmek C. Okumak E. Hatasız bilmek"]]},{"n":207,"b":[["l","B. Çok bilmek D. Ezberlemek"],["l","4. Çocukların yaptığı koleksiyonlar arasında hangisi yoktu?"],["l","A. Bayrak resmi C. Kartpostal E. Haritalar"],["l","B. Pul D. Para çeşitleri"],["l","5. Bugünün şartları bilgi sahibi olmak için elverişlidir. Aşağıdakilerden hangisi altı çizili kelimenin zıt anlamıdır?"],["l","A. Müsait değil C. Uygun E. Gelişmiş değil"],["l","B. Faydalı D. İhtiyaç değil III. Aşağıdaki cümlelerin doğru olanını “D”, yanlış olanını “Y” olarak işaretleyin."],["l","1. Eskiden çocuklar görme, okuma meraklısı olmuşlar."],["l","( )"],["l","2. Günümüzdeki çocuklar bilgi sahibi olmak tecessüsünü gösteriyorlar. ( )"],["l","3. Eskiden ansiklopedi, seyahat kitapları, karşılaştırmalı istatistikler çoktu. ( )"],["l","4. Jül Vern’in romanlarından İtalya, İspanya, Fransa hakkında bilgi aldık. ( )"],["l","5. Dünkü çocuklar daima öğrenmeye hazır, daima iştahlı bir merak sahibi olmuşlar. ( )"],["p","IV. Aşağıdaki kelime, kelime gruplarını kullanarak anlamlı cümle kurunuz."],["l","1. Bülbül kesilmek:"],["l","2. Didik didik etmek:"],["l","3. Merak:"],["l","4. Ayıplamak"],["l","5. Elverişli:"]]},{"n":208,"b":[["p","Kaynaklar"],["p","ПАЙДАЛАНЫЛҒАН ӘДЕБИЕТТЕР"],["l","1. Temel I. Alıştırma Kitabı Ankara Üniversitesi Basımevi:"],["l","2012."],["l","2. Temel II. Alıştırma Kitabı Ankara Üniversitesi Basımevi:"],["l","2012."],["l","3.Orta Türkçe I. Alıştırma Kitabı Ankara Üniversitesi Basımevi: 2012."],["l","4. Orta Türkçe II. Alıştırma Kitabı Ankara Üniversitesi Basımevi: 2012."],["l","5. Yüksek Türkçe I. Alıştırma Kitabı Ankara Üniversitesi Basımevi: 2012."],["l","6. Yüksek Türkçe II. Alıştırma Kitabı Ankara Üniversitesi Basımevi: 2012."],["l","7. Adım Adım Türkçe III. Ders Kitabı. Orta Seviye Serisi. Tuncay Öztürk, Sezgin Akçay, Salih Gün, Abdullah Yiğit, Gökhan Dayı. Dilset Yayınevi: 2002."],["l","8. Adım Adım Türkçe III. Alıştırma Kitabı. Orta Seviye Serisi. Tuncay Öztürk, Sezgin Akçay, Salih Gün, Abdullah Yiğit, Gökhan Dayı. Dilset Yayınevi: 2002."],["l","9. Adım Adım Türkçe IV. Ders Kitabı. Orta Seviye Serisi. Tuncay Öztürk, Sezgin Akçay, Salih Gün, Abdullah Yiğit, Gökhan Dayı. Dilset Yayınevi: 2002."],["l","10. Yeni Hitit Yabancılar İçin Türkçe Ders Kitabı/B1/Ankara Üniversitesi TÖMER: 2008."]]},{"n":209,"b":[["p","А.Б. Бабжанова, Е.М. Тубажанов"],["p","Оқу құралы"],["p","ISBN 978-601-270-438-9"]]},{"n":210,"b":[]}],"toc":[{"i":1,"t":"Алғы сөз","p":6},{"i":2,"t":"Piknik","p":7},{"i":3,"t":"Mevsimler","p":9},{"i":4,"t":"Sokak Köpeği","p":10},{"i":5,"t":"Akıllı Dilenci","p":11},{"i":6,"t":"Çiftliğimiz","p":13},{"i":7,"t":"Fatma Hanım","p":15},{"i":8,"t":"Hediy
