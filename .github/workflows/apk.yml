name: APK yig'ish

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Eng oxirgi zipni ochish
        run: |
          ZIP=$(for f in NarjanTurkish*.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
          echo "Ishlatilayotgan zip: $ZIP"
          rm -rf NarjanTurkish
          unzip -o "$ZIP"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK yig'ish
        working-directory: NarjanTurkish
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NarjanTurkish-apk
          path: NarjanTurkish/app/build/outputs/apk/release/*.apk
